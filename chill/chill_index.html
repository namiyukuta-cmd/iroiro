<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Chill</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#fff;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
main{
  width:min(100%,420px);
  text-align:center;
}
h1{
  margin:0 0 32px;
  font-size:32px;
  font-weight:500;
  letter-spacing:.12em;
}
  50%{transform:translateY(-5px)}
}
.start{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:54px;
  border:1px solid #222;
  border-radius:12px;
  background:#fff;
  color:#222;
  text-decoration:none;
  font-size:17px;
  font-weight:700;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.start:active{background:#f3f3f3}
</style>
</head>
<body>
<main>
  <h1>Chill</h1>
  <a id="startChill" class="start" href="chill_top.html?_nc=20260924-0405">はじめる</a>
</main>
<script>
(()=>{
  const url=new URL(location.href);
if(!url.searchParams.has('_nc')){
  url.searchParams.set('_nc',Date.now().toString());
  location.replace(url.toString());
  return;
}
window.addEventListener('pageshow',e=>{
  if(!e.persisted)return;
  const u=new URL(location.href);
  u.searchParams.set('_nc',Date.now().toString());
  location.replace(u.toString());
});

const start=document.getElementById('startChill');
  start?.addEventListener('click',e=>{
    e.preventDefault();
    location.href='chill_top.html?_nc='+Date.now();
  });
})();
</script>
</body>
</html>
