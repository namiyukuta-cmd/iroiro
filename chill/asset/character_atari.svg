<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 72" role="img" aria-label="chill 2頭身 人体アタリ">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 48x72 / ゲーム上は2x3マス。内部設計は4段 -->
    <rect x=".5" y=".5" width="47" height="71" rx="2" stroke="#b7c4d0" stroke-width="1"/>
    <path d="M24 0V72" stroke="#cfd8df" stroke-width="1"/>
    <path d="M0 18H48M0 36H48M0 54H48" stroke="#d9e1e7" stroke-width="1"/>
    <path d="M24 2V69" stroke="#7c8fa0" stroke-width="1" stroke-dasharray="2 2"/>
    <path d="M4 68H44" stroke="#d88470" stroke-width="1.5"/>

    <!-- 大きい頭 -->
    <ellipse cx="24" cy="27" rx="15.5" ry="14.5"
      fill="#f5d0bf" fill-opacity=".48" stroke="#9d5f53" stroke-width="1.5"/>

    <!-- 肩・胴体 -->
    <path d="M14 39Q24 36.5 34 39L33 54H15Z"
      fill="#cbdcf4" fill-opacity=".58" stroke="#5e7fa8" stroke-width="1.5"/>

    <!-- 腕 -->
    <rect x="5.5" y="40" width="12" height="5" rx="2.5"
      fill="#cfe8d5" fill-opacity=".7" stroke="#5f8b68" stroke-width="1.3"
      transform="rotate(-24 14 42.5)"/>
    <rect x="30.5" y="40" width="12" height="5" rx="2.5"
      fill="#cfe8d5" fill-opacity=".7" stroke="#5f8b68" stroke-width="1.3"
      transform="rotate(24 34 42.5)"/>

    <!-- スカート -->
    <path d="M14 53H34L40 61H8Z"
      fill="#d9f2c9" fill-opacity=".62" stroke="#78a54a" stroke-width="1.4"/>

    <!-- 脚 -->
    <rect x="18" y="59" width="5" height="10" rx="2.5"
      fill="#f2ddad" fill-opacity=".75" stroke="#9b7a39" stroke-width="1.3"/>
    <rect x="25" y="59" width="5" height="10" rx="2.5"
      fill="#f2ddad" fill-opacity=".75" stroke="#9b7a39" stroke-width="1.3"/>

    <!-- アンカー -->
    <g fill="#fff" stroke="#3f4f5d" stroke-width="1">
      <circle cx="24" cy="27" r="1.5"/>
      <circle cx="14" cy="39" r="1.5"/>
      <circle cx="34" cy="39" r="1.5"/>
      <circle cx="24" cy="53" r="1.5"/>
      <circle cx="20.5" cy="68" r="1.5"/>
      <circle cx="27.5" cy="68" r="1.5"/>
    </g>
  </g>
</svg>