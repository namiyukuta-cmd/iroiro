<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 72" role="img" aria-label="chill 2頭身 共通素体">
  <g stroke="#6a3826" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 影 -->
    <ellipse cx="24" cy="68" rx="10.5" ry="2" fill="#cdbb9d" opacity=".42" stroke="none"/>

    <!-- 脚 -->
    <rect x="18" y="59" width="5" height="10" rx="2.5" fill="#f3caa7"/>
    <rect x="25" y="59" width="5" height="10" rx="2.5" fill="#f3caa7"/>

    <!-- 首：頭の後ろ -->
