<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 96" role="img" aria-label="丸いくま風キャラクター">
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="42" cy="91" rx="20" ry="3" fill="#cdbb9d" opacity=".4"/>

    <!-- ears -->
    <circle cx="24" cy="19" r="10" fill="#fff3dc" stroke="#6a3826" stroke-width="3.5"/>
    <circle cx="60" cy="19" r="10" fill="#fff3dc" stroke="#6a3826" stroke-width="3.5"/>
    <circle cx="24" cy="19" r="4.5" fill="#f6c7a3"/>
    <circle cx="60" cy="19" r="4.5" fill="#f6c7a3"/>

    <!-- body behind head -->
    <path d="M24 58c-6 5-10 14-8 22 2 7 8 11 15 10l11-2 11 2c7 1 13-3 15-10 2-8-2-17-8-22-6-4-30-4-36 0Z"
          fill="#fff8e8" stroke="#6a3826" stroke-width="3.5"/>

    <!-- arms -->
    <ellipse cx="18" cy="67" rx="7" ry="11" transform="rotate(18 18 67)" fill="#fff3dc" stroke="#6a3826" stroke-width="3"/>
    <ellipse cx="66" cy="67" rx="7" ry="11" transform="rotate(-18 66 67)" fill="#fff3dc" stroke="#6a3826" stroke-width="3"/>

    <!-- head -->
    <path d="M18 34c0-14 10-24 24-24s24 10 24 24v13c0 15-10 24-24 24S18 62 18 47Z"
          fill="#fff3dc" stroke="#6a3826" stroke-width="3.5"/>

    <!-- soft shade -->
    <path d="M22 49c2 11 9 17 20 17 9 0 16-4 20-12-3 11-10 17-20 17-12 0-20-8-20-22Z"
          fill="#f1d7b7" opacity=".45"/>

    <!-- face -->
    <ellipse cx="33" cy="42" rx="2.6" ry="3.7" fill="#553022"/>
    <ellipse cx="51" cy="42" rx="2.6" ry="3.7" fill="#553022"/>
    <circle cx="27" cy="50" r="4.2" fill="#f6a391"/>
    <circle cx="57" cy="50" r="4.2" fill="#f6a391"/>

    <!-- muzzle -->
    <ellipse cx="42" cy="51" rx="8" ry="6" fill="#ffe2c1"/>
    <ellipse cx="42" cy="48.5" rx="2.8" ry="2.2" fill="#6a3826"/>
    <path d="M42 51v2.5M42 53.5c-2 0-3.5 1-4.5 2.2M42 53.5c2 0 3.5 1 4.5 2.2"
          fill="none" stroke="#6a3826" stroke-width="1.7"/>

    <!-- belly -->
    <ellipse cx="42" cy="73" rx="12" ry="10" fill="#fffdf5"/>

    <!-- feet -->
    <ellipse cx="31" cy="85" rx="7" ry="5" fill="#f0c9a7" stroke="#6a3826" stroke-width="2.5"/>
    <ellipse cx="53" cy="85" rx="7" ry="5" fill="#f0c9a7" stroke="#6a3826" stroke-width="2.5"/>

    <!-- highlights -->
    <path d="M26 28c4-7 9-10 15-11" fill="none" stroke="#ffffff" stroke-width="4" opacity=".75"/>
    <path d="M27 65c2-2 4-3 6-3" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".7"/>
  </g>
</svg>