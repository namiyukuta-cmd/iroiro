<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Chill</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
}
button{
  font:inherit;color:inherit;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#game{position:relative;width:100%;height:100dvh;overflow:hidden;background:#fff}
#ground{
  --grid:24px;
  position:absolute;left:5%;right:5%;top:5%;bottom:190px;
  border:1px solid #d8d8d8;border-radius:16px;background:#fff;overflow:hidden;
  touch-action:manipulation;
}
#ground.grid-on{
  background-image:
    linear-gradient(to right,#ececec 1px,transparent 1px),
    linear-gradient(to bottom,#ececec 1px,transparent 1px);
  background-size:var(--grid) var(--grid);
}
#objectLayer{position:absolute;inset:0}
#girl{
  position:absolute;left:50%;bottom:17%;width:min(25vw,108px);height:auto;
  transform:translateX(-50%);user-select:none;-webkit-user-drag:none;pointer-events:none;z-index:5;
}
.obj{
  position:absolute;width:48px;height:48px;transform:translate(-50%,-50%);
  display:grid;place-items:center;z-index:4;touch-action:manipulation;
}
.obj.selected::after{
  content:"";position:absolute;inset:-5px;border:1px dashed #333;border-radius:8px;pointer-events:none;
}
.box-art{
  width:36px;height:30px;border:2px solid #222;background:#fff;
  position:relative;
}
.box-art::before,.box-art::after{
  content:"";position:absolute;background:#222;
}
.box-art::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)}
.box-art::after{left:2px;right:2px;top:8px;height:2px}
.chair-art{
  width:31px;height:36px;border-left:3px solid #222;border-right:3px solid #222;
  border-bottom:3px solid transparent;position:relative;
}
.chair-art::before{
  content:"";position:absolute;left:-3px;right:-3px;top:15px;height:3px;background:#222;
}
.chair-art::after{
  content:"";position:absolute;left:2px;right:2px;bottom:-1px;height:17px;
  border-left:3px solid #222;border-right:3px solid #222;
}
.lamp-art{
  width:28px;height:34px;border:2px solid #222;border-radius:6px 6px 4px 4px;position:relative;background:#fff;
}
.lamp-art::before{
  content:"";position:absolute;left:5px;right:5px;top:-11px;height:12px;
  border:2px solid #222;border-bottom:0;border-radius:10px 10px 0 0;
}
.lamp-art::after{
  content:"";position:absolute;left:7px;right:7px;top:9px;bottom:6px;
  border:1px solid #222;border-radius:50% 50% 35% 35%;
}
.table-art{
  width:42px;height:28px;border-top:4px solid #222;position:relative;
}
.table-art::before,.table-art::after{
  content:"";position:absolute;top:0;bottom:0;width:3px;background:#222;
}
.table-art::before{left:5px}.table-art::after{right:5px}

.toolbar{
  position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));
  z-index:20;background:rgba(255,255,255,.96);border:1px solid #ddd;border-radius:14px;padding:8px;
}
.palette,.editrow{display:flex;gap:6px;align-items:center}
.editrow{margin-top:7px}
.tool{
  flex:1;min-width:0;min-height:42px;border:1px solid #ccc;border-radius:10px;background:#fff;
  font-size:12px;font-weight:700;padding:6px 4px;
}
.tool.active{background:#222;color:#fff;border-color:#222}
#pos{min-width:72px;text-align:center;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#555}
.nudge{
  width:42px;min-width:42px;height:42px;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:18px;
}
#deleteBtn{font-size:12px}
#hint{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);
  font-size:11px;color:#777;background:rgba(255,255,255,.86);padding:5px 9px;border-radius:999px;
  pointer-events:none;z-index:10;white-space:nowrap;
}

.inventory{
  position:absolute;
  left:8px;
  right:8px;
  bottom:max(8px,env(safe-area-inset-bottom));
  z-index:30;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:4px;
}
.inventory-slot{
  aspect-ratio:1/1;
  min-width:0;
  border:1px solid #bdbdbd;
  border-radius:6px;
  background:#fff;
}
.toolbar{
  bottom:calc(max(8px,env(safe-area-inset-bottom)) + 58px);
}


.quest-peek{
  position:absolute;
  right:-10px;
  top:18%;
  z-index:40;
  min-width:76px;
  min-height:44px;
  padding:8px 16px 8px 12px;
  border:1px solid #222;
  border-radius:12px 0 0 12px;
  background:#fff;
  font-size:13px;
  font-weight:800;
  transform:translateX(88px);
  opacity:0;
  animation:questPeek .48s cubic-bezier(.2,.9,.25,1.25) 1.1s forwards;
}
.quest-peek::before{content:"！";margin-right:5px}
@keyframes questPeek{
  0%{transform:translateX(88px);opacity:0}
  72%{transform:translateX(-7px);opacity:1}
  100%{transform:translateX(0);opacity:1}
}
.quest-backdrop{
  position:absolute;
  inset:0;
  z-index:80;
  background:rgba(255,255,255,.54);
  backdrop-filter:blur(2px);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.quest-backdrop.open{opacity:1;pointer-events:auto}
.quest-book{
  position:absolute;
  left:50%;
  top:50%;
  width:min(86%,360px);
  max-height:66%;
  overflow:auto;
  z-index:90;
  padding:20px 18px 16px;
  border:1.5px solid #222;
  border-radius:10px;
  background:#fff;
  box-shadow:0 12px 34px rgba(0,0,0,.14);
  transform:translate(58%,-78%) scale(.18) rotate(4deg);
  transform-origin:100% 0%;
  opacity:0;
  pointer-events:none;
}
.quest-book.open{
  pointer-events:auto;
  animation:questFly .34s cubic-bezier(.2,.82,.25,1.08) forwards;
}
@keyframes questFly{
  from{transform:translate(58%,-78%) scale(.18) rotate(4deg);opacity:.15}
  to{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
}
.quest-book h2{
  margin:0 0 4px;
  font-size:20px;
  text-align:center;
  letter-spacing:.08em;
}
.quest-book .chapter{
  margin:0 0 14px;
  text-align:center;
  font-size:11px;
  color:#777;
}
.quest-book .story{
  margin:0;
  padding:14px 4px 18px;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  font-size:14px;
  line-height:1.9;
}
.quest-book .choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}
.quest-book .choices button{
  min-height:44px;
  border:1px solid #aaa;
  border-radius:8px;
  background:#fff;
  font-weight:800;
}
.quest-book .choices .accept{
  border-color:#222;
  background:#222;
  color:#fff;
}
.quest-peek.hidden{display:none}

</style>
</head>
<body>
<main id="game" aria-label="白い箱庭">
  <div id="ground" class="grid-on">
    <div id="objectLayer"></div>
    <img id="girl" src="asset/chill_girl_01.png?_nc=20260924-0310" alt="女の子">
    <div id="hint">物を選んで、置きたいマスをタップ</div>
  </div>


  <button id="questPeek" class="quest-peek" type="button" aria-label="新しい依頼">依頼</button>

  <div id="questBackdrop" class="quest-backdrop" aria-hidden="true"></div>

  <article id="questBook" class="quest-book" aria-label="依頼書">
    <h2>依頼</h2>
    <p id="questChapter" class="chapter">QUEST 001</p>
    <p id="questStory" class="story"></p>
    <div class="choices">
      <button id="questClose" type="button">あとで</button>
      <button id="questAccept" class="accept" type="button">受ける</button>
    </div>
  </article>

  <section class="inventory" aria-label="所持アイテム">
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
    <div class="inventory-slot"></div>
  </section>

  <section class="toolbar" aria-label="箱庭編集">
    <div class="palette">
      <button class="tool active" data-tool="select" type="button">選択</button>
      <button class="tool" data-tool="box" type="button">箱</button>
      <button class="tool" data-tool="chair" type="button">椅子</button>
      <button class="tool" data-tool="lamp" type="button">ランプ</button>
      <button class="tool" data-tool="table" type="button">机</button>
      <button id="gridBtn" class="tool active" type="button">格子</button>
    </div>
    <div class="editrow">
      <button id="leftBtn" class="nudge" type="button">←</button>
      <button id="upBtn" class="nudge" type="button">↑</button>
      <button id="downBtn" class="nudge" type="button">↓</button>
      <button id="rightBtn" class="nudge" type="button">→</button>
      <span id="pos">未選択</span>
      <button id="deleteBtn" class="tool" type="button">削除</button>
    </div>
  </section>
</main>

<script>
(()=>{
const pathKey='fresh:'+location.pathname;
const url=new URL(location.href);
const token=url.searchParams.get('_nc');
const seen=sessionStorage.getItem(pathKey);

if(!token || seen===token){
  const fresh=Date.now().toString();
  url.searchParams.set('_nc',fresh);
  sessionStorage.setItem(pathKey,fresh);
  location.replace(url.toString());
  return;
}
sessionStorage.setItem(pathKey,token);

window.addEventListener('pageshow',e=>{
  if(!e.persisted)return;
  const u=new URL(location.href);
  const fresh=Date.now().toString();
  u.searchParams.set('_nc',fresh);
  sessionStorage.setItem(pathKey,fresh);
  location.replace(u.toString());
});

const ground=document.getElementById('ground');
const layer=document.getElementById('objectLayer');
const pos=document.getElementById('pos');
const gridBtn=document.getElementById('gridBtn');
const questPeek=document.getElementById('questPeek');
const questBook=document.getElementById('questBook');
const questBackdrop=document.getElementById('questBackdrop');
const questClose=document.getElementById('questClose');
const questAccept=document.getElementById('questAccept');
const questChapter=document.getElementById('questChapter');
const questStory=document.getElementById('questStory');
const GRID=24;
let currentTool='select';
let selectedId=null;
let nextId=1;
let objects=[];

const artClass={box:'box-art',chair:'chair-art',lamp:'lamp-art',table:'table-art'};

function save(){
  try{localStorage.setItem('chillSandboxObjects',JSON.stringify(objects))}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('chillSandboxObjects')||'[]');
    if(Array.isArray(d))objects=d.filter(o=>o&&artClass[o.type]&&Number.isFinite(o.x)&&Number.isFinite(o.y));
    nextId=objects.reduce((m,o)=>Math.max(m,Number(o.id)||0),0)+1;
  }catch(e){objects=[]}
}
function render(){
  layer.replaceChildren();
  objects.forEach(o=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='obj'+(o.id===selectedId?' selected':'');
    b.dataset.id=o.id;
    b.style.left=o.x+'px';
    b.style.top=o.y+'px';
    b.setAttribute('aria-label',o.type);
    const art=document.createElement('span');
    art.className=artClass[o.type];
    b.appendChild(art);
    b.addEventListener('click',e=>{
      e.stopPropagation();
      selectedId=o.id;
      currentTool='select';
      syncTools();
      render();
    });
    layer.appendChild(b);
  });
  const s=objects.find(o=>o.id===selectedId);
  pos.textContent=s?Math.round(s.x)+','+Math.round(s.y):'未選択';
}
function syncTools(){
  document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===currentTool));
}
function clamp(o){
  const r=ground.getBoundingClientRect();
  o.x=Math.max(24,Math.min(r.width-24,o.x));
  o.y=Math.max(24,Math.min(r.height-24,o.y));
}
document.querySelectorAll('[data-tool]').forEach(b=>{
  b.addEventListener('click',()=>{
    currentTool=b.dataset.tool;
    if(currentTool!=='select')selectedId=null;
    syncTools();render();
  });
});
ground.addEventListener('click',e=>{
  if(currentTool==='select')return;
  const r=ground.getBoundingClientRect();
  const rawX=e.clientX-r.left;
  const rawY=e.clientY-r.top;
  const x=Math.round(rawX/GRID)*GRID;
  const y=Math.round(rawY/GRID)*GRID;
  const o={id:nextId++,type:currentTool,x,y};
  clamp(o);objects.push(o);selectedId=o.id;
  currentTool='select';syncTools();render();save();
});
function nudge(dx,dy){
  const o=objects.find(o=>o.id===selectedId);if(!o)return;
  o.x+=dx;o.y+=dy;clamp(o);render();save();
}
document.getElementById('leftBtn').addEventListener('click',()=>nudge(-1,0));
document.getElementById('rightBtn').addEventListener('click',()=>nudge(1,0));
document.getElementById('upBtn').addEventListener('click',()=>nudge(0,-1));
document.getElementById('downBtn').addEventListener('click',()=>nudge(0,1));
document.getElementById('deleteBtn').addEventListener('click',()=>{
  if(selectedId==null)return;
  objects=objects.filter(o=>o.id!==selectedId);
  selectedId=null;render();save();
});
gridBtn.addEventListener('click',()=>{
  ground.classList.toggle('grid-on');
  gridBtn.classList.toggle('active',ground.classList.contains('grid-on'));
});
window.addEventListener('resize',()=>{
  objects.forEach(clamp);render();save();
});

const questPages=[
  {
    chapter:'QUEST 001',
    html:'村はずれの古い道に、夜になるとゾンビが現れるらしい。<br>道を通る人が困っている。<br><br>ゾンビを3体倒し、安全を確かめてほしい。',
    left:'あとで',
    right:'受ける'
  },
  {
    chapter:'QUEST 001　1',
    html:'依頼を引き受けた。<br><br>依頼人は、ゾンビが現れるのは日が落ちてからだと教えてくれた。<br>古い道は村の北側にある。',
    left:'閉じる',
    right:'進む'
  },
  {
    chapter:'QUEST 001　2',
    html:'必要なら準備をしてから向かえばいい。<br><br>急ぐ必要はない。<br>村を出れば、古い道へ続く道標がある。',
    left:'閉じる',
    right:'箱庭へ'
  }
];
let questPage=0;
let questAccepted=false;

function saveQuest(){
  try{
    localStorage.setItem('chillQuest001StateV2',JSON.stringify({
      page:questPage,
      accepted:questAccepted
    }));
  }catch(e){}
}
function renderQuestPage(){
  const p=questPages[questPage]||questPages[0];
  questChapter.textContent=p.chapter;
  questStory.innerHTML=p.html;
  questClose.textContent=p.left;
  questAccept.textContent=p.right;
  questPeek.textContent=questAccepted?'依頼中':'依頼';
}
function openQuest(){
  renderQuestPage();
  questBackdrop.classList.add('open');
  questBook.classList.remove('open');
  void questBook.offsetWidth;
  questBook.classList.add('open');
  questBackdrop.setAttribute('aria-hidden','false');
}
function closeQuest(){
  questBook.classList.remove('open');
  questBackdrop.classList.remove('open');
  questBackdrop.setAttribute('aria-hidden','true');
}
questPeek.addEventListener('click',openQuest);
questClose.addEventListener('click',closeQuest);
questBackdrop.addEventListener('click',closeQuest);
questAccept.addEventListener('click',()=>{
  if(questPage===0){
    questAccepted=true;
    questPage=1;
    saveQuest();
    renderQuestPage();
    return;
  }
  if(questPage===1){
    questPage=2;
    saveQuest();
    renderQuestPage();
    return;
  }
  closeQuest();
});
try{
  const saved=JSON.parse(localStorage.getItem('chillQuest001StateV2')||'null');
  if(saved&&Number.isFinite(saved.page)){
    questPage=Math.max(0,Math.min(2,saved.page));
    questAccepted=!!saved.accepted;
  }
}catch(e){}
renderQuestPage();

load();objects.forEach(clamp);render();syncTools();
})();
</script>
</body>
</html>
