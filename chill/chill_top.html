<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe8da">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Chill Herb Shop</title>
<link rel="stylesheet" href="css/chill_top.css?v=20261006-cutout-5">
</head>
<body>
<main id="game" aria-label="薬草店">
  <section id="room" aria-label="自動で動く薬草店">
    <div class="room-base" aria-hidden="true"></div>

    <header class="statusbar">
      <div><span>所持金</span><strong id="money">120</strong><b>G</b></div>
      <div><span>時刻</span><strong id="time">08:00</strong></div>
      <div><span>日付</span><strong id="date">1日目</strong></div>
    </header>

    <div id="customerLayer" class="layer"></div>
    <div id="productLayer" class="layer"></div>
    <div id="stationLayer" class="layer"></div>
    <div id="gardenLayer" class="layer"></div>
    <div id="travelLayer" class="layer travel-layer" aria-hidden="true"></div>

    <button id="bookButton" class="book-hit" type="button" aria-label="本を開く">
      <span id="bookArt" class="crop book-art"></span>
    </button>

    <footer class="auto-bar">
      <strong>AUTO ●</strong>
      <span id="message" aria-live="polite">ラベンダーが育っています</span>
    </footer>
  </section>

  <div id="bookShade" class="book-shade" hidden></div>
  <aside id="bookPanel" class="book-panel" hidden aria-label="本">
    <div class="book-head">
      <strong>本</strong>
      <button id="bookClose" type="button" aria-label="閉じる">×</button>
    </div>
    <nav class="book-tabs" aria-label="本の内容">
      <button class="book-tab active" data-tab="seeds" type="button">種</button>
      <button class="book-tab" data-tab="tools" type="button">道具</button>
      <button class="book-tab" data-tab="recipes" type="button">レシピ</button>
    </nav>
    <div id="bookContent" class="book-content"></div>
  </aside>
</main>
<script src="js/chill_top.js?v=20261006-cutout-5"></script>
</body>
</html>
