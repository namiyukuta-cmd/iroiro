<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f3e8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>因果カードRPG</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;min-height:100%;background:#f7f3e8;color:#24211d;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
#app{
  width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:12px 12px calc(92px + env(safe-area-inset-bottom));
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top-left{display:flex;align-items:center;gap:8px;min-width:0}
.top-title{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{
  border:1px solid #aaa;background:#fffdf8;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700
}
.top-right{display:flex;align-items:center;gap:6px}
.turn{font-size:12px;color:#665f54;white-space:nowrap}
.help-btn{
  width:32px;height:32px;border:1px solid #aaa;border-radius:10px;background:#fffdf8;
  font-size:14px;font-weight:900;padding:0
}
h1{font-size:21px;margin:3px 0 4px;letter-spacing:.03em}
.sub{font-size:12px;color:#736b60;margin:0 0 12px;line-height:1.55}
.paper{
  background:#fffdf8;border:1px solid #cfc6b8;border-radius:14px;
  box-shadow:0 2px 0 rgba(0,0,0,.05);padding:11px;margin-bottom:10px
}
.section-title{font-size:11px;font-weight:800;color:#766c60;letter-spacing:.08em;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card{
  min-height:52px;border:1px solid #b9b0a4;border-radius:10px;background:#fff;
  padding:6px 5px;text-align:left;overflow:hidden
}
.card .kind{font-size:8px;font-weight:900;color:#7d7468;margin-bottom:3px}
.card .name{font-size:11px;font-weight:900;line-height:1.25;white-space:normal}
.card:active{background:#f3eee6}
.placeholder{grid-column:1/-1;color:#aaa;font-size:12px;display:grid;place-items:center;min-height:52px}

.detail-layer{
  position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(35,31,27,.42);backdrop-filter:blur(2px)
}
.detail-layer.show{display:flex}
.detail-card{
  width:min(92vw,390px);background:#fffdf8;border:1px solid #9f9588;border-radius:18px;
  padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.22)
}
.detail-kind{font-size:11px;font-weight:900;color:#7d7468;margin-bottom:6px}
.detail-name{font-size:24px;font-weight:900;line-height:1.25;margin-bottom:12px}
.detail-desc{font-size:15px;line-height:1.65;color:#3f3932;margin-bottom:12px}
.detail-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag,.state-chip{
  display:inline-flex;align-items:center;border:1px solid #d5cec4;border-radius:999px;background:#faf8f3;
  padding:2px 6px;font-size:9px;line-height:1.2
}
.detail-reason{font-size:10px;line-height:1.5;color:#8b5d3b}
.detail-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.detail-btn{
  min-width:84px;min-height:42px;border:1px solid #9e9589;border-radius:11px;background:#fff;
  font-size:12px;font-weight:900
}
.detail-btn.primary-mini{background:#2c2924;color:#fff;border-color:#2c2924}

.help-layer{
  position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(35,31,27,.42);backdrop-filter:blur(2px)
}
.help-layer.show{display:flex}
.help-card{
  width:min(92vw,380px);background:#fffdf8;border:1px solid #9f9588;border-radius:18px;
  padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.22)
}
.help-card h2{font-size:17px;margin:0 0 10px}
.help-card p{font-size:12px;line-height:1.65;margin:7px 0;color:#4f493f}
.action-box{display:none}
.action-box.show{display:block}
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.action-btn{
  min-height:48px;border:1px solid #9e9589;border-radius:11px;background:#fff;font-size:12px;font-weight:850;
  padding:6px 4px
}
.action-btn:active{background:#eee8de}
.action-result{
  display:none;margin-top:9px;padding:9px 10px;border:1px dashed #b9afa2;border-radius:10px;
  background:#faf7f0;font-size:12px;line-height:1.55
}
.action-result.show{display:block}
.state-row{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}
.state-chip strong{margin-left:4px}
.empty{font-size:11px;color:#958d82}
.log{max-height:160px;overflow:auto;font-size:11px;line-height:1.55}
.log-entry{padding:5px 0;border-bottom:1px dashed #ded7cd}
.log-entry:last-child{border-bottom:0}
.controls{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(247,243,232,.96);
  border-top:1px solid #d8d0c5;backdrop-filter:blur(8px);display:grid;grid-template-columns:1fr auto auto;gap:8px;z-index:20
}
.primary{
  min-height:54px;border:1px solid #2c2924;border-radius:13px;background:#2c2924;color:#fff;
  font-size:16px;font-weight:900
}
.primary:active{transform:translateY(1px)}
.reset,.auto-toggle{
  min-width:72px;border:1px solid #aaa;border-radius:13px;background:#fffdf8;font-size:12px;font-weight:800
}
.auto-toggle.on{background:#2c2924;color:#fff;border-color:#2c2924}
.flash{animation:flash .24s ease}
@keyframes flash{0%{transform:translateY(4px);opacity:.45}100%{transform:none;opacity:1}}
</style>
</head>
<body>
<main id="app">
  <div class="topbar">
    <div class="top-left">
      <button class="back" id="backBtn">← 戻る</button>
      <div class="top-title">因果カードRPG</div>
    </div>
    <div class="top-right">
      <div class="turn">探索 <b id="turnNo">0</b> 回</div>
      <button class="help-btn" id="helpBtn" aria-label="ヘルプ">？</button>
    </div>
  </div>

  <section class="paper">
    <div class="section-title">今、世界に残っている気配</div>
    <div id="stateRow" class="state-row"><span class="empty">まだ何もない</span></div>
  </section>

  <section class="paper">
    <div class="section-title">今回の一区画</div>
    <div id="cards" class="cards">
      <div class="card placeholder">最初の一区画を引く</div>
    </div>
  </section>

  <section class="paper action-box" id="actionBox">
    <div class="section-title">どうする？</div>
    <div class="action-grid" id="actionGrid"></div>
    <div class="action-result" id="actionResult"></div>
  </section>

  <section class="paper">
    <div class="section-title">持ち帰ったもの</div>
    <div id="lootRow" class="state-row"><span class="empty">まだ何もない</span></div>
  </section>

  <section class="paper">
    <div class="section-title">因果ログ</div>
    <div id="log" class="log"><div class="empty">探索すると、なぜそのカードが出たかを記録します。</div></div>
  </section>
</main>

<div class="detail-layer" id="detailLayer" aria-hidden="true">
  <div class="detail-card">
    <div class="detail-kind" id="detailKind"></div>
    <div class="detail-name" id="detailName"></div>
    <div class="detail-desc" id="detailDesc"></div>
    <div class="detail-tags" id="detailTags"></div>
    <div class="detail-reason" id="detailReason"></div>
    <div class="detail-actions">
      <button class="detail-btn" id="detailCloseBtn">閉じる</button>
      <button class="detail-btn primary-mini" id="detailNextBtn">次へ</button>
    </div>
  </div>
</div>

<div class="help-layer" id="helpLayer" aria-hidden="true">
  <div class="help-card">
    <h2>ヘルプ</h2>
    <p>場所・発見・出来事の3枚が自動で出ます。最初は1枚ずつ大きく表示され、あとから上の小さなカードを押せば見直せます。</p>
    <p><b>オート ON</b>では、「どうする？」の選択だけを現在の状況から自動で決めます。オート OFFなら自分で選びます。</p>
    <p>過去のカードや選択結果は内部状態に残り、次に出るカードの確率へ影響します。</p>
    <div class="detail-actions"><button class="detail-btn primary-mini" id="helpCloseBtn">閉じる</button></div>
  </div>
</div>

<div class="controls">
  <button class="primary" id="drawBtn">最初の一区画を引く</button>
  <button class="auto-toggle" id="autoBtn">オート OFF</button>
  <button class="reset" id="resetBtn">リセット</button>
</div>

<script>
(()=>{
  const LABELS={
    forest:"森",water:"水辺",ruin:"廃墟",cave:"洞窟",road:"街道",human:"人",goblin:"ゴブリン",
    beast:"獣",blood:"血痕",danger:"危険",resource:"資源",herb:"薬草",rain:"雨",night:"夜",
    shelter:"休息地",treasure:"宝",clue:"痕跡",trap:"罠",fire:"火",mud:"ぬかるみ"
  };

  const locationCards=[
    {id:"forest_path",kind:"場所",name:"森の小道",desc:"木々の間を細い道が続いている。",tags:["forest"],effects:{forest:2,beast:1},affinity:{forest:3,beast:2,herb:2}},
    {id:"riverbank",kind:"場所",name:"浅い川辺",desc:"水音が近い。石の間に何か流れ着いている。",tags:["water"],effects:{water:2,resource:1},affinity:{water:3,rain:2}},
    {id:"ruin_edge",kind:"場所",name:"崩れた遺跡",desc:"壁だけが残り、奥は暗い。",tags:["ruin"],effects:{ruin:2,danger:1},affinity:{ruin:4,treasure:2,clue:1}},
    {id:"old_road",kind:"場所",name:"古い街道",desc:"人の往来が途絶えた石敷きの道。",tags:["road","human"],effects:{human:1,road:2},affinity:{human:3,road:3}},
    {id:"cave_mouth",kind:"場所",name:"洞窟の入口",desc:"冷たい空気が奥から流れてくる。",tags:["cave"],effects:{cave:2,danger:1},affinity:{cave:4,goblin:2,beast:2,ruin:1}},
    {id:"marsh",kind:"場所",name:"ぬかるんだ湿地",desc:"足元が沈み、進むたび水が鳴る。",tags:["water","mud"],effects:{water:1,mud:2,danger:1},affinity:{rain:3,water:2}},
    {id:"old_bridge",kind:"場所",name:"古い橋",desc:"板が何枚か抜けた橋が谷を渡っている。",tags:["road","danger"],effects:{road:1,danger:2},affinity:{road:2,danger:3,human:1}},
    {id:"clearing",kind:"場所",name:"森の空き地",desc:"木々が途切れ、見通しが開けている。",tags:["forest"],effects:{forest:1},affinity:{forest:3,fire:2,human:1}},
    {id:"abandoned_hut",kind:"場所",name:"捨てられた小屋",desc:"扉が半分開いたままになっている。",tags:["human","shelter"],effects:{human:2,shelter:2,clue:1},affinity:{human:3,clue:2,road:1}},
    {id:"rocky_slope",kind:"場所",name:"岩だらけの斜面",desc:"登りにくいが、遠くまで見渡せる。",tags:["danger"],effects:{danger:1,clue:1},affinity:{danger:2,cave:2}}
  ];

  const discoveryCards=[
    {id:"blood_trace",kind:"発見",name:"新しい血痕",desc:"まだ乾いていない。何かが近くにいる。",tags:["blood","clue"],effects:{blood:3,clue:2,danger:1},affinity:{beast:4,human:3,goblin:3,danger:2}},
    {id:"herbs",kind:"発見",name:"薬草",desc:"使えそうな葉がまとまって生えている。",tags:["herb","resource"],effects:{herb:2,resource:2},loot:"薬草",affinity:{forest:4,water:1}},
    {id:"goblin_tracks",kind:"発見",name:"小さな足跡",desc:"裸足に近い足跡が何度も往復している。",tags:["goblin","clue"],effects:{goblin:3,clue:2,danger:1},affinity:{goblin:5,cave:2,forest:2}},
    {id:"broken_cart",kind:"発見",name:"壊れた荷車",desc:"車輪が外れ、荷物の一部が散らばっている。",tags:["human","clue"],effects:{human:2,clue:1,danger:1},loot:"布切れ",affinity:{road:4,human:3,goblin:1}},
    {id:"cold_fire",kind:"発見",name:"消えた焚火",desc:"灰の下にわずかな熱が残っている。",tags:["fire","human","clue"],effects:{fire:2,human:2,clue:1},affinity:{human:3,goblin:2,shelter:2}},
    {id:"bones",kind:"発見",name:"散らばった骨",desc:"古い骨に新しい噛み跡が混じっている。",tags:["beast","clue"],effects:{beast:3,clue:2,danger:1},affinity:{beast:5,blood:2,cave:1}},
    {id:"small_chest",kind:"発見",name:"小さな箱",desc:"泥に半分埋まった木箱を見つけた。",tags:["treasure"],effects:{treasure:2},loot:"古い硬貨",affinity:{ruin:4,human:1}},
    {id:"map_piece",kind:"発見",name:"破れた地図",desc:"近くの地形らしき線が描かれている。",tags:["clue"],effects:{clue:3,cave:1,ruin:1},loot:"地図の切れ端",affinity:{human:2,ruin:2,road:2}},
    {id:"berries",kind:"発見",name:"木の実",desc:"食べられそうな実が低い枝に残っている。",tags:["resource","forest"],effects:{resource:2,forest:1},loot:"木の実",affinity:{forest:5,beast:1}},
    {id:"iron_key",kind:"発見",name:"錆びた鍵",desc:"何の鍵かは分からない。",tags:["clue","treasure"],effects:{clue:2,treasure:1,ruin:1},loot:"錆びた鍵",affinity:{ruin:4,human:2}}
  ];

  const eventCards=[
    {id:"wolf",kind:"出来事",name:"狼が現れる",desc:"低い唸り声とともに茂みから姿を見せた。",tags:["beast","danger"],effects:{beast:2,danger:2},affinity:{beast:5,blood:4,forest:2},loot:"獣の毛"},
    {id:"goblin_scout",kind:"出来事",name:"ゴブリンの斥候",desc:"こちらに気づき、逃げるか迷っている。",tags:["goblin","danger"],effects:{goblin:2,danger:2,clue:1},affinity:{goblin:6,cave:2,forest:1},loot:"粗末な小袋"},
    {id:"wounded_traveler",kind:"出来事",name:"負傷した旅人",desc:"道端で腕を押さえ、助けを求めている。",tags:["human","blood"],effects:{human:2,blood:1,clue:1},affinity:{human:5,blood:5,road:2}},
    {id:"rain",kind:"出来事",name:"雨が降り出す",desc:"細い雨が急に強くなってきた。",tags:["rain","water"],effects:{rain:3,water:2,mud:1},affinity:{water:4,rain:3}},
    {id:"fog",kind:"出来事",name:"霧が濃くなる",desc:"少し先までしか見えなくなる。",tags:["danger"],effects:{danger:2,clue:1},affinity:{water:2,forest:2,danger:2}},
    {id:"rockfall",kind:"出来事",name:"小さな崩落",desc:"進路に石が落ち、別の道を探す必要がある。",tags:["danger"],effects:{danger:3,cave:1},affinity:{cave:4,danger:4}},
    {id:"merchant",kind:"出来事",name:"行商人と出会う",desc:"荷を背負った商人がこちらへ手を上げた。",tags:["human"],effects:{human:2,danger:-1},affinity:{road:5,human:5}},
    {id:"snare",kind:"出来事",name:"仕掛け罠",desc:"草の下に細い縄が張られている。",tags:["trap","danger"],effects:{trap:2,danger:2,goblin:1},affinity:{goblin:4,human:2,forest:2}},
    {id:"nightfall",kind:"出来事",name:"日が暮れる",desc:"辺りが急に暗くなり、音だけが目立つ。",tags:["night","danger"],effects:{night:3,danger:1},affinity:{danger:2,beast:2,cave:1}},
    {id:"quiet",kind:"出来事",name:"何も起きない",desc:"しばらく静かな道が続く。",tags:["shelter"],effects:{danger:-2,shelter:1},affinity:{shelter:3}}
  ];

  const state={};
  const loot=[];
  const log=[];
  let turn=0;
  let currentDraw=null;
  let awaitingAction=false;
  let autoMode=false;
  let autoTimer=null;
  let detailIndex=0;
  let detailSequence=false;

  const el={
    cards:document.getElementById("cards"),
    state:document.getElementById("stateRow"),
    loot:document.getElementById("lootRow"),
    log:document.getElementById("log"),
    turn:document.getElementById("turnNo"),
    actionBox:document.getElementById("actionBox"),
    actionGrid:document.getElementById("actionGrid"),
    actionResult:document.getElementById("actionResult"),
    drawBtn:document.getElementById("drawBtn"),
    autoBtn:document.getElementById("autoBtn"),
    detailLayer:document.getElementById("detailLayer"),
    detailKind:document.getElementById("detailKind"),
    detailName:document.getElementById("detailName"),
    detailDesc:document.getElementById("detailDesc"),
    detailTags:document.getElementById("detailTags"),
    detailReason:document.getElementById("detailReason"),
    detailCloseBtn:document.getElementById("detailCloseBtn"),
    detailNextBtn:document.getElementById("detailNextBtn"),
    helpLayer:document.getElementById("helpLayer")
  };

  function value(k){return Math.max(0,Number(state[k]||0))}
  function add(k,n){
    state[k]=Math.max(0,Math.min(12,(state[k]||0)+n));
    if(state[k]===0)delete state[k];
  }

  function decay(){
    for(const k of Object.keys(state)){
      if(["night","rain"].includes(k)) state[k]=Math.max(0,state[k]-1);
      else state[k]=Math.max(0,Math.round(state[k]*0.82*10)/10);
      if(state[k]<0.4) delete state[k];
    }
  }

  function score(card){
    let weight=10;
    const reasons=[];
    for(const [tag,mul] of Object.entries(card.affinity||{})){
      const v=value(tag);
      if(v>0){
        const plus=v*mul;
        weight+=plus;
        if(plus>=2) reasons.push((LABELS[tag]||tag)+" "+format(v)+" → +"+format(plus));
      }
    }
    if(card.id==="quiet" && value("danger")>6) weight+=8;
    return {weight:Math.max(1,weight),reasons};
  }

  function weightedDraw(cards){
    const scored=cards.map(card=>({card,...score(card)}));
    const total=scored.reduce((s,x)=>s+x.weight,0);
    let r=Math.random()*total;
    let chosen=scored[scored.length-1];
    for(const x of scored){
      r-=x.weight;
      if(r<=0){chosen=x;break}
    }
    return chosen;
  }

  function applyCard(card){
    for(const [k,n] of Object.entries(card.effects||{})) add(k,n);
  }

  function addLoot(item){
    if(item && !loot.includes(item)) loot.push(item);
  }

  function drawSection(cards){
    const chosen=weightedDraw(cards);
    applyCard(chosen.card);
    return chosen;
  }

  function format(n){
    return Number.isInteger(n)?String(n):Number(n).toFixed(1);
  }

  function cardHTML(x,index){
    const c=x.card;
    return '<button class="card flash" data-card-index="'+index+'">'+
      '<div class="kind">'+c.kind+'</div>'+
      '<div class="name">'+c.name+'</div>'+
    '</button>';
  }

  function detailWhy(x){
    return x.reasons.length
      ? "因果："+x.reasons.slice(0,3).join(" / ")
      : "因果：基礎抽選";
  }

  function openDetail(index,sequence=false){
    if(!currentDraw || !currentDraw[index])return;
    detailIndex=index;
    detailSequence=sequence;
    const x=currentDraw[index];
    const c=x.card;
    el.detailKind.textContent=c.kind;
    el.detailName.textContent=c.name;
    el.detailDesc.textContent=c.desc;
    el.detailTags.innerHTML=c.tags.map(t=>'<span class="tag">'+(LABELS[t]||t)+'</span>').join("");
    el.detailReason.textContent=detailWhy(x);
    el.detailNextBtn.style.display=detailSequence?"inline-flex":"none";
    if(detailSequence){
      el.detailNextBtn.textContent=detailIndex<currentDraw.length-1?"次へ":"決定";
      el.detailCloseBtn.style.display="none";
    }else{
      el.detailCloseBtn.style.display="inline-flex";
    }
    el.detailLayer.classList.add("show");
    el.detailLayer.setAttribute("aria-hidden","false");
  }

  function closeDetail(){
    el.detailLayer.classList.remove("show");
    el.detailLayer.setAttribute("aria-hidden","true");
  }

  function finishInitialDetails(){
    detailSequence=false;
    closeDetail();
    showActions();
  }

  function hasTag(tag){
    return currentDraw ? currentDraw.some(x=>x.card.tags.includes(tag)) : false;
  }

  function currentLoot(){
    if(!currentDraw)return [];
    return currentDraw.map(x=>x.card.loot).filter(Boolean);
  }

  function actionSet(){
    if(hasTag("goblin") || hasTag("beast")){
      return [
        {label:"戦う",id:"fight"},
        {label:"避ける",id:"avoid"},
        {label:"様子を見る",id:"observe"}
      ];
    }
    if(hasTag("human")){
      return [
        {label:"話す",id:"talk"},
        {label:"助ける",id:"help"},
        {label:"離れる",id:"leave"}
      ];
    }
    if(hasTag("trap") || (hasTag("danger") && !hasTag("human"))){
      return [
        {label:"慎重に進む",id:"careful"},
        {label:"調べる",id:"inspect"},
        {label:"強行する",id:"force"}
      ];
    }
    if(hasTag("resource") || hasTag("treasure") || hasTag("herb")){
      return [
        {label:"拾う",id:"take"},
        {label:"調べる",id:"inspect"},
        {label:"先へ進む",id:"leave"}
      ];
    }
    return [
      {label:"調べる",id:"inspect"},
      {label:"休む",id:"rest"},
      {label:"先へ進む",id:"leave"}
    ];
  }

  function autoChooseAction(actions){
    // オートは完全ランダムではなく、今の状況から少しだけ判断する。
    const d=value("danger");
    const weights=actions.map(a=>{
      let w=10;
      if(a.id==="fight") w += d<5 ? 8 : -3;
      if(a.id==="avoid") w += d>=5 ? 10 : 1;
      if(a.id==="observe") w += value("clue")<5 ? 5 : 1;
      if(a.id==="talk") w += hasTag("human") ? 9 : 0;
      if(a.id==="help") w += hasTag("blood") ? 8 : 2;
      if(a.id==="careful") w += d>=4 ? 10 : 3;
      if(a.id==="inspect") w += currentLoot().length ? 8 : 4;
      if(a.id==="force") w += d<=2 ? 4 : -4;
      if(a.id==="take") w += currentLoot().length ? 12 : 2;
      if(a.id==="rest") w += d>=4 ? 7 : 2;
      if(a.id==="leave") w += d>=6 ? 8 : 2;
      return Math.max(1,w);
    });
    const total=weights.reduce((s,w)=>s+w,0);
    let r=Math.random()*total;
    for(let i=0;i<actions.length;i++){
      r-=weights[i];
      if(r<=0)return actions[i];
    }
    return actions[actions.length-1];
  }

  function runAutoAction(){
    if(!autoMode || !awaitingAction)return;
    const actions=actionSet();
    const chosen=autoChooseAction(actions);
    const btn=[...el.actionGrid.querySelectorAll("button")]
      .find(b=>b.dataset.action===chosen.id);
    if(btn)btn.classList.add("flash");
    resolveAction(chosen.id,"オート："+chosen.label);
  }

  function showActions(){
    const actions=actionSet();
    el.actionBox.classList.add("show");
    el.actionResult.classList.remove("show");
    el.actionResult.textContent="";
    el.actionGrid.innerHTML=actions.map(a=>
      '<button class="action-btn" data-action="'+a.id+'">'+a.label+'</button>'
    ).join("");
    el.actionGrid.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click",()=>resolveAction(btn.dataset.action,btn.textContent));
    });

    if(autoMode){
      clearTimeout(autoTimer);
      autoTimer=setTimeout(runAutoAction,550);
    }
  }

  function resolveAction(id,label){
    if(!awaitingAction)return;
    clearTimeout(autoTimer);
    autoTimer=null;
    awaitingAction=false;

    const foundLoot=currentLoot();
    let result="";
    const roll=Math.random();

    if(id==="fight"){
      if(roll<0.68){
        add("danger",-2); add("clue",1);
        foundLoot.forEach(addLoot);
        result="勝った。"+(foundLoot.length?"「"+foundLoot.join("・")+"」を持ち帰る。":"周囲を調べ、痕跡を得た。");
      }else{
        add("danger",3);
        result="押し切れなかった。危険が増した。";
      }
    }else if(id==="avoid"){
      add("danger",-2); add("clue",-1);
      result="危険を避けて抜けた。戦利品は得なかった。";
    }else if(id==="observe"){
      add("clue",2); add("danger",1);
      result="距離を取って観察した。痕跡を得たが、長居したぶん危険も少し増えた。";
    }else if(id==="talk"){
      add("human",2); add("clue",2); add("danger",-1);
      result="話を聞いた。人の気配と新しい手掛かりが残った。";
    }else if(id==="help"){
      add("human",3); add("clue",1); add("danger",1);
      if(roll<0.55)addLoot("小さなお礼");
      result="手を貸した。時間はかかったが、人との縁が強くなった。";
    }else if(id==="careful"){
      add("danger",-2); add("clue",1);
      result="慎重に進み、危険を抑えた。";
    }else if(id==="inspect"){
      add("clue",2); add("danger",1);
      if(foundLoot.length && roll<0.75){
        foundLoot.forEach(addLoot);
        result="詳しく調べた。「"+foundLoot.join("・")+"」を見つけた。";
      }else{
        result="詳しく調べ、次につながる痕跡を得た。";
      }
    }else if(id==="force"){
      if(roll<0.5){
        add("danger",-1); add("clue",1);
        result="強引に突破した。今回は通れた。";
      }else{
        add("danger",3);
        result="強行した結果、危険が増した。";
      }
    }else if(id==="take"){
      foundLoot.forEach(addLoot);
      add("resource",1);
      result=foundLoot.length?"「"+foundLoot.join("・")+"」を持ち帰ることにした。":"使えそうなものを確保した。";
    }else if(id==="rest"){
      add("danger",-2); add("shelter",2);
      result="少し休んだ。周囲の危険が薄れた。";
    }else{
      add("danger",-1);
      result="深入りせず先へ進むことにした。";
    }

    log.push('<b>'+turn+'回目の対処</b>　'+label+'<br>'+result);
    el.actionGrid.querySelectorAll("button").forEach(b=>b.disabled=true);
    el.actionResult.textContent=result;
    el.actionResult.classList.add("show");
    el.drawBtn.disabled=false;
    el.drawBtn.textContent="次の一区画を引く";
    renderState();
    renderLog();
  }

  function renderState(){
    const entries=Object.entries(state).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,14);
    el.state.innerHTML=entries.length
      ? entries.map(([k,v])=>'<span class="state-chip">'+(LABELS[k]||k)+' <strong>'+format(v)+'</strong></span>').join("")
      : '<span class="empty">まだ何もない</span>';

    el.loot.innerHTML=loot.length
      ? loot.map(x=>'<span class="state-chip">'+x+'</span>').join("")
      : '<span class="empty">まだ何もない</span>';

    el.turn.textContent=turn;
  }

  function renderLog(){
    el.log.innerHTML=log.length
      ? log.slice().reverse().map(x=>'<div class="log-entry">'+x+'</div>').join("")
      : '<div class="empty">探索すると、なぜそのカードが出たかを記録します。</div>';
  }

  function explore(){
    if(awaitingAction)return;
    turn++;
    decay();

    const loc=drawSection(locationCards);
    const disc=drawSection(discoveryCards);
    const evt=drawSection(eventCards);
    currentDraw=[loc,disc,evt];
    awaitingAction=true;

    el.cards.innerHTML=currentDraw.map((x,i)=>cardHTML(x,i)).join("");
    el.cards.querySelectorAll("[data-card-index]").forEach(btn=>{
      btn.addEventListener("click",()=>openDetail(Number(btn.dataset.cardIndex),false));
    });

    const chain=currentDraw.map(x=>x.card.name).join(" → ");
    const cause=currentDraw
      .flatMap(x=>x.reasons)
      .filter((v,i,a)=>a.indexOf(v)===i)
      .slice(0,4);

    log.push('<b>'+turn+'回目</b>　'+chain+
      (cause.length?'<br><span style="color:#8b5d3b">'+cause.join(" / ")+'</span>':""));

    el.actionBox.classList.remove("show");
    el.drawBtn.disabled=true;
    el.drawBtn.textContent="カード確認中";
    renderState();
    renderLog();
    openDetail(0,true);
  }

  function reset(){
    clearTimeout(autoTimer);
    autoTimer=null;
    for(const k of Object.keys(state)) delete state[k];
    loot.length=0;log.length=0;turn=0;currentDraw=null;awaitingAction=false;detailIndex=0;detailSequence=false;
    closeDetail();
    el.cards.innerHTML='<div class="card placeholder">最初の一区画を引く</div>';
    el.actionBox.classList.remove("show");
    el.actionGrid.innerHTML="";
    el.actionResult.classList.remove("show");
    el.drawBtn.disabled=false;
    el.drawBtn.textContent="最初の一区画を引く";
    renderState();renderLog();
  }

  function toggleAuto(){
    autoMode=!autoMode;
    el.autoBtn.textContent=autoMode?"オート ON":"オート OFF";
    el.autoBtn.classList.toggle("on",autoMode);

    if(autoMode && awaitingAction && !detailSequence){
      clearTimeout(autoTimer);
      autoTimer=setTimeout(runAutoAction,350);
    }else if(!autoMode){
      clearTimeout(autoTimer);
      autoTimer=null;
    }
  }

  el.detailNextBtn.addEventListener("click",()=>{
    if(!detailSequence){closeDetail();return;}
    if(detailIndex<currentDraw.length-1){
      openDetail(detailIndex+1,true);
    }else{
      finishInitialDetails();
    }
  });
  el.detailCloseBtn.addEventListener("click",closeDetail);
  el.detailLayer.addEventListener("click",e=>{
    if(e.target===el.detailLayer && !detailSequence)closeDetail();
  });

  document.getElementById("helpBtn").addEventListener("click",()=>{
    el.helpLayer.classList.add("show");
    el.helpLayer.setAttribute("aria-hidden","false");
  });
  document.getElementById("helpCloseBtn").addEventListener("click",()=>{
    el.helpLayer.classList.remove("show");
    el.helpLayer.setAttribute("aria-hidden","true");
  });
  el.helpLayer.addEventListener("click",e=>{
    if(e.target===el.helpLayer){
      el.helpLayer.classList.remove("show");
      el.helpLayer.setAttribute("aria-hidden","true");
    }
  });

  document.getElementById("drawBtn").addEventListener("click",explore);
  document.getElementById("autoBtn").addEventListener("click",toggleAuto);
  document.getElementById("resetBtn").addEventListener("click",reset);
  document.getElementById("backBtn").addEventListener("click",()=>location.href='/iroiro/chill/chill_index.html?_nc='+Date.now());

  const u=new URL(location.href);
  if(!u.searchParams.has("_nc")){
    u.searchParams.set("_nc",Date.now().toString());
    location.replace(u.toString());
  }
})();
</script>
