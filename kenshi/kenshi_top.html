<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#17140f" />
  <title>荒野</title>
  <link rel="stylesheet" href="kenshi_style.css?v=20260921-7" />
</head>
<body>
<div id="app">
  <header class="topHud">
    <div class="dayClock">
      <b id="dayText">1日目</b>
      <span id="clock">08:00</span>
    </div>

    <div class="topStats">
      <span>HP <b id="hpText">100/100</b></span>
      <span>空腹 <b id="hungerText">0</b></span>
      <span>金 <b id="moneyText">100</b></span>
    </div>

    <div class="topControls">
      <button id="speedBtn" type="button">×1</button>
      <button id="pauseBtn" type="button">停止</button>
      <div class="quickMenuWrap">
        <button id="quickMenuBtn" class="roundBtn" type="button" aria-label="メニュー">…</button>
        <div id="quickMenu" class="quickMenu" hidden>
          <button id="saveBtn" type="button">保存</button>
          <button id="loadBtn" type="button">読込</button>
          <a href="kenshi_index.html">入口</a>
        </div>
      </div>
    </div>
  </header>

  <main id="fieldStage" class="fieldStage" aria-label="荒野フィールド">
    <div id="fieldObjects" class="fieldObjects"></div>

    <div id="playerFixed" class="fieldPlayer" aria-label="主人公">
      <span class="head"></span>
      <span class="body"></span>
      <span class="arm armL"></span>
      <span class="arm armR"></span>
      <span class="leg legL"></span>
      <span class="leg legR"></span>
    </div>

    <aside class="fieldInfo">
      <b id="weather">乾燥</b>
      <span id="locationText">荒野</span>
      <span id="travelText"></span>
    </aside>

    <button id="mapBtn" class="mapBtn" type="button" aria-label="地図を開く">
      <span class="mapGrid"></span>
      <span class="mapPlayer">▲</span>
    </button>

    <div id="contextActions" class="contextActions"></div>
    <div id="resultToast" class="resultToast" aria-live="polite"></div>

    <div id="movePad" class="movePad" aria-label="自由移動">
      <button class="moveKey up" type="button" data-move="up" aria-label="上">▲</button>
      <button class="moveKey left" type="button" data-move="left" aria-label="左">◀</button>
      <button id="stopMoveBtn" class="moveKey center" type="button" aria-label="停止">●</button>
      <button class="moveKey right" type="button" data-move="right" aria-label="右">▶</button>
      <button class="moveKey down" type="button" data-move="down" aria-label="下">▼</button>
    </div>
  </main>

  <footer class="hotbarBand">
    <div class="footerBar">
      <button id="inventoryBtn" class="footerAction" type="button" aria-label="持物">袋</button>
      <button id="partyBtn" class="footerAction" type="button" aria-label="部隊">隊</button>
      <div id="hotbar" class="hotbar"></div>
    </div>
  </footer>

  <section id="mapOverlay" class="overlay" hidden aria-label="世界地図">
    <div class="overlayCard mapCard">
      <header class="overlayHead">
        <h2>世界地図</h2>
        <button id="closeMapBtn" type="button">×</button>
      </header>
      <div class="worldMapWrap">
        <div id="worldMap" class="worldMap">
          <svg id="mapRoutes" class="mapRoutes" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div id="mapPlaces"></div>
          <div id="mapActors"></div>
          <div id="mapPlayerDot" class="mapPlayerDot"></div>
        </div>
      </div>
      <div class="destinationHead">行き先</div>
      <div id="destinationList" class="destinationList"></div>
    </div>
  </section>

  <section id="panelOverlay" class="overlay" hidden aria-label="管理">
    <div class="overlayCard panelCard">
      <header class="overlayHead">
        <h2 id="panelTitle">持物</h2>
        <button id="closePanelBtn" type="button">×</button>
      </header>
      <nav class="panelTabs">
        <button type="button" data-panel="inventory" class="active">持物</button>
        <button type="button" data-panel="party">部隊</button>
        <button type="button" data-panel="faction">勢力</button>
        <button type="button" data-panel="log">記録</button>
      </nav>
      <div id="panelContent" class="panelContent"></div>
    </div>
  </section>
</div>

<script src="kenshi_game.js?v=20260921-11"></script>
</body>
</html>
