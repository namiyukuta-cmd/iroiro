<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>荒野</title>
  <link rel="stylesheet" href="kenshi_style.css?v=20260921-6" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="timebox">
      <b id="clock">1日目 08:00</b>
      <span id="weather">乾燥</span>
    </div>
    <div class="topActions">
      <button id="speedBtn" type="button">×1</button>
      <button id="pauseBtn" type="button">停止</button>
      <button id="saveBtn" type="button">保存</button>
      <button id="loadBtn" type="button">読込</button>
      <a href="kenshi_index.html">入口</a>
    </div>
  </header>

  <section class="travelShell">
    <aside class="destinationPanel">
      <div class="destinationTitle">行き先</div>
      <div id="travelSelector" class="travelSelector" aria-label="行き先一覧"></div>
    </aside>

    <section id="mapPanel" class="mapPanel">
      <div id="mapViewport" class="mapViewport" aria-label="世界地図">
        <div id="worldStage" class="worldStage">
          <svg id="routeSvg" class="route" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div id="landmarks"></div>
          <div id="actors"></div>
          <div id="moveCursor" class="moveCursor" aria-hidden="true"></div>
        </div>

        <div class="mapTools">
          <button id="zoomOutBtn" type="button" aria-label="縮小">−</button>
          <button id="zoomResetBtn" type="button" aria-label="全体表示">全体</button>
          <button id="zoomInBtn" type="button" aria-label="拡大">＋</button>
        </div>

        <div class="mapStatus">
          <span>HP <b id="hpText">100/100</b></span>
          <span>空腹 <b id="hungerText">0</b></span>
          <span>所持金 <b id="moneyText">100</b></span>
        </div>
      </div>

      <div class="travelControls">
        <div class="movePad" aria-label="自由移動">
          <button class="moveKey up" type="button" data-move="up" aria-label="上">▲</button>
          <button class="moveKey left" type="button" data-move="left" aria-label="左">◀</button>
          <button id="moveConfirm" class="moveKey center" type="button" aria-label="選択地点へ移動">●</button>
          <button class="moveKey right" type="button" data-move="right" aria-label="右">▶</button>
          <button class="moveKey down" type="button" data-move="down" aria-label="下">▼</button>
        </div>
        <div class="travelControlText">
          <b>移動</b>
          <span>方向キー＝自由移動</span>
          <span>紫で選択 → ●で目的地へ</span>
        </div>
      </div>
    </section>
  </section>

  <section id="encounterPanel" class="encounterPanel">
    <div id="encounterScene" class="encounterScene" aria-label="主人公の周囲">
      <div class="sceneGround"></div>
      <div id="scenePlace" class="scenePlace"></div>
      <div id="sceneEntities" class="sceneEntities"></div>
      <div class="scenePlayer">
        <span class="head"></span>
        <span class="body"></span>
        <span class="arm armL"></span>
        <span class="arm armR"></span>
        <span class="leg legL"></span>
        <span class="leg legR"></span>
      </div>
      <div id="resultToast" class="resultToast" aria-live="polite"></div>
      <div id="encounterActions" class="encounterActions"></div>
    </div>
  </section>

  <section id="menuArea" class="menuArea">
    <nav class="menuTabs">
      <button type="button" data-menu="inventory" class="active">持物</button>
      <button type="button" data-menu="party">部隊</button>
      <button type="button" data-menu="faction">勢力</button>
      <button type="button" data-menu="log">記録</button>
    </nav>
    <div id="menuPane" class="menuPane"></div>
  </section>
</div>

<script src="kenshi_game.js?v=20260921-10"></script>
</body>
</html>
