<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Kenshi風・止め絵版</title>
  <link rel="stylesheet" href="kenshi_still.css?v=20260922-3" />
</head>
<body>
  <main class="gameShell">
    <header class="topBar">
      <div class="timeBlock">
        <b id="dayText">1日目</b>
        <span id="clockText">08:00</span>
      </div>
      <button id="menuBtn" class="roundBtn" type="button">•••</button>
    </header>

    <section class="worldStage" aria-label="世界">
      <div class="orbit" aria-hidden="true"></div>
      <div id="sunMoon" class="sunMoon sun" aria-hidden="true"></div>

      <div id="sceneWindow" class="sceneWindow">
        <div id="sceneArt" class="sceneArt roadScene" role="img" aria-label="現在地の景色"></div>
        <div id="mapView" class="mapView" hidden>
          <div class="mapRoads" aria-hidden="true">
            <i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4"></i><i class="r5"></i>
          </div>
          <button class="mapNode dust" type="button" data-destination="dust">砂塵街</button>
          <button class="mapNode cross" type="button" data-destination="cross">十字路</button>
          <button class="mapNode mine" type="button" data-destination="mine">鉄鉱山</button>
          <button class="mapNode farm" type="button" data-destination="farm">南農場</button>
          <button class="mapNode ruins" type="button" data-destination="ruins">旧遺跡</button>
          <div id="mapPlayerMarker" class="mapPlayerMarker"><i></i><b>現在地</b></div>
          <span id="mapHere" class="mapHere">現在地</span>
        </div>

        <div class="sceneCaption">
          <b id="placeName">街道</b>
          <span id="placeKind">移動中の道</span>
        </div>
        <div id="travelState" class="travelState" hidden></div>
      </div>

      <div id="sceneActions" class="sceneActions" aria-label="現在地の行動"></div>
      <button id="destinationBtn" class="destinationTab" type="button">行き先</button>
    </section>

    <section class="statusStrip">
      <div class="meter hpMeter">
        <span>HP</span>
        <div class="meterTrack"><i id="hpFill"></i></div>
        <b id="hpText">100/100</b>
      </div>
      <div class="meter hungerMeter">
        <span>空腹</span>
        <div class="meterTrack"><i id="hungerFill"></i></div>
        <b id="hungerText">0/100</b>
      </div>
      <div class="moneyCoin">
        <span>金</span>
        <b id="moneyText">100</b>
      </div>
    </section>

    <section class="yellowPanel">
      <nav class="tabBar" aria-label="ゲームメニュー">
        <button class="tab active" type="button" data-tab="items">持物</button>
        <button class="tab" type="button" data-tab="party">部隊</button>
        <button class="tab" type="button" data-tab="log">記録</button>
      </nav>
      <div id="panelContent" class="panelContent"></div>
    </section>

    <div id="toast" class="toast" aria-live="polite"></div>

    <div id="quickMenu" class="quickMenu" hidden>
      <button id="saveBtn" type="button">セーブ</button>
      <button id="loadBtn" type="button">ロード</button>
      <a href="kenshi_index.html">入口へ戻る</a>
    </div>
  </main>
  <script src="kenshi_items.js?v=20260922-3"></script>
  <script src="kenshi_still.js?v=20260922-3"></script>
</body>
</html>
