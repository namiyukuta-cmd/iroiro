<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>iroiro</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f7f7f5;
      color: #202020;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    main {
      width: min(100%, 520px);
      min-height: 100dvh;
      padding:
        max(28px, env(safe-area-inset-top))
        18px
        max(28px, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 10px 0 28px;
      font-size: 28px;
      text-align: center;
    }

    .game-list {
      display: grid;
      gap: 14px;
    }

    .game-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 14px 18px;
      border: 2px solid #202020;
      border-radius: 18px;
      background: #fff;
      color: #202020;
      text-decoration: none;
      font-size: 22px;
      font-weight: 750;
      -webkit-tap-highlight-color: transparent;
    }

    .game-button:active {
      transform: scale(0.98);
      background: #eeeeea;
    }
  </style>
</head>
<body>
  <main>
    <h1>ゲームを選ぶ</h1>

    <div class="game-list">
      <a class="game-button" href="eigo.html">英語</a>
    </div>
  </main>
</body>
</html>
