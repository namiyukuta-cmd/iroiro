<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HMW 会話テスト</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f4f2ec}
    *{box-sizing:border-box}
    body{margin:0;padding:12px}
    main{max-width:860px;margin:0 auto;display:grid;gap:10px}
    h1{font-size:20px;margin:0}
    .card{background:#fff;border:1px solid #ccc5b9;border-radius:12px;padding:10px}
    textarea{width:100%;min-height:230px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #bbb;border-radius:8px;padding:8px}
    button{min-height:44px;padding:8px 14px;border:1px solid #777;border-radius:9px;background:#fff;font-weight:700}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
    .english{font-size:18px;line-height:1.55;font-weight:700}
    .muted{color:#666;font-size:12px}
    .error{color:#a40000}
  </style>
</head>
<body>
<main>
  <h1>HMW 会話テスト</h1>
  <div class="card muted">会話エンジンはこのページを開いた時に1回だけ読み込みます。以後はページを再読み込みせず、入力データを変えて「実行」だけで⑤→⑥を確認できます。</div>

  <div class="card">
    <div class="buttons">
      <button id="run-test" type="button">実行</button>
      <button id="reset-aaron" type="button">アーロン緊急支援テストに戻す</button>
    </div>
  </div>

  <div class="card">
    <b>テスト入力(JSON)</b>
    <textarea id="test-input" spellcheck="false"></textarea>
  </div>

  <div class="card">
    <b>⑥ 生成英文</b>
    <div id="english" class="english">読み込み中…</div>
  </div>

  <div class="card">
    <b>⑤ 選択された意味ID</b>
    <pre id="meaning-ids"></pre>
  </div>

  <div class="card">
    <b>生成内訳</b>
    <pre id="details"></pre>
  </div>
</main>

<script src="js/dialogue-loader.js?v=20260924-router-constraints"></script>
<script src="js/dialogue/dialogue-fast-test-runner.js?v=20260925-1"></script>
</body>
</html>
