<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>HMW 会話JS確認</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f4f2ec}
    *{box-sizing:border-box}
    body{margin:0;padding:10px}
    main{max-width:860px;margin:0 auto;display:grid;gap:9px}
    h1{font-size:20px;margin:0}
    .card{background:#fff;border:1px solid #ccc5b9;border-radius:12px;padding:10px}
    .muted{color:#666;font-size:12px;line-height:1.55}
    label{display:block;font-weight:700;margin-bottom:6px}
    select,button{min-height:44px;border:1px solid #888;border-radius:9px;background:#fff;padding:7px 10px;font-size:16px}
    select{width:100%}
    button{font-weight:700}
    textarea{width:100%;min-height:180px;max-height:42dvh;font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #bbb;border-radius:8px;padding:10px;resize:vertical;-webkit-text-size-adjust:100%}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.buttons button:first-child{grid-column:1/-1;background:#222;color:#fff;border-color:#222}
    .english{font-size:18px;line-height:1.55;font-weight:700;white-space:pre-wrap}
    pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
    .error{color:#a40000}
    details summary{cursor:pointer;font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>HMW 会話JS確認</h1>

  <div class="card muted">
    ChatGPTは主人公の発言を分析してJSONを渡すだけです。ここへ貼った後の「返す意味の決定」と「英文生成」はHMWのJSだけで実行します。
  </div>

  <div class="card">
    <label for="character-select">相手</label>
    <select id="character-select">
      <option value="support_named">アーロン</option>
      <option value="homeless_named">サム</option>
      <option value="police_named">マーク</option>
      <option value="thug_named">レオン</option>
    </select>
  </div>

  <div class="card">
    <label for="analysis-input">AIから受け取った分析JSONを貼る</label>
    <textarea id="analysis-input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="ここにChatGPTから受け取った分析JSONを貼る"></textarea>
    <div class="buttons">
      <button id="run-test" type="button">JSで英文生成</button>
      <button id="clear-input" type="button">全消去</button>
    </div>
  </div>

  <div class="card">
    <b>⑥ JSが生成した英文</b>
    <div id="english" class="english">読み込み中…</div>
  </div>

  <div class="card">
    <b>⑤ JSが選んだ意味ID</b>
    <pre id="meaning-ids"></pre>
  </div>

  <div class="card">
    <b>文ごとの証拠</b>
    <pre id="proof"></pre>
  </div>

  <details class="card">
    <summary>JS側で使った相手設定を見る</summary>
    <pre id="character-context"></pre>
  </details>

  <details class="card">
    <summary>詳細ログ</summary>
    <pre id="details"></pre>
  </details>
</main>

<script src="js/dialogue-loader.js?v=20260924-router-constraints"></script>
<script src="js/characters/hmw_character_sam.js?v=20260923-1944"></script>
<script src="js/characters/hmw_character_aaron.js?v=20260923-1944"></script>
<script src="js/characters/hmw_character_mark.js?v=20260923-1944"></script>
<script src="js/characters/hmw_character_leon.js?v=20260923-1944"></script>
<script src="js/dialogue/dialogue-analysis-paste-runner.js?v=20260925-mobile-2"></script>
</body>
</html>
