<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>HMW</title>
  <link rel="stylesheet" href="css/style.css?v=20260924-start-menu" />
</head>
<body>
  <section class="start-screen" id="start-screen" aria-label="開始メニュー">
    <div class="start-card">
      <h1>HMW</h1>
      <div class="start-actions">
        <button class="start-btn" id="start-new">初めから</button>
        <button class="start-btn" id="start-continue">続きから</button>
      </div>
    </div>
  </section>

  <div class="app game-not-started" id="game-app">
    <div class="topbar">
      <div class="status-box" id="day">DAY<b>1</b></div>
      <div class="status-box" id="time">TIME<b>朝</b></div>
      <div class="status-box" id="money">MONEY<b>0</b></div>
      <div class="weather-box" id="weather">☀️</div>
      <button class="menu-top-btn" id="nav-menu" aria-label="メニュー">…</button>
    </div>

    <div class="stats">
      <div class="stat" id="health">体力<b>80</b></div>
      <div class="stat" id="hunger">空腹<b>35</b></div>
      <div class="stat" id="hygiene">衛生<b>45</b></div>
      <div class="stat" id="warmth">体温<b>55</b></div>
      <div class="stat" id="wetness">濡れ<b>0</b></div>
      <div class="stat" id="fatigue">疲労<b>25</b></div>
    </div>

    <div class="cycle-row">
      <div class="cycle-head">
        <span>月周期</span>
        <b id="cycle-label">24/28</b>
      </div>
      <div class="cycle-track" id="cycle-track" aria-label="月周期"></div>
    </div>

    <main class="main">
      <section class="scene">
        <h1 id="location-name">駅前</h1>
        <p id="location-desc"></p>
        <div class="message" id="last-message"></div>\n        <div class="housing-goal" id="housing-goal"></div>
        <section class="city-scene hidden" id="city-scene"></section>
      </section>
    </main>

    <section class="main-actions" id="action-list"></section>

    <nav class="bottom-nav" aria-label="ゲームメニュー">
      <button class="nav-btn" id="nav-map">マップ</button>
      <button class="nav-btn" id="nav-inventory">持ち物</button>
      <button class="nav-btn" id="nav-log">記録</button>
      <button class="nav-btn" id="nav-save">セーブ</button>
      <button class="nav-btn" id="nav-load">ロード</button>
    </nav>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
      <div class="close-row">
        <button class="modal-btn" id="modal-close">閉じる</button>
      </div>
    </section>
  </div>

  <script src="js/data.js?v=20260909-2245"></script>
  <script src="js/items.js?v=20260922-2115"></script>
  <script src="js/hmw_psychology_parameters.js?v=20260923-2010"></script>
  <script src="js/hmw_ai_generation_guard.js?v=20260924-0225"></script>\n  <script src="js/hmw_romance_rules.js?v=20260923-2010"></script>
  <script src="js/dialogue-loader.js?v=20260924-router-constraints"></script>
  <script src="js/characters/hmw_character_sam.js?v=20260923-1944"></script>
  <script src="js/characters/hmw_character_sam_behavior.js?v=20260923-1944"></script>
  <script src="js/characters/hmw_character_aaron.js?v=20260923-1944"></script>
  <script src="js/characters/hmw_character_aaron_behavior.js?v=20260923-1944"></script>
  <script src="js/characters/hmw_character_mark.js?v=20260923-1944"></script>
  <script src="js/characters/hmw_character_mark_behavior.js?v=20260923-1944"></script>
  <script src="js/characters/hmw_character_leon.js?v=20260923-1944"></script>
  <script src="js/characters/hmw_character_leon_behavior.js?v=20260923-1944"></script>
  <script src="js/hmw_psychology_events.js?v=20260923-2010"></script>
  <script src="js/state.js?v=20260923-1944"></script>\n  <script src="js/housing.js?v=20260923-2230"></script>
  <script src="js/jobs.js?v=20260923-2315"></script>
  <script src="js/save.js?v=20260922-1115"></script>
  <script src="js/core.js?v=20260923-1944"></script>
  <script src="js/activities.js?v=20260909-2118"></script>
  <script src="js/actions-life.js?v=20260922-2205"></script>
  <script src="js/actions-people.js?v=20260923-1944"></script>
  <script src="js/scenes.js?v=20260922-1148"></script>
  <script src="js/ui.js?v=20260924-start-menu"></script>
  <script src="js/display-names.js?v=20260909-2130"></script>
</body>
</html>
