<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AD - 山札</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    :root{--ink:#282722;--paper:#f7f3eb;--purple:#62509d;--danger:#b94c3e;--card:#e4c74c;--muted:#716d65}
    html,body{margin:0;width:100%;min-height:100%;background:#efebe3;color:#1c1b18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;overflow-x:hidden}
    button,a{font:inherit}
    button{touch-action:manipulation}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}

    #topPanel{min-height:86px;border:2px solid var(--purple);border-radius:13px;background:#faf8f3;padding:6px 8px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    #placeBlock{min-width:0}
    #placeName{font-size:20px;font-weight:1000;line-height:1.1}
    #placeType{margin-top:4px;font-size:10px;font-weight:900;opacity:.58}
    #topRight{display:grid;gap:6px;justify-items:end}
    #topLinks{display:flex;gap:8px}.headLink{color:#292725;text-decoration:none;font-size:10px;font-weight:1000;white-space:nowrap}
    #autoControls{display:flex;gap:5px}
    #autoButton,#autoSpeedButton{height:30px;border:1.5px solid var(--ink);border-radius:7px;background:#fff;color:#1d1d1b;font-size:10px;font-weight:1000;padding:0 7px;box-shadow:0 1px 0 rgba(0,0,0,.13);white-space:nowrap}
    #autoSpeedButton{background:#e9e4da}#autoButton.on{background:var(--ink);color:#fff}

    #encounterArea{position:relative;border:1.5px solid #aaa397;border-radius:12px;background:rgba(255,255,255,.25);padding:6px 7px 6px}
    #encounterStage{position:relative;height:210px;display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:6px;align-items:center}
    #cardColumn{position:relative;height:100%;display:grid;place-items:center}
    #cardSlot{position:relative;width:140px;height:190px;border:2px dashed #8b867c;border-radius:11px;background:rgba(255,255,255,.48);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease,background .15s ease,border-color .15s ease}
    #cardSlot.empty:active{transform:scale(.97);background:#fff}#cardSlot.busy{cursor:default;border-style:solid;border-color:#b8b1a6}
    #slotPrompt{padding:11px;text-align:center;font-size:12px;font-weight:1000;line-height:1.35;color:#625f58}
    #drawn{position:absolute;inset:7px;width:auto;height:auto;border:3px solid var(--card);border-radius:9px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.13);display:none;flex-direction:column;align-items:center;justify-content:center;padding:7px;text-align:center;transform-origin:center;z-index:2}
    #drawn.dealIn{animation:dealIn .18s ease-out}@keyframes dealIn{from{opacity:.2;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:none}}
    #cardIcon{font-size:45px;line-height:1;margin-bottom:7px}#cardTitle{font-size:16px;font-weight:1000;line-height:1.15}#cardSub{margin-top:5px;font-size:10px;font-weight:900;color:#666}
    #encounterStatus{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
    #statusName{font-size:13px;font-weight:1000;line-height:1.2;min-height:15px}#statusValue{font-size:10px;font-weight:1000;text-align:right}#enemyIntent{font-size:10px;font-weight:800;line-height:1.25;color:#5d5952;min-height:30px}
    #cardActions{display:none;gap:6px;margin-top:3px}#cardActions.show{display:flex}#cardActions button{flex:1;height:35px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;font-size:11px;font-weight:1000;box-shadow:0 2px 0 rgba(0,0,0,.11)}#discardAction{background:#e7e2d8!important}
    #cardHint{text-align:center;min-height:15px;margin-top:4px;font-size:10px;font-weight:900;color:#5d5952;line-height:1.25}
    #eventStrip{border:1.5px solid #3a3833;border-radius:8px;background:#faf8f2;padding:8px;min-height:70px}
    #eventText{font-size:12px;font-weight:1000;line-height:1.25;min-height:15px}#eventDetail{margin-top:4px;font-size:10px;font-weight:800;color:#5d5952;line-height:1.3}#result{margin-top:4px;font-size:10px;font-weight:1000;color:#514e47;line-height:1.2}

    @media(max-width:370px){#game{padding-left:6px;padding-right:6px;gap:5px}#encounterStage{grid-template-columns:minmax(0,1fr) 88px;height:198px}#cardSlot{width:132px;height:180px}}
  </style>
</head>
<body>
<div id="game">
  <section id="topPanel">
    <div id="placeBlock">
      <div id="placeName">森</div>
      <div id="placeType">DDの地点探索の札システム</div>
    </div>
    <div id="topRight">
      <div id="topLinks"><a class="headLink" href="AD_top.html">トップへ</a></div>
      <div id="autoControls"><button id="autoButton" type="button">オート：OFF</button><button id="autoSpeedButton" type="button">速度：ゆっくり</button></div>
    </div>
  </section>

  <section id="encounterArea">
    <div id="encounterStage">
      <div id="cardColumn">
        <div id="cardSlot" class="empty" tabindex="0">
          <div id="slotPrompt">ここをタップして札を出す</div>
          <div id="drawn" tabindex="-1">
            <div id="cardIcon"></div>
            <div id="cardTitle"></div>
            <div id="cardSub"></div>
          </div>
        </div>
      </div>
      <div id="encounterStatus">
        <div id="statusName">出る札</div>
        <div id="statusValue">—</div>
        <div id="enemyIntent"></div>
        <div id="cardActions"><button id="primaryAction" type="button">入手する</button><button id="discardAction" type="button">見送る</button></div>
      </div>
    </div>
    <div id="cardHint">空白をタップして次の札へ</div>
  </section>

  <section id="eventStrip">
    <div id="eventText">札を出す。</div>
    <div id="eventDetail"></div>
    <div id="result"></div>
  </section>
</div>
<script src="AD_deck_config.js"></script>
<script src="AD_deck.js"></script>
</body>
</html>
