<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AD - 家で補修</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--ink:#292620;--paper:#f4eddf;--line:#766d61;--muted:#6d655a;--dark:#443d35;--done:#6f8762}
    html,body{margin:0;width:100%;min-height:100%;background:#d8d0c2;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}
    button,a{font:inherit;color:inherit}
    a{text-decoration:none}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px}
    h1{margin:0;font-size:24px}
    .back{font-size:12px;font-weight:900}
    #room{height:120px;border:2px solid var(--ink);border-radius:14px;background:linear-gradient(#e7dfd0 0 68%,#a99073 68%);display:grid;place-items:center;font-size:52px}
    #bookCard{border:2px solid var(--ink);border-radius:13px;background:var(--paper);padding:12px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
    #bookName{font-size:19px;font-weight:1000}
    #bookState{margin-top:4px;font-size:11px;font-weight:850;color:var(--muted)}
    #steps{display:grid;gap:8px}
    .step{border:1.5px solid var(--line);border-radius:11px;background:rgba(255,255,255,.45);padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .stepTitle{font-size:14px;font-weight:1000}
    .stepSub{margin-top:2px;font-size:10px;font-weight:800;color:var(--muted)}
    .stepButton{min-width:98px;min-height:40px;border:2px solid var(--ink);border-radius:9px;background:#fff;font-weight:1000}
    .stepButton.done{background:var(--done);color:#fff}
    #result{display:none;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:13px;text-align:center}
    #result.show{display:block}
    #result strong{display:block;font-size:20px}
    #result span{display:block;margin-top:5px;font-size:11px;font-weight:850;line-height:1.5}
    #finishDay{display:none;min-height:50px;border:2px solid var(--ink);border-radius:10px;background:var(--dark);color:#fff;font-weight:1000;place-items:center}
    #finishDay.show{display:grid}
  </style>
</head>
<body>
  <main id="game">
    <header>
      <h1>家で本を仕上げる</h1>
      <a class="back" href="AD_dump.html">戻る</a>
    </header>

    <div id="room" aria-hidden="true">🪑 📚</div>

    <section id="bookCard">
      <div id="bookName">回収した本</div>
      <div id="bookState">文字の補修は終わっている。貸せる状態に仕上げる。</div>
    </section>

    <section id="steps">
      <div class="step">
        <div>
          <div class="stepTitle">外装を補修する</div>
          <div class="stepSub">表紙・背表紙・破れを整える。</div>
        </div>
        <button class="stepButton" id="coverButton" type="button">補修する</button>
      </div>

      <div class="step">
        <div>
          <div class="stepTitle">ラミネート加工</div>
          <div class="stepSub">文字を食べる虫が寄りつかないようにする。</div>
        </div>
        <button class="stepButton" id="laminateButton" type="button" disabled>加工する</button>
      </div>
    </section>

    <section id="result">
      <strong>貸出できる本になった</strong>
      <span>この本は貸本屋の本として使える。</span>
    </section>

    <a id="finishDay" href="AD_morning.html">一日を終える</a>
  </main>

  <script>
    const pending = JSON.parse(localStorage.getItem('adPendingRepairBook') || 'null');
    const bookName = document.getElementById('bookName');
    const coverButton = document.getElementById('coverButton');
    const laminateButton = document.getElementById('laminateButton');
    const result = document.getElementById('result');
    const finishDay = document.getElementById('finishDay');

    if(pending?.name) bookName.textContent = pending.name;

    coverButton.addEventListener('click', () => {
      coverButton.textContent = '補修済み';
      coverButton.classList.add('done');
      coverButton.disabled = true;
      laminateButton.disabled = false;
    });

    laminateButton.addEventListener('click', () => {
      laminateButton.textContent = '加工済み';
      laminateButton.classList.add('done');
      laminateButton.disabled = true;

      const book = pending || {id:'book_unknown',name:'回収した本'};
      book.coverRepairComplete = true;
      book.laminated = true;
      book.rentable = true;

      const rentalBooks = JSON.parse(localStorage.getItem('adRentalBooks') || '[]');
      if(!rentalBooks.some(item => item.id === book.id)) rentalBooks.push(book);
      localStorage.setItem('adRentalBooks', JSON.stringify(rentalBooks));
      localStorage.removeItem('adPendingRepairBook');

      result.classList.add('show');
      finishDay.classList.add('show');
    });
  </script>
</body>
</html>
