<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ホットケーキキャッチ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff8ea;color:#3b2a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{display:flex;justify-content:center;padding:12px}
.wrap{width:min(100%,430px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.score{font-weight:800;font-size:17px;line-height:1.45}
.sub{font-size:13px;color:#765f50}
.orderline{font-size:14px;font-weight:800;color:#70401f;margin-top:2px}
button{font:inherit}
#reset{border:1px solid #cbb8a4;background:#fff;border-radius:10px;padding:9px 13px;min-height:44px;color:#3b2a20}
.gamebox{position:relative;width:100%;aspect-ratio:3/5;max-height:72vh;border:2px solid #d8c4ad;border-radius:18px;overflow:hidden;background:#fffdf8;touch-action:none}
canvas{display:block;width:100%;height:100%}
.msg{min-height:27px;text-align:center;font-weight:800;margin:8px 0 2px}
.quality{min-height:22px;text-align:center;font-size:14px;color:#765f50;margin-bottom:5px}
.help{text-align:center;font-size:12px;color:#765f50;margin-bottom:8px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.move{min-height:54px;border:1px solid #cbb8a4;background:#fff;border-radius:14px;font-size:24px;font-weight:800;color:#3b2a20}
.move:active,#reset:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="score">所持金 ¥<span id="money">0</span>　完成 <span id="finished">0</span>皿</div>
      <div id="orderLine" class="orderline">注文 #1　現在 ¥500</div>
      <div class="sub">注文ごとにトッピングが変わります</div>
    </div>
    <button id="reset" type="button">やり直す</button>
  </div>

  <div id="gamebox" class="gamebox" aria-label="注文されたホットケーキを作るゲーム">
    <canvas id="game" width="360" height="600"></canvas>
  </div>

  <div id="msg" class="msg" aria-live="polite">注文が入りました</div>
  <div id="quality" class="quality">早く、きれいに作る</div>
  <div class="help">画面を左右になぞる / ← → 長押しでも皿を移動</div>

  <div class="controls">
    <button id="left" class="move" type="button" aria-label="皿を左へ">←</button>
    <button id="right" class="move" type="button" aria-label="皿を右へ">→</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const box = document.getElementById('gamebox');
  const moneyEl = document.getElementById('money');
  const finishedEl = document.getElementById('finished');
  const orderLineEl = document.getElementById('orderLine');
  const msg = document.getElementById('msg');
  const qualityEl = document.getElementById('quality');
  const resetBtn = document.getElementById('reset');
  const leftBtn = document.getElementById('left');
  const rightBtn = document.getElementById('right');

  const W = canvas.width;
  const H = canvas.height;
  const plateY = 480;
  const plateW = 126;
  const cakeW = 82;
  const cakeH = 24;

  const BASE_PAY = 500;
  const MIN_PAY = 100;
  const PAY_LOSS_PER_SECOND = 10;
  const ORDER_NOTICE_MS = 900;

  const ORDER_RECIPES = [
    {name:'バター＆蜂蜜', toppings:['butter','honey'], text:'バターと蜂蜜でお願いします'},
    {name:'アイス＆チョコ', toppings:['icecream','chocolate'], text:'アイスとチョコをのせてください'},
    {name:'アイス＆さくらんぼ', toppings:['icecream','cherry'], text:'アイスとさくらんぼでお願いします'},
    {name:'チョコ＆さくらんぼ', toppings:['chocolate','cherry'], text:'チョコとさくらんぼをのせてください'},
    {name:'蜂蜜アイス', toppings:['honey','icecream','cherry'], text:'蜂蜜とアイス、さくらんぼもお願いします'},
    {name:'全部のせ', toppings:['butter','honey','icecream','chocolate','cherry'], text:'今日は全部のせでお願いします'}
  ];

  const STEP_LABELS = {
    cake:'ホットケーキ',
    butter:'バター',
    honey:'蜂蜜',
    icecream:'アイス',
    chocolate:'チョコ',
    cherry:'さくらんぼ'
  };

  const CUSTOMERS = [
    {name:'葵', line:'「ひとつお願いします」', skin:'#f2c9a5', hair:'#3a2a23', shirt:'#b45f5f'},
    {name:'蓮', line:'「これをお願いします」', skin:'#e6b98e', hair:'#2b2522', shirt:'#4f6f8f'},
    {name:'美咲', line:'「甘いのが食べたいです」', skin:'#f0c6a2', hair:'#5a3826', shirt:'#8a668f'},
    {name:'悠斗', line:'「焼きたてでお願いします」', skin:'#dcae85', hair:'#241f1c', shirt:'#627c55'},
    {name:'真琴', line:'「今日はこれにします」', skin:'#efc29c', hair:'#40312b', shirt:'#b17b45'},
    {name:'直樹', line:'「ひと皿お願いします」', skin:'#d9a87f', hair:'#312821', shirt:'#5f6978'},
    {name:'結衣', line:'「きれいにお願いしますね」', skin:'#f3c9a8', hair:'#6a4938', shirt:'#b85f78'},
    {name:'航', line:'「急ぎじゃないので丁寧に」', skin:'#e1b48d', hair:'#1f1d1c', shirt:'#4f7f78'},
    {name:'沙耶', line:'「今日は甘いものにします」', skin:'#edbf98', hair:'#4a3027', shirt:'#9070ad'},
    {name:'健太', line:'「お腹ぺこぺこです」', skin:'#ddb087', hair:'#30271f', shirt:'#687b98'},
    {name:'千尋', line:'「いい匂い。ひとつください」', skin:'#f1c7a3', hair:'#57382d', shirt:'#9b7753'},
    {name:'亮', line:'「これを1皿お願いします」', skin:'#dba77d', hair:'#29231f', shirt:'#6d8660'}
  ];

  let plateX = W / 2;
  let prevPlateX = plateX;
  let plateDelta = 0;
  let stack = [];
  let butter = null;
  let honey = null;
  let icecream = null;
  let chocolate = null;
  let cherry = null;
  let falling = null;

  let phase = 0;
  let state = 'order';
  let nextAt = 0;
  let completeAt = 0;
  let last = performance.now();

  let money = 0;
  let finished = 0;
  let orderNo = 0;
  let orderStartAt = 0;
  let orderPlayAt = 0;
  let currentPay = BASE_PAY;
  let dishScores = [];
  let resultInfo = null;
  let currentCustomer = null;
  let currentOrder = null;
  let currentSteps = ['cake','cake','cake','butter','honey'];

  let pointerDown = false;
  let leftHeld = false;
  let rightHeld = false;

  function phaseName() {
    const step = currentSteps[phase] || 'cake';
    if (step === 'cake') return (phase + 1) + '枚目';
    return STEP_LABELS[step] || step;
  }

  function phaseLabel() {
    if (phase >= currentSteps.length) return 'COMPLETE';
    const step = currentSteps[phase] || 'cake';
    if (step === 'cake') return 'HOTCAKE ' + (phase + 1) + ' / 3';
    return (STEP_LABELS[step] || step).toUpperCase();
  }

  function pickOrder() {
    let next = currentOrder;
    while (ORDER_RECIPES.length > 1 && next === currentOrder) {
      next = ORDER_RECIPES[Math.floor(Math.random() * ORDER_RECIPES.length)];
    }
    currentOrder = next || ORDER_RECIPES[0];
    currentSteps = ['cake','cake','cake', ...currentOrder.toppings];
  }

  function pickCustomer() {
    let next = currentCustomer;
    while (CUSTOMERS.length > 1 && next === currentCustomer) {
      next = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
    }
    currentCustomer = next || CUSTOMERS[0];
  }

  function drawCustomerPortrait(customer, x, y) {
    if (!customer) return;
    ctx.save();
    ctx.translate(x,y);

    ctx.fillStyle=customer.shirt;
    ctx.beginPath();
    ctx.roundRect(-27,22,54,42,15);
    ctx.fill();

    ctx.fillStyle=customer.skin;
    ctx.beginPath();
    ctx.arc(0,0,24,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=customer.hair;
    ctx.beginPath();
    ctx.arc(0,-5,25,Math.PI,Math.PI*2);
    ctx.lineTo(24,2);
    ctx.quadraticCurveTo(18,-17,0,-22);
    ctx.quadraticCurveTo(-18,-17,-24,2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle='#3b2a20';
    ctx.beginPath();
    ctx.arc(-8,3,2,0,Math.PI*2);
    ctx.arc(8,3,2,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle='#7a4e3b';
    ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.arc(0,8,7,0.15*Math.PI,0.85*Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  function topCenter() {
    if (phase === 0 || !stack.length) return plateX;
    const top = stack[stack.length - 1];
    return plateX + top.offsetX + (top.lagX || 0);
  }

  function topY() {
    return plateY - 10 - stack.length * 14;
  }

  function calcPay(now) {
    if (!orderStartAt) return BASE_PAY;
    const sec = Math.max(0, (now - orderStartAt) / 1000);
    return Math.max(MIN_PAY, BASE_PAY - Math.floor(sec) * PAY_LOSS_PER_SECOND);
  }

  function updateOrderLine(now) {
    if (!orderNo) return;
    currentPay = calcPay(now);
    orderLineEl.textContent = (currentCustomer ? currentCustomer.name + '　' : '') + '注文 #' + orderNo + '　現在 ¥' + currentPay;
  }

  function spawn() {
    const margin = 50;
    const x = margin + Math.random() * (W - margin * 2);
    const step = currentSteps[phase] || 'cake';

    if (step === 'cake') {
      const softness = 0.58 + Math.random() * 0.42;
      const elasticity = 0.08 + (1 - softness) * 0.34 + Math.random() * 0.05;
      falling = {
        type:'cake', x, y:-30,
        vx:(Math.random()*2-1)*0.24,
        vy:1.0, tilt:(Math.random()*2-1)*0.035,
        bounced:false, softness, elasticity,
        squash:0, squashUntil:0, impactRelative:0
      };
    } else if (step === 'butter') {
      falling = {
        type:'butter', x, y:-24,
        vx:(Math.random()*2-1)*0.18,
        vy:1.0, tilt:(Math.random()*2-1)*0.04,
        bounced:false, contactUntil:0,
        softness:0.62+Math.random()*0.30,
        squash:0
      };
    } else if (step === 'honey') {
      falling = {
        type:'honey', x, y:-34,
        vx:(Math.random()*2-1)*0.10,
        vy:1.2,
        stretch:0,
        trail:0
      };
    } else {
      falling = {
        type:step, x, y:-28,
        vx:(Math.random()*2-1)*0.18,
        vy:1.0, tilt:(Math.random()*2-1)*0.05
      };
    }
  }

  function startOrder(now) {
    stack = [];
    butter = null;
    honey = null;
    icecream = null;
    chocolate = null;
    cherry = null;
    falling = null;
    phase = 0;
    resultInfo = null;

    orderNo++;
    pickCustomer();
    pickOrder();
    dishScores = new Array(currentSteps.length).fill(0);
    orderStartAt = now;
    orderPlayAt = now + ORDER_NOTICE_MS;
    currentPay = BASE_PAY;
    state = 'order';

    msg.textContent = '注文が入りました';
    qualityEl.textContent = 'ホットケーキ3段・' + currentOrder.name;
    updateOrderLine(now);
  }

  function restart() {
    plateX = W/2;
    money = 0;
    finished = 0;
    orderNo = 0;
    orderStartAt = 0;
    currentPay = BASE_PAY;
    moneyEl.textContent = '0';
    finishedEl.textContent = '0';
    startOrder(performance.now());
  }

  function drawPancake(x,y,tilt=0,softness=0.5,squash=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt);

    const widthScale = 1 + squash * (0.38 + softness * 0.30);
    const heightScale = Math.max(0.24, 1 - squash * (0.56 + softness * 0.36));
    const w = cakeW * widthScale;
    const h = cakeH * heightScale;

    ctx.fillStyle = '#9f5e2c';
    ctx.strokeStyle = '#69401f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0,3,w/2,h/2,0,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#e7ae55';
    ctx.beginPath();
    ctx.ellipse(0,-2,w/2-4,Math.max(3,h/2-4),0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,235,183,.72)';
    ctx.beginPath();
    ctx.ellipse(-13,-5,14,3.5,-.12,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle='rgba(255,244,207,.58)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.ellipse(-3,-4,w*.27,Math.max(2,h*.12),-.08,Math.PI*.12,Math.PI*.82);
    ctx.stroke();
    ctx.restore();
  }

  function drawButter(x,y,tilt=0,squash=0,smear=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt);

    const w=26*(1+squash*0.45+smear*0.16);
    const h=Math.max(7,16*(1-squash*0.48));
    const r=Math.min(5,2+squash*3);

    ctx.fillStyle='#f2d357';
    ctx.strokeStyle='#b99828';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.roundRect(-w/2,-h/2,w,h,r);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle='rgba(255,248,184,.78)';
    ctx.beginPath();
    ctx.roundRect(-w*.36,-h*.34,w*.60,Math.max(2,h*.24),2);
    ctx.fill();

    if(smear>0.04){
      ctx.fillStyle='rgba(232,190,54,.55)';
      ctx.beginPath();
      ctx.ellipse(smear>0 ? w*.36 : -w*.36,h*.20,5+Math.abs(smear)*8,2.5,0,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawIcecream(x,y,tilt=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt);
    ctx.fillStyle='#fff4d8';
    ctx.strokeStyle='#c9a879';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,0,15,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath();
    ctx.arc(-5,-5,5,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawChocolate(x,y,tilt=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt);
    ctx.fillStyle='#5f321f';
    ctx.strokeStyle='#3d2116';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.roundRect(-15,-9,30,18,3);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle='#8a5133';
    ctx.beginPath();
    ctx.moveTo(-5,-8); ctx.lineTo(-5,8);
    ctx.moveTo(5,-8); ctx.lineTo(5,8);
    ctx.stroke();
    ctx.restore();
  }

  function drawCherry(x,y,tilt=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt);
    ctx.strokeStyle='#5f7f3d';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,-3);
    ctx.quadraticCurveTo(2,-14,9,-17);
    ctx.stroke();
    ctx.fillStyle='#c9343a';
    ctx.strokeStyle='#8c2026';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(0,3,8,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawHoneyBlob(x,y,stretch=0,trail=0) {
    ctx.save();
    ctx.translate(x,y);

    const long=17+stretch*30;
    const narrow=Math.max(4.2,9-stretch*3.8);

    if(trail>0.02){
      ctx.strokeStyle='rgba(215,151,24,.72)';
      ctx.lineWidth=Math.max(1.6,4.5-stretch*1.8);
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(0,-long*.65);
      ctx.quadraticCurveTo(-1,-long-trail*26,1,-long-trail*48);
      ctx.stroke();
    }

    ctx.fillStyle='#d79718';
    ctx.beginPath();
    ctx.ellipse(0,0,narrow,long,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#efbd45';
    ctx.beginPath();
    ctx.ellipse(-2,-long*.18,Math.max(2,narrow*.32),Math.max(4,long*.28),0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawHoneyOnStack() {
    if (!honey || !stack.length) return;
    const top = stack[stack.length-1];
    const x = plateX + top.offsetX + (top.lagX||0) + honey.offsetX;
    const y = plateY - 11 - (stack.length-1)*14 - 4;

    ctx.save();
    ctx.strokeStyle='#d79718';
    ctx.lineWidth=6+honey.splat*5;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x-honey.spread/2,y);
    ctx.quadraticCurveTo(x,y+4+honey.splat*6,x+honey.spread/2,y);
    ctx.stroke();

    ctx.fillStyle='rgba(239,189,69,.62)';
    ctx.beginPath();
    ctx.ellipse(x,y+2,honey.spread*.22,3+honey.splat*4,0,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle='#e1a221';
    ctx.lineWidth=3+honey.drip*1.5;
    const leftDrip = Math.max(-30, honey.offsetX - honey.spread*.24);
    const rightDrip = Math.min(30, honey.offsetX + honey.spread*.25);
    ctx.beginPath();
    ctx.moveTo(plateX+top.offsetX+(top.lagX||0)+leftDrip,y+2);
    ctx.quadraticCurveTo(plateX+top.offsetX+(top.lagX||0)+leftDrip-2,y+12,plateX+top.offsetX+(top.lagX||0)+leftDrip,y+22);
    ctx.moveTo(plateX+top.offsetX+(top.lagX||0)+rightDrip,y+2);
    ctx.quadraticCurveTo(plateX+top.offsetX+(top.lagX||0)+rightDrip+2,y+10,plateX+top.offsetX+(top.lagX||0)+rightDrip,y+18);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlateAndFood() {
    ctx.fillStyle='#d8e8ef';
    ctx.strokeStyle='#657d8a';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.ellipse(plateX,plateY+5,plateW/2,13,0,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle='#f8fcff';
    ctx.beginPath();
    ctx.ellipse(plateX,plateY+1,plateW/2-10,8,0,0,Math.PI*2);
    ctx.fill();

    for (let i=0;i<stack.length;i++) {
      const s=stack[i];
      const load = stack.length - 1 - i;
      const compression = Math.min(
        0.54,
        load * (0.070 + s.softness * 0.070) + (s.settleSquash || 0)
      );
      const softTilt = s.tilt + (s.lagX || 0) * 0.0035;
      drawPancake(
        plateX + s.offsetX + (s.lagX || 0),
        plateY - 11 - i*14 + compression * 4,
        softTilt,
        s.softness,
        compression
      );
    }

    if (butter && stack.length) {
      const top=stack[stack.length-1];
      drawButter(
        plateX+top.offsetX+(top.lagX||0)+butter.offsetX+(butter.lagX||0),
        plateY-11-(stack.length-1)*14-15+butter.sink,
        butter.tilt+(butter.lagX||0)*0.006,
        butter.squash||0,
        butter.smear||0
      );
    }

    drawHoneyOnStack();

    if (stack.length) {
      const top=stack[stack.length-1];
      const baseX=plateX+top.offsetX+(top.lagX||0);
      const baseY=plateY-11-(stack.length-1)*14;

      if (icecream) drawIcecream(baseX+icecream.offsetX,baseY-24,icecream.tilt||0);
      if (chocolate) drawChocolate(baseX+chocolate.offsetX,baseY-(icecream?34:18),chocolate.tilt||0);
      if (cherry) drawCherry(baseX+cherry.offsetX,baseY-(icecream?46:24),cherry.tilt||0);
    }
  }

  function drawBackground() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fffdf8';
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#fff5df';
    ctx.fillRect(0,0,W,92);

    ctx.fillStyle='#9f7d61';
    ctx.textAlign='center';
    ctx.font='700 17px sans-serif';
    ctx.fillText(phaseLabel(),W/2,38);

    ctx.fillStyle='#eadcc7';
    ctx.fillRect(0,455,W,145);
    ctx.strokeStyle='#d4c0a8';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,455);
    ctx.lineTo(W,455);
    ctx.stroke();
  }

  function drawOrderCard() {
    if (state !== 'order') return;
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.strokeStyle='#70401f';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(30,105,300,210,16);
    ctx.fill();
    ctx.stroke();

    drawCustomerPortrait(currentCustomer,82,168);

    ctx.fillStyle='#3b2a20';
    ctx.textAlign='left';
    ctx.font='800 24px sans-serif';
    ctx.fillText(currentCustomer ? currentCustomer.name : 'お客さん',126,145);
    ctx.font='700 14px sans-serif';
    ctx.fillText('注文 #' + orderNo,126,169);

    ctx.textAlign='center';
    ctx.font='700 15px sans-serif';
    ctx.fillText(currentCustomer ? currentCustomer.line : '「お願いします」',W/2,215);
    ctx.font='700 15px sans-serif';
    ctx.fillText('「' + currentOrder.text + '」',W/2,241);
    ctx.font='800 17px sans-serif';
    ctx.fillText('3段 ＋ ' + currentOrder.name,W/2,267);
    ctx.font='800 20px sans-serif';
    ctx.fillText('¥' + BASE_PAY + ' から開始', W/2,295);
    ctx.restore();
  }

  function advance(now) {
    phase++;
    if (phase >= currentSteps.length) {
      finishDish(now);
      return;
    }
    falling=null;
    state='play';
    msg.textContent=phaseName()+'を受け止める';
    spawn();
  }

  function scoreFromDiff(diff, maxDiff) {
    return Math.max(0, Math.round(100*(1-Math.min(diff,maxDiff)/maxDiff)));
  }

  function settleCake(now) {
    const center = topCenter();
    const diff = Math.abs(falling.x-center);
    const supportHalf = phase===0 ? 48 : 34;

    if (diff>supportHalf) {
      falling.vy=2.7;
      falling.vx += Math.sign(falling.x-center || 1)*0.9;
      state='fallingOff';
      msg.textContent='跳ねて落ちた！ 時間ロス';
      return;
    }

    const prev = stack.length ? stack[stack.length-1].offsetX : 0;
    const surfaceTilt = stack.length ? stack[stack.length-1].tilt : 0;
    const relative = falling.x-center;
    const slide = relative * (0.34 + falling.softness * 0.22) + surfaceTilt * 16;
    const offset = stack.length ? prev + slide : slide * 0.80;
    const tilt = surfaceTilt * 0.55 + relative * (0.0018 + falling.softness * 0.0018);

    for (const s of stack) {
      s.settleSquash = Math.min(0.46, (s.settleSquash || 0) + 0.14 + falling.softness * 0.11);
    }

    stack.push({
      offsetX:Math.max(-38,Math.min(38,offset)),
      tilt:Math.max(-.13,Math.min(.13,tilt)),
      softness:falling.softness,
      settleSquash:0.28 + falling.softness * 0.22,
      lagX:0,
      lagVX:0
    });

    dishScores[phase]=scoreFromDiff(diff,supportHalf);
    qualityEl.textContent='この1枚 '+dishScores[phase]+'点';
    advance(now);
  }

  function hitCake(now) {
    const center=topCenter();
    const targetY=topY();
    const relative=falling.x-center;
    const hitHalf=phase===0?52:38;

    if (Math.abs(relative)>hitHalf+12) return false;

    falling.y=targetY-cakeH/2;

    if (!falling.bounced) {
      falling.bounced=true;
      falling.impactRelative=relative;
      falling.vy=0;
      falling.squash=0.58 + falling.softness * 0.16;
      falling.squashUntil=now + 150 + falling.softness * 150;
      state='squash';
      msg.textContent=falling.softness>0.68 ? 'むにっ…' : 'ぽふっ';
      return true;
    }

    settleCake(now);
    return true;
  }

  function settleButter(now) {
    const top=stack[stack.length-1];
    const center=plateX+top.offsetX+(top.lagX||0);
    const relative=falling.x-center;
    const diff=Math.abs(relative);

    if (diff>37) {
      falling.vy=2.8;
      falling.vx += Math.sign(relative||1)*.8;
      state='fallingOff';
      msg.textContent='バターが落ちた！ 時間ロス';
      return;
    }

    const surfaceTilt=top.tilt||0;
    const slide=relative*.58 + surfaceTilt*22 + falling.vx*2.0;
    butter={
      offsetX:Math.max(-31,Math.min(31,slide)),
      tilt:Math.max(-.16,Math.min(.16,surfaceTilt*.75+falling.tilt*.35)),
      sink:2 + top.softness*3,
      softness:falling.softness||0.78,
      squash:0.55+(falling.softness||0.78)*0.26,
      smear:0,
      lagX:0,
      lagVX:0
    };
    dishScores[phase]=scoreFromDiff(Math.abs(butter.offsetX),31);
    qualityEl.textContent='バター '+dishScores[phase]+'点';
    advance(now);
  }

  function hitButter(now) {
    const top=stack[stack.length-1];
    const center=plateX+top.offsetX+(top.lagX||0);
    const targetY=plateY-11-(stack.length-1)*14-18;
    if (Math.abs(falling.x-center)>48) return false;

    falling.y=targetY;
    if (!falling.bounced) {
      falling.bounced=true;
      falling.vy=0;
      falling.squash=0.75+(falling.softness||0.75)*0.18;
      falling.contactUntil=now+150+(falling.softness||0.75)*110;
      state='butterContact';
      msg.textContent='バターがむにっ…';
      return true;
    }

    settleButter(now);
    return true;
  }

  function settleHoney(now) {
    const top=stack[stack.length-1];
    const center=plateX+top.offsetX+(top.lagX||0);
    const relative=falling.x-center;
    const diff=Math.abs(relative);

    if (diff>49) {
      state='fallingOff';
      falling.vy=3.4;
      msg.textContent='蜂蜜が外れた！ 時間ロス';
      return;
    }

    const surfaceTilt=top.tilt||0;
    honey={
      offsetX:Math.max(-36,Math.min(36,relative*.66)),
      spread:Math.max(18,48-diff*.38),
      targetSpread:Math.max(36,70-diff*.48),
      flow:surfaceTilt*0.12,
      viscosity:0.92+Math.random()*0.07,
      splat:1,
      drip:0
    };

    dishScores[phase]=scoreFromDiff(diff,49);
    qualityEl.textContent='蜂蜜 '+dishScores[phase]+'点';
    falling=null;
    advance(now);
  }

  function hitHoney(now) {
    const top=stack[stack.length-1];
    const targetY=plateY-11-(stack.length-1)*14-16;
    if (falling.y+14<targetY) return false;
    settleHoney(now);
    return true;
  }

  function simpleToppingTargetY(type) {
    if (!stack.length) return plateY-20;
    const base=plateY-11-(stack.length-1)*14;
    if (type==='cherry') return base-(icecream?46:24);
    if (type==='chocolate') return base-(icecream?34:18);
    return base-24;
  }

  function settleSimpleTopping(now) {
    const top=stack[stack.length-1];
    const center=plateX+top.offsetX+(top.lagX||0);
    const relative=falling.x-center;
    const diff=Math.abs(relative);
    const maxDiff=44;

    if (diff>maxDiff) {
      falling.vy=3.0;
      falling.vx += Math.sign(relative||1)*0.7;
      state='fallingOff';
      msg.textContent=STEP_LABELS[falling.type]+'が落ちた！ 時間ロス';
      return;
    }

    const item={
      offsetX:Math.max(-34,Math.min(34,relative*.68)),
      tilt:Math.max(-.18,Math.min(.18,falling.tilt||0))
    };
    if (falling.type==='icecream') icecream=item;
    if (falling.type==='chocolate') chocolate=item;
    if (falling.type==='cherry') cherry=item;

    dishScores[phase]=scoreFromDiff(diff,maxDiff);
    qualityEl.textContent=STEP_LABELS[falling.type]+' '+dishScores[phase]+'点';
    falling=null;
    advance(now);
  }

  function hitSimpleTopping(now) {
    const targetY=simpleToppingTargetY(falling.type);
    if (falling.y+14<targetY) return false;
    settleSimpleTopping(now);
    return true;
  }

  function miss(now) {
    state='wait';
    falling=null;
    nextAt=now+550;
    msg.textContent=phaseName()+'をもう一度　時間ロス';
  }

  function updateStackSoftness(dt) {
    if (!stack.length) return;
    const f = dt / 16.67;

    for (let i=0;i<stack.length;i++) {
      const s = stack[i];
      const layer = i + 1;
      const softness = s.softness || 0.5;

      s.lagVX = (s.lagVX || 0) - plateDelta * (0.055 + softness * 0.065) * layer;
      s.lagVX += -(s.lagX || 0) * (0.022 + (1-softness)*0.012) * f;
      s.lagVX *= Math.pow(0.88 + softness * 0.055, f);
      s.lagX = (s.lagX || 0) + s.lagVX * f;
      s.lagX = Math.max(-14, Math.min(14, s.lagX));

      s.settleSquash = Math.max(0, (s.settleSquash || 0) - (0.0045 + (1-softness)*0.004) * f);
    }
  }

  function updateButterSoftness(dt) {
    if(!butter || !stack.length) return;
    const f=dt/16.67;
    const top=stack[stack.length-1];
    const soft=butter.softness||0.78;

    butter.lagVX=(butter.lagVX||0)-plateDelta*(0.055+soft*0.055);
    butter.lagVX+=-(butter.lagX||0)*(0.028+(1-soft)*0.016)*f;
    butter.lagVX*=Math.pow(0.86+soft*0.06,f);
    butter.lagX=(butter.lagX||0)+butter.lagVX*f;
    butter.lagX=Math.max(-10,Math.min(10,butter.lagX));

    butter.squash=Math.max(0.16,(butter.squash||0)-0.008*f);
    const slope=(top.tilt||0)+(top.lagX||0)*0.002;
    butter.offsetX+=slope*(0.20+soft*0.16)*f;
    butter.smear=Math.max(-1,Math.min(1,(butter.smear||0)+slope*0.08*f+(butter.lagX||0)*0.002));
    butter.offsetX=Math.max(-33,Math.min(33,butter.offsetX));
  }

  function updateHoneyFlow(dt) {
    if (!honey || !stack.length) return;
    const top=stack[stack.length-1];
    const f=dt/16.67;
    const slope=(top.tilt||0)+(top.lagX||0)*0.0025;
    const visc=honey.viscosity||0.8;

    honey.offsetX += (honey.flow + slope*(0.045+0.055*(1-visc))) * f;
    honey.offsetX += -plateDelta * 0.006 * (1-visc) * f;
    honey.offsetX=Math.max(-40,Math.min(40,honey.offsetX));

    honey.spread += (honey.targetSpread-honey.spread)*(0.008+0.010*(1-visc))*f;
    honey.splat=Math.max(0,honey.splat-0.018*f);
    honey.drip=Math.min(1,(honey.drip||0)+0.004*f+Math.abs(slope)*0.010*f);
  }

  function finishDish(now) {
    const points=dishScores.reduce((a,b)=>a+b,0);
    const percent=Math.round(points/Math.max(1,dishScores.length));
    const earned=calcPay(now);

    let rank='くずれ気味';
    if(percent>=95)rank='完璧';
    else if(percent>=85)rank='かなり上手';
    else if(percent>=70)rank='きれい';
    else if(percent>=50)rank='まあまあ';

    money+=earned;
    finished++;
    moneyEl.textContent=String(money);
    finishedEl.textContent=String(finished);

    resultInfo={points,percent,rank,earned};
    state='complete';
    completeAt=now+2200;
    msg.textContent='注文完成！ ¥'+earned;
    qualityEl.textContent='出来度 '+percent+'%　'+rank;
    orderLineEl.textContent=(currentCustomer ? currentCustomer.name+'　' : '')+'注文 #'+orderNo+'　売上 ¥'+earned;
  }

  function update(dt,now) {
    if (state !== 'complete') updateOrderLine(now);

    const moveSpeed=.31*dt;
    prevPlateX = plateX;
    if(leftHeld)plateX-=moveSpeed;
    if(rightHeld)plateX+=moveSpeed;
    plateX=Math.max(plateW/2,Math.min(W-plateW/2,plateX));
    plateDelta = plateX - prevPlateX;
    updateStackSoftness(dt);
    updateButterSoftness(dt);
    updateHoneyFlow(dt);

    if(state==='order'){
      if(now>=orderPlayAt){
        state='play';
        msg.textContent=phaseName()+'を受け止める';
        qualityEl.textContent='中央にきれいに重ねるほど高得点';
        spawn();
      }
      return;
    }

    if(state==='complete'){
      if(now>=completeAt)startOrder(now);
      return;
    }

    if(state==='squash'){
      if(!falling)return;
      falling.squash=Math.min(0.78,Math.max(0.12,(falling.squashUntil-now)/220));
      if(now>=falling.squashUntil){
        const surfaceTilt=stack.length ? stack[stack.length-1].tilt : 0;
        const edge=falling.impactRelative;
        const bouncePower=0.24 + falling.elasticity*1.28;
        falling.squash=0;
        falling.vy=-bouncePower;
        falling.vx += edge*(0.016+falling.elasticity*0.012) + surfaceTilt*2.2;
        falling.tilt += edge*0.0018 + surfaceTilt*0.65;
        state='play';
        msg.textContent=falling.softness>0.78 ? 'しっとり、むにゅ…' : (bouncePower<0.9 ? 'ふわっ' : 'ぽよん');
      }
      return;
    }

    if(state==='butterContact'){
      if(!falling)return;
      const remain=Math.max(0,falling.contactUntil-now);
      falling.squash=Math.max(0.35,remain/260);
      if(now>=falling.contactUntil){
        state='play';
        settleButter(now);
      }
      return;
    }

    if(state==='wait'){
      if(now>=nextAt){
        state='play';
        spawn();
      }
      return;
    }

    if(!falling)return;

    const f=dt/16.67;

    if(falling.type==='honey'){
      falling.vy+=.15*f;
      falling.x+=falling.vx*f;
      falling.y+=falling.vy*f;
      falling.stretch=Math.min(1,Math.max(0,(falling.vy-1.0)/3.0));
      falling.trail=Math.min(1,(falling.trail||0)+0.030*f);
      if(state==='play')hitHoney(now);
    }else{
      falling.vy+=.20*f;
      falling.x+=falling.vx*f;
      falling.y+=falling.vy*f;
      falling.tilt+=falling.vx*.0012*f;

      if(falling.x<22){falling.x=22;falling.vx=Math.abs(falling.vx)*.8}
      if(falling.x>W-22){falling.x=W-22;falling.vx=-Math.abs(falling.vx)*.8}

      if(state==='play' && falling.vy>0){
        if(falling.type==='cake' && falling.y+cakeH/2>=topY()) hitCake(now);
        if(falling.type==='butter'){
          const targetY=plateY-11-(stack.length-1)*14-18;
          if(falling.y+9>=targetY) hitButter(now);
        }
        if(falling.type==='icecream' || falling.type==='chocolate' || falling.type==='cherry'){
          hitSimpleTopping(now);
        }
      }
    }

    if(falling && falling.y>H+50)miss(now);
  }

  function render() {
    drawBackground();
    drawPlateAndFood();

    if(falling){
      if(falling.type==='cake')drawPancake(falling.x,falling.y,falling.tilt,falling.softness,falling.squash||0);
      else if(falling.type==='butter')drawButter(falling.x,falling.y,falling.tilt,falling.squash||0,0);
      else if(falling.type==='honey')drawHoneyBlob(falling.x,falling.y,falling.stretch||0,falling.trail||0);
      else if(falling.type==='icecream')drawIcecream(falling.x,falling.y,falling.tilt||0);
      else if(falling.type==='chocolate')drawChocolate(falling.x,falling.y,falling.tilt||0);
      else if(falling.type==='cherry')drawCherry(falling.x,falling.y,falling.tilt||0);
    }

    drawOrderCard();

    if(state==='complete' && resultInfo){
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,.92)';
      ctx.strokeStyle='#7b5a3f';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.roundRect(54,108,252,118,14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle='#3b2a20';
      ctx.textAlign='center';
      ctx.font='800 25px sans-serif';
      ctx.fillText('出来度 '+resultInfo.percent+'%',W/2,145);
      ctx.font='700 17px sans-serif';
      ctx.fillText(resultInfo.rank+'　'+resultInfo.points+'/'+(dishScores.length*100)+'点',W/2,176);
      ctx.font='800 22px sans-serif';
      ctx.fillText('売上 ¥'+resultInfo.earned,W/2,207);
      ctx.restore();
    }
  }

  function loop(now){
    const dt=Math.min(34,now-last);
    last=now;
    update(dt,now);
    render();
    requestAnimationFrame(loop);
  }

  function pointerToPlate(e){
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)*(W/r.width);
    const oldX=plateX;
    plateX=Math.max(plateW/2,Math.min(W-plateW/2,x));
    plateDelta=plateX-oldX;
    if(stack.length){
      for(let i=0;i<stack.length;i++){
        const s=stack[i];
        s.lagVX=(s.lagVX||0)-plateDelta*(0.08+(s.softness||0.5)*0.08)*(i+1);
      }
    }
    if(butter){
      butter.lagVX=(butter.lagVX||0)-plateDelta*(0.10+(butter.softness||0.78)*0.08);
    }
  }

  box.addEventListener('pointerdown',e=>{
    pointerDown=true;
    box.setPointerCapture?.(e.pointerId);
    pointerToPlate(e);
  });
  box.addEventListener('pointermove',e=>{if(pointerDown)pointerToPlate(e)});
  box.addEventListener('pointerup',e=>{
    pointerDown=false;
    box.releasePointerCapture?.(e.pointerId);
  });
  box.addEventListener('pointercancel',()=>{pointerDown=false});

  function bindHold(btn,side){
    btn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      if(side==='left')leftHeld=true;else rightHeld=true;
      btn.setPointerCapture?.(e.pointerId);
    });
    const stop=()=>{if(side==='left')leftHeld=false;else rightHeld=false};
    btn.addEventListener('pointerup',stop);
    btn.addEventListener('pointercancel',stop);
    btn.addEventListener('lostpointercapture',stop);
  }

  bindHold(leftBtn,'left');
  bindHold(rightBtn,'right');
  resetBtn.addEventListener('click',restart);

  restart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
