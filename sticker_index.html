<body><main class="app"><header><div class="brand"><h1>シール手帳</h1><small>好きな画像で、ページを飾る。</small></div><div class="header-actions"><button id="undo" title="元に戻す">↶ 戻す</button><button id="redo" title="やり直す">↷</button><button id="saveMenu">セーブ</button></div></header>
<div class="workspace"><section class="left"><nav class="page-bar" aria-label="ページ操作"><button id="prev" aria-label="前のページ">‹ 前のページ</button><span id="pageNumber" class="page-number"></span><button id="next" aria-label="次のページ">次のページ ›</button><button id="newPage">＋ ページ</button><select class="mobile-style" id="styleMobile" aria-label="用紙"><option value="blank">白紙</option><option value="lined">罫線</option><option value="grid">方眼</option></select></nav><div class="paper-area"><div class="paper" id="paper" aria-label="シールを貼るページ"></div></div><p class="help">シールを選択 → ＋／−または枠の右下を動かして拡大・縮小</p><div class="status" id="status" aria-live="polite"></div></section>
<aside class="sidebar"><section class="panel paper-style-panel"><div class="page-style"><label for="styleDesktop">用紙</label><select id="styleDesktop"><option value="blank">白紙</option><option value="lined">罫線</option><option value="grid">方眼</option></select></div></section><section class="panel editor-panel"><h2 class="panel-title">貼ったシール</h2><p id="toolHint" class="tool-hint">ページのシールを押すと編集できます。</p><div id="editor" class="editor" hidden><div class="size-row"><label for="size">大きさ</label><button id="sizeDown" aria-label="シールを小さくする">−</button><input id="size" aria-label="シールの大きさ" type="range" min="5" max="100" step="1"><button id="sizeUp" aria-label="シールを大きくする">＋</button><output id="sizeValue"></output></div><label class="range-row">角度<input id="angle" type="range" min="-180" max="180"><output id="angleValue"></output></label><div class="lock-buttons"><button id="lockPosition" aria-pressed="false">位置：自由</button><button id="lockLayer" aria-pressed="false">重なり：自由</button></div><div class="edit-buttons"><button id="front">手前へ</button><button id="back">奥へ</button><button id="copy">複製</button><button id="remove">はがす</button></div></div></section><section class="panel tray-panel"><div class="tray-heading"><h2>シール一覧</h2><button class="add" id="add" disabled>＋ 画像を追加</button></div><div class="tray" id="tray"></div></section></aside></div></main><input id="files" type="file" accept="image/*" multiple><div id="toast" class="toast" role="status"></div>
<dialog id="saveDialog"><form method="dialog" class="dialog-head"><strong>セーブ・ロード</strong><button aria-label="閉じる">×</button></form><p class="save-description">画像・配置・全ページをまとめて保存し、続きから編集できます。</p><label class="slot-row">保存先 <select id="saveSlot"><option value="1">スロット1</option><option value="2">スロット2</option><option value="3">スロット3</option></select></label><div class="save-actions"><button id="savePrivate" class="add">セーブ</button><button id="loadPrivate">ロード</button></div><p id="saveMessage" role="status" aria-live="polite"></p><details id="connection"><summary>GitHub接続設定</summary><p class="save-description">他のゲームで登録した接続情報を共用します。未登録の場合は、private-game-dataの読み書き権限があるトークンを登録してください。</p><label for="githubToken">トークン</label><input type="password" id="githubToken" autocomplete="off" placeholder="この端末の接続情報"><button id="registerToken">登録</button></details><details class="file-tools"><summary>セーブファイルで保存・読み込み</summary><p class="save-description">画像を含む編集用データとして保存します。</p><div class="save-actions"><button id="downloadSave">ファイル保存</button><button id="uploadSave">ファイル読み込み</button></div></details><input id="saveFile" type="file" accept=".json,application/json"></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),KEY='sticker-notebook-v1';
let state={assets:[],pages:[{id:uid(),style:'blank',items:[]}],page:0},selected=null,history=[],future=[],db,saveQueue=Promise.resolve(),drag=null,rangeBefore=null;
const current=()=>state.pages[state.page],item=()=>current().items.find(i=>i.id===selected),snapshot=()=>JSON.stringify(state);
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2800)}
function commit(before){if(before===snapshot())return;history.push(before);if(history.length>35)history.shift();future=[];save();renderButtons()}
function mutate(fn){const before=snapshot();fn();commit(before);render()}
let storageReadyResolve;const storageReady=new Promise(r=>storageReadyResolve=r);let saveBusy=false;
function localWrite(value){return new Promise((resolve,reject)=>{if(!db){try{localStorage.setItem(KEY,JSON.stringify(value));resolve();}catch(e){reject(e)}return}let tx;try{tx=db.transaction('data','readwrite');tx.objectStore('data').put(value,KEY)}catch(e){reject(e);return}tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function save(){const value=JSON.parse(snapshot());saveQueue=saveQueue.catch(()=>{}).then(()=>storageReady).then(()=>localWrite(value)).then(()=>{if(!saveBusy)$('status').textContent='端末に仮保存・セーブは上のボタンから'}).catch(()=>{if(!saveBusy)$('status').textContent='端末の仮保存に失敗・セーブボタンから保存してください'});return saveQueue}

function renderButtons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length;$('prev').disabled=state.page===0;$('next').disabled=state.page===state.pages.length-1}
function applyPosition(el,i){el.style.left=i.x+'%';el.style.top=i.y+'%';el.style.width=i.w+'%';el.style.setProperty('--angle',i.r+'deg')}
function render(){const p=current(),paper=$('paper');paper.className='paper '+p.style;paper.replaceChildren();if(!p.items.length){const h=document.createElement('div');h.className='empty-hint';h.innerHTML='<span class="plus">＋</span><span>好きな画像を追加して<br>ここに貼ってみましょう</span>';paper.append(h)}for(const i of p.items){const a=state.assets.find(a=>a.id===i.asset);if(!a)continue;const el=document.createElement('div');el.className='sticker'+(i.id===selected?' selected':'')+(i.positionLocked?' position-locked':'');el.dataset.id=i.id;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',a.name+'を編集');applyPosition(el,i);const im=new Image();im.src=a.src;im.alt=a.name;im.draggable=false;el.append(im);const handle=document.createElement('button');handle.className='resize-handle';handle.textContent='↘';handle.setAttribute('aria-label','角を動かして大きさを変える');handle.addEventListener('pointerdown',startResize);el.append(handle);el.addEventListener('pointerdown',startDrag);el.addEventListener('keydown',e=>{if(e.key==='Enter'){selected=i.id;render()}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(i.positionLocked)return;mutate(()=>{i.x=Math.max(0,Math.min(100,i.x+(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0)));i.y=Math.max(0,Math.min(100,i.y+(e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0)))})}});paper.append(el)}$('pageNumber').textContent=(state.page+1)+' / '+state.pages.length;$('styleDesktop').value=$('styleMobile').value=p.style;renderTools();renderButtons()}
function renderTools(){const i=item();$('editor').hidden=!i;$('editor').style.display=i?'':'none';$('toolHint').hidden=!!i;if(i){$('size').value=i.w;$('angle').value=i.r;$('sizeValue').textContent=Math.round(i.w)+'%';$('angleValue').textContent=i.r+'°';$('lockPosition').textContent=i.positionLocked?'位置：固定':'位置：自由';$('lockLayer').textContent=i.layerLocked?'重なり：固定':'重なり：自由';$('lockPosition').setAttribute('aria-pressed',String(!!i.positionLocked));$('lockLayer').setAttribute('aria-pressed',String(!!i.layerLocked));$('front').disabled=i.layerLocked||layerTarget(i,1)===current().items.indexOf(i);$('back').disabled=i.layerLocked||layerTarget(i,-1)===current().items.indexOf(i)}}
function renderTray(){const tray=$('tray');tray.replaceChildren();if(!state.assets.length){const t=document.createElement('div');t.className='tray-note';t.innerHTML='写真や透過画像を追加できます。<br>追加した画像は何度でも貼れます。';tray.append(t)}state.assets.forEach(a=>{const b=document.createElement('button');b.className='thumb';b.title=a.name+'を貼る';b.setAttribute('aria-label',a.name+'を貼る');const im=new Image();im.src=a.src;im.alt=a.name;b.append(im);b.onclick=()=>mutate(()=>{const i={id:uid(),asset:a.id,x:50,y:50,w:30,r:0,positionLocked:false,layerLocked:false};current().items.push(i);selected=i.id});tray.append(b)})}
function startDrag(e){if(e.button!==0)return;e.preventDefault();e.stopPropagation();const el=e.currentTarget;selected=el.dataset.id;document.querySelectorAll('.sticker').forEach(n=>n.classList.toggle('selected',n===el));renderTools();const i=item();if(i.positionLocked){drag=null;return}const rect=$('paper').getBoundingClientRect();drag={id:selected,pointer:e.pointerId,x:e.clientX,y:e.clientY,ix:i.x,iy:i.y,rect,before:snapshot(),el};el.setPointerCapture(e.pointerId)}
function startResize(e){if(e.button!==0)return;e.preventDefault();e.stopPropagation();const el=e.currentTarget.closest('.sticker');selected=el.dataset.id;const rect=el.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;drag={mode:'resize',id:selected,pointer:e.pointerId,cx,cy,distance:Math.max(1,Math.hypot(e.clientX-cx,e.clientY-cy)),iw:item().w,before:snapshot(),el};el.setPointerCapture(e.pointerId);renderTools()}
function moveSticker(e){if(!drag||e.pointerId!==drag.pointer)return;const i=item();if(!i)return;if(drag.mode==='resize'){i.w=Math.max(5,Math.min(100,drag.iw*Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)/drag.distance));renderTools()}else{if(i.positionLocked)return;i.x=Math.max(0,Math.min(100,drag.ix+(e.clientX-drag.x)/drag.rect.width*100));i.y=Math.max(0,Math.min(100,drag.iy+(e.clientY-drag.y)/drag.rect.height*100))}applyPosition(drag.el,i)}
$('paper').addEventListener('pointermove',moveSticker);
function changeSize(delta){if(!item())return;mutate(()=>item().w=Math.max(5,Math.min(100,item().w+delta)))}$('sizeDown').onclick=()=>changeSize(-5);$('sizeUp').onclick=()=>changeSize(5);
function endDrag(e){if(!drag||e.pointerId!==drag.pointer)return;const before=drag.before;drag=null;commit(before)}$('paper').addEventListener('pointerup',endDrag);$('paper').addEventListener('pointercancel',endDrag);$('paper').addEventListener('pointerdown',e=>{if(e.target===$('paper')){selected=null;render()}});
$('add').onclick=()=>$('files').click();
function readFile(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>resolve({id:uid(),name:f.name,src:r.result});im.onerror=()=>reject(Error(f.name));im.src=r.result};r.onerror=()=>reject(Error(f.name));r.readAsDataURL(f)})}
$('files').onchange=async e=>{const fs=Array.from(e.target.files);if(!fs.length)return;$('add').disabled=true;const results=await Promise.allSettled(fs.map(readFile));const added=results.filter(r=>r.status==='fulfilled').map(r=>r.value);if(added.length){mutate(()=>state.assets.push(...added));renderTray();toast('一覧の画像を押すと貼れます')}if(results.some(r=>r.status==='rejected'))toast('読み込めない画像がありました。PNGやJPEGでお試しください。');$('add').disabled=false;e.target.value=''};
for(const [id,field] of [['size','w'],['angle','r']]){$(id).addEventListener('pointerdown',()=>rangeBefore=snapshot());$(id).addEventListener('keydown',()=>{rangeBefore??=snapshot()});$(id).addEventListener('input',()=>{const i=item();if(!i)return;rangeBefore??=snapshot();i[field]=Number($(id).value);const el=$('paper').querySelector('[data-id="'+i.id+'"]');applyPosition(el,i);renderTools()});$(id).addEventListener('change',()=>{if(rangeBefore){commit(rangeBefore);rangeBefore=null}})}
function layerTarget(i,direction){const list=current().items;let target=list.indexOf(i);if(i.layerLocked)return target;while(target+direction>=0&&target+direction<list.length&&!list[target+direction].layerLocked)target+=direction;return target}
function moveLayer(direction){const i=item();if(!i||i.layerLocked)return;mutate(()=>{const list=current().items,index=list.indexOf(i),target=layerTarget(i,direction);list.splice(index,1);list.splice(target,0,i)})}
$('front').onclick=()=>moveLayer(1);$('back').onclick=()=>moveLayer(-1);
$('lockPosition').onclick=()=>{if(item())mutate(()=>item().positionLocked=!item().positionLocked)};
$('lockLayer').onclick=()=>{if(item())mutate(()=>item().layerLocked=!item().layerLocked)};
$('copy').onclick=()=>mutate(()=>{const i=item();if(i){const n={...i,id:uid(),positionLocked:false,layerLocked:false,x:Math.min(95,i.x+4),y:Math.min(95,i.y+4)};current().items.push(n);selected=n.id}});$('remove').onclick=()=>mutate(()=>{current().items=current().items.filter(i=>i.id!==selected);selected=null});
$('newPage').onclick=()=>mutate(()=>{state.pages.push({id:uid(),style:current().style,items:[]});state.page=state.pages.length-1;selected=null});for(const [id,delta] of [['prev',-1],['next',1]])$(id).onclick=()=>{state.page=Math.max(0,Math.min(state.pages.length-1,state.page+delta));selected=null;save();render()};for(const id of ['styleMobile','styleDesktop'])$(id).onchange=()=>mutate(()=>current().style=$(id).value);
function restore(s){state=JSON.parse(s);selected=null;save();render();renderTray()}$('undo').onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop())}};
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}

const TOKEN_KEYS=['private_game_github_token_v1','homedeco_github_token_v1'];
const SAVE_FORMAT='iroiro-sticker-notebook',SAVE_ROOT='https://api.github.com/repos/namiyukuta-cmd/private-game-data/contents/sticker/saves/';
function getToken(){for(const key of TOKEN_KEYS){try{const t=localStorage.getItem(key);if(t)return t}catch{}}return ''}
function validState(s){if(!s||!Array.isArray(s.assets)||!Array.isArray(s.pages)||!s.pages.length||!Number.isInteger(s.page)||s.page<0||s.page>=s.pages.length)return false;const ids=new Set();for(const a of s.assets){if(!a||typeof a.id!=='string'||ids.has(a.id)||typeof a.name!=='string'||typeof a.src!=='string'||!/^data:image\//i.test(a.src))return false;ids.add(a.id)}for(const p of s.pages){if(!p||typeof p.id!=='string'||!['blank','lined','grid'].includes(p.style)||!Array.isArray(p.items))return false;const itemIds=new Set();for(const i of p.items){if(!i||typeof i.id!=='string'||itemIds.has(i.id)||!ids.has(i.asset)||!['x','y','w','r'].every(k=>Number.isFinite(i[k]))||i.x<0||i.x>100||i.y<0||i.y>100||i.w<5||i.w>100||i.r< -180||i.r>180||['positionLocked','layerLocked'].some(k=>i[k]!==undefined&&typeof i[k]!=='boolean'))return false;itemIds.add(i.id)}}return true}
function saveData(){return {format:SAVE_FORMAT,version:1,savedAt:new Date().toISOString(),state:JSON.parse(snapshot())}}
function parseSave(text){const d=JSON.parse(text);if(d.format!==SAVE_FORMAT||d.version!==1||!validState(d.state))throw Error('シール手帳のセーブデータではありません。');return d}
function encode(text){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)}
function saveUrl(){return SAVE_ROOT+'slot'+$('saveSlot').value+'.json'}
function saveMessage(t){$('saveMessage').textContent=t}
function setSaveBusy(v){saveBusy=v;for(const id of ['savePrivate','loadPrivate','downloadSave','uploadSave','saveSlot','registerToken'])$(id).disabled=v}
async function githubRequest(method,url,body,raw=false){const token=getToken();if(!token){$('connection').open=true;throw Error('GitHub接続情報が未登録です。接続設定から登録するか、セーブファイルで保存してください。')}const response=await fetch(url,{method,headers:{Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!response.ok){const error=Error(response.status===401?'GitHub接続情報が無効です。':response.status===403?'private-game-dataへのアクセス権限を確認してください。':response.status===404?'保存データが見つからないか、保存先へのアクセス権限がありません。':'GitHubへの通信に失敗しました（'+response.status+'）。');error.status=response.status;throw error}return raw?response.text():response.json()}
function replaceSave(data){const before=snapshot();state=data.state;selected=null;commit(before);render();renderTray()}
$('saveMenu').onclick=()=>{saveMessage(getToken()?'保存先：private-game-data / sticker / saves':'GitHub接続情報を登録すると、非公開リポジトリにセーブできます。');$('saveDialog').showModal()};
$('registerToken').onclick=()=>{const token=$('githubToken').value.trim();if(!token){saveMessage('トークンを入力してください。');return}try{localStorage.setItem(TOKEN_KEYS[0],token);$('githubToken').value='';$('connection').open=false;saveMessage('接続情報を登録しました。セーブを押してください。')}catch{saveMessage('接続情報を端末に保存できませんでした。セーブファイルで保存できます。')}};
$('savePrivate').onclick=async()=>{if(saveBusy)return;const data=saveData(),url=saveUrl();setSaveBusy(true);saveMessage('セーブ中…');try{let sha=null;try{const existing=await githubRequest('GET',url);sha=existing.sha;if(!sha)throw Error('保存先の情報を取得できませんでした。');const old=parseSave(await githubRequest('GET',url,undefined,true));if(!confirm('スロット'+$('saveSlot').value+'に保存済みの手帳があります。上書きしますか？')){saveMessage('上書きを取り消しました。');return}}catch(e){if(e.status!==404)throw e;/* Confirm access before creating a missing slot. */await githubRequest('GET','https://api.github.com/repos/namiyukuta-cmd/private-game-data')}await githubRequest('PUT',url,{message:'Save sticker notebook slot'+$('saveSlot').value,content:encode(JSON.stringify(data)),...(sha?{sha}:{})});try{localStorage.setItem(KEY+'-manual-'+$('saveSlot').value,JSON.stringify(data))}catch{}const unchanged=JSON.stringify(data.state)===snapshot();saveMessage('スロット'+$('saveSlot').value+'にセーブしました。画像と全ページを保存済みです。'+(unchanged?'':'保存後の変更は未セーブです。'));$('status').textContent=unchanged?'GitHubにセーブ済み':'未セーブの変更があります';toast('セーブしました')}catch(e){saveMessage('セーブ失敗：'+e.message);$('status').textContent='セーブに失敗しました。画面の手帳はそのままです。'}finally{setSaveBusy(false)}};
$('loadPrivate').onclick=async()=>{if(saveBusy)return;const started=snapshot(),url=saveUrl();setSaveBusy(true);saveMessage('ロード中…');try{const data=parseSave(await githubRequest('GET',url,undefined,true));if(!confirm('保存した手帳をロードしますか？'+(started!==snapshot()?'読み込み中に編集した内容も切り替わります。':'現在の編集内容が切り替わります。'))){saveMessage('ロードを取り消しました。');return}replaceSave(data);saveMessage('ロードしました。シールを動かして続きを編集できます。');$('status').textContent='GitHubのセーブをロードしました';toast('ロードしました')}catch(e){saveMessage('ロード失敗：'+e.message)}finally{setSaveBusy(false)}};
$('downloadSave').onclick=()=>{try{const text=JSON.stringify(saveData()),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='シール手帳-セーブ-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);saveMessage('編集用のセーブファイルを出力しました。ファイル読み込みで復元できます。')}catch{saveMessage('ファイルの出力に失敗しました。')}};
$('uploadSave').onclick=()=>$('saveFile').click();$('saveFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=parseSave(await f.text());if(!confirm('セーブファイルを読み込み、現在の手帳を切り替えますか？'))return;replaceSave(data);saveMessage('セーブファイルを読み込みました。続きを編集できます。')}catch(e){saveMessage('読み込み失敗：'+e.message)}finally{$('saveFile').value=''}};
const paperArea=document.querySelector(".paper-area");new ResizeObserver(()=>{const w=Math.min(paperArea.clientWidth-24,(paperArea.clientHeight-28)*.75);$("paper").style.width=Math.max(0,w)+"px";$("paper").style.height=Math.max(0,w/0.75)+"px"}).observe(paperArea);
async function init(){try{db=await new Promise((resolve,reject)=>{const r=indexedDB.open('sticker-notebook',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const saved=await new Promise((resolve,reject)=>{const r=db.transaction('data').objectStore('data').get(KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(saved&&Array.isArray(saved.pages)&&saved.pages.length&&Array.isArray(saved.assets)){state=saved;state.page=Math.max(0,Math.min(state.page,state.pages.length-1))}$('status').textContent='端末に仮保存・セーブは上のボタンから'}catch{db=null;try{const raw=localStorage.getItem(KEY);if(raw){const old=JSON.parse(raw);if(validState(old))state=old}}catch{}$('status').textContent='セーブは上のボタンから'}storageReadyResolve();$('add').disabled=false;render();renderTray()}init();
</script></body></html>
