name: Audit HMW response rules 008
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-008.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          [
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js',
            'HMW/js/dialogue/response-rules-001-social-emotion.js',
            'HMW/js/dialogue/response-rules-002-daily-relationship.js',
            'HMW/js/dialogue/response-rules-003-facts-policy-nuance.js',
            'HMW/js/dialogue/response-rules-004-claims-context.js',
            'HMW/js/dialogue/response-rules-005-actions-daily-repair.js',
            'HMW/js/dialogue/response-rules-006-exact-actions-questions.js',
            'HMW/js/dialogue/response-rules-007-semantic-continuity.js',
            'HMW/js/dialogue/response-rules-008-questions-boundaries-repair.js',
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js'
          ].forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const meanings=D.MEANINGS||{};
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!meanings[id]))];

          const cases=[
            {
              name:'multi_boundary',
              analysis:{boundaries:['do_not_touch','do_not_kiss'],emotions:{fear:60}},
              facts:{},policy:{},psych:{}
            },
            {
              name:'talk_permission_denied',
              analysis:{intents:['ask_permission_action'],questions:[{kind:'permission',action:'talk'}]},
              facts:{},policy:{permissions:{talk:false}},psych:{}
            },
            {
              name:'relationship_reassurance',
              analysis:{intents:['request_reassurance'],focusConcepts:['love','trust','abandonment'],emotions:{fear:65}},
              facts:{lovesHeroine:true,trustsHeroine:true,choosesHeroine:true,willAbandonHeroine:false,loyalToHeroine:true},
              policy:{},psych:{care:70}
            },
            {
              name:'reason_distrust',
              analysis:{intents:['ask_reason'],questions:[{kind:'reason'}],emotions:{distrust:65}},
              facts:{reason:'work'},policy:{},psych:{}
            },
            {
              name:'contradiction_prune',
              analysis:{intents:['ask_permission_action'],questions:[{kind:'permission',action:'touch'}]},
              facts:{},policy:{permissions:{touch:true}},psych:{}
            },
            {
              name:'sad_goodbye',
              analysis:{intents:['say_goodbye'],emotions:{sadness:70,affection:60}},
              facts:{willReturn:true},policy:{},psych:{tenderness:70}
            }
          ];

          const results=cases.map(c=>{
            const plan=D.planResponse({analysis:c.analysis,characterFacts:c.facts,characterPolicy:c.policy,psychology:c.psych});
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {name:c.name,meaningIds:plan.meaningIds,matchedRuleIds:plan.matchedResponseRuleIds,selected};
          });

          const conflictSelected=D.selectResponseMeanings(
            ['GRANT_PERMISSION','DENY_PERMISSION','AFFIRM_LOVE','DENY_LOVE','CONFIRM_AVAILABLE','DENY_AVAILABLE'],
            {maxMeanings:10}
          );

          const checks={
            ruleCount:rules.length===800,
            uniqueRuleIds:new Set(ids).size===800,
            noMissingMeanings:missingMeaningIds.length===0,
            multiBoundary:results[0].matchedRuleIds.includes('R756_BOUNDARY_PHYSICAL_MULTI')&&results[0].meaningIds.includes('PROMISE_NOT_TOUCH')&&results[0].meaningIds.includes('PROMISE_NOT_KISS'),
            talkPermission:results[1].meaningIds.includes('DENY_PERMISSION'),
            reassurance:results[2].meaningIds.includes('AFFIRM_LOVE')&&results[2].meaningIds.includes('CONFIRM_TRUST')&&results[2].meaningIds.includes('REASSURE_NOT_LEAVING'),
            reasonDistrust:results[3].meaningIds.includes('STATE_REASON')&&results[3].meaningIds.includes('ASK_FOR_HONEST_ANSWER'),
            noConflict:conflictSelected.includes('GRANT_PERMISSION')&&!conflictSelected.includes('DENY_PERMISSION')&&conflictSelected.includes('AFFIRM_LOVE')&&!conflictSelected.includes('DENY_LOVE')&&conflictSelected.includes('CONFIRM_AVAILABLE')&&!conflictSelected.includes('DENY_AVAILABLE'),
            sadGoodbye:results[5].meaningIds.includes('EXPRESS_MISSING')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            conflictSelected,
            checks,
            results
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
