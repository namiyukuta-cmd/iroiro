name: Audit HMW generation router 002
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-generation-router-002.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit generation router
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd(),lang=path.join(root,'HMW/js/dialogue/language');
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          const names=fs.readdirSync(lang).sort();
          const loadPrefix=prefix=>{
            for(const name of names) if(name.startsWith(prefix)&&name.endsWith('.js')) run('HMW/js/dialogue/language/'+name);
          };

          run('HMW/js/dialogue/dialogue-meanings.js');
          run('HMW/js/dialogue/language/vocabulary-registry.js');
          loadPrefix('vocabulary-');
          run('HMW/js/dialogue/language/morphology-rules.js');
          loadPrefix('sentence-patterns-');
          run('HMW/js/dialogue/language/word-selector.js');
          run('HMW/js/dialogue/language/dialogue-composer.js');
          run('HMW/js/dialogue/language/pattern-slot-filler.js');
          loadPrefix('meaning-pattern-map-');
          loadPrefix('meaning-generation-specs-');
          run('HMW/js/dialogue/language/semantic-generation-router.js');
          run('HMW/js/dialogue/language/generated-sentence-builder.js');

          const D=ctx.HMW.Dialogue;
          const ids=Object.keys(D.MEANINGS||{});
          const routed={};
          for(const id of ids){
            try{ routed[id]=D.getMeaningGenerationRoutes(id,{variantSeed:0}); }
            catch(e){ routed[id]=[{ok:false,error:String(e)}]; }
          }
          const routedIds=ids.filter(id=>(routed[id]||[]).some(x=>x.ok));
          const totalRoutes=ids.reduce((n,id)=>n+(routed[id]||[]).filter(x=>x.ok).length,0);
          const mapRoutedIds=ids.filter(id=>(routed[id]||[]).some(x=>x.ok&&x.routeSource==='meaning_pattern_map'));
          const badRoutes=ids.flatMap(id=>(routed[id]||[]).filter(x=>x.ok&&(/[{}]/.test(x.english||'')||!String(x.english||'').trim())).map(x=>({id,...x})));

          const composed=ids.map((id,i)=>{
            try{return D.composeMeaning(id,{variantSeed:i,preferGenerated:true});}
            catch(e){return {meaningId:id,ok:false,english:'',reason:String(e)};}
          });
          const failed=composed.filter(x=>!x.ok||!String(x.english||'').trim());
          const unresolved=composed.filter(x=>/[{}]/.test(String(x.english||'')));

          const offerFood=D.getMeaningGenerationRoutes('OFFER_FOOD',{variantSeed:0});
          const offerDrink=D.getMeaningGenerationRoutes('OFFER_DRINK',{variantSeed:0});
          const care=D.getMeaningGenerationRoutes('EXPRESS_CARE',{variantSeed:0});

          const checks={
            meanings177:ids.length===177,
            allCompose:failed.length===0,
            noUnresolved:unresolved.length===0,
            noBadRoutes:badRoutes.length===0,
            mappedRouterWorks:mapRoutedIds.includes('OFFER_FOOD')&&mapRoutedIds.includes('OFFER_DRINK'),
            foodHasFamily:offerFood.length>=2,
            drinkHasFamily:offerDrink.length>=2,
            careRoutes:care.length>=1
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            meaningCount:ids.length,
            vocabularyCount:D.Vocabulary?.entries?.length||0,
            patternCount:Object.keys(D.SENTENCE_PATTERNS||{}).length,
            routedMeaningCount:routedIds.length,
            mappedRoutedMeaningCount:mapRoutedIds.length,
            totalRoutes,
            failed:failed.map(x=>x.meaningId),
            unresolved:unresolved.map(x=>x.meaningId),
            badRoutes:badRoutes.slice(0,10),
            offerFood:offerFood.map(x=>({patternId:x.patternId,english:x.english,routeSource:x.routeSource})),
            offerDrink:offerDrink.map(x=>({patternId:x.patternId,english:x.english,routeSource:x.routeSource})),
            care:care.map(x=>({patternId:x.patternId,english:x.english,routeSource:x.routeSource})),
            checks
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
