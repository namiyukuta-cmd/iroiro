name: Audit HMW generation router 003
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-generation-router-003.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit semantic generation router
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd(),lang=path.join(root,'HMW/js/dialogue/language');
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          const names=fs.readdirSync(lang).sort();
          const loadPrefix=prefix=>names.filter(n=>n.startsWith(prefix)&&n.endsWith('.js')).forEach(n=>run('HMW/js/dialogue/language/'+n));

          run('HMW/js/dialogue/dialogue-meanings.js');
          run('HMW/js/dialogue/language/vocabulary-registry.js');
          loadPrefix('vocabulary-');
          run('HMW/js/dialogue/language/morphology-rules.js');
          run('HMW/js/dialogue/language/word-selector.js');
          loadPrefix('sentence-patterns-');
          run('HMW/js/dialogue/language/dialogue-composer.js');
          run('HMW/js/dialogue/language/pattern-slot-filler.js');
          loadPrefix('meaning-generation-specs-');
          loadPrefix('meaning-pattern-map-');
          run('HMW/js/dialogue/language/semantic-generation-router.js');
          run('HMW/js/dialogue/language/generated-sentence-builder.js');

          const D=ctx.HMW.Dialogue;
          const ids=Object.keys(D.MEANINGS||{});
          const routed={};
          for(const id of ids) routed[id]=D.getMeaningGenerationRoutes(id,{variantSeed:0});
          const routedIds=ids.filter(id=>routed[id].length);
          const noRouted=ids.filter(id=>!routed[id].length);
          const totalRoutes=ids.reduce((n,id)=>n+routed[id].length,0);
          const allRoutes=ids.flatMap(id=>routed[id].map(x=>({id,...x})));
          const suspicious=allRoutes.filter(x=>/please like something|like to like|the thing about you|cannot like something/i.test(String(x.english||'')));

          const composed=ids.map((id,i)=>{
            try{return D.composeMeaning(id,{variantSeed:i,preferGenerated:true});}
            catch(e){return {meaningId:id,ok:false,english:'',reason:String(e)};}
          });
          const failed=composed.filter(x=>!x.ok||!String(x.english||'').trim());
          const unresolved=composed.filter(x=>/[{}]/.test(String(x.english||'')));

          const expectedDynamic=[
            'ASK_WHAT_HAPPENED','ASK_TO_REPAIR','ACKNOWLEDGE_EVENT','ASK_FOR_DETAILS',
            'EXPRESS_SURPRISE','EXPRESS_SYMPATHY','EXPRESS_APPROVAL','EXPRESS_DISAPPROVAL',
            'ASK_PLAN','ASK_PREFERENCE','ASK_WORK_STATUS','ASK_MONEY_STATUS',
            'ASK_HUNGER','ASK_THIRST','ASK_TIREDNESS','REQUEST_CONTACT',
            'ASK_PERMISSION_ENTER','ASK_PERMISSION_WAIT','EXPRESS_DISAPPOINTMENT','EXPRESS_HOPE',
            'EXPRESS_PRIDE','CONFIRM_ARRIVAL','ANSWER_UNKNOWN','CONFIRM_KNOWLEDGE',
            'DENY_KNOWLEDGE','CONFIRM_FACT','DENY_FACT','GRANT_PERMISSION','DENY_PERMISSION',
            'ACCEPT_ACTION_REQUEST','DECLINE_ACTION_REQUEST','ACCEPT_INVITATION',
            'DECLINE_INVITATION','ACCEPT_SUGGESTION','DECLINE_SUGGESTION'
          ];
          const missingDynamic=expectedDynamic.filter(id=>!routed[id]?.length);

          const checks={
            vocabulary5073:(D.Vocabulary?.entries?.length||0)===5073,
            patterns1000:Object.keys(D.SENTENCE_PATTERNS||{}).length===1000,
            meanings177:ids.length===177,
            allCompose:failed.length===0,
            noUnresolved:unresolved.length===0,
            noKnownBadRoutes:suspicious.length===0,
            dynamicBatchComplete:missingDynamic.length===0,
            routedAtLeast174:routedIds.length>=174
          };

          const allMeaningsRouted = routedMeanings.length === meaningIds.length && noRouted.length === 0;
          if (!allMeaningsRouted) process.exitCode = 1;

          console.log('AUDIT_RESULT '+JSON.stringify({
            vocabularyCount:D.Vocabulary?.entries?.length||0,
            patternCount:Object.keys(D.SENTENCE_PATTERNS||{}).length,
            meaningCount:ids.length,
            routedMeaningCount:routedIds.length,
            noRouted,
            totalRoutes,
            missingDynamic,
            failed:failed.map(x=>x.meaningId),
            unresolved:unresolved.map(x=>x.meaningId),
            suspicious:suspicious.slice(0,20).map(x=>({id:x.id,patternId:x.patternId,english:x.english})),
            samples:{
              askWhat:routed.ASK_WHAT_HAPPENED?.map(x=>x.english),
              askPlan:routed.ASK_PLAN?.map(x=>x.english),
              hunger:routed.ASK_HUNGER?.map(x=>x.english),
              grant:routed.GRANT_PERMISSION?.map(x=>x.english),
              acceptAction:routed.ACCEPT_ACTION_REQUEST?.map(x=>x.english)
            },
            checks
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
