name: Audit HMW response rules 002
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-002.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          [
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js',
            'HMW/js/dialogue/response-rules-001-social-emotion.js',
            'HMW/js/dialogue/response-rules-002-daily-relationship.js',
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js'
          ].forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const meanings=D.MEANINGS||{};
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!meanings[id]))];

          const cases=[
            {
              name:'hungry_can_offer',
              analysis:{intents:['report_condition'],focusConcepts:['food','hunger'],tone:{positivity:20,hesitation:20}},
              facts:{},policy:{canOfferFood:true},psych:{}
            },
            {
              name:'thirst_can_offer',
              analysis:{intents:['report_condition'],focusConcepts:['water','thirst']},
              facts:{},policy:{canOfferWater:true},psych:{}
            },
            {
              name:'stay_denied',
              analysis:{intents:['request_stay']},
              facts:{},policy:{willingToStay:false},psych:{}
            },
            {
              name:'betrayal_false',
              analysis:{intents:['fear_betrayal'],focusConcepts:['betrayal']},
              facts:{intendsBetrayal:false,loyalToHeroine:true},policy:{},psych:{}
            },
            {
              name:'quiet_hesitant',
              analysis:{intents:['report_condition'],focusConcepts:['health'],tone:{style:'subdued',hesitation:90,negativity:65}},
              facts:{},policy:{},psych:{}
            },
            {
              name:'sad_lonely',
              analysis:{intents:['report_event'],emotions:{sadness:70,loneliness:70}},
              facts:{},policy:{},psych:{}
            }
          ];

          const results=cases.map(c=>{
            const plan=D.planResponse({analysis:c.analysis,characterFacts:c.facts,characterPolicy:c.policy,psychology:c.psych});
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {name:c.name,meaningIds:plan.meaningIds,matchedRuleIds:plan.matchedResponseRuleIds,selected};
          });

          const checks={
            ruleCount:rules.length===200,
            uniqueRuleIds:new Set(ids).size===200,
            noMissingMeanings:missingMeaningIds.length===0,
            hungry:results[0].meaningIds.includes('OFFER_FOOD'),
            thirst:results[1].meaningIds.includes('OFFER_DRINK'),
            stayDenied:results[2].meaningIds.includes('DECLINE_REQUEST'),
            betrayal:results[3].meaningIds.includes('DENY_BETRAYAL')&&!results[3].meaningIds.includes('ADMIT_BETRAYAL'),
            quiet:results[4].meaningIds.includes('ASK_IF_OKAY'),
            sadLonely:results[5].meaningIds.includes('EXPRESS_SYMPATHY')&&results[5].meaningIds.includes('OFFER_COMPANY')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            checks,
            results
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
