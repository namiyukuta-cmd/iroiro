name: Audit HMW response rules 021
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-021.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          const files=[
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js'
          ];
          for(let i=1;i<=21;i++){
            const n=String(i).padStart(3,'0');
            const found=fs.readdirSync(path.join(root,'HMW/js/dialogue'))
              .find(name=>name.startsWith('response-rules-'+n+'-')&&name.endsWith('.js'));
            if(!found) throw new Error('missing response rules file '+n);
            files.push('HMW/js/dialogue/'+found);
          }
          files.push(
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js',
            'HMW/js/dialogue/response-history.js'
          );
          files.forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!D.MEANINGS[id]))];

          const test=c=>{
            const plan=D.planResponse(c);
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{
              boundaryActive:plan.boundaryActive,
              maxMeanings:5,
              preferredMeaningIds:plan.preferredMeaningIds||[]
            });
            return {plan,selected};
          };

          const secondaryPrice=test({
            analysis:{
              intents:['ask_where','ask_price'],
              questions:[
                {kind:'where',target:'home',requestedField:'currentLocation'},
                {kind:'price',target:'apple'}
              ]
            },
            characterFacts:{currentLocation:'Kyoto',prices:{apple:5,home:999}},
            characterPolicy:{},
            relationship:{stage:'friend',familiarity:70,trust:70,goodwill:70,flags:{}}
          });

          const secondaryPermission=test({
            analysis:{
              intents:['ask_where','ask_permission_action'],
              questions:[
                {kind:'where',target:'kiss',requestedField:'currentLocation'},
                {kind:'permission',action:'hug'}
              ]
            },
            characterFacts:{currentLocation:'Osaka'},
            characterPolicy:{permissions:{kiss:true,hug:false}},
            relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,flags:{}}
          });

          const secondaryInviteBoundary=test({
            analysis:{
              intents:['ask_where','invite_action'],
              questions:[
                {kind:'where',requestedField:'currentLocation'},
                {kind:'invitation',action:'hug'}
              ],
              boundaries:['do_not_hug']
            },
            characterFacts:{currentLocation:'Tokyo'},
            characterPolicy:{invitationResponses:{hug:true}},
            relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,flags:{}}
          });

          const secondaryClaim=test({
            analysis:{
              focusConcepts:['relationship','betrayal'],
              claims:[
                {concept:'relationship',type:'speaker_fear',polarity:true,certainty:'medium'},
                {concept:'betrayal',type:'speaker_suspicion',polarity:true,certainty:'high'}
              ]
            },
            characterFacts:{intendsBetrayal:false,loyalToHeroine:true},
            characterPolicy:{},
            relationship:{stage:'partner',familiarity:90,trust:85,goodwill:90,flags:{}}
          });

          const primarySecondaryDirect=test({
            analysis:{
              intents:['ask_where','ask_when'],
              questions:[
                {kind:'where',requestedField:'currentLocation'},
                {kind:'when',requestedField:'returnTime'}
              ]
            },
            characterFacts:{currentLocation:'Nagoya',returnTime:'21:00'},
            characterPolicy:{},
            relationship:{stage:'friend',familiarity:70,trust:70,goodwill:70,flags:{}}
          });

          const apologyConflict=D.selectResponseMeanings(
            D.prioritizeResponseMeanings(['DECLINE_FOR_NOW','ACCEPT_APOLOGY']),
            {maxMeanings:5}
          );
          const contactConflict=D.selectResponseMeanings(
            D.prioritizeResponseMeanings(['DECLINE_CONTACT','OFFER_CONTACT']),
            {maxMeanings:5}
          );

          const checks={
            ruleCount:rules.length===2100,
            uniqueRuleIds:new Set(ids).size===2100,
            noMissingMeanings:missingMeaningIds.length===0,
            secondaryPriceIsolation:
              secondaryPrice.plan.slotOverridesByMeaning.STATE_PRICE?.AMOUNT==='5' &&
              secondaryPrice.selected.includes('STATE_CURRENT_LOCATION') &&
              secondaryPrice.selected.includes('STATE_PRICE'),
            secondaryPermissionIsolation:
              secondaryPermission.plan.matchedResponseRuleIds.includes('R2024_SECONDARY_PERMISSION_HUG_DENY') &&
              secondaryPermission.selected.includes('DENY_PERMISSION') &&
              !secondaryPermission.selected.includes('GRANT_PERMISSION'),
            secondaryInviteBoundary:
              secondaryInviteBoundary.plan.matchedResponseRuleIds.includes('R2088_SECOND_HUG_INVITE_BOUNDARY') &&
              secondaryInviteBoundary.plan.suppressedMeaningIds.includes('ACCEPT_INVITATION') &&
              secondaryInviteBoundary.selected.includes('RESPECT_BOUNDARY') &&
              secondaryInviteBoundary.selected.includes('DECLINE_INVITATION') &&
              !secondaryInviteBoundary.selected.includes('ACCEPT_INVITATION'),
            secondaryClaimTruth:
              secondaryClaim.plan.matchedResponseRuleIds.includes('R2043_SECONDARY_CLAIM_BETRAY_FALSE') &&
              secondaryClaim.selected.includes('DENY_BETRAYAL') &&
              !secondaryClaim.selected.includes('ADMIT_BETRAYAL'),
            twoDirectAnswers:
              primarySecondaryDirect.selected.includes('STATE_CURRENT_LOCATION') &&
              primarySecondaryDirect.selected.includes('STATE_RETURN_TIME') &&
              primarySecondaryDirect.selected.indexOf('STATE_CURRENT_LOCATION') < primarySecondaryDirect.selected.indexOf('STATE_RETURN_TIME'),
            apologyConflict:apologyConflict.includes('DECLINE_FOR_NOW')&&!apologyConflict.includes('ACCEPT_APOLOGY'),
            contactConflict:contactConflict.includes('DECLINE_CONTACT')&&!contactConflict.includes('OFFER_CONTACT')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            checks,
            cases:{
              secondaryPrice:{meaningIds:secondaryPrice.plan.meaningIds,slots:secondaryPrice.plan.slotOverridesByMeaning,selected:secondaryPrice.selected,matched:secondaryPrice.plan.matchedResponseRuleIds},
              secondaryPermission:{meaningIds:secondaryPermission.plan.meaningIds,suppressed:secondaryPermission.plan.suppressedMeaningIds,selected:secondaryPermission.selected,matched:secondaryPermission.plan.matchedResponseRuleIds},
              secondaryInviteBoundary:{meaningIds:secondaryInviteBoundary.plan.meaningIds,suppressed:secondaryInviteBoundary.plan.suppressedMeaningIds,selected:secondaryInviteBoundary.selected,matched:secondaryInviteBoundary.plan.matchedResponseRuleIds},
              secondaryClaim:{meaningIds:secondaryClaim.plan.meaningIds,suppressed:secondaryClaim.plan.suppressedMeaningIds,selected:secondaryClaim.selected,matched:secondaryClaim.plan.matchedResponseRuleIds},
              primarySecondaryDirect:{meaningIds:primarySecondaryDirect.plan.meaningIds,selected:primarySecondaryDirect.selected,matched:primarySecondaryDirect.plan.matchedResponseRuleIds},
              apologyConflict,contactConflict
            }
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
