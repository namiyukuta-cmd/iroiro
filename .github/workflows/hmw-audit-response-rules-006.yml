name: Audit HMW response rules 006
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-006.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          [
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js',
            'HMW/js/dialogue/response-rules-001-social-emotion.js',
            'HMW/js/dialogue/response-rules-002-daily-relationship.js',
            'HMW/js/dialogue/response-rules-003-facts-policy-nuance.js',
            'HMW/js/dialogue/response-rules-004-claims-context.js',
            'HMW/js/dialogue/response-rules-005-actions-daily-repair.js',
            'HMW/js/dialogue/response-rules-006-exact-actions-questions.js',
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js'
          ].forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const meanings=D.MEANINGS||{};
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!meanings[id]))];

          const cases=[
            {
              name:'kiss_denied_touch_allowed',
              analysis:{intents:['ask_permission_action'],questions:[{kind:'permission',action:'kiss'}]},
              facts:{},policy:{permissions:{touch:true,kiss:false}},psych:{}
            },
            {
              name:'hug_request_only_hug',
              analysis:{intents:['request_action'],questions:[{kind:'request_action',action:'hug'}]},
              facts:{},policy:{requestResponses:{touch:true,hug:false,kiss:true}},psych:{}
            },
            {
              name:'enter_permission',
              analysis:{intents:['ask_permission_action'],questions:[{kind:'permission',action:'enter'}]},
              facts:{},policy:{permissions:{enter:true}},psych:{}
            },
            {
              name:'requested_name',
              analysis:{intents:['ask_identity'],questions:[{kind:'identity',requestedField:'name'}]},
              facts:{name:'Sam'},policy:{},psych:{}
            },
            {
              name:'love_claim_hurt',
              analysis:{focusConcepts:['love'],claims:[{concept:'love',type:'speaker_fear',polarity:false,certainty:'medium'}],emotions:{hurt:70}},
              facts:{lovesHeroine:true},policy:{},psych:{care:60}
            },
            {
              name:'fear_refusal',
              analysis:{intents:['refuse'],emotions:{fear:70}},
              facts:{},policy:{},psych:{}
            }
          ];

          const results=cases.map(c=>{
            const plan=D.planResponse({analysis:c.analysis,characterFacts:c.facts,characterPolicy:c.policy,psychology:c.psych});
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {name:c.name,meaningIds:plan.meaningIds,matchedRuleIds:plan.matchedResponseRuleIds,selected};
          });

          const checks={
            ruleCount:rules.length===600,
            uniqueRuleIds:new Set(ids).size===600,
            noMissingMeanings:missingMeaningIds.length===0,
            kissExact:results[0].meaningIds.includes('DENY_PERMISSION')&&!results[0].matchedRuleIds.includes('R221_PERMISSION_TOUCH_ALLOW'),
            hugExact:results[1].meaningIds.includes('DECLINE_ACTION_REQUEST')&&!results[1].matchedRuleIds.includes('R401_REQ_TOUCH_ALLOW')&&!results[1].matchedRuleIds.includes('R405_REQ_KISS_ALLOW'),
            enterPermission:results[2].meaningIds.includes('GRANT_PERMISSION')&&results[2].matchedRuleIds.includes('R501_PERMISSION_ENTER_ALLOW'),
            requestedName:results[3].meaningIds.includes('STATE_IDENTITY_NAME'),
            loveClaim:results[4].meaningIds.includes('AFFIRM_LOVE')&&!results[4].meaningIds.includes('DENY_LOVE'),
            refusal:results[5].meaningIds.includes('RESPECT_BOUNDARY')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            checks,
            results
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
