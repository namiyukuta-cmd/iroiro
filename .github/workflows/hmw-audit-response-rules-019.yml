name: Audit HMW response rules 019
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-019.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          const files=[
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js'
          ];
          for(let i=1;i<=19;i++){
            const n=String(i).padStart(3,'0');
            const found=fs.readdirSync(path.join(root,'HMW/js/dialogue'))
              .find(name=>name.startsWith('response-rules-'+n+'-')&&name.endsWith('.js'));
            if(!found) throw new Error('missing response rules file '+n);
            files.push('HMW/js/dialogue/'+found);
          }
          files.push(
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js',
            'HMW/js/dialogue/response-history.js',
            'HMW/js/dialogue/fact-slot-resolver.js'
          );
          files.forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!D.MEANINGS[id]))];

          const test=c=>{
            const plan=D.planResponse(c);
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {plan,selected,prioritized};
          };

          const multiQuestion=test({
            analysis:{
              intents:['ask_where','ask_relationship_status'],
              questions:[
                {kind:'where',requestedField:'currentLocation'},
                {kind:'relationship_status',requestedField:'relationshipStatus'}
              ]
            },
            characterFacts:{currentLocation:'Kyoto',relationshipStatus:'married'},
            characterPolicy:{},
            relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,flags:{}}
          });

          const primaryPermissionDenied=test({
            analysis:{
              intents:['ask_permission_action','ask_where'],
              questions:[
                {kind:'permission',action:'kiss'},
                {kind:'where',requestedField:'currentLocation'}
              ]
            },
            characterFacts:{currentLocation:'Kyoto'},
            characterPolicy:{permissions:{kiss:false}},
            relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,desire:80,conscience:80,malice:0,flags:{}},
            conversationContext:{privacy:'private'}
          });

          const multiClaim=test({
            analysis:{
              intents:['question_affection','fear_betrayal'],
              focusConcepts:['love','betrayal'],
              claims:[
                {concept:'love',type:'speaker_fear',polarity:false,certainty:'high'},
                {concept:'betrayal',type:'speaker_suspicion',polarity:true,certainty:'medium'}
              ]
            },
            characterFacts:{lovesHeroine:true,intendsBetrayal:false,loyalToHeroine:true},
            characterPolicy:{},
            relationship:{stage:'partner',familiarity:90,trust:85,goodwill:90,conscience:80,malice:0,flags:{}}
          });

          const primaryClaimOnly=test({
            analysis:{
              focusConcepts:['trust'],
              claims:[
                {concept:'trust',type:'speaker_suspicion',polarity:false,certainty:'high'}
              ]
            },
            characterFacts:{trustsHeroine:true},
            characterPolicy:{},
            relationship:{stage:'friend',familiarity:70,trust:70,goodwill:70,flags:{}}
          });

          const singleQuestion=test({
            analysis:{intents:['ask_where'],questions:[{kind:'where',requestedField:'currentLocation'}]},
            characterFacts:{currentLocation:'Osaka'},
            characterPolicy:{},
            relationship:{stage:'friend',familiarity:70,trust:70,goodwill:70,flags:{}}
          });

          const boundaryMultiClaim=test({
            analysis:{
              intents:['request_contact'],
              boundaries:['do_not_contact'],
              claims:[
                {concept:'contact',type:'boundary',polarity:false,certainty:'explicit'},
                {concept:'relationship',type:'speaker_fear',polarity:true,certainty:'medium'}
              ]
            },
            characterFacts:{},
            characterPolicy:{allowContact:true},
            relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,flags:{}}
          });

          const checks={
            ruleCount:rules.length===1900,
            uniqueRuleIds:new Set(ids).size===1900,
            noMissingMeanings:missingMeaningIds.length===0,
            multiPrimaryWhere:
              multiQuestion.plan.matchedResponseRuleIds.includes('R1841_MULTI_PRIMARY_WHERE') &&
              multiQuestion.selected.includes('STATE_CURRENT_LOCATION') &&
              multiQuestion.selected.indexOf('STATE_CURRENT_LOCATION') <= multiQuestion.selected.indexOf('STATE_RELATIONSHIP_STATUS'),
            primaryPermissionDenied:
              primaryPermissionDenied.plan.matchedResponseRuleIds.includes('R1825_PRIMARY_PERMISSION_KISS_DENY') &&
              primaryPermissionDenied.plan.suppressedMeaningIds.includes('GRANT_PERMISSION') &&
              !primaryPermissionDenied.plan.meaningIds.includes('GRANT_PERMISSION') &&
              primaryPermissionDenied.selected.includes('DENY_PERMISSION'),
            multiClaimTruth:
              multiClaim.plan.matchedResponseRuleIds.includes('R1881_MULTI_PRIMARY_LOVE_BETRAY') &&
              multiClaim.plan.meaningIds.includes('AFFIRM_LOVE') &&
              multiClaim.plan.meaningIds.includes('DENY_BETRAYAL') &&
              !multiClaim.plan.meaningIds.includes('DENY_LOVE') &&
              !multiClaim.plan.meaningIds.includes('ADMIT_BETRAYAL'),
            primaryClaim:
              primaryClaimOnly.plan.matchedResponseRuleIds.includes('R1866_PRIMARY_TRUST_TRUE') &&
              primaryClaimOnly.plan.meaningIds.includes('CONFIRM_TRUST'),
            singleNoMultiLeak:
              !singleQuestion.plan.matchedResponseRuleIds.some(id=>/^R18(4|5)[1-9]_/.test(id)),
            boundaryMultiClaim:
              boundaryMultiClaim.plan.matchedResponseRuleIds.includes('R1900_MULTI_BOUNDARY_FINAL') &&
              boundaryMultiClaim.selected.includes('RESPECT_BOUNDARY') &&
              !boundaryMultiClaim.selected.includes('ACCEPT_CONTACT')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            checks,
            cases:{
              multiQuestion:{meaningIds:multiQuestion.plan.meaningIds,selected:multiQuestion.selected,matched:multiQuestion.plan.matchedResponseRuleIds},
              primaryPermissionDenied:{meaningIds:primaryPermissionDenied.plan.meaningIds,suppressed:primaryPermissionDenied.plan.suppressedMeaningIds,selected:primaryPermissionDenied.selected,matched:primaryPermissionDenied.plan.matchedResponseRuleIds},
              multiClaim:{meaningIds:multiClaim.plan.meaningIds,suppressed:multiClaim.plan.suppressedMeaningIds,selected:multiClaim.selected,matched:multiClaim.plan.matchedResponseRuleIds},
              primaryClaimOnly:{meaningIds:primaryClaimOnly.plan.meaningIds,selected:primaryClaimOnly.selected,matched:primaryClaimOnly.plan.matchedResponseRuleIds},
              singleQuestion:{meaningIds:singleQuestion.plan.meaningIds,selected:singleQuestion.selected,matched:singleQuestion.plan.matchedResponseRuleIds},
              boundaryMultiClaim:{meaningIds:boundaryMultiClaim.plan.meaningIds,selected:boundaryMultiClaim.selected,matched:boundaryMultiClaim.plan.matchedResponseRuleIds}
            }
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
