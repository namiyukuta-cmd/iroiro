name: Audit HMW response rules 001
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-001.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          [
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js',
            'HMW/js/dialogue/response-rules-001-social-emotion.js',
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js'
          ].forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const meanings=D.MEANINGS||{};
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!meanings[id]))];

          const cases=[
            {
              name:'friendly_intro',
              analysis:{intents:['greet'],tone:{friendliness:85,positivity:80,style:'friendly'},emotions:{joy:45}},
              facts:{name:'Sam'},policy:{},psych:{}
            },
            {
              name:'okay_bright',
              analysis:{intents:['report_condition'],focusConcepts:['health'],tone:{positivity:85,hesitation:10,style:'warm'},emotions:{relief:60}},
              facts:{},policy:{},psych:{}
            },
            {
              name:'okay_hesitant',
              analysis:{intents:['report_condition'],focusConcepts:['health'],tone:{positivity:55,hesitation:55,style:'neutral'},emotions:{anxiety:20}},
              facts:{},policy:{},psych:{}
            },
            {
              name:'okay_subdued',
              analysis:{intents:['report_condition'],focusConcepts:['health'],tone:{positivity:25,hesitation:90,style:'subdued'},emotions:{sadness:30}},
              facts:{},policy:{},psych:{}
            },
            {
              name:'affection_question_true',
              analysis:{intents:['question_affection'],focusConcepts:['love'],claims:[{concept:'love',type:'speaker_fear',polarity:false,certainty:'medium'}]},
              facts:{lovesHeroine:true,choosesHeroine:true},policy:{},psych:{care:70}
            },
            {
              name:'boundary_no_touch',
              analysis:{boundaries:['do_not_touch'],intents:['refuse']},
              facts:{},policy:{},psych:{}
            }
          ];

          const results=cases.map(c=>{
            const plan=D.planResponse({analysis:c.analysis,characterFacts:c.facts,characterPolicy:c.policy,psychology:c.psych});
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {name:c.name,meaningIds:plan.meaningIds,matchedRuleIds:plan.matchedResponseRuleIds,selected};
          });

          const checks={
            ruleCount:rules.length===100,
            missingMeaningIds:missingMeaningIds.length===0,
            friendly:results[0].meaningIds.includes('RETURN_GREETING'),
            bright:results[1].meaningIds.includes('EXPRESS_RELIEF')&&!results[1].meaningIds.includes('ASK_IF_OKAY'),
            hesitant:results[2].meaningIds.includes('EXPRESS_CONCERN'),
            subdued:results[3].meaningIds.includes('ASK_IF_OKAY'),
            affection:results[4].meaningIds.includes('AFFIRM_LOVE')&&!results[4].meaningIds.includes('DENY_LOVE'),
            boundary:results[5].meaningIds.includes('RESPECT_BOUNDARY')&&results[5].meaningIds.includes('PROMISE_NOT_TOUCH')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({ruleCount:rules.length,missingMeaningIds,checks,results}));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE

# rerun refined health handling
