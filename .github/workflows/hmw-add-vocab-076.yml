name: Add HMW vocabulary 076
on:
  push:
    paths:
      - '.github/workflows/hmw-add-vocab-076.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 200 unique entries and commit
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm'),cp=require('child_process');
          const lang=path.join(process.cwd(),'HMW/js/dialogue/language');
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=f=>vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:path.basename(f)});
          run(path.join(lang,'vocabulary-registry.js'));
          const files=fs.readdirSync(lang).filter(f=>{const m=f.match(/^vocabulary-(\d{3}).*\.js$/);return m&&Number(m[1])>=1&&Number(m[1])<=75}).sort((a,b)=>Number(a.match(/(\d{3})/)[1])-Number(b.match(/(\d{3})/)[1]));
          for(const f of files)run(path.join(lang,f));
          const V=ctx.HMW.Dialogue.Vocabulary;
          const groups={
            verb:["whisper","murmur","mutter","babble","ramble","chat","converse","utter","declare","announce","state","remark","comment","respond","reply","answer","question","inquire","wonder","ask","exclaim","yell","shout","scream","whine","groan","moan","sob","giggle","chuckle","snicker","grin","smirk","frown","glare","stare","gaze","peek","peer","blink","wink","nod","bow","shrug","gesture","point","beckon","signal","motion","wave","salute","applaud","clap","cheer","hesitate","pause","resume","interrupt","overhear","mishear","misread","misunderstand","rephrase","paraphrase","quote","cite","spell","pronounce","articulate","emphasize","stress","imply","infer","deduce","interpret","translate","summarize","clarify","elaborate","describe","define","distinguish","compare","contrast","classify","categorize","analyze","evaluate","assess","inspect","review","verify","validate","confirm","deny","admit","acknowledge","claim","assert","insist","object","oppose","protest","argue","debate","negotiate","bargain","compromise","persuade","convince","assure","reassure","encourage","discourage","praise","compliment","criticize","insult","blame","accuse","forgive","excuse","tolerate","trust","distrust","suspect","doubt","reconsider","rethink","prioritize","coordinate","delegate","assign","assist","collaborate","cooperate","participate","attend","escort","accompany","reunite","reconnect","linger","stroll","pace","stride","creep","tiptoe","crouch","duck","dodge","stumble","slip","sprint","jog","hop","skip","bounce","spin","twirl","grip","clench","pinch","poke","nudge","pat","stroke","scrape","twist","rotate","stack","pile","scoop","sprinkle","knead","gulp","sip","spit","drool","snore","hiccup","burp","hum","chant","exhale","inhale","refill","drain","soak","rinse","wipe","wrap","unwrap","seal","unseal","fasten","unfasten","loosen","tighten","rearrange","discard","restart","reset","scan","browse","scroll","click"],
            noun:["ambiguity","nuance","implication","inference","assumption","interpretation","perspective","viewpoint","emphasis","sarcasm","irony","metaphor","idiom","slang","jargon","dialect","accent","nickname","surname","quotation","caption","subtitle","headline","brochure","catalog","checklist","footnote","bookmark","punctuation","comma","period","colon","semicolon","apostrophe","hyphen","dash","parenthesis","bracket","listener","speaker","sender","receiver","participant","coordinator","observer","witness","audience","reader","writer","author","editor","translator","interpreter","conversation","dialogue","debate","argument","remark","comment","statement","claim","assertion","denial","refusal","consent","permission","restriction","exception","alternative","outcome","circumstance","clue","hint","impression","reaction","gesture","posture","expression","glance","stare","silence","echo","rhythm","pace","reluctance","willingness","discomfort","distrust","empathy","generosity","hostility","disbelief","urgency","priority","teamwork","collaboration","errand","chore","reassurance","negotiation","compromise","reconciliation","apology","forgiveness","gratitude","resentment","sympathy","insecurity","hesitation","annoyance","frustration","boredom","sorrow","delight","courage","patience","boundary","obligation","authorization","responsibility","notification","reminder","deadline","appointment","summary","pronunciation","grammar","context","reference","definition","meaning","logic","method","process","strategy","probability","certainty","uncertainty","necessity","requirement","consequence","cause","effect","improvement","skill","ability","doorstep","doorbell","doormat","windowsill","railing","stairwell","outlet","socket","plug","cord","bulb","remote","toolbox","workbench","eyelid","jaw","waist","spine","thumb","toe","knuckle","thigh","calf","belly","mustard","ketchup","mayonnaise","ginger","cinnamon","vanilla","shortcut","detour","crosswalk","curb","escalator","voucher","pouch","notepad"],
            adjective:["ambiguous","explicit","implicit","precise","vague","sarcastic","ironic","literal","figurative","rational","irrational","authentic","genuine","deliberate","accidental","mutual","tense","hesitant","reluctant","eager","supportive","cooperative","hostile","aggressive","forgiving","apologetic","respectful","disrespectful","trusting","suspicious","sincere","unclear","irrelevant","unreasonable","illogical","mandatory","irresponsible","ongoing","pending","repeated","continuous","verbal","nonverbal","spoken","written","audible","inaudible","visible","invisible","noticeable","subtle","obvious","formal","informal","casual","serious","playful","friendly","unfriendly","polite","impolite","patient","impatient","generous","selfish","loyal","disloyal","faithful","unfaithful","confusing","understandable","readable","unreadable","specific","general","approximate","exact","complete","incomplete","related","unrelated","preventable","avoidable","unavoidable","resolved","unresolved","appropriate","inappropriate","acceptable","unacceptable","permitted","prohibited","restricted","unrestricted","secure","unprotected","protected","occupied","vacant","furnished","unfurnished","portable","wireless","digital","electronic"],
            adverb:["sarcastically","ironically","literally","figuratively","precisely","vaguely","secretly","hesitantly","jointly","mutually","deliberately","accidentally","sincerely","respectfully","reluctantly","eagerly","confidently","firmly","briefly","indirectly","casually","informally","roughly","fully","barely","partially","visibly","audibly","silently","patiently","impatiently","faithfully","playfully","carelessly","responsibly","strictly","freely","optionally","urgently","steadily","weakly","strongly","locally","remotely","internationally","professionally","socially","emotionally","physically","mentally","openly","privately","publicly","naturally","logically","incorrectly","accurately","repeatedly","continuously","initially","eventually","temporarily","permanently","ambiguously","explicitly","implicitly","rationally","irrationally","authentically","genuinely","mutually","tensely","supportively","cooperatively","aggressively","forgivingly","apologetically","suspiciously","sincerely","relevantly","reasonably","unreasonably","logically","illegally","mandatorily","irresponsibly","verbally","nonverbally","noticeably","subtly","formally","informally","playfully","friendly","politely","impolitely","generously","selfishly","loyally","unfaithfully","confusingly","specifically","approximately","completely","incompletely","appropriately","inappropriately","acceptably","unacceptably","securely","portably","digitally","electronically","visually","verbally","quietly","calmly","angrily","sadly","happily","warmly","coldly","softly","sharply","smoothly","roughly","deeply","lightly","heavily","quickly","slowly","closely","widely","narrowly","highly","lowly","openly","secretly","publicly","privately","socially","professionally","personally","emotionally","mentally","physically","carefully","carelessly","correctly","incorrectly","accurately","inaccurately","directly","indirectly","frequently","occasionally","rarely","regularly","constantly","gradually","suddenly","recently","previously","currently","later","soon","today","tonight","tomorrow","yesterday"]
          };
          const chosen=[];
          for(const [pos,lemmas] of Object.entries(groups)){
            for(const raw of lemmas){
              const lemma=String(raw).toLowerCase();
              const key=lemma+":"+pos;
              if(!V.byKey[key]&&!chosen.some(e=>e.lemma===lemma&&e.pos===pos)){
                chosen.push({lemma,pos,tags:["conversation","expression","reasoning","interaction","batch076"]});
                if(chosen.length===200) break;
              }
            }
            if(chosen.length===200) break;
          }
          if(chosen.length<200) throw new Error("Only "+chosen.length+" unique candidates available");
          const byPos={};for(const e of chosen)(byPos[e.pos]||(byPos[e.pos]=[])).push(e.lemma);
          const lines=[
            '(() => {','  "use strict";',
            '  const V = window.HMW?.Dialogue?.Vocabulary;',
            '  if (!V) throw new Error("Vocabulary registry must load first.");','',
            '  // Conversation expression, reasoning and interaction vocabulary.',
            '  const words = '+JSON.stringify(byPos,null,4).replace(/^/gm,'  ')+';','',
            '  const entries = [];',
            '  for (const [pos, lemmas] of Object.entries(words)) {',
            '    for (const lemma of lemmas) {',
            '      entries.push({ lemma, pos, tags: ["conversation","expression","reasoning","interaction","batch076"] });',
            '    }','  }','',
            '  V.register(entries);','})();',''
          ];
          const out=path.join(lang,'vocabulary-076-conversation-expression.js');
          fs.writeFileSync(out,lines.join('\n'));
          for(const e of chosen)V.register([e]);
          const result={added:chosen.length,uniqueAfter:V.entries.length,remainingTo5000:Math.max(0,5000-V.entries.length),byPos:Object.fromEntries(Object.entries(byPos).map(([k,v])=>[k,v.length]))};
          console.log('AUDIT_RESULT '+JSON.stringify(result));
          cp.execSync('git config user.name "github-actions[bot]"');
          cp.execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
          cp.execSync('git add HMW/js/dialogue/language/vocabulary-076-conversation-expression.js');
          cp.execSync('git commit -m "Add vocabulary batch 076"');
          cp.execSync('git push');
          NODE
