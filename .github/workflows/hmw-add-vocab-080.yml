name: Add HMW vocabulary 080
on:
  push:
    paths:
      - '.github/workflows/hmw-add-vocab-080.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 200 unique entries and commit
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm'),cp=require('child_process');
          const lang=path.join(process.cwd(),'HMW/js/dialogue/language');
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=f=>vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:path.basename(f)});
          run(path.join(lang,'vocabulary-registry.js'));
          const files=fs.readdirSync(lang).filter(f=>{const m=f.match(/^vocabulary-(\d{3}).*\.js$/);return m&&Number(m[1])>=1&&Number(m[1])<=79}).sort((a,b)=>Number(a.match(/(\d{3})/)[1])-Number(b.match(/(\d{3})/)[1]));
          for(const f of files)run(path.join(lang,f));
          const V=ctx.HMW.Dialogue.Vocabulary;

          const groups={
            verb:["abbreviate","absorb","accelerate","accommodate","accumulate","activate","adapt","administer","advocate","align","amplify","annotate","archive","assemble","automate","balance","bookmark","broadcast","calculate","calibrate","capture","categorize","compress","configure","conserve","consolidate","construct","customize","decode","decrease","demonstrate","detach","differentiate","disable","distribute","document","edit","enable","encode","evaluate","export","extract","facilitate","format","forward","generate","highlight","illustrate","import","index","initialize","integrate","label","locate","maximize","minimize","moderate","modify","optimize","organize","parse","preview","prioritize","process","publish","reboot","recharge","record","redirect","refresh","rename","reorganize","restore","retrieve","revise","scan","schedule","simplify","sort","synchronize","transcribe","transform","update","validate","visualize","archive","backup","browse","cache","capture","compile","convert","filter","link","merge","monitor","navigate","notify","pin","print","reconnect","restart","save","search","select","share","store","stream","submit","tag","upload","verify","zoom","calm","console","comfort","encourage","reassure","mediate","reconcile","clarify","summarize","confirm","acknowledge","persuade","recommend","advise","suggest","request","decline","accept","approve","reject","authorize","permit","prohibit","restrict","resolve","settle","negotiate","compromise","cooperate","collaborate","participate","observe","notice","recognize","recall","memorize","interpret","infer","deduce","estimate","predict","anticipate","compare","contrast"],
            noun:["adapter","algorithm","annotation","archive","attachment","backup","bandwidth","browser","cache","caption","category","clipboard","configuration","cursor","database","directory","display","document","download","extension","filename","filter","firmware","folder","format","homepage","hotspot","hyperlink","icon","index","interface","keyword","layout","login","logout","menu","network","notification","password","platform","popup","profile","query","record","router","scanner","server","session","setting","sidebar","software","storage","stream","subscription","sync","template","toolbar","touchscreen","upload","username","version","webcam","webpage","wifi","worksheet","dashboard","dataset","diagram","formula","spreadsheet","cell","column","row","table","chart","graph","report","summary","history","revision","draft","copy","original","comment","highlight","bookmark","log","status","update","alert","account","access","security","privacy","compatibility","usability","accessibility","coverage","signal","connection","outage","recovery","battery","charging","connector","panel","processor","memory","device","application","program","system","feature","function","setting","preference","shortcut","command","input","output","feedback","response","instruction","procedure","guideline","policy","standard","criterion","indicator","measurement","estimate","prediction","forecast","hypothesis","framework","structure","sequence","dependency","constraint","limitation","capacity","inventory","shortage","surplus","supplies","equipment","inspection","installation","replacement","maintenance","operation","authorization","approval","rejection","appeal","dispute","settlement","commitment","obligation","ownership","membership","partnership","workload","overtime","attendance","milestone","completion","productivity","performance","supervision","orientation","assignment","vacancy","qualification","recruitment","resignation","retirement","promotion","leadership","management","initiative","motivation","maturity","stability","reliability","efficiency","flexibility","transparency","accountability","credibility","confidentiality","hospitality","friendliness","thoughtfulness","resourcefulness","persistence","sincerity","tolerance","trustworthiness","assertiveness","neutrality","objectivity","specificity","brevity","coherence","fluency","intonation","phrasing","wording","understatement","overstatement","miscommunication","misinterpretation","misreading","mishearing","elaboration","acknowledgment","assessment","evaluation","classification","comparison","contrast","likelihood","uncertainty","principle","concept","context","factor","source","evidence","outcome","circumstance","exception","violation","responsibility","permission","requirement","condition","consequence","priority","availability","readiness","convenience","inconvenience","adaptability","suitability","vulnerability","affordability","dependability","openness","optimism","enthusiasm","dedication","cooperation","coordination","fairness","modesty","sensitivity","seriousness","abacus","accordion","adhesive","airbag","airfare","airmail","alleyway","antibiotic","antiseptic","armrest","ashtray","awning","backache","badge","barbecue","barometer","bathmat","bathrobe","beehive","binoculars","blackboard","blister","bookcase","booklet","bottlecap","brace","briefcase","buckle","bulletin","calculator","canister","cardboard","cashpoint","casserole","cellphone","choppingboard","clothesline","clothespin","coathanger","corkscrew","crate","crowbar","cutlery","dashboard","deodorant","doorknob","earphones","earplug","eyedrops","facecloth","flashdrive","floorboard","flowerpot","footrest","fryingpan","garagedoor","garbagebag","hairbrush","hairdryer","handrail","hanger","headboard","headlamp","headphones","icepack","inkpad","keyhole","keyring","lampshade","laundrybasket","laundryroom","lawnmower","letterbox","lightshade","lunchbox","measuringcup","measuringspoon","microwaveoven","nightstand","notebook","ovenmitt","paperclip","paperwork","peeler","penknife","peppermill","pictureframe","placemat","plaster","powerbank","powerstrip","raincoat","razorblade","recyclebin","rollingpin","rubberband","saucepan","scotch","shoelace","showercurtain","showerhead","sinkhole","soapdish","spatula","spraybottle","stapler","straw","sunglasses","teapot","thermos","toiletpaper","toothpick","trashbag","trashcan","umbrella","vacuumcleaner","wallpaper","washcloth","washingmachine","wastebasket","waterheater","wateringcan","wheelbarrow","windowframe","windscreen","worktop","ziplock","abbreviation","acronym","adjective","adverb","alphabet","antonym","apostrophe","bracket","bulletpoint","capitalization","colon","comma","conjunction","consonant","determiner","ellipsis","exclamation","hyphen","noun","parenthesis","prefix","preposition","pronoun","semicolon","suffix","syllable","synonym","verb","vowel","accentuation","articulation","inflection","punctuation","syntax","tense","utterance","collocation","proverb","saying","expression","register","formality","dialect","slang","jargon","terminology","paraphrase","transcript","subtitle","caption","headline","footnote","appendix","glossary","bibliography","citation","referencebook","textbook","workbook","handbook","manual","pamphlet","leaflet","poster","noticeboard","whiteboard","clipboard","highlighter","marker","eraser","sharpener","binder","notepad","envelope","postcard","parcel","package","label","sticker","receipt","invoice","voucher","coupon","warranty","guarantee","barcode","cashregister","shoppingcart","shoppingbag","fittingroom","storeroom","warehouse","showroom","workshop","receptiondesk","waitingroom","canteen","cafeteria","restroom","cloakroom","lounge","lobby","corridor","passageway","doorway","staircase","handrail","escalator","elevator","platform","turnstile","ticketmachine","ticketoffice","timetable","departureboard","baggageclaim","boardingpass","seatbelt","headrest","armrest","aisle","carriage","compartment","locomotive","ferry","tram","minibus","shuttle","scooter","motorbike","pedestrian","cyclist","motorist","commuter","traveler","tourist","guidebook","souvenir","campsite","campground","guesthouse","boardinghouse","lodger","roommate","housemate","caretaker","housekeeper","doorman","concierge","receptionist","porter","courier","messenger","dispatcher","operator","technician","repairman","handyman","craftsman","apprentice","supervisor","foreman","contractor","consultant","advisor","recruiter","trainee","intern","freelancer","vendor","merchant","retailer","wholesaler","supplier","client","consumer","subscriber","member","resident","tenant","landlord","borrower","lender","debtor","creditor","applicant","candidate","employee","employer","colleague","coworker","teammate","classmate","neighbor","acquaintance"],
            adjective:["accountable","adaptable","adequate","alert","appreciative","assertive","automated","available","capable","compatible","confidential","configurable","convenient","credible","customizable","dependable","digital","disabled","downloadable","editable","efficient","enabled","encrypted","flexible","fluent","hospitable","inactive","interactive","mature","motivated","offline","online","optimistic","portable","printable","private","public","punctual","rechargeable","recyclable","reliable","responsive","searchable","secure","selectable","shared","stable","stationary","subscribed","suitable","transparent","unavailable","unblocked","unencrypted","unfurnished","unmuted","unpinned","unrestricted","unsubscribed","updated","uploadable","usable","visible","vulnerable","wireless","accessible","inaccessible","affordable","unaffordable","accurate","inaccurate","coherent","incoherent","consistent","inconsistent","objective","subjective","neutral","biased","specific","general","brief","lengthy","concise","detailed","explicit","implicit","plausible","implausible","logical","illogical","relevant","irrelevant","valid","invalid","decisive","indecisive","attentive","distracted","focused","dismissive","receptive","persuasive","convincing","unconvincing","credible","dubious","formal","informal","spoken","written","verbal","nonverbal","literal","figurative","rhetorical","contextual","semantic","grammatical","idiomatic","analytical","comparative","descriptive","tactful","tactless","considerate","inconsiderate","empathetic","sympathetic","compassionate","supportive","cooperative","hostile","aggressive","forgiving","apologetic","trusting","suspicious","sincere","frank","reserved","outspoken","patient","impatient","tolerant","intolerant","responsible","irresponsible","prepared","unprepared","resolved","unresolved","preventable","unavoidable","voluntary","involuntary","intentional","unintentional","spontaneous","steady","subtle","obvious"],
            adverb:["adequately","appreciatively","assertively","automatically","confidentially","conveniently","credibly","dependably","digitally","efficiently","flexibly","fluently","hospitably","interactively","optimistically","punctually","reliably","responsively","securely","transparently","wirelessly","accessibly","affordably","accurately","inaccurately","coherently","incoherently","consistently","inconsistently","objectively","subjectively","neutrally","specifically","generally","briefly","concisely","explicitly","implicitly","plausibly","logically","illogically","relevantly","validly","decisively","indecisively","attentively","dismissively","receptively","persuasively","convincingly","formally","informally","verbally","literally","figuratively","rhetorically","contextually","semantically","grammatically","analytically","comparatively","descriptively","tactfully","thoughtfully","empathetically","sympathetically","compassionately","supportively","cooperatively","aggressively","forgivingly","apologetically","trustfully","suspiciously","sincerely","frankly","patiently","impatiently","responsibly","irresponsibly","voluntarily","involuntarily","intentionally","unintentionally","spontaneously","steadily","subtly","obviously","openly","privately","publicly","professionally","socially","emotionally","mentally","physically","carefully","carelessly","quickly","slowly","smoothly","roughly","deeply","lightly","heavily","widely","narrowly","highly","closely","regularly","occasionally","frequently","rarely","constantly","temporarily","permanently","currently","recently","previously","eventually","gradually","immediately"]
          };

          const chosen=[];
          for(const [pos,lemmas] of Object.entries(groups)){
            for(const raw of lemmas){
              const lemma=String(raw).toLowerCase();
              const key=lemma+":"+pos;
              if(!V.byKey[key]&&!chosen.some(e=>e.lemma===lemma&&e.pos===pos)){
                chosen.push({lemma,pos,tags:["conversation","general","practical","technology","reasoning","batch080"]});
                if(chosen.length===200) break;
              }
            }
            if(chosen.length===200) break;
          }
          if(chosen.length<200) throw new Error("Only "+chosen.length+" unique candidates available");
          const byPos={};for(const e of chosen)(byPos[e.pos]||(byPos[e.pos]=[])).push(e.lemma);
          const lines=[
            '(() => {','  "use strict";',
            '  const V = window.HMW?.Dialogue?.Vocabulary;',
            '  if (!V) throw new Error("Vocabulary registry must load first.");','',
            '  // General practical, communication, technology and reasoning vocabulary.',
            '  const words = '+JSON.stringify(byPos,null,4).replace(/^/gm,'  ')+';','',
            '  const entries = [];',
            '  for (const [pos, lemmas] of Object.entries(words)) {',
            '    for (const lemma of lemmas) {',
            '      entries.push({ lemma, pos, tags: ["conversation","general","practical","technology","reasoning","batch080"] });',
            '    }','  }','',
            '  V.register(entries);','})();',''
          ];
          const out=path.join(lang,'vocabulary-080-general-practical.js');
          fs.writeFileSync(out,lines.join('\n'));
          for(const e of chosen)V.register([e]);
          const result={added:chosen.length,uniqueAfter:V.entries.length,remainingTo5000:Math.max(0,5000-V.entries.length),byPos:Object.fromEntries(Object.entries(byPos).map(([k,v])=>[k,v.length]))};
          console.log('AUDIT_RESULT '+JSON.stringify(result));
          cp.execSync('git config user.name "github-actions[bot]"');
          cp.execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
          cp.execSync('git add HMW/js/dialogue/language/vocabulary-080-general-practical.js');
          cp.execSync('git commit -m "Add vocabulary batch 080"');
          cp.execSync('git push');
          NODE
