name: Audit HMW response rules 023
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-023.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          const files=[
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js'
          ];
          for(let i=1;i<=23;i++){
            const n=String(i).padStart(3,'0');
            const found=fs.readdirSync(path.join(root,'HMW/js/dialogue'))
              .find(name=>name.startsWith('response-rules-'+n+'-')&&name.endsWith('.js'));
            if(!found) throw new Error('missing response rules file '+n);
            files.push('HMW/js/dialogue/'+found);
          }
          files.push(
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js',
            'HMW/js/dialogue/response-history.js'
          );
          files.forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!D.MEANINGS[id]))];

          const test=c=>{
            const plan=D.planResponse(c);
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{
              boundaryActive:plan.boundaryActive,
              maxMeanings:5,
              preferredMeaningIds:plan.preferredMeaningIds||[]
            });
            return {plan,selected};
          };

          const fiveQuestions=test({
            analysis:{
              intents:['ask_where','ask_when','ask_relationship_status','ask_plan','ask_permission_action'],
              questions:[
                {kind:'where',requestedField:'currentLocation'},
                {kind:'when',requestedField:'returnTime'},
                {kind:'relationship_status',requestedField:'relationshipStatus'},
                {kind:'plan',requestedField:'currentPlan'},
                {kind:'permission',action:'kiss'}
              ]
            },
            characterFacts:{
              currentLocation:'Tokyo',
              returnTime:'21:00',
              relationshipStatus:'married',
              currentPlan:{verb:'work',object:'tonight',time:''}
            },
            characterPolicy:{permissions:{kiss:false}},
            relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,desire:80,conscience:80,malice:0,flags:{}}
          });

          const fifthBoundary=test({
            analysis:{
              intents:['ask_where','ask_when','ask_relationship_status','ask_plan','invite_action'],
              questions:[
                {kind:'where',requestedField:'currentLocation'},
                {kind:'when',requestedField:'returnTime'},
                {kind:'relationship_status',requestedField:'relationshipStatus'},
                {kind:'plan',requestedField:'currentPlan'},
                {kind:'invitation',action:'visit'}
              ],
              boundaries:['do_not_visit']
            },
            characterFacts:{
              currentLocation:'Kyoto',
              returnTime:'20:00',
              relationshipStatus:'partners',
              currentPlan:{verb:'rest',object:'home',time:''}
            },
            characterPolicy:{invitationResponses:{visit:true}},
            relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,flags:{}}
          });

          const fiveClaims=test({
            analysis:{
              focusConcepts:['love','relationship','return','trust','betrayal'],
              claims:[
                {concept:'love',type:'speaker_fear',polarity:false,certainty:'medium'},
                {concept:'relationship',type:'speaker_fear',polarity:true,certainty:'medium'},
                {concept:'return',type:'speaker_fear',polarity:false,certainty:'medium'},
                {concept:'trust',type:'speaker_suspicion',polarity:false,certainty:'high'},
                {concept:'betrayal',type:'accusation',polarity:true,certainty:'high'}
              ]
            },
            characterFacts:{
              lovesHeroine:true,
              willReturn:true,
              trustsHeroine:true,
              intendsBetrayal:false,
              loyalToHeroine:true
            },
            characterPolicy:{},
            relationship:{stage:'partner',familiarity:90,trust:80,goodwill:90,conscience:80,malice:0,flags:{}}
          });

          const fourQuestions=test({
            analysis:{
              questions:[
                {kind:'where',requestedField:'currentLocation'},
                {kind:'when',requestedField:'returnTime'},
                {kind:'relationship_status',requestedField:'relationshipStatus'},
                {kind:'plan',requestedField:'currentPlan'}
              ]
            },
            characterFacts:{
              currentLocation:'Osaka',
              returnTime:'19:00',
              relationshipStatus:'friends',
              currentPlan:{verb:'eat',object:'dinner',time:''}
            },
            relationship:{stage:'friend',familiarity:70,trust:70,goodwill:70,flags:{}}
          });

          const oldOverflow=test({
            analysis:{
              focusConcepts:['love','trust','betrayal'],
              claims:[
                {concept:'love',type:'speaker_fear',polarity:false,certainty:'medium'},
                {concept:'trust',type:'speaker_suspicion',polarity:false,certainty:'high'},
                {concept:'betrayal',type:'accusation',polarity:true,certainty:'high'}
              ]
            },
            characterFacts:{lovesHeroine:true,trustsHeroine:true,intendsBetrayal:false,loyalToHeroine:true},
            relationship:{stage:'partner',familiarity:90,trust:80,goodwill:90,flags:{}}
          });

          const checks={
            ruleCount:rules.length===2300,
            uniqueRuleIds:new Set(ids).size===2300,
            noMissingMeanings:missingMeaningIds.length===0,
            fiveQuestionOrder:
              fiveQuestions.plan.matchedResponseRuleIds.includes('R2206_Q4_PLAN') &&
              fiveQuestions.plan.matchedResponseRuleIds.includes('R2254_Q5_PERMISSION_KISS_DENY') &&
              fiveQuestions.selected.length===5 &&
              fiveQuestions.selected[0]==='STATE_CURRENT_LOCATION' &&
              fiveQuestions.selected[1]==='STATE_RETURN_TIME' &&
              fiveQuestions.selected[2]==='STATE_RELATIONSHIP_STATUS' &&
              fiveQuestions.selected[3]==='STATE_CURRENT_PLAN' &&
              fiveQuestions.selected[4]==='DENY_PERMISSION',
            fifthBoundary:
              fifthBoundary.plan.matchedResponseRuleIds.includes('R2298_Q5_INVITE_VISIT_BOUNDARY') &&
              fifthBoundary.plan.suppressedMeaningIds.includes('ACCEPT_INVITATION') &&
              fifthBoundary.selected[0]==='RESPECT_BOUNDARY' &&
              fifthBoundary.selected.includes('DECLINE_INVITATION') &&
              !fifthBoundary.selected.includes('ACCEPT_INVITATION') &&
              fifthBoundary.selected.length===5,
            deepClaims:
              fiveClaims.plan.matchedResponseRuleIds.includes('R2265_C4_TRUST_TRUE') &&
              fiveClaims.plan.matchedResponseRuleIds.includes('R2273_C5_BETRAY_FALSE') &&
              fiveClaims.selected.includes('CONFIRM_TRUST') &&
              fiveClaims.selected.includes('DENY_BETRAYAL') &&
              !fiveClaims.selected.includes('ADMIT_BETRAYAL') &&
              fiveClaims.selected.length<=5,
            noFifthLeak:
              !fourQuestions.plan.matchedResponseRuleIds.some(id=>
                /^R22(?:2[1-9]|3[0-9]|40|5[1-9]|60|7[1-9]|80|9[1-9]|300)_Q5_/.test(id)
              ),
            hardMaxMeanings:oldOverflow.selected.length<=5
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            checks,
            cases:{
              fiveQuestions:{meaningIds:fiveQuestions.plan.meaningIds,preferred:fiveQuestions.plan.preferredMeaningIds,selected:fiveQuestions.selected,matched:fiveQuestions.plan.matchedResponseRuleIds},
              fifthBoundary:{meaningIds:fifthBoundary.plan.meaningIds,suppressed:fifthBoundary.plan.suppressedMeaningIds,preferred:fifthBoundary.plan.preferredMeaningIds,selected:fifthBoundary.selected,matched:fifthBoundary.plan.matchedResponseRuleIds},
              fiveClaims:{meaningIds:fiveClaims.plan.meaningIds,preferred:fiveClaims.plan.preferredMeaningIds,selected:fiveClaims.selected,matched:fiveClaims.plan.matchedResponseRuleIds},
              fourQuestions:{meaningIds:fourQuestions.plan.meaningIds,selected:fourQuestions.selected,matched:fourQuestions.plan.matchedResponseRuleIds},
              oldOverflow:{meaningIds:oldOverflow.plan.meaningIds,preferred:oldOverflow.plan.preferredMeaningIds,selected:oldOverflow.selected}
            }
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
