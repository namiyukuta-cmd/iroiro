name: Audit HMW response rules 009
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-009.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          [
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js',
            'HMW/js/dialogue/response-rules-001-social-emotion.js',
            'HMW/js/dialogue/response-rules-002-daily-relationship.js',
            'HMW/js/dialogue/response-rules-003-facts-policy-nuance.js',
            'HMW/js/dialogue/response-rules-004-claims-context.js',
            'HMW/js/dialogue/response-rules-005-actions-daily-repair.js',
            'HMW/js/dialogue/response-rules-006-exact-actions-questions.js',
            'HMW/js/dialogue/response-rules-007-semantic-continuity.js',
            'HMW/js/dialogue/response-rules-008-questions-boundaries-repair.js',
            'HMW/js/dialogue/response-rules-009-practical-social-context.js',
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js'
          ].forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const meanings=D.MEANINGS||{};
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!meanings[id]))];

          const cases=[
            {
              name:'price_anxiety',
              analysis:{intents:['ask_price'],questions:[{kind:'price',target:'room'}],emotions:{anxiety:70}},
              facts:{price:30},policy:{},psych:{}
            },
            {
              name:'permission_talk_allow',
              analysis:{intents:['ask_permission_action'],questions:[{kind:'permission',action:'talk'}]},
              facts:{},policy:{permissions:{talk:true}},psych:{}
            },
            {
              name:'permission_talk_blocked',
              analysis:{intents:['ask_permission_action'],questions:[{kind:'permission',action:'talk'}],boundaries:['stop_conversation']},
              facts:{},policy:{permissions:{talk:true}},psych:{}
            },
            {
              name:'work_report_frustration',
              analysis:{intents:['report_event'],focusConcepts:['work'],emotions:{frustration:70}},
              facts:{},policy:{},psych:{care:50}
            },
            {
              name:'relationship_status_fear',
              analysis:{intents:['ask_relationship_status'],questions:[{kind:'relationship_status'}],focusConcepts:['relationship'],emotions:{fear:65}},
              facts:{relationshipStatus:'partners'},policy:{},psych:{care:70}
            },
            {
              name:'refusal_care',
              analysis:{intents:['refuse'],tone:{style:'subdued'},emotions:{fear:55}},
              facts:{},policy:{},psych:{care:70,empathy:70}
            }
          ];

          const results=cases.map(c=>{
            const plan=D.planResponse({analysis:c.analysis,characterFacts:c.facts,characterPolicy:c.policy,psychology:c.psych});
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {name:c.name,meaningIds:plan.meaningIds,matchedRuleIds:plan.matchedResponseRuleIds,selected};
          });

          const conflictSelected=D.selectResponseMeanings(
            ['DENY_LOVE','AFFIRM_LOVE','DECLINE_ACTION_REQUEST','ACCEPT_ACTION_REQUEST','DENY_FACT','CONFIRM_FACT'],
            {maxMeanings:10}
          );

          const checks={
            ruleCount:rules.length===900,
            uniqueRuleIds:new Set(ids).size===900,
            noMissingMeanings:missingMeaningIds.length===0,
            priceAnxiety:results[0].meaningIds.includes('STATE_PRICE')&&results[0].meaningIds.includes('EXPRESS_CONCERN'),
            talkAllow:results[1].meaningIds.includes('GRANT_PERMISSION'),
            talkBlocked:results[2].meaningIds.includes('RESPECT_BOUNDARY')&&results[2].meaningIds.includes('DENY_PERMISSION')&&!results[2].selected.includes('GRANT_PERMISSION'),
            workReport:results[3].meaningIds.includes('EXPRESS_CONCERN'),
            relationshipFear:results[4].meaningIds.includes('STATE_RELATIONSHIP_STATUS')&&results[4].meaningIds.includes('EXPRESS_CARE'),
            refusal:results[5].meaningIds.includes('RESPECT_BOUNDARY'),
            conflictPruned:conflictSelected.includes('DENY_LOVE')&&!conflictSelected.includes('AFFIRM_LOVE')&&conflictSelected.includes('DECLINE_ACTION_REQUEST')&&!conflictSelected.includes('ACCEPT_ACTION_REQUEST')&&conflictSelected.includes('DENY_FACT')&&!conflictSelected.includes('CONFIRM_FACT')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            conflictSelected,
            checks,
            results
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
