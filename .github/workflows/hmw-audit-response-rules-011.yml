name: Audit HMW response rules 011
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-011.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          [
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js',
            'HMW/js/dialogue/response-rules-001-social-emotion.js',
            'HMW/js/dialogue/response-rules-002-daily-relationship.js',
            'HMW/js/dialogue/response-rules-003-facts-policy-nuance.js',
            'HMW/js/dialogue/response-rules-004-claims-context.js',
            'HMW/js/dialogue/response-rules-005-actions-daily-repair.js',
            'HMW/js/dialogue/response-rules-006-exact-actions-questions.js',
            'HMW/js/dialogue/response-rules-007-semantic-continuity.js',
            'HMW/js/dialogue/response-rules-008-questions-boundaries-repair.js',
            'HMW/js/dialogue/response-rules-009-practical-social-context.js',
            'HMW/js/dialogue/response-rules-010-completion-expansion.js',
            'HMW/js/dialogue/response-rules-011-relationship-history.js',
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js',
            'HMW/js/dialogue/response-history.js',
            'HMW/js/dialogue/dialogue-pipeline.js'
          ].forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const meanings=D.MEANINGS||{};
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!meanings[id]))];

          const cases=[
            {
              name:'high_trust_reassurance',
              analysis:{intents:['request_reassurance'],focusConcepts:['trust']},
              facts:{trustsHeroine:true},policy:{},psych:{care:40},
              relationship:{familiarity:75,trust:85,goodwill:80,desire:40,conscience:70,malice:5,flags:{}},
              recent:[]
            },
            {
              name:'high_desire_boundary',
              analysis:{focusConcepts:['love'],boundaries:['do_not_touch']},
              facts:{lovesHeroine:true},policy:{},psych:{},
              relationship:{familiarity:80,trust:80,goodwill:80,desire:95,conscience:50,malice:20,flags:{}},
              recent:[]
            },
            {
              name:'history_love_repeat',
              analysis:{intents:['question_affection'],focusConcepts:['love']},
              facts:{lovesHeroine:true,choosesHeroine:true},policy:{},psych:{care:50},
              relationship:{familiarity:80,trust:80,goodwill:80,desire:50,conscience:60,malice:0,flags:{}},
              recent:['AFFIRM_LOVE']
            },
            {
              name:'history_unknown_repeat',
              analysis:{intents:['ask_question'],questions:[{kind:'generic'}]},
              facts:{},policy:{},psych:{},
              relationship:{familiarity:20,trust:20,goodwill:20,desire:0,conscience:50,malice:0,flags:{}},
              recent:['ANSWER_UNKNOWN','ANSWER_UNKNOWN']
            },
            {
              name:'dating_flag',
              analysis:{intents:['ask_relationship_status'],questions:[{kind:'relationship_status'}]},
              facts:{},policy:{},psych:{},
              relationship:{stage:'partner',familiarity:90,trust:90,goodwill:90,desire:70,conscience:80,malice:0,flags:{dating:true}},
              recent:[]
            },
            {
              name:'trust_broken_flag',
              analysis:{focusConcepts:['trust']},
              facts:{},policy:{},psych:{},
              relationship:{familiarity:80,trust:20,goodwill:60,desire:30,conscience:70,malice:10,flags:{trustBroken:true}},
              recent:[]
            }
          ];

          const results=cases.map(c=>{
            const plan=D.planResponse({
              analysis:c.analysis,
              characterFacts:c.facts,
              characterPolicy:c.policy,
              psychology:c.psych,
              relationship:c.relationship,
              recentMeaningIds:c.recent
            });
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {
              name:c.name,
              meaningIds:plan.meaningIds,
              matchedRuleIds:plan.matchedResponseRuleIds,
              slots:plan.slotOverridesByMeaning,
              selected
            };
          });

          const pipelineResult=D.runDialoguePipeline({
            analysis:{intents:['question_affection'],focusConcepts:['love']},
            characterFacts:{lovesHeroine:true,choosesHeroine:true},
            characterPolicy:{},
            psychology:{care:50},
            relationship:{familiarity:80,trust:80,goodwill:80,desire:50,conscience:60,malice:0,flags:{}},
            recentMeaningIds:['AFFIRM_LOVE']
          });

          const checks={
            ruleCount:rules.length===1100,
            uniqueRuleIds:new Set(ids).size===1100,
            noMissingMeanings:missingMeaningIds.length===0,
            highTrust:results[0].meaningIds.includes('CONFIRM_TRUST'),
            desireBoundary:results[1].meaningIds.includes('RESPECT_BOUNDARY')&&!results[1].selected.includes('EXPRESS_WANT_TO_BE_TOGETHER'),
            historyLove:results[2].matchedRuleIds.includes('R1061_HISTORY_AFTER_LOVE_CONFIRM'),
            historyUnknown:results[3].matchedRuleIds.includes('R1071_HISTORY_UNKNOWN_REPEAT')&&results[3].meaningIds.includes('ASK_FOR_DETAILS'),
            datingFlag:results[4].meaningIds.includes('STATE_RELATIONSHIP_STATUS')&&results[4].slots.STATE_RELATIONSHIP_STATUS?.RELATIONSHIP==='dating',
            trustBroken:results[5].matchedRuleIds.includes('R1093_FLAG_TRUST_BROKEN')&&results[5].meaningIds.includes('ASK_TO_REPAIR'),
            pipelineRelationship:pipelineResult.plan.relationship?.trust===80,
            pipelineHistory:pipelineResult.plan.matchedResponseRuleIds.includes('R1061_HISTORY_AFTER_LOVE_CONFIRM')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            checks,
            results,
            pipeline:{selected:pipelineResult.plan.selectedMeaningIds,matchedRuleIds:pipelineResult.plan.matchedResponseRuleIds}
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
