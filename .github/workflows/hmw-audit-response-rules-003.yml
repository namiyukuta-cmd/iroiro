name: Audit HMW response rules 003
on:
  push:
    paths:
      - '.github/workflows/hmw-audit-response-rules-003.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit response rules
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=process.cwd();
          const ctx={console};ctx.window=ctx;ctx.HMW={};vm.createContext(ctx);
          const run=p=>vm.runInContext(fs.readFileSync(path.join(root,p),'utf8'),ctx,{filename:p});
          [
            'HMW/js/dialogue/dialogue-input.js',
            'HMW/js/dialogue/analysis-schema.js',
            'HMW/js/dialogue/claim-rules.js',
            'HMW/js/dialogue/dialogue-meanings.js',
            'HMW/js/dialogue/language/lexical-target-rules.js',
            'HMW/js/dialogue/response-rule-engine.js',
            'HMW/js/dialogue/response-rules-001-social-emotion.js',
            'HMW/js/dialogue/response-rules-002-daily-relationship.js',
            'HMW/js/dialogue/response-rules-003-facts-policy-nuance.js',
            'HMW/js/dialogue/response-planner.js',
            'HMW/js/dialogue/response-priority.js',
            'HMW/js/dialogue/response-selection.js'
          ].forEach(run);

          const D=ctx.HMW.Dialogue;
          const rules=D.RESPONSE_RULES||[];
          const ids=rules.map(r=>r.id);
          const dupIds=ids.filter((id,i)=>ids.indexOf(id)!==i);
          const meanings=D.MEANINGS||{};
          const missingMeaningIds=[...new Set(rules.flatMap(r=>r.meanings||[]).filter(id=>!meanings[id]))];

          const cases=[
            {
              name:'sleep_good',
              analysis:{intents:['ask_sleep'],questions:[{kind:'sleep'}]},
              facts:{sleptWell:true},policy:{},psych:{}
            },
            {
              name:'money_none',
              analysis:{intents:['ask_money'],questions:[{kind:'money'}]},
              facts:{hasEnoughMoney:false},policy:{},psych:{}
            },
            {
              name:'touch_permission_denied',
              analysis:{intents:['ask_permission_action'],questions:[{kind:'permission',action:'touch'}]},
              facts:{},policy:{permissions:{touch:false}},psych:{}
            },
            {
              name:'contact_boundary',
              analysis:{intents:['request_contact'],boundaries:['do_not_contact']},
              facts:{},policy:{allowContact:true},psych:{}
            },
            {
              name:'relationship_fear',
              analysis:{intents:['question_affection'],focusConcepts:['love','relationship'],emotions:{fear:70},tone:{hesitation:75}},
              facts:{lovesHeroine:true,choosesHeroine:true},policy:{},psych:{care:70}
            },
            {
              name:'nervous_health',
              analysis:{intents:['report_condition'],focusConcepts:['health'],tone:{style:'nervous',hesitation:75,negativity:60}},
              facts:{},policy:{},psych:{}
            }
          ];

          const results=cases.map(c=>{
            const plan=D.planResponse({analysis:c.analysis,characterFacts:c.facts,characterPolicy:c.policy,psychology:c.psych});
            const prioritized=D.prioritizeResponseMeanings(plan.meaningIds);
            const selected=D.selectResponseMeanings(prioritized,{boundaryActive:plan.boundaryActive,maxMeanings:5});
            return {name:c.name,meaningIds:plan.meaningIds,matchedRuleIds:plan.matchedResponseRuleIds,selected};
          });

          const checks={
            ruleCount:rules.length===300,
            uniqueRuleIds:new Set(ids).size===300,
            noMissingMeanings:missingMeaningIds.length===0,
            sleepGood:results[0].meaningIds.includes('STATE_SLEEP_STATUS_GOOD'),
            moneyNone:results[1].meaningIds.includes('STATE_NO_MONEY'),
            permissionDenied:results[2].meaningIds.includes('DENY_PERMISSION'),
            contactBoundary:results[3].meaningIds.includes('DECLINE_CONTACT')&&results[3].meaningIds.includes('RESPECT_BOUNDARY'),
            relationshipFear:results[4].meaningIds.includes('AFFIRM_LOVE')&&!results[4].meaningIds.includes('DENY_LOVE'),
            nervousHealth:results[5].meaningIds.includes('ASK_IF_OKAY')||results[5].meaningIds.includes('EXPRESS_CONCERN')
          };

          console.log('AUDIT_RESULT '+JSON.stringify({
            ruleCount:rules.length,
            uniqueRuleIds:new Set(ids).size,
            dupIds,
            missingMeaningIds,
            checks,
            results
          }));
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE

# rerun refined question fallbacks
