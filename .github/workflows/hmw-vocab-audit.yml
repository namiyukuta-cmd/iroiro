name: HMW Dialogue Audit
on:
  push:
    paths:
      - '.github/workflows/hmw-vocab-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit dialogue assets
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          const root=path.join(process.cwd(),'HMW/js/dialogue');
          const lang=path.join(root,'language');
          const ctx={console}; ctx.window=ctx; ctx.HMW={Dialogue:{}}; vm.createContext(ctx);
          const run=f=>vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:path.basename(f)});
          run(path.join(lang,'vocabulary-registry.js'));
          const V=ctx.HMW.Dialogue.Vocabulary; let vocabAttempts=0; const vorig=V.register.bind(V);
          V.register=(entries=[])=>{for(const e of entries)if(e&&e.lemma)vocabAttempts++;return vorig(entries)};
          const vocabFiles=fs.readdirSync(lang).filter(f=>{const m=f.match(/^vocabulary-(\d{3}).*\.js$/);return m&&Number(m[1])>=1&&Number(m[1])<=74}).sort((a,b)=>Number(a.match(/(\d{3})/)[1])-Number(b.match(/(\d{3})/)[1]));
          const errors=[];
          for(const f of vocabFiles){try{run(path.join(lang,f))}catch(e){errors.push({file:f,error:String(e)})}}
          run(path.join(lang,'phrase-registry.js'));
          const phraseFiles=fs.readdirSync(lang).filter(f=>/^phrases-.*\.js$/.test(f)).sort();
          for(const f of phraseFiles){try{run(path.join(lang,f))}catch(e){errors.push({file:f,error:String(e)})}}
          ctx.HMW.Dialogue.SENTENCE_PATTERNS={};
          const patternFiles=fs.readdirSync(lang).filter(f=>/^sentence-patterns-.*\.js$/.test(f)).sort();
          for(const f of patternFiles){try{run(path.join(lang,f))}catch(e){errors.push({file:f,error:String(e)})}}
          ctx.HMW.Dialogue.MEANING_PATTERN_MAP={};
          const mapFiles=fs.readdirSync(lang).filter(f=>/^meaning-pattern-map-.*\.js$/.test(f)).sort();
          for(const f of mapFiles){try{run(path.join(lang,f))}catch(e){errors.push({file:f,error:String(e)})}}
          ctx.HMW.Dialogue.MEANING_GENERATION_SPECS={};
          const specFiles=fs.readdirSync(lang).filter(f=>/^meaning-generation-specs-.*\.js$/.test(f)).sort();
          for(const f of specFiles){try{run(path.join(lang,f))}catch(e){errors.push({file:f,error:String(e)})}}
          const result={
            vocabFiles:vocabFiles.length,
            vocabAttempts,
            uniqueLemmaPos:V.entries.length,
            vocabDuplicates:vocabAttempts-V.entries.length,
            phraseFiles:phraseFiles.length,
            uniquePhraseIds:ctx.HMW.Dialogue.Phrases.entries.length,
            patternFiles:patternFiles.length,
            sentencePatterns:Object.keys(ctx.HMW.Dialogue.SENTENCE_PATTERNS||{}).length,
            meaningMapFiles:mapFiles.length,
            meaningIdsMapped:Object.keys(ctx.HMW.Dialogue.MEANING_PATTERN_MAP||{}).length,
            specFiles:specFiles.length,
            meaningGenerationSpecs:Object.keys(ctx.HMW.Dialogue.MEANING_GENERATION_SPECS||{}).length,
            errors
          };
          console.log('AUDIT_RESULT '+JSON.stringify(result));
          if(errors.length)process.exitCode=1;
          NODE
