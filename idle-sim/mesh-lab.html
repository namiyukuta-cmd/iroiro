<title>固定ローポリ人体メッシュ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#eee9df;color:#28251f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100dvh}main{max-width:520px;margin:0 auto;padding:12px}h1{font-size:18px;margin:0 0 4px}.lead{font-size:12px;color:#6d675e;line-height:1.55;margin:0 0 10px}
.stage{position:relative;height:520px;border:1px solid #c8c0b3;border-radius:14px;background:#f8f5ee;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
.badge{position:absolute;left:10px;top:10px;padding:5px 8px;border-radius:999px;border:1px solid #d2cabd;background:rgba(248,245,238,.92);font-size:10px;color:#6d675e}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}button{min-height:44px;border:1px solid #bdb5a8;border-radius:10px;background:#faf8f2;color:#28251f;font:inherit;font-size:12px;font-weight:700}
.info{margin-top:10px;padding:10px;border:1px solid #cfc8bb;background:#f8f5ee;border-radius:12px;font-size:11px;line-height:1.65;color:#625d54}.info b{color:#302d28}@media(max-width:360px){main{padding:8px}.stage{height:470px}.controls{gap:5px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<main>
<h1>固定ローポリ人体メッシュ</h1>
<p class="lead">今の箱ポリとは別の実験ページです。頂点位置を固定して、肩・胸・腰・骨盤・膝・足首・頬・顎を人型として直接決めています。</p>
<section class="stage"><canvas id="meshCanvas"></canvas><div class="badge">指で回転・拡大</div></section>
<section class="controls"><button id="frontBtn">正面</button><button id="sideBtn">横</button><button id="backBtn">後ろ</button><button id="wireBtn">ワイヤー</button><button id="solidBtn">面表示</button><button id="resetBtn">初期角度</button></section>
<section class="info"><b>別実験です。</b><br>model-test.html と既存の箱ポリ版は変更していません。<br>このページでは、人体の断面ごとの頂点を固定値で持ち、実行時に体型パラメータから作り直しません。</section>
</main><script type="module" src="js/mesh-lab.js?v=20261003-1"></script>
</body></html>
