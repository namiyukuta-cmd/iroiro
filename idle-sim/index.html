<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#ebe8df">
  <title>放置生活</title>
  <link rel="stylesheet" href="css/style.css?v=20261003-1">
</head>
<body>
  <main class="game" id="game">
    <header class="topbar">
      <div>
        <div class="day" id="dayText">1日目</div>
        <div class="time" id="timeText">07:00</div>
      </div>
      <div class="money" id="moneyText">¥1,500</div>
    </header>

    <section class="needs" aria-label="住人の状態">
      <div class="need"><span>満腹</span><progress id="hungerBar" max="100" value="72"></progress><b id="hungerText">72</b></div>
      <div class="need"><span>体力</span><progress id="energyBar" max="100" value="78"></progress><b id="energyText">78</b></div>
      <div class="need"><span>衛生</span><progress id="hygieneBar" max="100" value="80"></progress><b id="hygieneText">80</b></div>
      <div class="need"><span>社交</span><progress id="socialBar" max="100" value="55"></progress><b id="socialText">55</b></div>
    </section>

    <section class="room" aria-label="部屋">
      <div class="zone" data-zone="bed"><span class="icon">▰</span><small>ベッド</small></div>
      <div class="zone" data-zone="kitchen"><span class="icon">▣</span><small>キッチン</small></div>
      <div class="zone" data-zone="bath"><span class="icon">▥</span><small>シャワー</small></div>
      <div class="zone" data-zone="desk"><span class="icon">▤</span><small>仕事</small></div>
      <div class="zone" data-zone="sofa"><span class="icon">▱</span><small>くつろぐ</small></div>
      <div class="zone" data-zone="door"><span class="icon">□</span><small>外出</small></div>
      <div class="resident" id="resident" aria-label="住人">●</div>
    </section>

    <section class="current">
      <div>
        <span class="label">いま</span>
        <strong id="actionText">起きたところ</strong>
      </div>
      <span class="thought" id="thoughtText">次に何をしようかな</span>
    </section>

    <section class="log" aria-label="生活履歴">
      <div class="log-title">生活履歴</div>
      <div id="logList" aria-live="polite"></div>
    </section>

    <footer class="controls">
      <button type="button" id="pauseBtn">一時停止</button>
      <button type="button" id="speedBtn">速度 ×1</button>
      <button type="button" id="saveBtn">保存</button>
      <button type="button" id="loadBtn">読込</button>
    </footer>
  </main>

  <script src="js/main.js?v=20261003-1"></script>
</body>
</html>
