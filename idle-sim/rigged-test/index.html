<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>既存CC0人体ベース実験</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#ece9e1;color:#25231f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{width:min(100%,560px);margin:auto;padding:10px}
h1{font-size:18px;margin:2px 0 5px}
p{font-size:12px;line-height:1.55;color:#676158;margin:0 0 9px}
.stage{height:560px;max-height:68dvh;border:1px solid #c6bfb3;border-radius:14px;overflow:hidden;background:#f8f5ee;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none}
.status{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);padding:6px 9px;border:1px solid #d0c8bc;border-radius:999px;background:rgba(248,245,238,.92);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
button{min-height:44px;border:1px solid #bdb5a8;border-radius:10px;background:#faf8f2;color:#28251f;font:inherit;font-size:12px;font-weight:700}
.note{margin-top:8px;padding:9px 10px;border:1px solid #cec6b9;border-radius:10px;background:#f8f5ee;font-size:11px;line-height:1.5;color:#625d54}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
</head>
<body>
<main>
<h1>既存CC0人体ベース実験</h1>
<p>ゼロから座標生成せず、既存の低ポリ人体メッシュ＋骨格＋スキンウェイト＋アニメーションをそのまま読み込む別実験です。</p>
<section class="stage">
<canvas id="c"></canvas>
<div class="status" id="status">読み込み中…</div>
</section>
<section class="controls">
<button id="prev">前の動作</button>
<button id="play">停止</button>
<button id="next">次の動作</button>
<button id="front">正面</button>
<button id="side">横</button>
<button id="reset">初期視点</button>
</section>
<div class="note">元モデルはCC0。既存の model-test.html と mesh-lab は変更していません。</div>
</main>
<script type="module" src="./rigged-test.js?v=20261003-1"></script>
</body>
</html>
