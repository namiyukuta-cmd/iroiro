<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#ece8df">
<title>3D住人テスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#ece8df;color:#28251f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100dvh}
main{max-width:520px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0 0 4px}
.lead{font-size:12px;color:#706a60;margin:0 0 10px;line-height:1.55}
.stage{position:relative;width:100%;height:410px;background:#f8f5ee;border:1px solid #cfc8bb;border-radius:14px;overflow:hidden}
#simCanvas{display:block;width:100%;height:100%;touch-action:none}
.badge{position:absolute;left:10px;top:10px;padding:5px 8px;border-radius:999px;background:rgba(248,245,238,.92);border:1px solid #d7d0c3;font-size:10px;color:#6e685e;pointer-events:none}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;color:#716b61}
select,button{width:100%;min-height:44px;border:1px solid #bdb5a8;border-radius:10px;background:#faf8f2;color:#28251f;font:inherit;font-size:14px;padding:0 10px}
button{font-weight:700}
.preview-title{font-size:11px;font-weight:700;margin:12px 0 6px}
.texture-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.texture-card{background:#f8f5ee;border:1px solid #cfc8bb;border-radius:12px;padding:8px;min-width:0}
.texture-card b{display:block;font-size:10px;margin-bottom:6px;color:#625d54}
.texture-card canvas{display:block;width:100%;aspect-ratio:1/1;background:#aaa;border-radius:7px;image-rendering:pixelated}
.info{margin-top:10px;padding:10px;border:1px solid #cfc8bb;background:#f8f5ee;border-radius:12px;font-size:11px;line-height:1.6;color:#625d54}
.status{font-weight:700;color:#302d28;margin-bottom:4px}
.arch{margin-top:6px;padding-top:6px;border-top:1px solid #ddd6ca}
@media(max-width:360px){main{padding:8px}.stage{height:370px}.controls{gap:6px}}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<main>
<h1>3D住人・スキン方式</h1>
<p class="lead">初代シムズに近い考え方で、3Dの形と表面画像を分離しています。Bodyは共通、HeadとHairはメッシュ交換、服と肌はBodyテクスチャ、顔・耳・側頭部・頭頂・後頭部は1枚のHeadテクスチャとしてHeadメッシュ全体へ巻き付けます。</p>

<section class="stage" aria-label="3D住人プレビュー">
  <canvas id="simCanvas"></canvas>
  <div class="badge">指で回転・拡大</div>
</section>

<section class="controls" aria-label="住人の見た目設定">
  <div class="field">
    <label for="skin">肌</label>
    <select id="skin">
      <option value="light">ライト</option>
      <option value="warm" selected>ウォーム</option>
      <option value="deep">ディープ</option>
    </select>
  </div>

  <div class="field">
    <label for="bodyTexture">Bodyテクスチャ</label>
    <select id="bodyTexture">
      <option value="green">グリーン普段着</option>
      <option value="red">レンガ色普段着</option>
      <option value="blue">ブルー作業着</option>
    </select>
  </div>

  <div class="field">
    <label for="faceTexture">Head/Faceテクスチャ</label>
    <select id="faceTexture">
      <option value="soft">ソフト</option>
      <option value="sharp">シャープ</option>
      <option value="cheerful">朗らか</option>
    </select>
  </div>

  <div class="field">
    <label for="headMesh">Headメッシュ</label>
    <select id="headMesh">
      <option value="classic">クラシック</option>
      <option value="narrow">細め</option>
      <option value="round">丸め</option>
    </select>
  </div>

  <div class="field">
    <label for="hairMesh">Hairメッシュ</label>
    <select id="hairMesh">
      <option value="short">ショート</option>
      <option value="bob">ボブ</option>
      <option value="bun">まとめ髪</option>
    </select>
  </div>

  <div class="field">
    <label for="hairColor">髪色</label>
    <select id="hairColor">
      <option value="brown">ブラウン</option>
      <option value="black">ブラック</option>
      <option value="auburn">赤茶</option>
    </select>
  </div>

  <div class="field" style="grid-column:1/-1">
    <button type="button" id="randomBtn">ランダム生成</button>
  </div>
</section>

<div class="preview-title">実際に3Dへ貼っているテクスチャ</div>
<section class="texture-row">
  <div class="texture-card">
    <b>Body texture atlas</b>
    <canvas id="bodyTexturePreview" width="256" height="256" aria-label="Bodyテクスチャのプレビュー"></canvas>
  </div>
  <div class="texture-card">
    <b>Head texture atlas</b>
    <canvas id="faceTexturePreview" width="256" height="256" aria-label="Faceテクスチャのプレビュー"></canvas>
  </div>
</section>

<section class="info">
  <div class="status" id="layerStatus"></div>
  <div class="arch">構造：肩・胸・腰・骨盤を複数断面でつないだ低ポリBodyメッシュ ＋ Bodyテクスチャ1枚 ＋ 低ポリHeadメッシュ ＋ Headテクスチャ1枚 ＋ 交換Hairメッシュ。箱を並べる方式ではありません。</div>
</section>
</main>
<script type="module" src="js/character3d.js?v=20261003-7"></script>
</body>
</html>
