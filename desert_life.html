<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>砂漠都市生活</title>
  <style>
    :root {
      --bg:#f2eee5; --panel:#fbf8f1; --ink:#29241f; --muted:#71695f;
      --line:#cfc5b4; --strong:#2a2520; --accent:#8b5a2b; --dark:#24211d;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:18px;line-height:1.45}
    body{position:fixed;inset:0;touch-action:none}
    button{font:inherit;color:inherit}
    .game{position:fixed;inset:0;left:0;right:0;width:min(100vw,720px);height:100dvh;margin:0 auto;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) 210px;background:var(--panel);border:2px solid var(--strong);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
    .hud-left{display:flex;align-items:center;gap:14px;min-width:0}
    .avatar{width:74px;height:74px;flex:0 0 74px;border:2px solid var(--strong);border-radius:50%;background:#fff;display:grid;place-items:center}
    .avatar svg{width:48px;height:48px;fill:#65615b}
    .stats{font-size:17px;line-height:1.5;font-weight:700}.stats div{white-space:nowrap}
    .hud-right{display:grid;justify-items:end;gap:10px}.daybox{text-align:right;line-height:1.1}.day{font-size:18px;font-weight:900}.phase{margin-top:4px;font-size:18px;font-weight:900;color:var(--accent)}
    .menu-btn{min-width:118px;min-height:56px;border:2px solid var(--strong);border-radius:30px;background:#fff;font-size:18px;font-weight:900;letter-spacing:.05em;touch-action:manipulation}
    .scene{position:relative;min-height:0;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(to bottom,rgba(139,90,43,.03),transparent 35%),var(--panel)}
    .scene:before,.scene:after{content:"";position:absolute;pointer-events:none;opacity:.12}.scene:before{width:260px;height:260px;right:-80px;bottom:100px;border:2px solid var(--accent);border-radius:120px 120px 0 0}.scene:after{width:190px;height:190px;left:-70px;bottom:80px;border:2px solid var(--accent);transform:rotate(45deg)}
    .location{position:absolute;top:20px;left:18px;right:18px;z-index:1;font-size:28px;font-weight:900}
    .scene-text{position:absolute;left:18px;right:18px;top:78px;bottom:140px;z-index:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;font-size:18px;line-height:1.7}
    .event-card{position:absolute;left:18px;right:18px;bottom:22px;z-index:2;border:1px solid var(--line);background:rgba(255,255,255,.55);padding:18px 18px 16px;max-height:120px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
    .event-main{font-size:18px;font-weight:800;margin:0 0 10px}.event-note{font-size:17px;color:var(--muted);margin:0;font-weight:700}
    .choices{min-height:0;overflow:hidden}.choice-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
    .choice-btn{min-height:74px;padding:10px 14px;border:2px solid var(--strong);border-radius:18px;background:#fff;font-size:18px;font-weight:900;line-height:1.3;text-align:center;display:grid;place-items:center;touch-action:manipulation}.choice-btn.primary{background:var(--dark);color:#fff}.choice-btn:disabled{opacity:.45}.choice-grid .choice-btn:last-child:nth-child(odd){grid-column:1/-1}
    .menu-layer{position:absolute;inset:0;z-index:30;display:none;background:rgba(32,28,24,.35);touch-action:none}.menu-layer.open{display:block}.menu-card{position:absolute;inset:110px 14px 14px;border:2px solid var(--strong);border-radius:20px;background:var(--panel);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.menu-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}.menu-head h2{margin:0;font-size:24px}.menu-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 18px}.menu-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:16px;font-size:17px;font-weight:700}.menu-sub{font-size:18px;font-weight:900;margin:0 0 10px}.log-entry{padding:10px 0;border-bottom:1px solid var(--line)}.log-time{font-size:16px;color:var(--muted);font-weight:700;margin-bottom:4px}.menu-foot{padding:14px 18px 18px;border-top:1px solid var(--line)}.close-btn{width:100%;min-height:52px;border:2px solid var(--strong);border-radius:14px;background:var(--dark);color:#fff;font-size:18px;font-weight:900;touch-action:manipulation}
    @media(max-height:740px){.game{grid-template-rows:auto minmax(0,1fr) 182px}.hud{padding:10px 14px}.avatar{width:64px;height:64px;flex-basis:64px}.avatar svg{width:42px;height:42px}.scene-text{top:72px;bottom:126px}.event-card{bottom:14px;max-height:108px;padding:14px 15px 12px}.location{top:14px;font-size:24px}.choice-btn{min-height:62px}}
  </style>
</head>
<body>
<main class="game">
  <header class="hud">
    <div class="hud-left">
      <div class="avatar" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="20" r="13"></circle><path d="M12 55c0-13 8-22 20-22s20 9 20 22v3H12z"></path></svg></div>
      <div class="stats"><div>体力　<span id="energyText">6</span>/10</div><div>所持金 <span id="moneyText">3</span></div><div>借金　<span id="debtText">30</span></div></div>
    </div>
    <div class="hud-right"><div class="daybox"><div class="day" id="dayText">1日目</div><div class="phase" id="phaseText">朝</div></div><button class="menu-btn" id="menuBtn" type="button">MENU</button></div>
  </header>

  <section class="scene" aria-live="polite">
    <div class="location" id="placeText">借り部屋</div>
    <div class="scene-text" id="sceneText">薄い朝の光が、格子窓から差し込んでいる。今日をどう過ごすか決める。</div>
    <div class="event-card"><p class="event-main" id="eventText">今日をどう過ごすか決める。</p><p class="event-note" id="noticeText">借金は残り30。</p></div>
  </section>

  <section class="choices" aria-label="選択肢"><div class="choice-scroll" id="choiceScroll"><div class="choice-grid" id="choiceGrid"></div></div></section>

  <div class="menu-layer" id="menuLayer" aria-hidden="true">
    <section class="menu-card">
      <div class="menu-head"><h2>状態と記録</h2></div>
      <div class="menu-scroll"><div class="menu-stats"><div>所持金：<strong id="menuMoney">3</strong></div><div>借金：<strong id="menuDebt">30</strong></div><div>体力：<strong id="menuEnergy">6</strong>/10</div><div>評判：<strong id="menuRep">0</strong></div><div>常連：<strong id="menuRegular">0</strong>人</div><div>警戒：<strong id="menuRisk">0</strong></div></div><p class="menu-sub">記録</p><div id="logList"></div></div>
      <div class="menu-foot"><button class="close-btn" id="menuClose" type="button">閉じる</button></div>
    </section>
  </div>
</main>
<script>
(() => {
  const phases=["朝","昼","夕方","深夜"];
  const state={day:1,phase:0,money:3,debt:30,energy:6,rep:0,regulars:0,risk:0,place:"room",eventText:"今日をどう過ごすか決める。",log:[{day:1,phase:"朝",text:"借り部屋で目を覚ました。"}]};
  const placeData={
    room:{name:"借り部屋",text:"古い貸家の二階。寝台と水差し、小さな箱だけがある。ここで暮らし、夜には客を迎えることもある。"},
    well:{name:"共同水場",text:"近所の人や水売りが出入りする。水を汲みながら、街の噂も耳に入る。"},
    market:{name:"小市場",text:"食べ物、布、香油、安い化粧品や日用品が並ぶ。大市場ほど品は多くない。"},
    bath:{name:"公衆浴場",text:"石造りの浴場。使える時間は限られている。入浴すれば疲れが少し取れる。"},
    edge:{name:"水路沿い",text:"街外れへ続く水路沿い。少し歩けば花や香草を摘める場所がある。人通りは少ない。"},
    pleasure:{name:"歓楽の通り",text:"日が落ちると灯りと音楽が増える。仕事の話も集まるが、夜は揉め事も起こりやすい。"}
  };
  const $=id=>document.getElementById(id);
  function clamp(){state.energy=Math.max(0,Math.min(10,state.energy));state.risk=Math.max(0,Math.min(10,state.risk));state.rep=Math.max(0,state.rep);state.regulars=Math.max(0,state.regulars);state.money=Math.max(0,state.money);state.debt=Math.max(0,state.debt)}
  function addLog(text,day=state.day,phase=phases[state.phase]){state.log.unshift({day,phase,text});if(state.log.length>80)state.log.length=80}
  function setEvent(text){state.eventText=text}
  function availablePlaces(){const list=["room"];if(state.phase!==3)list.push("well","market","edge");if(state.phase<=2)list.push("bath");if(state.phase>=2)list.push("pleasure");return list}
  function advance(text){const d=state.day,p=phases[state.phase];setEvent(text);addLog(text,d,p);state.phase++;if(state.phase>=phases.length){state.phase=0;state.day++;state.energy=Math.min(10,state.energy+3);state.place="room";if(state.day%7===0){state.debt+=4;state.eventText+=" 週の部屋代4が借金に加わった。";addLog("週の部屋代4が借金に加わった。",state.day,"朝")}}clamp();render()}
  function moveTo(place){state.place=place;setEvent(placeData[place].name+"へ移動した。");render()}
  function rumor(){const r=Math.random();if(r<.35){state.risk++;return"近くで役人が聞き込みをしている、という噂を聞いた。"}if(r<.7)return"隊商が到着したらしい。今夜は旅人が増えるかもしれない。";return"この辺りは今夜、比較的静かだという。"}
  function work(){if(state.phase<2){setEvent("客を取る仕事は、主に夕方以降だ。");render();return}if(state.energy<=0){advance("今日はもう客を取れる状態ではなかった。");return}const chance=.45+state.rep*.03+state.regulars*.04-state.risk*.03;if(Math.random()>chance){state.energy--;advance("待ったが、今日は客がつかなかった。");return}const pay=3+Math.floor(Math.random()*5);state.money+=pay;state.energy-=2;state.rep++;let text=`客を一人取った。${pay}を得た。`;if(Math.random()<.18+state.rep*.01){state.regulars++;text+=" また来たいと言われた。常連になるかもしれない。"}advance(text)}
  function payDebt(){if(state.money<=0||state.debt<=0){setEvent("今は返せる金がない。");render();return}const amount=Math.min(5,state.money,state.debt);state.money-=amount;state.debt-=amount;const text=`${amount}を借金の返済に回した。`;setEvent(text);addLog(text);clamp();render()}
  function btn(label,fn,options={}){const b=document.createElement("button");b.type="button";b.className="choice-btn";if(options.primary)b.classList.add("primary");b.disabled=!!options.disabled;b.textContent=label;b.addEventListener("click",fn);return b}
  function buildChoices(){const list=[],place=state.place;if(place==="room"){list.push(btn("休む",()=>{state.energy+=2;advance("横になって休んだ。体力が少し戻った。")},{primary:true}));list.push(btn("借金を返す",payDebt,{disabled:state.money<=0||state.debt<=0}))}if(place==="well")list.push(btn("水を汲む・噂を聞く",()=>advance(rumor()),{primary:true}));if(place==="market"){list.push(btn("食事を買う（2）",()=>{if(state.money<2){setEvent("金が足りない。");render();return}state.money-=2;state.energy+=2;advance("食事を買って食べた。")},{primary:true}));list.push(btn("香油を買う（3）",()=>{if(state.money<3){setEvent("金が足りない。");render();return}state.money-=3;state.rep++;advance("安い香油を買った。身支度が少し整った。" )}))}if(place==="bath")list.push(btn("浴場を使う（2）",()=>{if(state.money<2){setEvent("金が足りない。");render();return}state.money-=2;state.energy+=3;advance("浴場を使った。身体が少し軽くなった。")},{primary:true,disabled:state.phase===3}));if(place==="edge")list.push(btn("花や香草を摘む",()=>{state.energy--;const gain=1+Math.floor(Math.random()*3);state.money+=gain;advance(`花や香草を集め、${gain}で売れる分を得た。`)},{primary:true,disabled:state.phase===3}));if(place==="pleasure"){list.push(btn("今夜、客を取る",work,{primary:true}));list.push(btn("今日は取らずに帰る",()=>{state.place="room";advance("今日は客を取らず、部屋へ戻った。")}))}availablePlaces().filter(p=>p!==place).forEach(p=>list.push(btn(placeData[p].name+"へ行く",()=>moveTo(p))));list.push(btn("何もせず時間を進める",()=>advance("しばらく時間を過ごした。")));return list}
  function renderLog(){const box=$("logList");box.replaceChildren();state.log.forEach(entry=>{const row=document.createElement("div");row.className="log-entry";const time=document.createElement("div");time.className="log-time";time.textContent=`${entry.day}日目・${entry.phase}`;const text=document.createElement("div");text.textContent=entry.text;row.append(time,text);box.append(row)})}
  function renderChoices(){const grid=$("choiceGrid");grid.replaceChildren();buildChoices().forEach(b=>grid.append(b));$("choiceScroll").scrollTop=0}
  function render(){clamp();$("dayText").textContent=`${state.day}日目`;$("phaseText").textContent=phases[state.phase];$("energyText").textContent=state.energy;$("moneyText").textContent=state.money;$("debtText").textContent=state.debt;$("menuMoney").textContent=state.money;$("menuDebt").textContent=state.debt;$("menuEnergy").textContent=state.energy;$("menuRep").textContent=state.rep;$("menuRegular").textContent=state.regulars;$("menuRisk").textContent=state.risk;$("placeText").textContent=placeData[state.place].name;$("sceneText").textContent=placeData[state.place].text;$("eventText").textContent=state.eventText;$("noticeText").textContent=state.debt>0?`借金は残り${state.debt}。`:"借金は返し終えた。この部屋を出ることもできる。";renderChoices();renderLog()}
  function openMenu(open){$("menuLayer").classList.toggle("open",open);$("menuLayer").setAttribute("aria-hidden",String(!open))}
  $("menuBtn").addEventListener("click",()=>openMenu(true));$("menuClose").addEventListener("click",()=>openMenu(false));$("menuLayer").addEventListener("click",e=>{if(e.target===$("menuLayer"))openMenu(false)});render();
})();
</script>
</body>
</html>
