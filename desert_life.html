<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>砂漠都市生活</title>
  <style>
    :root {
      --bg: #f3ead8;
      --panel: #fffaf0;
      --ink: #33271f;
      --muted: #75685d;
      --line: #d5c3a8;
      --accent: #8b5a2b;
      --accent-soft: #ead8bd;
      --danger: #9a3f35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 18px;
      line-height: 1.55;
    }
    button { font: inherit; }
    .wrap {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 16px 14px 36px;
    }
    .status {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .status-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .day { font-size: 22px; font-weight: 700; }
    .phase { font-weight: 700; color: var(--accent); }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 12px;
      font-size: 17px;
    }
    .scene {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
      min-height: 190px;
      margin-bottom: 14px;
    }
    .scene h1 {
      font-size: 23px;
      margin: 0 0 10px;
    }
    .scene p { margin: 8px 0; }
    .notice {
      padding: 10px 12px;
      border-left: 4px solid var(--accent);
      background: #f7efdf;
      margin-top: 12px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .actions button {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
    }
    .actions button.primary {
      background: var(--accent-soft);
      border-color: #bf9b6a;
      font-weight: 700;
    }
    .actions button:disabled {
      opacity: .45;
      cursor: default;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 18px 0 8px;
    }
    .small { font-size: 17px; color: var(--muted); }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="status" aria-label="現在の状態">
      <div class="status-top">
        <div class="day" id="dayText">1日目</div>
        <div class="phase" id="phaseText">朝</div>
      </div>
      <div class="stats">
        <div>所持金：<strong id="moneyText">3</strong></div>
        <div>借金：<strong id="debtText">30</strong></div>
        <div>体力：<strong id="energyText">6</strong>/10</div>
        <div>評判：<strong id="repText">0</strong></div>
        <div>常連：<strong id="regularText">0</strong>人</div>
        <div>警戒：<strong id="riskText">0</strong></div>
      </div>
    </section>

    <section class="scene" aria-live="polite">
      <h1 id="placeText">借り部屋</h1>
      <p id="sceneText">薄い朝の光が、格子窓から差し込んでいる。今日をどう過ごすか決める。</p>
      <div id="notice" class="notice">部屋代と借金はまだ残っている。</div>
    </section>

    <div class="section-title">行動</div>
    <div class="actions" id="actions"></div>

    <div class="section-title">行ける場所</div>
    <div class="actions" id="places"></div>
  </main>

  <script>
    (() => {
      const phases = ["朝", "昼", "夕方", "深夜"];
      const state = {
        day: 1,
        phase: 0,
        money: 3,
        debt: 30,
        energy: 6,
        rep: 0,
        regulars: 0,
        risk: 0,
        place: "room"
      };

      const placeData = {
        room: { name: "借り部屋", text: "古い貸家の二階。寝台と水差し、小さな箱だけがある。ここで暮らし、夜には客を迎えることもある。" },
        well: { name: "共同水場", text: "近所の女たちや水売りが出入りする。水を汲みながら、街の噂も耳に入る。" },
        market: { name: "小市場", text: "食べ物、布、香油、安い化粧品や日用品が並ぶ。大市場ほど品は多くない。" },
        bath: { name: "公衆浴場", text: "石造りの浴場。使える時間は限られている。入浴すれば疲れが少し取れる。" },
        edge: { name: "水路沿い", text: "街外れへ続く水路沿い。少し歩けば花や香草を摘める場所がある。人通りは少ない。" },
        pleasure: { name: "歓楽街の入口", text: "日が落ちると灯りと音楽が増える。仕事の話も集まるが、夜は揉め事も起こりやすい。" }
      };

      const $ = id => document.getElementById(id);

      function clamp() {
        state.energy = Math.max(0, Math.min(10, state.energy));
        state.risk = Math.max(0, Math.min(10, state.risk));
        state.rep = Math.max(0, state.rep);
      }

      function advance(message) {
        state.phase++;
        if (state.phase >= phases.length) {
          state.phase = 0;
          state.day++;
          state.energy = Math.min(10, state.energy + 3);
          if (state.day % 7 === 0) {
            state.debt += 4;
            message += " 週の部屋代4が借金に加わった。";
          }
        }
        clamp();
        render(message);
      }

      function go(place) {
        state.place = place;
        render();
      }

      function rumor() {
        const roll = Math.random();
        if (roll < 0.35) {
          state.risk++;
          return "近くで役人が聞き込みをしている、という噂を聞いた。";
        }
        if (roll < 0.7) return "隊商が到着したらしい。今夜は旅人が増えるかもしれない。";
        return "この辺りは今夜、比較的静かだという。";
      }

      function work() {
        if (state.phase < 2) {
          render("客を取る仕事は、主に夕方以降だ。");
          return;
        }
        if (state.energy <= 0) {
          advance("今日はもう客を取れる状態ではなかった。");
          return;
        }
        const chance = 0.45 + state.rep * 0.03 + state.regulars * 0.04 - state.risk * 0.03;
        if (Math.random() > chance) {
          state.energy--;
          advance("待ったが、今日は客がつかなかった。");
          return;
        }
        const pay = 3 + Math.floor(Math.random() * 5);
        state.money += pay;
        state.energy -= 2;
        state.rep++;
        let text = `客を一人取った。${pay}を得た。`;
        if (Math.random() < 0.18 + state.rep * 0.01) {
          state.regulars++;
          text += " また来たいと言われた。常連になるかもしれない。";
        }
        advance(text);
      }

      function payDebt() {
        if (state.money <= 0 || state.debt <= 0) {
          render("今は返せる金がない。\n");
          return;
        }
        const amount = Math.min(5, state.money, state.debt);
        state.money -= amount;
        state.debt -= amount;
        render(`${amount}を借金の返済に回した。`);
      }

      function actionButton(label, fn, primary = false, disabled = false) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        if (primary) b.classList.add("primary");
        b.disabled = disabled;
        b.addEventListener("click", fn);
        return b;
      }

      function render(message = "") {
        clamp();
        $("dayText").textContent = `${state.day}日目`;
        $("phaseText").textContent = phases[state.phase];
        $("moneyText").textContent = state.money;
        $("debtText").textContent = state.debt;
        $("energyText").textContent = state.energy;
        $("repText").textContent = state.rep;
        $("regularText").textContent = state.regulars;
        $("riskText").textContent = state.risk;

        const pd = placeData[state.place];
        $("placeText").textContent = pd.name;
        $("sceneText").textContent = message || pd.text;
        $("notice").textContent = state.debt > 0
          ? `借金は残り${state.debt}。返し切れば、この部屋を出る道も見えてくる。`
          : "借金は返し終えた。ここを出るか、残るかを自分で選べる。";

        const actions = $("actions");
        actions.replaceChildren();

        if (state.place === "room") {
          actions.append(actionButton("休む", () => { state.energy += 2; advance("横になって休んだ。体力が少し戻った。"); }, true));
          actions.append(actionButton("借金を返す（最大5）", payDebt, false, state.money <= 0 || state.debt <= 0));
        }
        if (state.place === "well") {
          actions.append(actionButton("水を汲む・噂を聞く", () => advance(rumor()), true));
        }
        if (state.place === "market") {
          actions.append(actionButton("食事を買う（2）", () => {
            if (state.money < 2) return render("金が足りない。");
            state.money -= 2; state.energy += 2; advance("食事を買って食べた。");
          }, true));
          actions.append(actionButton("香油を買う（3）", () => {
            if (state.money < 3) return render("金が足りない。");
            state.money -= 3; state.rep++; advance("安い香油を買った。身支度が少し整った。");
          }));
        }
        if (state.place === "bath") {
          actions.append(actionButton("浴場を使う（2）", () => {
            if (state.money < 2) return render("金が足りない。");
            state.money -= 2; state.energy += 3; advance("浴場を使った。身体が少し軽くなった。");
          }, true, state.phase === 3));
        }
        if (state.place === "edge") {
          actions.append(actionButton("花や香草を摘む", () => {
            state.energy--; const gain = 1 + Math.floor(Math.random() * 3); state.money += gain;
            advance(`花や香草を集め、${gain}で売れる分を得た。`);
          }, true, state.phase === 3));
        }
        if (state.place === "pleasure") {
          actions.append(actionButton("今夜、客を取る", work, true));
          actions.append(actionButton("今日は取らずに帰る", () => { state.place = "room"; advance("今日は客を取らず、部屋へ戻った。"); }));
        }

        actions.append(actionButton("何もせず時間を進める", () => advance("しばらく時間を過ごした。")));

        const places = $("places");
        places.replaceChildren();
        places.append(actionButton("借り部屋", () => go("room"), state.place === "room"));
        if (state.phase !== 3) {
          places.append(actionButton("共同水場", () => go("well"), state.place === "well"));
          places.append(actionButton("小市場", () => go("market"), state.place === "market"));
        }
        if (state.phase === 0 || state.phase === 1 || state.phase === 2) {
          places.append(actionButton("公衆浴場", () => go("bath"), state.place === "bath"));
        }
        if (state.phase !== 3) {
          places.append(actionButton("水路沿い", () => go("edge"), state.place === "edge"));
        }
        if (state.phase >= 2) {
          places.append(actionButton("歓楽街の入口", () => go("pleasure"), state.place === "pleasure"));
        }
      }

      render();
    })();
  </script>
</body>
</html>
