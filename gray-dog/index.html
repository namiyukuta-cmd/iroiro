<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1d1a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>グレイと暮らす</title>
  <link rel="stylesheet" href="css/game.css?v=20261006-1">
</head>
<body>
  <main class="game-shell" aria-live="polite">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="chapterLabel">保護施設</p>
        <h1 id="dayLabel">訪問 1回目</h1>
      </div>
      <button class="icon-button" id="menuButton" aria-label="記録を開く">記録</button>
    </header>

    <section class="scene" id="scene">
      <div class="scene-copy">
        <p class="scene-place" id="placeLabel">譲渡会の一角</p>
        <p class="scene-text" id="sceneText">大きな黒灰色の犬が、少し離れた場所で伏せています。</p>
      </div>

      <div class="dog-stage" id="dogStage" data-distance="far" aria-label="グレイの様子">
        <svg class="dog" viewBox="0 0 320 230" role="img" aria-labelledby="dogTitle">
          <title id="dogTitle">大型犬のグレイ</title>
          <ellipse class="shadow" cx="165" cy="199" rx="105" ry="16"/>
          <path class="tail" d="M238 134 C278 121 292 91 274 70 C264 58 249 64 255 76 C266 97 248 105 229 110"/>
          <ellipse class="body" cx="165" cy="139" rx="88" ry="48"/>
          <path class="leg" d="M108 164 L100 209 L124 209 L132 163 Z"/>
          <path class="leg" d="M190 165 L187 209 L211 209 L216 159 Z"/>
          <path class="neck" d="M102 118 C83 109 73 92 80 73 C88 49 120 43 142 62 C153 72 157 91 148 109 Z"/>
          <ellipse class="head" cx="98" cy="78" rx="46" ry="41"/>
          <path class="ear ear-left" d="M68 51 L74 18 L94 45 Z"/>
          <path class="ear ear-right" d="M108 43 L131 18 L126 57 Z"/>
          <ellipse class="muzzle" cx="70" cy="91" rx="25" ry="18"/>
          <circle class="nose" cx="50" cy="91" r="8"/>
          <circle class="eye" cx="91" cy="72" r="4.5"/>
          <path class="collar" d="M110 112 C123 114 137 112 148 105"/>
        </svg>
        <div class="distance-line" id="distanceLine"><span></span></div>
      </div>

      <div class="observation" id="observationBox">
        <span class="observation-label">今日の様子</span>
        <strong id="observationText">こちらを見ません。耳だけが、ときどき周囲の音を追っています。</strong>
      </div>
    </section>

    <section class="action-panel">
      <div class="action-heading">
        <span id="actionTitle">どうする？</span>
        <span class="action-count" id="actionCount">1回選べます</span>
      </div>
      <div class="actions" id="actions"></div>
      <button class="primary-button hidden" id="advanceButton">今日は帰る</button>
    </section>

    <nav class="bottom-nav" aria-label="ゲームメニュー">
      <button class="nav-button active" data-panel="main">グレイ</button>
      <button class="nav-button" data-panel="home">準備</button>
      <button class="nav-button" data-panel="journal">記録</button>
      <button class="nav-button" data-panel="settings">保存</button>
    </nav>
  </main>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-card">
      <div class="sheet-header">
        <h2 id="sheetTitle">記録</h2>
        <button class="close-button" id="closeSheet" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-content" id="sheetContent"></div>
    </div>
  </div>

  <script src="js/state.js?v=20261006-2"></script>
  <script src="js/save.js?v=20261006-1"></script>
  <script src="js/events.js?v=20261006-1"></script>
  <script src="js/ui.js?v=20261006-2"></script>
  <script src="js/main.js?v=20261006-1"></script>
</body>
</html>
