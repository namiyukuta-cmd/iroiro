<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1d1a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>グレイと暮らす</title>
  <link rel="stylesheet" href="css/game.css?v=20261006-3">
</head>
<body>
  <main class="game-shell" aria-live="polite">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="chapterLabel">保護施設</p>
        <h1 id="dayLabel">訪問 1回目</h1>
      </div>
      <button class="icon-button" id="menuButton" aria-label="記録を開く">記録</button>
    </header>

    <section class="scene" id="scene">
      <div class="scene-copy">
        <p class="scene-place" id="placeLabel">譲渡会の一角</p>
        <p class="scene-text" id="sceneText">大きな黒灰色の犬が、少し離れた場所で伏せています。</p>
      </div>

      <div class="dog-stage" id="dogStage" data-distance="far" aria-label="グレイの様子">
        <svg class="dog" viewBox="0 0 420 260" role="img" aria-labelledby="dogTitle">
          <title id="dogTitle">伏せている大型犬のグレイ</title>
          <ellipse class="shadow" cx="220" cy="224" rx="145" ry="18"/>

          <path class="tail" d="M318 145 C354 137 381 116 385 91 C388 72 373 61 361 72 C352 80 357 93 369 94 C364 113 343 126 315 130"/>

          <path class="body" d="M139 121
            C166 99 218 92 267 102
            C303 109 327 129 330 153
            C333 177 317 194 291 200
            C257 208 216 199 179 194
            C151 190 126 177 119 156
            C113 140 120 130 139 121 Z"/>

          <path class="hind-leg rear" d="M275 174
            C300 175 314 187 309 201
            C304 214 286 219 260 218
            L224 218
            C218 218 215 212 220 208
            C236 197 247 180 275 174 Z"/>
          <path class="hind-leg front" d="M239 177
            C255 183 263 196 257 207
            C252 216 235 219 211 218
            L183 218
            C177 218 174 211 179 207
            C194 196 211 178 239 177 Z"/>

          <path class="chest" d="M146 126
            C132 136 126 151 128 169
            C130 183 138 195 150 202
            L167 197
            C162 181 162 159 171 141 Z"/>

          <path class="front-leg rear" d="M157 184
            C164 185 169 191 168 199
            L166 219
            L132 219
            C125 219 123 211 129 208
            L145 200
            L146 187 Z"/>
          <path class="front-leg front" d="M133 181
            C141 183 146 190 145 199
            L141 222
            L102 222
            C95 222 93 214 100 211
            L119 202
            L120 185 Z"/>

          <path class="neck" d="M154 139
            C138 130 123 118 113 101
            C104 86 104 70 114 58
            C126 44 150 44 168 56
            C184 68 192 87 189 108
            C187 122 178 135 167 145 Z"/>

          <path class="head" d="M119 57
            C108 47 94 42 80 46
            C64 50 53 64 51 80
            C49 96 57 109 71 116
            C84 123 103 120 117 111
            C129 103 136 91 135 76
            C134 68 128 62 119 57 Z"/>

          <path class="ear ear-left" d="M75 51 L68 20 L91 44 Z"/>
          <path class="ear ear-right" d="M102 47 L116 18 L123 58 Z"/>

          <path class="muzzle" d="M73 82
            C59 79 42 84 34 95
            C28 104 34 115 46 117
            C61 119 75 113 84 104
            C91 97 87 86 73 82 Z"/>
          <ellipse class="nose" cx="34" cy="101" rx="8" ry="7"/>
          <circle class="eye" cx="88" cy="72" r="4.5"/>
          <path class="brow" d="M80 64 C87 60 94 60 100 64"/>
          <path class="mouth" d="M45 110 C55 113 65 112 73 108"/>

          <path class="collar" d="M113 111 C128 119 146 121 162 116"/>
          <path class="chest-mark" d="M132 128 C144 133 153 143 157 157 C150 153 143 151 136 151 Z"/>
        </svg>
        <div class="distance-line" id="distanceLine"><span></span></div>
      </div>

      <div class="observation" id="observationBox">
        <span class="observation-label">今日の様子</span>
        <strong id="observationText">こちらを見ません。耳だけが、ときどき周囲の音を追っています。</strong>
      </div>
    </section>

    <section class="action-panel">
      <div class="action-heading">
        <span id="actionTitle">どうする？</span>
        <span class="action-count" id="actionCount">1回選べます</span>
      </div>
      <div class="actions" id="actions"></div>
      <button class="primary-button hidden" id="advanceButton">今日は帰る</button>
    </section>

    <nav class="bottom-nav" aria-label="ゲームメニュー">
      <button class="nav-button active" data-panel="main">グレイ</button>
      <button class="nav-button" data-panel="home">準備</button>
      <button class="nav-button" data-panel="journal">記録</button>
      <button class="nav-button" data-panel="settings">保存</button>
    </nav>
  </main>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-card">
      <div class="sheet-header">
        <h2 id="sheetTitle">記録</h2>
        <button class="close-button" id="closeSheet" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-content" id="sheetContent"></div>
    </div>
  </div>

  <script src="js/state.js?v=20261006-3"></script>
  <script src="js/save.js?v=20261006-2"></script>
  <script src="js/events.js?v=20261006-1"></script>
  <script src="js/ui.js?v=20261006-3"></script>
  <script src="js/main.js?v=20261006-1"></script>
</body>
</html>
