<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1d1a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>グレイと暮らす</title>
  <link rel="stylesheet" href="css/game.css?v=20261007-5">
</head>
<body>
  <main class="game-shell" aria-live="polite">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="chapterLabel">保護施設</p>
        <h1 id="dayLabel">訪問 1回目</h1>
      </div>
      <button class="icon-button" id="menuButton" aria-label="記録を開く">記録</button>
    </header>

    <section class="scene" id="scene">
      <div class="scene-copy">
        <div class="scene-meta">
          <p class="scene-place" id="placeLabel">譲渡会の一角</p>
          <span class="feedback-badge hidden" id="feedbackBadge"></span>
        </div>
        <p class="scene-text" id="sceneText">大きな黒灰色の犬が、少し離れた場所で伏せています。</p>
      </div>

      <div class="dog-stage" id="dogStage" data-distance="far" aria-label="グレイの様子">
        <img class="dog" id="grayDogImage" alt="大型雑種犬のグレイ">

      </div>

      <div class="observation" id="observationBox">
        <span class="observation-label">グレイの反応</span>
        <strong id="observationText">こちらを見ません。耳だけが、ときどき周囲の音を追っています。</strong>
      </div>
    </section>

    <section class="action-panel">
      <div class="action-heading">
        <span id="actionTitle">どうする？</span>
        <span class="action-count" id="actionCount">1回選べます</span>
      </div>
      <div class="actions" id="actions"></div>
      <button class="primary-button hidden" id="advanceButton">今日は帰る</button>
    </section>

    <nav class="bottom-nav" aria-label="ゲームメニュー">
      <button class="nav-button active" data-panel="main">グレイ</button>
      <button class="nav-button" data-panel="home">準備</button>
      <button class="nav-button" data-panel="journal">記録</button>
      <button class="nav-button" data-panel="settings">保存</button>
    </nav>
  </main>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-card">
      <div class="sheet-header">
        <h2 id="sheetTitle">記録</h2>
        <button class="close-button" id="closeSheet" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-content" id="sheetContent"></div>
    </div>
  </div>

  <script src="js/state.js?v=20261007-3"></script>
  <script src="js/save.js?v=20261006-2"></script>
  <script src="js/events.js?v=20261007-3"></script>
  <script src="js/ui.js?v=20261007-3"></script>
  <script src="js/gray-image.js?v=20261007-1"></script>
  <script src="js/main.js?v=20261006-2"></script>
</body>
</html>
