<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DD - 制作</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;min-height:100%;background:#f2efe7;color:#20201d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:13px;border-bottom:2px solid #aaa397}
    h1{margin:0;font-size:28px;line-height:1}
    #clock{font-size:14px;font-weight:900;text-align:right}
    .nav{display:block;margin-top:7px;color:#20201d;text-decoration:none;font-size:14px;font-weight:900;text-align:right}
    main{padding-top:16px}
    #craftList{border:2px dashed #aaa397;border-radius:12px;padding:28px 14px;text-align:center;font-size:17px;font-weight:900;color:#6d685f;background:#fff}
    html[data-dd-phase="夕方"] body{background:#eadfd1}
    html[data-dd-phase="夜"] body,html[data-dd-phase="深夜"] body{background:#d4d7dc}
  </style>
</head>
<body>
<div id="game">
  <header>
    <h1>制作</h1>
    <div>
      <div id="clock" data-dd-clock></div>
      <a class="nav" href="DD_top.html">← 小屋</a>
    </div>
  </header>
  <main>
    <div id="craftList">まだ制作レシピがない。</div>
  </main>
</div>
<script src="DD_time.js"></script>
<script src="DD_items.js"></script>
</body>
</html>
