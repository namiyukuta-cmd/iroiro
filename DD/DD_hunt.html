<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DD - 狩り</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#151812;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
    #game{position:relative;width:min(100%,520px);height:100dvh;margin:0 auto;overflow:hidden;background:linear-gradient(#1e241b,#11140f)}
    #top{position:absolute;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:rgba(0,0,0,.62)}
    #top a{color:#fff;text-decoration:none;font-weight:700}
    #topLeft{display:grid;gap:4px}
    #clock{font-size:11px;font-weight:800;white-space:nowrap}
    #stats{font-size:12px;text-align:right;line-height:1.45;max-width:72%}

    #searchWindow{position:absolute;z-index:10;width:230px;height:230px;left:calc(50% - 115px);top:20%;overflow:hidden;border:4px solid #d8d2c6;border-radius:50%;background:#55604e;box-shadow:0 0 0 7px #27231e,0 10px 25px rgba(0,0,0,.45),inset 0 0 22px rgba(0,0,0,.45);transition:left .46s ease,top .46s ease}
    #scene{position:absolute;inset:0;background:linear-gradient(#788071 0 44%,#46513f 44% 100%)}
    #scene:before,#scene:after{content:"";position:absolute;bottom:0;width:35px;height:92%;background:#303a2d;border-radius:50% 50% 0 0}
    #scene:before{left:13%}#scene:after{right:12%}
    .bush{position:absolute;bottom:0;width:74px;height:52px;border-radius:50% 50% 0 0;background:#364230}.bush.a{left:31%}.bush.b{right:23%;height:63px}

    #animal{display:none;position:absolute;left:50%;top:41%;width:174px;height:138px;transform:translate(-50%,-50%);transition:transform .22s ease,opacity .22s ease;opacity:1;text-align:center;transform-origin:50% 85%;z-index:5;pointer-events:none}
    #animalVisual{width:100%;height:100%;overflow:hidden;background:transparent;box-shadow:none}
    #animalImage{display:none;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:scale(var(--animal-image-scale,1));transform-origin:28% 36%;mix-blend-mode:multiply;filter:saturate(.96) contrast(1.04)}
    #animalGlyph{display:none;width:100%;height:100%;place-items:center;font-size:62px;line-height:1}
    #animalName{display:block;position:absolute;z-index:14;left:18px;right:18px;bottom:49px;text-align:center;font-size:16px;font-weight:900;line-height:1;text-shadow:0 2px 4px #000;pointer-events:none}
    #animal.hit{animation:animalHit .26s ease}
    #animal.dead{transform:translate(-50%,-43%) rotate(72deg);opacity:.88}
    @keyframes animalHit{
      0%{transform:translate(-50%,-50%)}
      25%{transform:translate(-58%,-50%) rotate(-5deg)}
      55%{transform:translate(-43%,-50%) rotate(5deg)}
      100%{transform:translate(-50%,-50%)}
    }

    #timingWrap{display:none;position:absolute;z-index:15;left:24px;right:24px;bottom:20px;height:20px;border:2px solid rgba(255,255,255,.95);border-radius:10px;background:rgba(20,20,20,.78);overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.5)}
    #hitZone{position:absolute;top:0;bottom:0;background:rgba(210,210,210,.58)}
    #timingMarker{position:absolute;top:-2px;bottom:-2px;width:5px;background:#fff;left:0;box-shadow:0 0 4px #000}

    #searchText{position:absolute;left:4%;right:4%;top:50%;text-align:center;font-weight:800;font-size:15px;line-height:1.35}

    #shootArea{position:absolute;left:0;right:0;bottom:0;height:44%;display:none}
    #bow{position:absolute;left:32px;top:37%;width:82px;height:175px;transform:translateY(-50%);border:6px solid #8b6842;border-right:none;border-radius:100% 0 0 100%}
    #string{position:absolute;left:111px;top:37%;width:3px;height:166px;background:#ddd;transform:translateY(-50%)}
    #arrow{position:absolute;left:111px;top:37%;width:110px;height:4px;background:#ddd;transform:translateY(-50%)}
    #arrow:after{content:"";position:absolute;right:-10px;top:-5px;border-left:12px solid #ddd;border-top:7px solid transparent;border-bottom:7px solid transparent}
    #guide{position:absolute;left:0;right:0;bottom:35px;text-align:center;font-weight:800;text-shadow:0 1px 3px #000}
    #result{position:absolute;z-index:40;left:50%;top:57%;transform:translate(-50%,-50%);padding:12px 18px;background:rgba(0,0,0,.82);border:1px solid #aaa;display:none;font-size:18px;white-space:nowrap}
  </style>
</head>
<body>
<div id="game">
  <div id="top">
    <div id="topLeft">
      <a id="backHome" href="DD_top.html">← 戻る</a>
      <div id="clock" data-dd-clock></div>
    </div>
    <div id="stats"></div>
  </div>

  <div id="searchWindow">
    <div id="scene"><i class="bush a"></i><i class="bush b"></i></div>
    <div id="animal">
      <div id="animalVisual">
        <img id="animalImage" alt="" />
        <span id="animalGlyph"></span>
      </div>
    </div>
    <span id="animalName"></span>
    <div id="timingWrap">
      <div id="hitZone"></div>
      <div id="timingMarker"></div>
    </div>
  </div>

  <div id="searchText">獲物を探している…</div>

  <div id="shootArea">
    <div id="bow"></div>
    <div id="string"></div>
    <div id="arrow"></div>
    <div id="guide">長押しで弓を引く　狙った位置で離す</div>
  </div>

  <div id="result"></div>
</div>

<script src="DD_time.js"></script>
<script src="DD_hunt_config.js"></script>
<script src="DD_items.js"></script>
<script src="DD_hunt.js"></script>
</body>
</html>
