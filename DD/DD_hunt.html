<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>DD - 狩り</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
    #game{position:relative;width:min(100%,520px);height:100dvh;margin:0 auto;overflow:hidden;background:linear-gradient(#68755e 0 45%,#263120 45% 100%)}
    #top{position:absolute;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:rgba(0,0,0,.55)}
    #top a{color:#fff;text-decoration:none;font-weight:700}
    #stats{font-size:12px;text-align:right;line-height:1.35}
    #animal{position:absolute;left:72%;top:46%;width:82px;height:48px;border-radius:48% 48% 42% 42%;background:#6f5942;transform:translate(-50%,-50%)}
    #animal:before{content:"";position:absolute;right:-20px;top:4px;width:29px;height:29px;border-radius:50%;background:#6f5942}
    #animal:after{content:"";position:absolute;right:-22px;top:12px;width:6px;height:6px;border-radius:50%;background:#111}
    .leg{position:absolute;bottom:-26px;width:7px;height:29px;background:#6f5942}.leg.a{left:18px}.leg.b{right:16px}
    #bow{position:absolute;left:38px;top:53%;width:84px;height:190px;transform:translateY(-50%);border:6px solid #8b6842;border-right:none;border-radius:100% 0 0 100%}
    #string{position:absolute;left:118px;top:53%;width:3px;height:180px;background:#eee;transform:translateY(-50%)}
    #arrow{position:absolute;left:118px;top:53%;width:115px;height:4px;background:#eee;transform:translateY(-50%);transform-origin:left center}
    #arrow:after{content:"";position:absolute;right:-10px;top:-5px;border-left:12px solid #eee;border-top:7px solid transparent;border-bottom:7px solid transparent}
    #powerWrap{position:absolute;left:10%;right:10%;bottom:92px;height:18px;border:2px solid #eee;background:rgba(0,0,0,.4)}
    #power{height:100%;width:0;background:#eee}
    #guide{position:absolute;left:0;right:0;bottom:38px;text-align:center;font-weight:800;text-shadow:0 1px 3px #000}
    #result{position:absolute;z-index:30;left:50%;top:28%;transform:translate(-50%,-50%);padding:12px 18px;background:rgba(0,0,0,.75);border:1px solid #aaa;display:none;font-size:20px}
  </style>
</head>
<body>
<div id="game">
  <div id="top"><a href="DD_top.html">← 戻る</a><div id="stats">弓 品質3<br>弓弦 強度3 / 矢 強度3</div></div>
  <div id="animal"><i class="leg a"></i><i class="leg b"></i></div>
  <div id="bow"></div><div id="string"></div><div id="arrow"></div>
  <div id="powerWrap"><div id="power"></div></div>
  <div id="guide">長押しで引く　離して放つ</div>
  <div id="result"></div>
</div>
<script>
(() => {
  const game=document.getElementById('game'),bar=document.getElementById('power'),string=document.getElementById('string'),arrow=document.getElementById('arrow'),animal=document.getElementById('animal'),result=document.getElementById('result');
  let pulling=false,start=0,power=0,raf=0;
  const bowQuality=3,stringStrength=3,arrowStrength=3;
  function show(text){result.textContent=text;result.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>result.style.display='none',1200)}
  function draw(){if(!pulling)return;power=Math.min(100,(performance.now()-start)/12);bar.style.width=power+'%';const px=Math.min(52,power*.52);string.style.transform=`translate(${-px}px,-50%)`;arrow.style.transform=`translate(${-px}px,-50%)`;raf=requestAnimationFrame(draw)}
  function begin(e){e.preventDefault();if(pulling)return;pulling=true;start=performance.now();power=0;raf=requestAnimationFrame(draw)}
  function release(e){if(!pulling)return;e.preventDefault();pulling=false;cancelAnimationFrame(raf);const strain=power/100;if(Math.random()<Math.max(0,strain-stringStrength*.17)){reset();show('弓弦が切れた');return}if(Math.random()<Math.max(0,strain-arrowStrength*.19)){reset();show('矢が折れた');return}const hit=Math.random()<0.5;fire(hit)}
  function fire(hit){const g=game.getBoundingClientRect(),a=animal.getBoundingClientRect(),sx=118,sy=g.height*.53,tx=a.left-g.left+a.width/2,ty=a.top-g.top+a.height/2;const dx=(tx-sx)+(hit?0:(Math.random()<.5?-1:1)*(80+Math.random()*140)),dy=(ty-sy)+(hit?0:(Math.random()<.5?-1:1)*(50+Math.random()*100)),dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;arrow.style.transition='none';arrow.style.transform='translate(0,-50%)';arrow.offsetHeight;arrow.style.transition='transform .32s linear';arrow.style.transform=`translate(${dist}px,${dy}px) rotate(${ang}deg)`;setTimeout(()=>{show(hit?'命中':'外れ');setTimeout(reset,400)},330)}
  function reset(){power=0;bar.style.width='0%';string.style.transform='translateY(-50%)';arrow.style.transition='none';arrow.style.transform='translateY(-50%)'}
  game.addEventListener('pointerdown',begin,{passive:false});game.addEventListener('pointerup',release,{passive:false});game.addEventListener('pointercancel',release,{passive:false});
})();
</script>
</body>
</html>
