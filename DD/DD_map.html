<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="dd-build" content="20260921touchfix1" />
  <title>DD - マップ</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b2119;color:#f1efe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{height:100svh}
    #game{position:relative;width:min(100%,520px);height:100svh;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#263024;overflow:hidden}
    header{flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.28);padding:0 3px 6px}h1{margin:0;font-size:24px}.headerRight{text-align:right;display:grid;gap:2px}#dayPhase{font-size:17px;font-weight:900}header a{color:#fff;text-decoration:none;font-size:14px;font-weight:800}
    #message{flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#d9ddd6}
    #mapWrap{position:relative;flex:1 1 auto;min-height:0;border:2px solid #161a15;border-radius:12px;overflow:hidden;background:#53634c}
    #mapScene{position:absolute;inset:0;background:radial-gradient(circle at 18% 18%,rgba(25,55,27,.95) 0 16%,transparent 17%),radial-gradient(circle at 31% 32%,rgba(45,80,40,.9) 0 18%,transparent 19%),linear-gradient(110deg,#496344 0 42%,#7d7a4d 43% 76%,#527681 77% 100%)}
    #mapScene::before{content:"";position:absolute;left:77%;top:-5%;width:14%;height:115%;background:rgba(92,142,159,.72);transform:rotate(4deg);border-left:2px solid rgba(215,235,239,.35);border-right:2px solid rgba(215,235,239,.25)}
    #mapScene::after{content:"";position:absolute;left:37%;top:0;width:2px;height:100%;background:rgba(232,219,175,.18);transform:rotate(-18deg);transform-origin:top}

    .mapPlace{position:absolute;z-index:4;touch-action:manipulation;transform:translate(-50%,-50%);min-width:88px;min-height:44px;padding:8px 8px;border:1px solid rgba(255,255,255,.7);border-radius:7px;background:rgba(24,29,23,.72);color:#fff;font-size:12px;font-weight:900;text-align:center;line-height:1.15;display:flex;align-items:center;justify-content:center;pointer-events:auto}
    .mapPlace.current{border-color:#ffe36b}
    .mapPlace.selected{outline:2px solid rgba(255,255,255,.9);outline-offset:2px}
    #place-deepForest{left:14%;top:15%}#place-northForest{left:31%;top:29%}#place-cabin{left:39%;top:58%}#place-plain{left:67%;top:40%}#place-river{left:84%;top:72%}

    #mapPin{position:absolute;z-index:6;width:28px;height:28px;border:4px solid #fff;border-radius:50% 50% 50% 0;background:#ffe36b;transform:translate(-50%,-85%) rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.5);transition:left .24s ease,top .24s ease;pointer-events:none}
    #mapPin::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#25231f;left:50%;top:50%;transform:translate(-50%,-50%)}
    #shade{position:absolute;inset:0;pointer-events:none;z-index:8;transition:background .3s ease}html[data-dd-phase="朝"] #shade{background:rgba(255,236,176,.04)}html[data-dd-phase="昼"] #shade{background:transparent}html[data-dd-phase="夕方"] #shade{background:rgba(111,54,20,.18)}html[data-dd-phase="夜"] #shade{background:rgba(11,19,48,.44)}html[data-dd-phase="深夜"] #shade{background:rgba(4,8,22,.6)}

    #selectorBox{flex:0 0 260px;border:1px solid rgba(255,255,255,.25);border-radius:11px;background:rgba(0,0,0,.24);padding:8px 10px;display:flex;flex-direction:column;gap:5px}
    #placeMenu{display:grid;gap:0;min-height:0}
    .placeMenuItem{position:relative;width:100%;touch-action:manipulation;min-height:40px;border:0;border-bottom:1px solid rgba(255,255,255,.13);background:transparent;color:#f1efe7;text-align:left;padding:4px 58px 4px 28px;font:inherit;font-size:14px;font-weight:900}
    .placeMenuItem:last-child{border-bottom:0}.placeMenuItem::before{content:"";position:absolute;left:6px;top:50%;transform:translateY(-50%)}.placeMenuItem.selected{background:rgba(255,255,255,.1)}.placeMenuItem.selected::before{content:"▶"}.placeMenuItem .cost{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:800;opacity:.78}.placeMenuItem .here{font-size:9px;margin-left:5px;color:#ffe36b}
    #selectedInfo{font-size:11px;line-height:1.3;color:#d9ddd6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #confirmMove{min-height:46px;touch-action:manipulation;border:1px solid #f0eee5;border-radius:8px;background:#f0eee5;color:#171817;font-size:14px;font-weight:1000}
  </style>
</head>
<body>
<div id="game">
  <header><h1>周辺マップ</h1><div class="headerRight"><div id="dayPhase"></div><a href="DD_top.html">小屋画面へ</a></div></header>
  <div id="message">場所を選ぶとピンが移動する。</div>
  <div id="mapWrap">
    <div id="mapScene"></div>
    <button id="place-deepForest" class="mapPlace" type="button" data-place="deepForest">深い森</button>
    <button id="place-northForest" class="mapPlace" type="button" data-place="northForest">北の森</button>
    <button id="place-cabin" class="mapPlace" type="button" data-place="cabin">小屋</button>
    <button id="place-plain" class="mapPlace" type="button" data-place="plain">開けた平原</button>
    <button id="place-river" class="mapPlace" type="button" data-place="river">川辺</button>
    <div id="mapPin" aria-hidden="true"></div>
    <div id="shade"></div>
  </div>
  <section id="selectorBox" aria-label="場所選択">
    <div id="placeMenu"></div>
    <div id="selectedInfo"></div>
    <button id="confirmMove" type="button"></button>
  </section>
</div>
<script src="DD_time.js?v=20260916cursor2"></script>
<script src="DD_items.js?v=20260916cursor2"></script>
<script src="DD_wolf.js?v=20260916cursor2"></script>
<script src="DD_event.js?v=20260916cursor2"></script>
<script src="DD_map.js?v=20260921touchfix1"></script>
</body>
</html>
