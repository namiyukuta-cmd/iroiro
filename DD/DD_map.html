<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>DD - マップ</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b2119;color:#f1efe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{height:100dvh}
    #game{position:relative;width:min(100%,520px);height:100dvh;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;background:#263024;overflow:hidden}
    header{flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.28);padding:0 3px 5px}
    h1{margin:0;font-size:22px}
    .headerRight{text-align:right;display:grid;gap:2px}
    #dayPhase{font-size:15px;font-weight:800}
    header a{color:#fff;text-decoration:none;font-size:14px;font-weight:700}
    #message{flex:0 0 40px;border:1px solid rgba(255,255,255,.24);border-radius:7px;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:5px 8px;text-align:center;font-size:14px;font-weight:700}
    #boardWrap{position:relative;flex:1 1 auto;min-height:0;border:2px solid #161a15;border-radius:8px;overflow:hidden;background:#354333}
    #board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:1px;background:#151b14}
    .cell{position:relative;min-width:0;min-height:0;border:0;padding:0;font:inherit;color:#fff;overflow:hidden;cursor:pointer;isolation:isolate}
    .cell::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.11);pointer-events:none;z-index:8}
    .forest{background:linear-gradient(145deg,#4b6345,#344b32)}
    .plain{background:linear-gradient(145deg,#8d8b57,#6f7047)}
    .river{background:linear-gradient(145deg,#617f88,#496a75)}
    .cabin{background:linear-gradient(145deg,#8b7358,#6f5944)}
    .deepForest{background:linear-gradient(145deg,#344831,#243724)}

    .cell.reachable{box-shadow:inset 0 0 0 4px #f4d35e;filter:brightness(1.15) saturate(1.08)}
    .cell.reachable::before{content:"";position:absolute;inset:4px;background:rgba(255,239,150,.16);pointer-events:none;z-index:1}
    .cell.selected:not(.current):not(.reachable){box-shadow:inset 0 0 0 3px #fff}
    .cell.current{background:linear-gradient(145deg,#4d5264,#343846);box-shadow:inset 0 0 0 4px #e9edf7,inset 0 0 0 7px #232631;filter:none}

    .terrainLabel{position:absolute;left:4px;bottom:3px;font-size:11px;font-weight:700;line-height:1;text-shadow:0 1px 2px #000;opacity:.9;z-index:3}
    .poi{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:20px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65));pointer-events:none;z-index:4}
    .animal{font-size:24px}

    .pawn{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:700;line-height:1;text-shadow:0 2px 2px #000,0 0 5px rgba(0,0,0,.85)}
    .pawnClock{position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:7;pointer-events:none;min-width:54px;padding:2px 5px;border:2px solid #fff;border-radius:8px;background:#17191f;color:#fff;font-size:16px;font-weight:900;line-height:1.1;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.65);white-space:nowrap}

    #shade{position:absolute;inset:0;pointer-events:none;z-index:20;transition:background .3s ease}
    html[data-dd-phase="朝"] #shade{background:rgba(255,236,176,.03)}
    html[data-dd-phase="昼"] #shade{background:transparent}
    html[data-dd-phase="夕方"] #shade{background:rgba(111,54,20,.17)}
    html[data-dd-phase="夜"] #shade{background:rgba(11,19,48,.43)}
    html[data-dd-phase="深夜"] #shade{background:rgba(4,8,22,.58)}
    #actionBox{flex:0 0 108px;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(0,0,0,.22);padding:8px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:6px 8px}
    #locationName{font-size:16px;font-weight:800}
    #moveCost{font-size:14px;text-align:right;opacity:.9;font-weight:700}
    #locationText{font-size:14px;line-height:1.4;align-self:center}
    #actions{display:flex;align-items:center;gap:6px;justify-content:flex-end}
    .action{min-width:82px;min-height:38px;border:1px solid #f0eee5;border-radius:7px;background:#f0eee5;color:#1c1c1c;font:inherit;font-size:14px;font-weight:800;padding:4px 9px}
    .action:disabled{opacity:.38}
    #legend{flex:0 0 28px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:700;opacity:.96;white-space:nowrap}
  </style>
</head>
<body>
<div id="game">
  <header>
    <h1>周辺マップ</h1>
    <div class="headerRight">
      <div id="dayPhase"></div>
      <a href="DD_top.html">小屋画面へ</a>
    </div>
  </header>

  <div id="message">黄色いマスをタップして移動する。</div>

  <div id="boardWrap">
    <div id="board" aria-label="周辺マップ"></div>
    <div id="shade"></div>
  </div>

  <div id="actionBox">
    <div id="locationName">現在地</div>
    <div id="moveCost"></div>
    <div id="locationText"></div>
    <div id="actions"></div>
  </div>

  <div id="legend">♟ 自分　黄色 移動可能　🦌🐇🐦 獲物　✦ 採取場所</div>
</div>

<script src="DD_time.js"></script>
<script src="DD_map.js"></script>
</body>
</html>
