<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DD - Game</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100dvh;
      background: #f5f4ef;
      color: #202020;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #game-root {
      width: min(100%, 520px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
    }
    header {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #bbb;
    }
    h1 { margin: 0; font-size: 24px; }
    .back {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }
    main {
      padding-top: 16px;
      display: grid;
      gap: 14px;
    }
    .scene {
      width: 100%;
      border: 2px solid #202020;
      background: #fff;
      overflow: hidden;
    }
    .scene img {
      display: block;
      width: 100%;
      height: auto;
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .choice {
      min-width: 0;
      min-height: 54px;
      border: 2px solid #202020;
      background: #fff;
      border-radius: 10px;
      font: inherit;
      cursor: pointer;
    }
    #huntButton {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 100;
      width: min(calc(100% - 32px), 488px);
      min-height: 58px;
      display: grid;
      place-items: center;
      border: 2px solid #202020;
      border-radius: 12px;
      background: #fff;
      color: #202020;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <header>
      <h1>DD</h1>
      <a class="back" href="DD_index.html">入口へ</a>
    </header>

    <main id="game-screen">
      <section class="scene">
        <img src="IMG_2788.jpeg" alt="DDの絵" />
      </section>
      <div class="choices" aria-label="選択肢">
        <button class="choice" type="button"></button>
        <button class="choice" type="button"></button>
        <button class="choice" type="button"></button>
        <button class="choice" type="button"></button>
      </div>
    </main>
  </div>

  <a id="huntButton" href="DD_hunt.html">狩り</a>
</body>
</html>
