<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DD - Game</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100dvh;
      background: #f5f4ef;
      color: #202020;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #game-root {
      width: min(100%, 520px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }
    header {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #bbb;
    }
    h1 { margin: 0; font-size: 24px; }
    .header-right { text-align: right; display: grid; gap: 4px; }
    #clock { font-size: 13px; font-weight: 800; }
    .back {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
    }
    main {
      padding-top: 16px;
      display: grid;
      gap: 14px;
    }
    .scene {
      width: 100%;
      border: 2px solid #202020;
      background: #fff;
      overflow: hidden;
    }
    .scene img {
      display: block;
      width: 100%;
      height: auto;
    }
    .choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .choice {
      width: 100%;
      min-height: 60px;
      border: 2px solid #202020;
      background: #fff;
      border-radius: 10px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <header>
      <h1>DD</h1>
      <div class="header-right">
        <div id="clock" data-dd-clock></div>
        <a class="back" href="DD_index.html">入口へ</a>
      </div>
    </header>

    <main id="game-screen">
      <section class="scene">
        <img src="IMG_2788.jpeg" alt="DDの絵" />
      </section>
      <div class="choices" aria-label="選択肢">
        <button class="choice" type="button" onclick="location.href='DD_map.html'">マップ</button>
      </div>
    </main>
  </div>

<script src="DD_time.js"></script>
</body>
</html>
