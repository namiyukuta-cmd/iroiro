<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="dd-build" content="20260920topfix1" />
  <title>DD - Game</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%}
    body{min-height:100dvh;background:#f5f4ef;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #game-root{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
    header{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #bbb}
    h1{margin:0;font-size:24px}.header-right{text-align:right;display:grid;gap:4px}#clock{font-size:13px;font-weight:800}.back{color:inherit;text-decoration:none;font-weight:700;font-size:12px}
    main{padding-top:16px;display:grid;gap:14px}.scene{width:100%;border:2px solid #202020;background:#fff;overflow:hidden}.scene img{display:block;width:100%;height:auto}
    #needs{display:grid;gap:8px}.need{border:2px solid #202020;border-radius:10px;background:#fff;padding:9px 10px}.needHead{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:900;margin-bottom:6px}.needBar{height:14px;border:2px solid #202020;border-radius:999px;overflow:hidden;background:#eeeae1}.needFill{height:100%;width:0;background:#202020;transition:width .2s ease}#wolfNeed{display:none}

    #menuBox{background:#fff;border:2px solid #202020;border-radius:12px;padding:7px 10px}
    #menuList{display:grid}
    .menuItem{position:relative;width:100%;min-height:42px;touch-action:manipulation;border:0;border-bottom:1px solid #ddd8cf;background:transparent;color:#202020;text-align:left;padding:8px 10px 8px 38px;font:inherit;font-size:18px;font-weight:900;cursor:pointer}
    .menuItem:last-child{border-bottom:0}
    .menuItem::before{content:"";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:18px}
    .menuItem.selected{background:#f2efe7}
    .menuItem.selected::before{content:"▶"}
    .menuItem:disabled{opacity:.42}
    .menuHint{margin-top:5px;text-align:right;font-size:10px;font-weight:800;color:#777168}
  </style>
</head>
<body>
<div id="game-root">
  <header><h1>DD</h1><div class="header-right"><div id="clock" data-dd-clock></div><a class="back" href="DD_index.html">入口へ</a></div></header>
  <main id="game-screen">
    <section class="scene"><img src="IMG_2788.jpeg" alt="DDの絵" /></section>
    <section id="needs" aria-label="空腹">
      <div class="need"><div class="needHead"><span>主人公の空腹</span><span id="playerHungerText">0 / 100</span></div><div class="needBar"><div id="playerHungerFill" class="needFill"></div></div></div>
      <div id="wolfNeed" class="need"><div class="needHead"><span id="wolfHungerLabel">狼の子の空腹</span><span id="wolfHungerText">0 / 100</span></div><div class="needBar"><div id="wolfHungerFill" class="needFill"></div></div></div>
    </section>
    <section id="menuBox" aria-label="ホームメニュー">
      <div id="menuList"></div>
      <div class="menuHint">▲▼で選択　決定で開く</div>
    </section>
  </main>
</div>
<script src="DD_time.js?v=20260920topfix1"></script>
<script src="DD_items.js?v=20260920topfix1"></script>
<script src="DD_wolf.js?v=20260920topfix1"></script>
<script src="DD_needs.js?v=20260920topfix1"></script>
<script>
(() => {
  const playerText=document.getElementById('playerHungerText'),playerFill=document.getElementById('playerHungerFill');
  const wolfNeed=document.getElementById('wolfNeed'),wolfLabel=document.getElementById('wolfHungerLabel'),wolfText=document.getElementById('wolfHungerText'),wolfFill=document.getElementById('wolfHungerFill');
  const menuList=document.getElementById('menuList');
  let index=0;

  function pupIsSleeping(state){if(state?.stage!=='pup')return false;const h=Number(window.DDTime?.getState?.().hour??12);return h>=20||h<7}
  function menuItems(){
    const items=[
      {label:'マップ',href:'DD_map.html'},
      {label:'アイテム',href:'DD_inventory.html'},
      {label:'寝る',href:'DD_sleep.html'},
      {label:'制作',href:'DD_craft.html'},
      {label:'料理',href:'DD_cook.html'}
    ];
    const state=window.DDWolf?.getState?.();
    if(state?.hasCompanion) items.push({label:state.stage==='adult'?'狼（？）の世話':pupIsSleeping(state)?'狼の子は眠っている':'狼の子の世話',href:'DD_wolf.html',disabled:pupIsSleeping(state)});
    return items;
  }

  function renderMenu(){
    const items=menuItems();
    if(index>=items.length)index=0;
    menuList.innerHTML='';
    items.forEach((item,i)=>{
      const button=document.createElement('button');
      button.type='button';
      button.className=`menuItem${i===index?' selected':''}`;
      button.textContent=item.label;
      button.disabled=!!item.disabled;
      button.addEventListener('click',()=>{
        if(item.disabled)return;
        index=i;
        location.href=item.href;
      });
      menuList.appendChild(button);
    });
  }

  function moveSelection(step){
    const items=menuItems();
    if(!items.length)return;
    let next=index;
    for(let n=0;n<items.length;n++){
      next=(next+step+items.length)%items.length;
      if(!items[next].disabled)break;
    }
    index=next;
    renderMenu();
  }
  function activate(){const item=menuItems()[index];if(item&&!item.disabled)location.href=item.href}
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'){e.preventDefault();moveSelection(-1)}
    else if(e.key==='ArrowDown'){e.preventDefault();moveSelection(1)}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}
  });

  function refreshNeeds(){const state=window.DDNeeds?.getState?.()||{playerHunger:0,wolfHunger:0,maxHunger:100,hasWolf:false};playerText.textContent=`${state.playerHunger} / ${state.maxHunger}`;playerFill.style.width=`${state.playerHunger}%`;wolfText.textContent=`${state.wolfHunger} / ${state.maxHunger}`;wolfFill.style.width=`${state.wolfHunger}%`;wolfNeed.style.display=state.hasWolf?'block':'none';const w=window.DDWolf?.getState?.();wolfLabel.textContent=w?.stage==='adult'?'狼（？）の空腹':'狼の子の空腹'}
  function refresh(){window.DDWolf?.updateAge?.();refreshNeeds();renderMenu()}
  ['ddwolfchange','ddinventorychange','ddtimechange','ddneedschange'].forEach(name=>window.addEventListener(name,refresh));
  refresh();
})();
</script>
</body>
</html>
