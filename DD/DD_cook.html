<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="dd-build" content="202609161115" />
  <title>DD - 料理</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;min-height:100%;background:#f2efe7;color:#20201d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:13px;border-bottom:2px solid #aaa397}
    h1{margin:0;font-size:28px;line-height:1}
    #headerRight{text-align:right;display:grid;gap:6px}
    #clock{font-size:14px;font-weight:900}
    .nav{color:#20201d;text-decoration:none;font-size:14px;font-weight:900}
    #intro{margin-top:14px;border:2px solid #20201d;border-radius:12px;background:#fff;padding:13px;font-size:14px;font-weight:800;line-height:1.55}
    #needBox{margin-top:10px;display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:1000}
    #cookResult{min-height:44px;margin-top:10px;border:2px solid #aaa397;border-radius:10px;padding:10px 12px;background:#faf8f2;font-size:14px;font-weight:900;line-height:1.45}
    #cookList{display:grid;gap:11px;margin-top:12px}
    .recipe{border:2px solid #20201d;border-radius:12px;background:#fff;padding:14px}
    .recipeTop{display:flex;justify-content:space-between;gap:10px;align-items:start}
    .recipeTitle{font-size:20px;font-weight:1000}
    .recipeCount{font-size:14px;font-weight:900;white-space:nowrap}
    .recipeMaterial{margin-top:7px;font-size:14px;font-weight:800;color:#5d5a53}
    .cookButton{width:100%;min-height:48px;margin-top:12px;border:2px solid #20201d;border-radius:9px;background:#20201d;color:#fff;font:inherit;font-size:16px;font-weight:1000}
    .cookButton:disabled{opacity:.35}
    html[data-dd-phase="夕方"] body{background:#eadfd1}
    html[data-dd-phase="夜"] body,html[data-dd-phase="深夜"] body{background:#d4d7dc}
  </style>
</head>
<body>
<div id="game">
  <header>
    <h1>料理</h1>
    <div id="headerRight">
      <div id="clock" data-dd-clock></div>
      <a class="nav" href="DD_top.html">← 小屋</a>
    </div>
  </header>

  <section id="intro">木の実はそのまま食べられる。キノコ・肉・魚は小屋で焼いてから食べる。</section>
  <div id="needBox"><span>主人公の空腹</span><span id="playerHunger">0 / 100</span></div>
  <div id="cookResult" aria-live="polite">食材を選ぶ。</div>
  <main id="cookList" aria-label="料理一覧"></main>
</div>

<script src="DD_time.js?v=202609161115"></script>
<script src="DD_items.js?v=202609161115"></script>
<script src="DD_wolf.js?v=202609161115"></script>
<script src="DD_needs.js?v=202609161115"></script>
<script src="DD_cook.js?v=202609161115"></script>
</body>
</html>
