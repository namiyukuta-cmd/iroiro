<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>DD - 森</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172018;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{height:100dvh}
    #game{width:min(100%,520px);height:100dvh;margin:0 auto;padding:max(7px,env(safe-area-inset-top)) 9px max(7px,env(safe-area-inset-bottom));background:linear-gradient(#263225,#151b15);display:flex;flex-direction:column;gap:6px;overflow:hidden}
    header{flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:5px;border-bottom:1px solid #778071}
    h1{margin:0;font-size:19px}
    a{color:#fff;text-decoration:none;font-weight:700;font-size:12px}
    #status{flex:0 0 38px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .panel{padding:4px 7px;border:1px solid #87907f;border-radius:7px;background:rgba(0,0,0,.22);font-size:10px;line-height:1.2;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
    .panel strong{font-size:13px}
    #message{flex:0 0 28px;padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.08);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center}
    #board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:5px}
    .card{position:relative;min-width:0;min-height:0;border:1.5px solid #b7b5a4;border-radius:7px;background:#3e4d3a;color:#fff;font:inherit;font-weight:800;font-size:11px;line-height:1.1;overflow:hidden;cursor:pointer;touch-action:manipulation;padding:2px}
    .card::before{content:'森';position:absolute;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.1em;background:linear-gradient(145deg,#4a5a43,#293426)}
    .card.open,.card.matched{background:#eee9d8;color:#222}
    .card.open::before,.card.matched::before{display:none}
    .card.matched{opacity:.58;border-style:dashed}
    .card:disabled{cursor:default}
    #resultBox{flex:0 0 auto;min-height:27px;max-height:43px;padding:4px 7px;border:1px solid #87907f;border-radius:7px;background:rgba(0,0,0,.22);font-size:10px;line-height:1.25;display:flex;flex-wrap:wrap;gap:1px 8px;align-content:center;overflow:hidden}
    .resultItem{white-space:nowrap}
    #finish{display:none;flex:0 0 32px;width:100%;margin:0;border:1.5px solid #eee;border-radius:7px;background:#eee;color:#171717;font:inherit;font-size:11px;font-weight:800}
  </style>
</head>
<body>
<div id="game">
  <header>
    <h1>森</h1>
    <a href="DD_top.html">小屋へ戻る</a>
  </header>

  <div id="status">
    <div class="panel">探索回数 <strong><span id="turn">0</span> / <span id="maxTurns">10</span></strong></div>
    <div class="panel">見つけたペア <strong><span id="pairs">0</span></strong></div>
  </div>

  <div id="message">同じものを2枚見つける。</div>
  <div id="board" aria-label="森の探索"></div>
  <div id="resultBox"></div>

  <button id="finish" type="button" onclick="location.href='DD_top.html'">探索を終えて小屋へ戻る</button>
</div>

<script src="DD_items.js"></script>
<script src="DD_survival_config.js"></script>
<script>
(() => {
  const config=window.DDSurvivalConfig||{};
  const itemDb=window.DDItems||{};
  const maxTurns=Math.max(1,Number(config.exploration?.maxTurns||10));
  document.getElementById('maxTurns').textContent=maxTurns;

  const forestItems=typeof itemDb.byZone==='function' ? itemDb.byZone('forest') : [];
  const fallbackItems=[
    {id:'branch',name:'木の枝'},
    {id:'vine',name:'蔓'},
    {id:'nuts',name:'木の実'},
    {id:'mushroom',name:'キノコ'},
    {id:'pebble',name:'小石'},
    {id:'herb',name:'薬草'}
  ];
  const itemDefs=(forestItems.length?forestItems:fallbackItems).slice(0,6);

  const pairDefs=itemDefs.map(item=>({key:item.id,label:item.name}));
  while(pairDefs.length<6){
    const source=pairDefs[pairDefs.length%Math.max(1,pairDefs.length)]||{key:'branch',label:'木の枝'};
    pairDefs.push({...source,key:source.key+'-extra-'+pairDefs.length});
  }

  const deck=pairDefs.flatMap(item=>[
    {...item,cardId:item.key+'-a'},
    {...item,cardId:item.key+'-b'}
  ]).slice(0,12);

  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }

  const board=document.getElementById('board');
  const turnEl=document.getElementById('turn');
  const pairsEl=document.getElementById('pairs');
  const message=document.getElementById('message');
  const finish=document.getElementById('finish');
  const resultBox=document.getElementById('resultBox');
  const counts={};
  itemDefs.forEach(item=>counts[item.id]=0);

  let turns=0;
  let pairCount=0;
  let first=null;
  let second=null;
  let locked=false;
  let ended=false;

  function updateCounts(){
    resultBox.innerHTML=itemDefs.map(item=>
      `<span class="resultItem">${item.name}：${counts[item.id]||0}</span>`
    ).join('');
  }

  function endExploration(text){
    ended=true;
    locked=true;
    message.textContent=text;
    finish.style.display='block';
    board.querySelectorAll('.card').forEach(btn=>btn.disabled=true);
  }

  function checkEnd(){
    if(pairCount===6){
      endExploration('森で見つけられるペアをすべて見つけた。');
      return true;
    }
    if(turns>=maxTurns){
      endExploration(`${maxTurns}回の探索が終わった。`);
      return true;
    }
    return false;
  }

  function closeCards(){
    if(first) first.button.classList.remove('open');
    if(second) second.button.classList.remove('open');
    first=null;
    second=null;
    locked=false;
    checkEnd();
  }

  function choose(entry,button){
    if(ended||locked||button.classList.contains('open')||button.classList.contains('matched'))return;

    button.classList.add('open');
    button.textContent=entry.label;

    if(!first){
      first={entry,button};
      return;
    }

    second={entry,button};
    locked=true;
    turns++;
    turnEl.textContent=turns;

    if(first.entry.key===second.entry.key){
      first.button.classList.remove('open');
      second.button.classList.remove('open');
      first.button.classList.add('matched');
      second.button.classList.add('matched');
      first.button.disabled=true;
      second.button.disabled=true;
      const itemKey=entry.key.replace(/-extra-\d+$/,'');
      counts[itemKey]=(counts[itemKey]||0)+1;
      pairCount++;
      pairsEl.textContent=pairCount;
      updateCounts();
      message.textContent=`${entry.label}を見つけた。`;
      first=null;
      second=null;
      locked=false;
      checkEnd();
    }else{
      message.textContent='違う。';
      setTimeout(closeCards,700);
    }
  }

  deck.forEach(entry=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='card';
    button.setAttribute('aria-label','伏せられたカード');
    button.addEventListener('click',()=>choose(entry,button));
    board.appendChild(button);
  });

  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  updateCounts();
})();
</script>
</body>
</html>
