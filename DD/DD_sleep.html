<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DD - 寝る</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;min-height:100%;background:#efede7;color:#20201d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));display:grid;align-content:start;gap:16px}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:2px solid #aaa397}
    h1{margin:0;font-size:28px}
    #clock{font-size:14px;font-weight:900;text-align:right}
    .nav{display:block;margin-top:7px;color:#20201d;text-decoration:none;font-weight:900;font-size:14px;text-align:right}
    .panel{border:2px solid #292823;border-radius:12px;background:#fff;padding:14px}
    .panel h2{margin:0 0 10px;font-size:19px}
    #hungerText{font-size:14px;font-weight:900;margin-bottom:7px}
    .bar{height:18px;border:2px solid #292823;border-radius:999px;overflow:hidden;background:#eeeae1}
    #hungerFill{height:100%;width:0;background:#292823;transition:width .2s ease}
    #sleepChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sleepButton{min-height:62px;border:2px solid #292823;border-radius:10px;background:#fff;font:inherit;font-size:17px;font-weight:1000}
    #message{min-height:52px;border:1px solid #aaa397;border-radius:10px;background:#faf8f2;padding:12px;font-size:15px;font-weight:900;line-height:1.5}
  </style>
</head>
<body>
<div id="game">
  <header>
    <h1>寝る</h1>
    <div>
      <div id="clock" data-dd-clock></div>
      <a class="nav" href="DD_top.html">← 小屋</a>
    </div>
  </header>

  <section class="panel">
    <h2>主人公の空腹</h2>
    <div id="hungerText">空腹 0 / 100</div>
    <div class="bar"><div id="hungerFill"></div></div>
  </section>

  <section class="panel">
    <h2>睡眠時間</h2>
    <div id="sleepChoices">
      <button class="sleepButton" type="button" data-minutes="60">1時間寝る</button>
      <button class="sleepButton" type="button" data-minutes="180">3時間寝る</button>
      <button class="sleepButton" type="button" data-minutes="480">8時間寝る</button>
      <button id="untilMorning" class="sleepButton" type="button">朝7時まで</button>
    </div>
  </section>

  <div id="message">寝る時間を選ぶ。</div>
</div>

<script src="DD_time.js"></script>
<script src="DD_items.js"></script>
<script src="DD_needs.js"></script>
<script src="DD_sleep.js"></script>
</body>
</html>
