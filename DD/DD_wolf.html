<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DD - 狼の世話</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;min-height:100%;background:#eeeae1;color:#1f1e1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:2px solid #aaa397}
    h1{margin:0;font-size:27px}
    #clock{font-size:13px;font-weight:900;text-align:right}
    .nav{display:block;margin-top:6px;color:#1f1e1a;text-decoration:none;font-size:14px;font-weight:900;text-align:right}
    #wolfCard{border:2px solid #25241f;border-radius:14px;background:#fff;padding:16px;display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
    #wolfIcon{width:92px;height:92px;border-radius:50%;background:#ded9ce;display:grid;place-items:center;font-size:48px}
    #wolfName{font-size:23px;font-weight:1000}
    #wolfStage{margin-top:4px;font-size:14px;font-weight:900;color:#5e5a51}
    #growth{margin-top:8px;font-size:14px;font-weight:800;line-height:1.45}
    .panel{border:2px solid #2a2924;border-radius:12px;background:#faf8f2;padding:14px}
    .panel h2{margin:0 0 10px;font-size:19px}
    #hungerText{font-size:14px;font-weight:900;margin-bottom:7px}
    .bar{height:18px;border:2px solid #2a2924;border-radius:999px;overflow:hidden;background:#e7e1d6}
    #hungerFill{height:100%;width:0;background:#2a2924;transition:width .2s ease}
    #diet{font-size:15px;font-weight:900;margin-bottom:10px}
    #meatList{display:grid;gap:8px}
    .meatRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .meatInfo{font-size:15px;font-weight:900}
    .feedButton,.behaviorButton,.careButton{min-height:44px;border:2px solid #24231f;border-radius:9px;background:#24231f;color:#fff;font:inherit;font-weight:900;padding:8px 12px}
    .feedButton:disabled{opacity:.35}
    #noMeat{font-size:14px;font-weight:800;color:#6c675e}
    #careButtons{display:grid;grid-template-columns:1fr;gap:8px}
    #careText,#behaviorText{min-height:70px;border:1px solid #aaa397;border-radius:9px;background:#fff;padding:12px;font-size:16px;font-weight:800;line-height:1.55;margin-bottom:10px}
    #message{min-height:30px;font-size:14px;font-weight:900;color:#59554d}
    html[data-dd-phase="夕方"] body{background:#e7d9c9}
    html[data-dd-phase="夜"] body,html[data-dd-phase="深夜"] body{background:#c8ccd2}
  </style>
</head>
<body>
<div id="game">
  <header>
    <h1>狼の世話</h1>
    <div>
      <div id="clock" data-dd-clock></div>
      <a class="nav" href="DD_top.html">← 小屋</a>
    </div>
  </header>

  <section id="wolfCard">
    <div id="wolfIcon">🐺</div>
    <div>
      <div id="wolfName">狼の子（？）</div>
      <div id="wolfStage"></div>
      <div id="growth"></div>
    </div>
  </section>

  <section class="panel">
    <h2>空腹</h2>
    <div id="hungerText">空腹 0 / 100</div>
    <div class="bar"><div id="hungerFill"></div></div>
  </section>

  <section class="panel">
    <h2>食事</h2>
    <div id="diet">完全肉食。肉しか食べない。</div>
    <div id="meatList"></div>
    <div id="noMeat"></div>
  </section>

  <section class="panel">
    <h2>お世話</h2>
    <div id="careText">どうする？</div>
    <div id="careButtons">
      <button id="petButton" class="careButton" type="button">撫でる</button>
      <button id="hugButton" class="careButton" type="button">抱きしめる</button>
      <button id="lullabyButton" class="careButton" type="button">子守唄を歌う</button>
    </div>
  </section>

  <section class="panel">
    <h2>様子</h2>
    <div id="behaviorText">様子を見てみる。</div>
    <button id="behaviorButton" class="behaviorButton" type="button">様子を見る</button>
  </section>

  <div id="message"></div>
</div>

<script src="DD_time.js"></script>
<script src="DD_items.js"></script>
<script src="DD_wolf.js"></script>
<script src="DD_needs.js"></script>
<script src="DD_wolf_home.js"></script>
</body>
</html>
