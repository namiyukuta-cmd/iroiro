<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="dd-build" content="20260916wolfassist1" />
  <title>DD - 地点探索</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    :root{--ink:#24231f;--paper:#f5f1e8;--purple:#65509d;--hero:#35b8df;--wolf:#c95a86;--danger:#b84d3e;--card:#e7c94e}
    html,body{margin:0;width:100%;min-height:100%;background:#ece8df;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}
    button,a{font:inherit}
    button{touch-action:manipulation}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}

    #topPanel{border:3px solid var(--purple);border-radius:18px;background:#faf8f2;padding:10px 11px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
    #clockArea{display:flex;align-items:center;gap:8px;min-width:0}
    #clockDial{position:relative;width:66px;height:66px;flex:0 0 66px;border:4px solid var(--purple);border-radius:50%;background:#fff}
    #clockDial::before{content:"12";position:absolute;left:50%;top:2px;transform:translateX(-50%);font-size:9px;font-weight:900}
    #clockDial::after{content:"6";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:9px;font-weight:900}
    #clockDial.timeReceive{animation:clockReceive .32s ease}
    @keyframes clockReceive{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
    #hourHand,#minuteHand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:999px;background:#25231f}
    #hourHand{width:4px;height:19px;margin-left:-2px}
    #minuteHand{width:3px;height:25px;margin-left:-1.5px}
    #clockPin{position:absolute;width:8px;height:8px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#25231f}
    #timeText{font-size:27px;font-weight:1000;line-height:1;letter-spacing:-1px;white-space:nowrap}
    #dayText{margin-top:5px;font-size:12px;font-weight:900;white-space:nowrap}
    #topInfo{min-width:0;display:flex;flex-direction:column;align-items:flex-end}
    #placeName{font-size:19px;font-weight:1000;line-height:1.15;text-align:right}
    #placeType{margin-top:2px;font-size:12px;font-weight:900;opacity:.62}
    #topLinks{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:5px}
    .headLink{color:#292725;text-decoration:none;font-size:12px;font-weight:1000}
    #autoControls{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;flex-wrap:wrap}
    #autoButton,#autoSpeedButton{min-height:34px;border:2px solid var(--ink);border-radius:9px;background:#fff;color:#1d1d1b;font-size:12px;font-weight:1000;padding:5px 9px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
    #autoSpeedButton{background:#e9e4da}
    #autoButton.on{background:var(--ink);color:#fff}
    #autoButton:active,#autoSpeedButton:active{transform:translateY(1px);box-shadow:none}

    #encounterArea{position:relative;border:2px solid #aaa397;border-radius:16px;background:rgba(255,255,255,.28);padding:10px 8px 8px}
    #encounterStage{position:relative;height:254px;display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center}
    #cardColumn{position:relative;height:100%;display:grid;place-items:center}
    #cardSlot{position:relative;width:158px;height:216px;border:3px dashed #8b867c;border-radius:15px;background:rgba(255,255,255,.46);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease,background .15s ease,border-color .15s ease}
    #cardSlot.empty:active{transform:scale(.97);background:#fff}
    #cardSlot.busy{cursor:default;border-style:solid;border-color:#b8b1a6}
    #slotPrompt{padding:14px;text-align:center;font-size:14px;font-weight:1000;line-height:1.45;color:#625f58}
    #drawn{position:absolute;inset:9px;width:auto;height:auto;border:4px solid var(--card);border-radius:12px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;transform-origin:center;z-index:2}
    #drawn.dealIn{animation:dealIn .18s ease-out}
    #drawn.hitFlash{animation:cardHit .28s ease}
    @keyframes dealIn{from{opacity:.2;transform:translateY(-12px) scale(.95)}to{opacity:1;transform:none}}
    @keyframes cardHit{0%,100%{transform:none}35%{transform:translateX(-7px) rotate(-2deg)}70%{transform:translateX(6px) rotate(2deg)}}
    #cardIcon{font-size:52px;line-height:1;margin-bottom:10px}
    #cardTitle{font-size:19px;font-weight:1000;line-height:1.2}
    #cardSub{margin-top:7px;font-size:12px;font-weight:900;color:#666}

    #encounterStatus{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
    #statusName{font-size:14px;font-weight:1000;line-height:1.25;min-height:18px}
    .statusBar{height:15px;border:2px solid var(--ink);border-radius:999px;background:#ddd7cd;overflow:hidden}
    .statusFill{height:100%;width:100%;transition:width .2s ease}
    #enemyHpFill{background:var(--danger)}
    #statusValue{font-size:11px;font-weight:1000;text-align:right}
    #battleRound{font-size:12px;font-weight:1000;min-height:16px}
    #enemyIntent{font-size:11px;font-weight:800;line-height:1.35;color:#5d5952;min-height:32px}

    #cardActions{display:none;gap:8px;margin-top:5px}
    #cardActions.show{display:flex}
    #cardActions button{flex:1;min-height:43px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:14px;font-weight:1000;box-shadow:0 3px 0 rgba(0,0,0,.13)}
    #discardAction{background:#e7e2d8!important}
    #cardHint{text-align:center;min-height:20px;margin-top:6px;font-size:12px;font-weight:900;color:#5d5952}

    #eventStrip{border:2px solid #383631;border-radius:11px;background:#faf8f2;padding:8px 10px;min-height:66px}
    #eventText{font-size:15px;font-weight:1000;line-height:1.35;min-height:21px}
    #eventDetail{margin-top:3px;font-size:12px;font-weight:800;color:#5d5952;line-height:1.35;min-height:17px}
    #result{margin-top:2px;font-size:12px;font-weight:1000;color:#514e47;min-height:16px}

    #partyArea{position:relative;min-height:318px;margin-top:2px}
    #partyTabs{height:42px;display:flex;align-items:flex-end;padding:0 8px;gap:4px;position:relative;z-index:3}
    .partyTab{min-width:122px;height:42px;border:3px solid var(--ink);border-bottom:0;border-radius:13px 13px 0 0;background:#fff;font-weight:1000;font-size:14px;padding:5px 10px;position:relative;top:3px}
    #heroTab{border-color:var(--hero);background:#eaf9fd}
    #wolfTab{border-color:var(--wolf);background:#fdebf2;display:none;margin-left:-12px}
    #heroTab.active{z-index:3;top:0;background:#d8f5fc}
    #wolfTab.active{z-index:3;top:0;background:#fbdde9}
    .miniHp{display:block;font-size:10px;font-weight:900;margin-top:1px}

    #partyPanel{position:relative;z-index:2;min-height:270px;border:4px solid var(--hero);border-radius:14px;background:#fbfaf6;padding:11px 10px 10px;overflow:hidden}
    #partyPanel.wolfMode{border-color:var(--wolf)}
    #partyHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    #turnLabel{font-size:14px;font-weight:1000;line-height:1.2}
    #inventoryButton{flex:0 0 auto;border:2px solid var(--ink);border-radius:9px;background:#fff;color:#1d1d1b;text-decoration:none;font-size:12px;font-weight:1000;padding:7px 9px}
    #allyStatus{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    #allyStatusName{font-size:13px;font-weight:1000;min-width:58px}
    #allyHpBar{flex:1;height:13px;border:2px solid var(--ink);border-radius:999px;background:#ddd7cd;overflow:hidden}
    #allyHpFill{height:100%;width:100%;background:var(--hero);transition:width .2s ease}
    #partyPanel.wolfMode #allyHpFill{background:var(--wolf)}
    #allyHpValue{font-size:11px;font-weight:1000;min-width:36px;text-align:right}
    #actionGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;align-content:start}
    .actionTile{min-width:0;min-height:70px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:6px 3px;font-size:11px;font-weight:1000;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
    .actionTile:disabled{opacity:.42;box-shadow:none}
    .actionIcon{font-size:25px;line-height:1}
    .actionCount{font-size:10px;color:#666}
    #partyNote{margin-top:8px;font-size:11px;font-weight:800;color:#656159;line-height:1.4}

    .attackFx{position:fixed;z-index:10020;pointer-events:none;font-size:28px;line-height:1;will-change:transform,opacity}
    .damagePop{position:fixed;z-index:10021;pointer-events:none;font-size:17px;font-weight:1000;background:#24231f;color:#fff;border-radius:999px;padding:3px 7px;animation:damagePop .6s ease forwards}
    @keyframes damagePop{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}25%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-17px) scale(1)}}
    .inventoryFly{position:fixed;z-index:10010;border:3px solid var(--ink);border-radius:11px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;pointer-events:none;will-change:transform,opacity;box-shadow:0 7px 20px rgba(0,0,0,.25)}
    .inventoryFly .flyIcon{font-size:34px;line-height:1;margin-bottom:5px}
    .inventoryFly .flyTitle{font-size:13px;font-weight:1000}
    .timeSparkle{position:fixed;z-index:10030;pointer-events:none;font-size:18px;font-weight:1000;color:#f1c934;text-shadow:0 0 5px #fff;will-change:transform,opacity}
    .timeGain{position:fixed;z-index:10031;transform:translateX(-50%);pointer-events:none;padding:3px 7px;border-radius:999px;background:#20201d;color:#fff;font-size:11px;font-weight:1000;white-space:nowrap;animation:timeGain .65s ease forwards}
    @keyframes timeGain{0%{opacity:0;transform:translate(-50%,5px) scale(.85)}25%{opacity:1;transform:translate(-50%,0) scale(1.06)}100%{opacity:0;transform:translate(-50%,-12px) scale(1)}}

    html[data-dd-phase="夕方"] body{background:#e5d8c8}
    html[data-dd-phase="夜"] body,html[data-dd-phase="深夜"] body{background:#c7cbd1}
    @media (max-width:360px){
      #game{padding-left:8px;padding-right:8px}
      #topPanel{grid-template-columns:1fr}
      #topInfo{align-items:flex-start}
      #topLinks,#autoControls{justify-content:flex-start}
      #encounterStage{grid-template-columns:1fr 92px}
      #cardSlot{width:146px}
      #actionGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .partyTab{min-width:108px}
    }
  </style>
</head>
<body>
<div id="game">
  <header id="topPanel">
    <div id="clockArea">
      <div id="clockDial" aria-hidden="true"><div id="hourHand"></div><div id="minuteHand"></div><div id="clockPin"></div></div>
      <div><div id="timeText">07:00</div><div id="dayText">1日目　朝</div></div>
    </div>
    <div id="topInfo">
      <div id="placeName">森</div>
      <div id="placeType">探索地点</div>
      <div id="topLinks"><a class="headLink" href="DD_inventory.html">アイテム</a><a class="headLink" href="DD_map.html?v=20260916wolfassist1">← マップ</a></div>
      <div id="autoControls"><button id="autoButton" type="button" aria-pressed="false">オート：OFF</button><button id="autoSpeedButton" type="button">速度：ゆっくり</button></div>
    </div>
  </header>

  <section id="encounterArea" aria-label="出る札">
    <div id="encounterStage">
      <div id="cardColumn">
        <div id="cardSlot" class="empty" role="button" tabindex="0" aria-label="札を出す">
          <div id="slotPrompt">ここをタップして札を出す</div>
          <div id="drawn" role="button" tabindex="-1" aria-live="polite"><div id="cardIcon"></div><div id="cardTitle"></div><div id="cardSub"></div></div>
        </div>
      </div>
      <aside id="encounterStatus" aria-label="札の状態">
        <div id="statusName">出る札</div>
        <div class="statusBar"><div id="enemyHpFill" class="statusFill"></div></div>
        <div id="statusValue">—</div>
        <div id="battleRound"></div>
        <div id="enemyIntent"></div>
      </aside>
    </div>
    <div id="cardActions" aria-label="札の選択肢"><button id="primaryAction" type="button">入手する</button><button id="discardAction" type="button">見送る</button></div>
    <div id="cardHint">空白をタップして次の札へ　6分</div>
  </section>

  <section id="eventStrip"><div id="eventText">空白をタップして札を出す。</div><div id="eventDetail">札を出すと6分進む。</div><div id="result"></div></section>

  <section id="partyArea" aria-label="味方">
    <div id="partyTabs">
      <button id="heroTab" class="partyTab active" type="button">主人公<span id="heroMiniHp" class="miniHp"></span></button>
      <button id="wolfTab" class="partyTab" type="button">狼（？）<span id="wolfMiniHp" class="miniHp"></span></button>
    </div>
    <div id="partyPanel">
      <div id="partyHead"><div id="turnLabel">主人公</div><a id="inventoryButton" href="DD_inventory.html">全アイテム</a></div>
      <div id="allyStatus"><div id="allyStatusName">主人公</div><div id="allyHpBar"><div id="allyHpFill"></div></div><div id="allyHpValue">—</div></div>
      <div id="actionGrid"></div>
      <div id="partyNote">探索中は所持品を表示する。</div>
    </div>
  </section>
</div>

<script src="DD_time.js?v=20260916wolfassist1"></script>
<script src="DD_items.js?v=20260916wolfassist1"></script>
<script src="DD_wolf.js?v=20260916wolfassist1"></script>
<script src="DD_event.js?v=20260916wolfassist1"></script>
<script src="DD_hunt_config.js?v=20260916wolfassist1"></script>
<script src="DD_point_config.js?v=20260916wolfassist1"></script>
<script src="DD_wolf_assist.js?v=20260916wolfassist1"></script>
<script src="DD_point.js?v=20260916wolfassist1"></script>
</body>
</html>
