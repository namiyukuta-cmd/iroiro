<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="dd-build" content="20260921layoutfix2" />
  <title>DD - 地点探索</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    :root{--ink:#282722;--paper:#f7f3eb;--purple:#62509d;--hero:#35b8df;--wolf:#c95a86;--danger:#b94c3e;--card:#e4c74c;--muted:#716d65}
    html,body{margin:0;width:100%;min-height:100%;background:#efebe3;color:#1c1b18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100svh;overflow-x:hidden}
    button,a{font:inherit}
    button{touch-action:manipulation}
    #game{width:min(100%,520px);min-height:100svh;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 8px calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}

    #topPanel{min-height:78px;border:2px solid var(--purple);border-radius:13px;background:#faf8f3;padding:6px 8px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
    #clockArea{display:flex;align-items:center;gap:7px;min-width:0}
    #clockDial{position:relative;width:58px;height:58px;flex:0 0 58px;border:3px solid var(--purple);border-radius:50%;background:#fff}
    #clockDial::before{content:"12";position:absolute;left:50%;top:1px;transform:translateX(-50%);font-size:7px;font-weight:900}
    #clockDial::after{content:"6";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);font-size:7px;font-weight:900}
    #clockDial.timeReceive{animation:clockReceive .32s ease}
    @keyframes clockReceive{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
    #hourHand,#minuteHand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:999px;background:#25231f}
    #hourHand{width:3px;height:17px;margin-left:-1.5px}
    #minuteHand{width:2px;height:22px;margin-left:-1px}
    #clockPin{position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#25231f}
    #timeText{font-size:26px;font-weight:1000;line-height:1;letter-spacing:-1px;white-space:nowrap}
    #dayText{margin-top:3px;font-size:10px;font-weight:900;white-space:nowrap}
    #topInfo{min-width:0;display:grid;grid-template-columns:1fr;grid-template-areas:"place" "links";gap:5px;align-items:center}
    #placeBlock{grid-area:place;display:flex;justify-content:flex-end;align-items:baseline;gap:6px;min-width:0}
    #placeName{font-size:17px;font-weight:1000;line-height:1.1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #placeType{font-size:10px;font-weight:900;opacity:.58;white-space:nowrap}
    #topLinks{grid-area:links;display:flex;justify-content:flex-end;gap:8px;min-width:0}
    .headLink{color:#292725;text-decoration:none;font-size:12px;font-weight:1000;white-space:nowrap;min-height:40px;padding:0 8px;border:1.5px solid var(--ink);border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center}
    #autoControls{display:flex;justify-content:flex-end;gap:5px;margin-bottom:4px}
    #autoButton,#autoSpeedButton{height:42px;border:1.5px solid var(--ink);border-radius:7px;background:#fff;color:#1d1d1b;font-size:11px;font-weight:1000;padding:0 10px;box-shadow:0 1px 0 rgba(0,0,0,.13);white-space:nowrap}
    #autoSpeedButton{background:#e9e4da}
    #autoButton.on{background:var(--ink);color:#fff}

    #encounterArea{position:relative;border:1.5px solid #aaa397;border-radius:12px;background:rgba(255,255,255,.25);padding:7px 7px 6px}
    #encounterStage{position:relative;height:210px;display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:6px;align-items:center}
    #cardColumn{position:relative;height:100%;display:grid;place-items:center}
    #cardSlot{position:relative;width:140px;height:190px;border:2px dashed #8b867c;border-radius:11px;background:rgba(255,255,255,.48);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease,background .15s ease,border-color .15s ease}
    #cardSlot.empty:active{transform:scale(.97);background:#fff}
    #cardSlot.busy{cursor:default;border-style:solid;border-color:#b8b1a6}
    #slotPrompt{padding:11px;text-align:center;font-size:12px;font-weight:1000;line-height:1.35;color:#625f58}
    #drawn{position:absolute;inset:7px;width:auto;height:auto;border:3px solid var(--card);border-radius:9px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.13);display:none;flex-direction:column;align-items:center;justify-content:center;padding:7px;text-align:center;transform-origin:center;z-index:2}
    #drawn.dealIn{animation:dealIn .18s ease-out}
    #drawn.hitFlash{animation:cardHit .28s ease}
    @keyframes dealIn{from{opacity:.2;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:none}}
    @keyframes cardHit{0%,100%{transform:none}35%{transform:translateX(-5px) rotate(-2deg)}70%{transform:translateX(4px) rotate(2deg)}}
    #cardIcon{font-size:45px;line-height:1;margin-bottom:7px}
    #cardTitle{font-size:16px;font-weight:1000;line-height:1.15}
    #cardSub{margin-top:5px;font-size:10px;font-weight:900;color:#666}
    #encounterStatus{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
    #statusName{font-size:13px;font-weight:1000;line-height:1.2;min-height:15px}
    .statusBar{height:11px;border:1.5px solid var(--ink);border-radius:999px;background:#ddd7cd;overflow:hidden}
    .statusFill{height:100%;width:100%;transition:width .2s ease}
    #enemyHpFill{background:var(--danger)}
    #statusValue{font-size:10px;font-weight:1000;text-align:right}
    #battleRound{font-size:10px;font-weight:1000;min-height:13px}
    #enemyIntent{font-size:10px;font-weight:800;line-height:1.25;color:#5d5952;min-height:30px}
    #cardActions{display:none;gap:6px;margin-top:3px}
    #cardActions.show{display:flex}
    #cardActions button{flex:1;height:46px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;font-size:11px;font-weight:1000;box-shadow:0 2px 0 rgba(0,0,0,.11)}
    #discardAction{background:#e7e2d8!important}
    #cardHint{text-align:center;min-height:15px;margin-top:4px;font-size:10px;font-weight:900;color:#5d5952;line-height:1.25}

    #eventStrip{border:1.5px solid #3a3833;border-radius:8px;background:#faf8f2;padding:6px 8px;min-height:48px;max-height:62px;overflow:hidden}
    #eventText{font-size:12px;font-weight:1000;line-height:1.25;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #eventDetail{margin-top:2px;font-size:10px;font-weight:800;color:#5d5952;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #result{margin-top:1px;font-size:10px;font-weight:1000;color:#514e47;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    #partyArea{position:relative;min-height:238px;margin-top:0}
    #partyTabs{height:44px;display:flex;align-items:flex-end;padding:0 6px;gap:0;position:relative;z-index:3}
    .partyTab{min-width:108px;height:44px;border:2px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;background:#fff;font-weight:1000;font-size:12px;padding:4px 9px;position:relative;top:2px;line-height:1.05}
    #heroTab{border-color:var(--hero);background:#eaf9fd}
    #wolfTab{border-color:var(--wolf);background:#fdebf2;display:none;margin-left:-9px}
    #heroTab.active{z-index:3;top:0;background:#d8f5fc}
    #wolfTab.active{z-index:3;top:0;background:#fbdde9}
    .miniHp{display:block;font-size:9px;font-weight:900;margin-top:1px}
    #partyPanel{position:relative;z-index:2;min-height:198px;border:3px solid var(--hero);border-radius:11px;background:#fbfaf6;padding:6px 7px 7px;overflow:hidden}
    #partyPanel.wolfMode{border-color:var(--wolf)}
    #partyHead{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:4px;min-height:25px}
    #turnLabel{font-size:12px;font-weight:1000;line-height:1.1}
    #inventoryButton{width:42px;height:42px;display:grid;place-items:center;flex:0 0 42px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:#1d1d1b;text-decoration:none;font-size:15px;font-weight:1000;padding:0}
    #allyStatus{display:flex;align-items:center;gap:6px;margin-bottom:5px}
    #allyStatusName{font-size:10px;font-weight:1000;min-width:46px}
    #allyHpBar{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:999px;background:#ddd7cd;overflow:hidden}
    #allyHpFill{height:100%;width:100%;background:var(--hero);transition:width .2s ease}
    #partyPanel.wolfMode #allyHpFill{background:var(--wolf)}
    #allyHpValue{font-size:9px;font-weight:1000;min-width:30px;text-align:right}
    #actionGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-content:start}
    .quickUiLabel{grid-column:1/-1;height:14px;display:flex;align-items:center;font-size:9px;font-weight:1000;color:#66615a;letter-spacing:.02em}
    .quickUiLabel.skillLabel{margin-top:2px}
    .actionTile{min-width:0;width:100%;height:54px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:4px 1px;font-size:9px;font-weight:1000;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 1px 0 rgba(0,0,0,.11);overflow:hidden}
    .actionTile:disabled{opacity:.45;box-shadow:none}
    .actionTile.quickSlot{background:#fffdf7}
    .actionTile.skillSlot{background:#f2f7fb}
    #partyPanel.wolfMode .actionTile.skillSlot{background:#fff1f6}
    .actionIcon{font-size:22px;line-height:1}
    .actionCount{font-size:8px;color:#666;line-height:1}
    .emptyActionSlot{border-style:dashed;opacity:.28;box-shadow:none}
    .emptyActionSlot .actionIcon{font-size:17px;color:#777}
    #partyNote{margin-top:4px;font-size:9px;font-weight:800;color:#656159;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .attackFx{position:fixed;z-index:10020;pointer-events:none;font-size:26px;line-height:1;will-change:transform,opacity}
    .damagePop{position:fixed;z-index:10021;pointer-events:none;font-size:15px;font-weight:1000;background:#24231f;color:#fff;border-radius:999px;padding:2px 6px;animation:damagePop .6s ease forwards}
    @keyframes damagePop{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}25%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-17px) scale(1)}}
    .inventoryFly{position:fixed;z-index:10010;border:2px solid var(--ink);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5px;pointer-events:none;will-change:transform,opacity;box-shadow:0 5px 15px rgba(0,0,0,.22)}
    .inventoryFly .flyIcon{font-size:27px;line-height:1;margin-bottom:3px}.inventoryFly .flyTitle{font-size:11px;font-weight:1000}
    .timeSparkle{position:fixed;z-index:10030;pointer-events:none;font-size:16px;font-weight:1000;color:#f1c934;text-shadow:0 0 5px #fff;will-change:transform,opacity}
    .timeGain{position:fixed;z-index:10031;transform:translateX(-50%);pointer-events:none;padding:2px 5px;border-radius:999px;background:#20201d;color:#fff;font-size:10px;font-weight:1000;white-space:nowrap;animation:timeGain .65s ease forwards}
    @keyframes timeGain{0%{opacity:0;transform:translate(-50%,5px) scale(.85)}25%{opacity:1;transform:translate(-50%,0) scale(1.06)}100%{opacity:0;transform:translate(-50%,-12px) scale(1)}}
    html[data-dd-phase="夕方"] body{background:#e5d8c8}
    html[data-dd-phase="夜"] body,html[data-dd-phase="深夜"] body{background:#c7cbd1}

    @media (max-width:370px){
      #game{padding-left:6px;padding-right:6px;gap:5px}
      #topPanel{grid-template-columns:auto 1fr;padding:5px 6px;gap:6px;min-height:82px}
      #clockDial{width:54px;height:54px;flex-basis:54px}
      #timeText{font-size:24px}
      #autoButton,#autoSpeedButton{padding:0 5px;font-size:9px}
      #encounterStage{grid-template-columns:minmax(0,1fr) 88px;height:198px}
      #cardSlot{width:132px;height:180px}
      .partyTab{min-width:100px}
      .actionTile{height:50px;font-size:8px}
      .actionIcon{font-size:20px}
      #partyPanel{padding-left:5px;padding-right:5px}
      #actionGrid{gap:3px}
    }
  </style>
</head>
<body>
<div id="game">
  <header id="topPanel">
    <div id="clockArea">
      <div id="clockDial" aria-hidden="true"><div id="hourHand"></div><div id="minuteHand"></div><div id="clockPin"></div></div>
      <div><div id="timeText">07:00</div><div id="dayText">1日目　朝</div></div>
    </div>
    <div id="topInfo">
      <div id="placeBlock"><div id="placeName">森</div><div id="placeType">探索地点</div></div>
      <div id="topLinks"><a class="headLink" href="DD_inventory.html">アイテム</a><a class="headLink" href="DD_map.html?v=20260916quickslots4">← マップ</a></div>
    </div>
  </header>

  <section id="encounterArea" aria-label="出る札">
    <div id="autoControls"><button id="autoButton" type="button" aria-pressed="false">オート：OFF</button><button id="autoSpeedButton" type="button">速度：ゆっくり</button></div>
    <div id="encounterStage">
      <div id="cardColumn">
        <div id="cardSlot" class="empty" role="button" tabindex="0" aria-label="札を出す">
          <div id="slotPrompt">ここをタップして札を出す</div>
          <div id="drawn" role="button" tabindex="-1" aria-live="polite"><div id="cardIcon"></div><div id="cardTitle"></div><div id="cardSub"></div></div>
        </div>
      </div>
      <aside id="encounterStatus" aria-label="札の状態">
        <div id="statusName">出る札</div>
        <div class="statusBar"><div id="enemyHpFill" class="statusFill"></div></div>
        <div id="statusValue">—</div>
        <div id="battleRound"></div>
        <div id="enemyIntent"></div>
      </aside>
    </div>
    <div id="cardActions" aria-label="札の選択肢"><button id="primaryAction" type="button">入手する</button><button id="discardAction" type="button">見送る</button></div>
    <div id="cardHint">空白をタップして次の札へ　6分</div>
  </section>

  <section id="eventStrip"><div id="eventText">空白をタップして札を出す。</div><div id="eventDetail">札を出すと6分進む。</div><div id="result"></div></section>

  <section id="partyArea" aria-label="味方">
    <div id="partyTabs">
      <button id="heroTab" class="partyTab active" type="button">主人公<span id="heroMiniHp" class="miniHp"></span></button>
      <button id="wolfTab" class="partyTab" type="button">狼（？）<span id="wolfMiniHp" class="miniHp"></span></button>
    </div>
    <div id="partyPanel">
      <div id="partyHead"><div id="turnLabel">主人公</div><a id="inventoryButton" href="DD_inventory.html" aria-label="全アイテム" title="全アイテム">▣</a></div>
      <div id="allyStatus"><div id="allyStatusName">主人公</div><div id="allyHpBar"><div id="allyHpFill"></div></div><div id="allyHpValue">—</div></div>
      <div id="actionGrid"></div>
      <div id="partyNote">武器1・防具1・道具2。下段は行動・スキル。</div>
    </div>
  </section>
</div>

<script src="DD_time.js?v=20260916quickslots4"></script>
<script src="DD_items.js?v=20260916quickslots4"></script>
<script src="DD_wolf.js?v=20260916quickslots4"></script>
<script src="DD_event.js?v=20260916quickslots4"></script>
<script src="DD_hunt_config.js?v=20260916quickslots4"></script>
<script src="DD_point_config.js?v=20260916quickslots4"></script>
<script src="DD_wolf_assist.js?v=20260916quickslots4"></script>
<script src="DD_point.js?v=20260916quickslots4"></script>
<script src="DD_quick_ui.js?v=20260916quickslots4"></script>
</body>
</html>
