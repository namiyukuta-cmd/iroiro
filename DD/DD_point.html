<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DD - 地点探索</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html,body{margin:0;width:100%;min-height:100%;background:#eeeae1;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}
    #game{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    #clockArea{display:flex;align-items:center;gap:12px}
    #clockDial{position:relative;width:86px;height:86px;border:5px solid #20201d;border-radius:50%;background:#faf8f2;box-shadow:0 3px 0 rgba(0,0,0,.12)}
    #clockDial::before{content:"12";position:absolute;left:50%;top:4px;transform:translateX(-50%);font-size:11px;font-weight:900}
    #clockDial::after{content:"6";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:11px;font-weight:900}
    #hourHand,#minuteHand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:999px;background:#20201d}
    #hourHand{width:5px;height:24px;margin-left:-2.5px}
    #minuteHand{width:3px;height:31px;margin-left:-1.5px}
    #clockPin{position:absolute;width:9px;height:9px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#20201d}
    #timeText{font-size:34px;font-weight:1000;line-height:1;letter-spacing:-1px}
    #dayText{margin-top:7px;font-size:15px;font-weight:900}
    #placeArea{text-align:right;padding-top:4px}
    #placeName{font-size:23px;font-weight:1000}
    #placeType{margin-top:4px;font-size:13px;font-weight:800;opacity:.65}
    .headLink{display:inline-block;margin-top:8px;margin-left:8px;color:#1d1d1b;text-decoration:none;font-size:14px;font-weight:900}
    #table{position:relative;min-height:320px;border-top:2px solid #aaa397;border-bottom:2px solid #aaa397;padding:28px 8px 24px}
    #cards{height:220px;position:relative}
    .card{position:absolute;width:132px;height:184px;border:3px solid #24231f;border-radius:12px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center}
    #deck{left:6%;top:6px;z-index:2;background:repeating-linear-gradient(45deg,#2a2d27 0 7px,#3c4038 7px 14px);color:#fff;cursor:pointer;touch-action:manipulation;transition:transform .09s ease,box-shadow .09s ease}
    #deck:active{transform:translateY(3px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.15)}
    #deck::before{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.75);border-radius:8px}
    #deckTitle{font-size:18px;font-weight:1000;z-index:1}
    #drawn{right:6%;top:28px;z-index:1;display:none;touch-action:manipulation;transition:transform .12s ease,box-shadow .12s ease,opacity .18s ease,filter .18s ease}
    #drawn.tapFeedback{transform:translateY(5px) scale(.91);box-shadow:0 1px 0 rgba(0,0,0,.15)}
    #drawn.acquired{opacity:.34;filter:grayscale(.45);transform:scale(.96);pointer-events:none!important}
    #drawn:focus{outline:3px solid #777;outline-offset:3px}
    #cardIcon{font-size:54px;line-height:1;margin-bottom:12px}
    #cardTitle{font-size:19px;font-weight:1000;line-height:1.25}
    #cardSub{margin-top:8px;font-size:13px;font-weight:800;color:#666}
    #deckHint{position:absolute;left:8px;right:8px;bottom:0;text-align:center;font-size:14px;font-weight:900;color:#555}
    #eventBox{min-height:118px;border:2px solid #2c2b27;border-radius:12px;background:#faf8f2;padding:14px}
    #eventText{min-height:38px;font-size:18px;font-weight:900;line-height:1.45}
    #eventDetail{min-height:24px;margin-top:5px;font-size:14px;font-weight:700;color:#5d5a53}
    #result{min-height:28px;font-size:14px;font-weight:900;color:#514e47}
    #bottomBar{position:fixed;z-index:90;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),492px);display:flex;justify-content:center;pointer-events:none}
    #inventoryButton{pointer-events:auto;width:100%;min-height:58px;border:3px solid #24231f;border-radius:15px;background:#faf8f2;color:#1d1d1b;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:9px;font-size:18px;font-weight:1000;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
    #inventoryButton:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
    #inventoryButton.receive{transform:scale(1.07);background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.14),0 0 0 7px rgba(35,35,31,.18)}
    .inventoryFly{position:fixed;z-index:9999;border:3px solid #24231f;border-radius:12px;background:#fff;box-shadow:0 9px 24px rgba(0,0,0,.34);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;pointer-events:none;will-change:transform,opacity}
    .inventoryFly .flyIcon{font-size:46px;line-height:1;margin-bottom:10px}
    .inventoryFly .flyTitle{font-size:17px;font-weight:1000;line-height:1.2}
    html[data-dd-phase="夕方"] body{background:#e7d9c9}
    html[data-dd-phase="夜"] body,html[data-dd-phase="深夜"] body{background:#c8ccd2}
  </style>
</head>
<body>
<div id="game">
  <header>
    <div id="clockArea">
      <div id="clockDial" aria-hidden="true"><div id="hourHand"></div><div id="minuteHand"></div><div id="clockPin"></div></div>
      <div><div id="timeText">07:00</div><div id="dayText">1日目　朝</div></div>
    </div>
    <div id="placeArea">
      <div id="placeName">森</div>
      <div id="placeType">探索地点</div>
      <a class="headLink" href="DD_inventory.html">アイテム</a>
      <a class="headLink" href="DD_map.html">← マップ</a>
    </div>
  </header>

  <section id="table">
    <div id="cards">
      <button id="deck" class="card" type="button" aria-label="山札をめくる"><span id="deckTitle">山札</span></button>
      <div id="drawn" class="card" role="button" tabindex="0" aria-live="polite"><div id="cardIcon"></div><div id="cardTitle"></div><div id="cardSub"></div></div>
      <div id="deckHint">山札をタップして1枚めくる</div>
    </div>
  </section>

  <section id="eventBox"><div id="eventText">カードをめくる。</div><div id="eventDetail"></div></section>
  <div id="result"></div>

  <nav id="bottomBar" aria-label="下部メニュー">
    <a id="inventoryButton" href="DD_inventory.html"><span aria-hidden="true">▣</span><span>アイテム</span></a>
  </nav>
</div>

<script src="DD_time.js?v=202609160815"></script>
<script src="DD_items.js?v=202609160815"></script>
<script src="DD_wolf.js?v=202609160815"></script>
<script src="DD_event.js?v=202609160815"></script>
<script src="DD_point_config.js?v=202609160815"></script>
<script src="DD_point.js?v=202609160815"></script>
</body>
</html>
