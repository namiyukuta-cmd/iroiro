<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#211c16">
  <title>宵の間 — カードゲーム</title>
  <link rel="stylesheet" href="css/base.css?v=20261005-table-2">
  <link rel="stylesheet" href="css/layout.css?v=20261005-table-2">
  <link rel="stylesheet" href="css/cards.css?v=20261005-table-2">
</head>
<body>
  <main aria-label="宵の間">
    <header class="status-strip">
      <span class="date-label" id="gameDate">日付 —</span>
      <div class="mood-summary" id="moods"></div>
      <span class="time-label" id="gameTime">時間 —</span>
    </header>
    <section class="history-strip" aria-label="今までのカード">
      <span class="history-label">今までのカード</span>
      <div id="history" class="history-icons"></div>
    </section>
    <section class="hand-section opponent-section" aria-label="相手の手札">
      <div class="section-label"><span id="npcName">相手手札</span><span id="npcFeeling"></span></div>
      <div class="hand opponent-hand" id="npcHand"></div>
    </section>
    <section class="scene" id="scene" aria-label="カード卓">
      <div class="table">
        <div class="table-row">
          <section class="table-slot"><h2>相手ベット</h2><div class="slot-content" id="npcBet"></div></section>
          <section class="table-slot"><h2>相手の誘いカード</h2><div class="slot-content" id="npcInvite"></div></section>
        </div>
        <div class="table-row stacks-row">
          <section class="stack-slot"><h2>捨札</h2><div class="pile" id="discard"></div></section>
          <section class="stack-slot"><h2>積む札</h2><div class="pile" id="pile"></div></section>
        </div>
        <div class="table-row">
          <section class="table-slot"><h2>自分の誘いカード</h2><div class="slot-content" id="pcInvite"></div></section>
          <section class="table-slot"><h2>自分ベット</h2><div class="slot-content"><button class="bet-card" id="bet" aria-label="自分のベットを変更">＋0</button></div></section>
        </div>
      </div>
      <div class="table-note" id="tableNote"></div>
    </section>
    <section class="hand-section own-section" aria-label="自分の手札">
      <div class="section-label"><span>自分手札</span><span id="pcFeeling"></span></div>
      <div class="hand" id="hand"></div>
    </section>
    <footer class="bottom">
      <div class="message" id="message" aria-live="polite"></div>
      <div class="card-controls"><button id="leave">仕舞う</button><button id="menu" aria-label="メニュー">☰</button><button class="primary send" id="send">カードを出す</button></div>
      <div class="footer" id="cardHelp"></div>
    </footer>
  </main>
  <div id="modal"></div>
  <div id="fade"></div>
  <script src="js/cards.js?v=20261005-table-2"></script>
  <script src="js/render.js?v=20261005-table-2"></script>
  <script src="js/game.js?v=20261005-table-2"></script>
</body>
</html>
