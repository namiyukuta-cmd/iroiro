<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#171d1c;color:#f7efdf;font-family:system-ui,-apple-system,sans-serif}button,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #ffffff30;background:#ffffff09;border-radius:10px;min-height:44px;padding:8px 12px}button:active{transform:translateY(1px)}button:disabled{opacity:.36;cursor:default}button:focus-visible{outline:3px solid #e5ba81}main{max-width:480px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#202825;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{height:55px;flex-shrink:0;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15}h1{font-family:serif;font-size:21px;font-weight:400;letter-spacing:5px;margin:0}small{color:#bcbdad;font-size:11px}.moods{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:10px 18px}.mood-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.heart{font-size:19px;color:var(--heart)}.meter{height:5px;border-radius:9px;background:#ffffff18;overflow:hidden}.meter i{display:block;height:100%;background:#c9858f;width:var(--value);transition:width .4s}.scene{position:relative;flex:1;min-height:155px;overflow:hidden;background:linear-gradient(#555d58,#a79378 70%,#47524c)}.scene:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 73% 20%,#f6d3a876,transparent 40%);pointer-events:none}.scene[data-place="bar"]{background:linear-gradient(110deg,#302b31,#8d6454 65%,#39302d)}.scene[data-place="work"]{background:linear-gradient(#738078,#c4ae8d)}.scene[data-place="home"]{background:linear-gradient(110deg,#454342,#9c8977)}.scene.private{background:linear-gradient(110deg,#251f30,#79535c 58%,#35252d)}.scenery{position:absolute;width:100%;height:100%;opacity:.65}.location{position:absolute;top:12px;left:15px;z-index:2}.location strong{display:block;font-family:serif;font-weight:400;font-size:19px;letter-spacing:3px}.location small{display:block;margin-top:5px;color:#f5efdc}.person{position:absolute;bottom:0;width:29%;height:72%;color:#202526;filter:drop-shadow(2px 4px 3px #0004)}.person.left{left:-1%;transform:scaleX(-1)}.person.right{right:-1%}.figure{width:100%;height:100%}.reaction{position:absolute;top:16%;left:50%;z-index:4;color:#ffd2d8;font-size:23px;text-shadow:0 2px 4px #000}.left .reaction{transform:scaleX(-1)}.private .mask{display:block}.mask{display:none;position:absolute;top:28%;left:29%;width:47%;height:26%;background:#eee4cf;border:3px double #9d735e;border-radius:5px;transform:rotate(-12deg);color:#854550;text-align:center;padding-top:6px;font-size:26px}.table{display:none;position:absolute;left:14%;right:14%;top:36%;bottom:5%;border-radius:48%;background:radial-gradient(ellipse,#365c49,#193f30);border:7px solid #5c4634;box-shadow:0 8px 0 #352a23,0 10px 25px #0008;z-index:3}.playing .table{display:block}.private .table{background:radial-gradient(ellipse,#813e50,#492232)}.pile{position:absolute;inset:12% 12%;display:flex;align-items:center;justify-content:center}.card{background:#f3ead8;color:#664648;border:1px solid #c0a282;border-radius:7px;box-shadow:0 3px 7px #0003;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px}.card svg{width:100%;height:calc(100% - 20px);max-height:67px}.card span{font-size:11px;letter-spacing:1px}.pile .card{position:absolute;width:78px;height:110px;transform:translate(var(--x),var(--y)) rotate(var(--r));animation:deal .35s ease-out}.pile .card:disabled{opacity:1}.pile .card.npc{border:2px solid #b56d78}.pile .card.picked{outline:3px solid #e7b355;transform:translate(var(--x),calc(var(--y) - 10px)) rotate(var(--r))}.pile .card svg{max-height:none}.table-note{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:#e1cf9a}.message{padding:12px 18px;min-height:88px;font-size:13px;line-height:1.6;background:#202825;border-top:1px solid #ffffff10;display:flex;flex-direction:column;justify-content:center}.message em{font-style:normal;font-family:serif;font-size:16px;color:#e4c5ac}.message .translation{color:#d8d6ca}.card-status{text-align:center;color:#debf99;letter-spacing:2px}.bottom{padding:0 12px 8px;flex-shrink:0}.stats{display:flex;justify-content:space-between;padding:6px 4px 10px;color:#b8bbae;font-size:11px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button{font-size:12px;background:#2d3731}.actions button.primary,.primary{background:#e1c6a1!important;color:#2d3028!important;border-color:#e1c6a1!important}.tabs{display:flex;gap:4px;padding-top:9px}.tabs button{flex:1;border:0;font-size:12px;color:#abae9f;min-height:36px}.tabs .active{color:#f2ddbb;background:#ffffff0a}.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.hand .card{height:87px;min-height:0;padding:3px}.hand .selected{outline:3px solid #d9ad6b;transform:translateY(-3px)}.hand .card:disabled{opacity:.4}.card-controls{display:flex;gap:6px;margin-top:9px}.card-controls button{flex:1;font-size:12px;padding:5px}.card-controls .send{flex:1.4}.hidden{display:none!important}.footer{text-align:center;font-size:10px;color:#939c8d;padding-top:8px}.overlay{position:fixed;inset:0;z-index:20;background:#111b;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{max-width:400px;width:100%;padding:26px 22px;background:#29322d;border:1px solid #b3936870;border-radius:16px;box-shadow:0 15px 65px #0009}.dialog h2{font-family:serif;font-weight:400;letter-spacing:3px;margin-top:0}.dialog p{font-size:13px;line-height:1.8;color:#d4d2c4}.dialog .choices{display:grid;gap:9px;margin-top:18px}.dialog label{display:block;font-size:13px;margin-top:15px}.dialog select{background:#18251e;color:#eee;padding:10px;width:100%;border:1px solid #ffffff30;border-radius:8px}.fade{position:fixed;inset:0;background:#09090d;z-index:30;display:flex;align-items:center;justify-content:center;animation:blackout 1s;letter-spacing:5px;color:#d8c5b0}.toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:25;background:#151c18;padding:10px 16px;border:1px solid #b49367;border-radius:8px;font-size:12px;white-space:nowrap}@keyframes deal{from{opacity:0;margin-top:70px}to{opacity:1;margin-top:0}}@keyframes blackout{from{opacity:0}to{opacity:1}}@media(max-height:700px){header{height:45px}.moods{padding:6px 16px}.hand .card{height:68px}.message{min-height:68px;padding:7px 15px}.stats{padding:4px}.footer{padding:3px}.scene{min-height:125px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<main><header><h1>宵の間</h1><button id="menu">☰ メニュー</button></header><div class="moods" id="moods"></div><section class="scene" id="scene"><svg class="scenery" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"><path fill="#22382c" d="M0 0h38v400H0zM322 0h15v400h-15z"/><path fill="#d4bb8e" opacity=".5" d="M48 32h263v205H48z"/><path stroke="#574c3e" stroke-width="7" fill="none" d="M44 30h270v209H44zM178 30v209M44 140h270"/><path fill="#283c32" d="M0 312Q140 275 400 316v84H0z"/><path fill="#3c4938" d="M10 293v-80q-35-40-13-70 32-13 43 20 36 20 8 62v70zM360 302v-78q-22-27-8-45 40-14 45 20l-16 28v75z"/><path stroke="#b5a27d" stroke-width="7" d="M65 281h245m-217 0v47m190-47v47"/></svg><div class="location" id="location"></div><div class="person left" id="pc"></div><div class="person right" id="npc"></div><div class="table"><div class="pile" id="pile"></div><div class="table-note" id="tableNote"></div></div></section><div class="message" id="message" aria-live="polite"></div><section class="bottom"><div class="stats" id="stats"></div><div id="daily"><div class="actions" id="actions"></div><nav class="tabs" id="tabs"></nav></div><div id="cards" class="hidden"><div class="hand" id="hand"></div><div class="card-controls"><button id="leave">仕舞う</button><button id="bet">ベット ＋0</button><button class="primary send" id="send">カードを出す</button></div><div class="footer" id="cardHelp">8枚は何度でも使えます</div></div><div class="footer" id="footer">静かな街で、暮らしと恋を。</div></section></main><div id="modal"></div><div id="fade"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), SAVE='iroiro-romance-cards-save-v1';
const DECK=[['lips','唇',35,'M15 48Q36 24 50 36Q65 24 85 48Q66 77 50 66Q32 77 15 48ZM15 48Q50 53 85 48M30 52Q50 64 70 52'],['hand','手',0,'M36 88V67L19 47Q17 38 25 41L35 48V20Q39 10 44 20V43V13Q50 5 54 14V43V18Q62 11 64 21V45V28Q72 21 74 32V65L64 88M44 57Q55 48 64 55'],['outfit','衣装',55,'M35 12L50 23L65 12L88 28L77 47L70 41V90H30V41L23 47L12 28ZM35 12L39 38L50 23L61 38L65 12M50 23V90M54 48h1M54 62h1'],['cheek','頬',15,'M31 13Q70 4 76 39L86 53L76 57Q80 77 59 79L57 91M31 13Q14 36 28 57M59 79Q40 75 36 62M60 40h5M59 56l8 2'],['leg','足',65,'M32 10L43 49L34 79L21 84Q18 94 42 88L55 80L61 49L68 10M43 49l18 0'],['back','背中',60,'M35 12V24L12 34L24 91H77L88 34L65 24V12M26 30Q50 99 75 30M35 24Q50 32 65 24'],['ear','耳',40,'M28 63Q8 22 40 13Q77 4 80 37Q83 57 62 65Q59 91 43 84Q35 81 39 70M31 47Q22 25 46 23Q72 23 66 45L54 53Q40 44 42 60'],['neck','首',45,'M32 10Q40 37 29 49L10 59M67 10Q60 37 71 49L90 59M29 49Q48 67 71 49M10 59L18 91M90 59L82 91']];
const PLACES={park:['公園','風の穏やかな遊歩道',72],cafe:['カフェ','午後のひと休み',65],bar:['バー','灯りがやわらぐ時間',88],work:['花屋','仕事中・親密な誘いには不向き',15],home:['自宅','休息と身支度',80]};
const FEEL={calm:['穏やか','#c9cdc7'],warm:['ときめき','#dc91b0'],sad:['落ち込み','#82afc4'],angry:['怒り','#e56559'],guarded:['警戒','#9a83b4'],tense:['緊張','#c8a66c']};
const fresh=()=>({version:1,day:1,time:16*60,money:3000,energy:85,affection:36,pcMood:38,npcMood:40,pcFeeling:'calm',npcFeeling:'calm',place:'cafe',mode:'daily',turn:'pc',stack:[],round:0,selected:null,pair:null,bet:0,tab:'talk',inviteCooldown:0,lastAction:'',repeat:0,visits:0});
let s=fresh(), timer=null, generation=0;
const clamp=n=>Math.max(0,Math.min(100,n));
function change(k,n){s[k]=clamp(s[k]+n)}
function svg(path){return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function cardHTML(id,cls='',extra=''){const c=DECK.find(c=>c[0]===id);return `<button class="card ${cls}" ${extra} aria-label="${c[1]}">${svg(c[3])}<span>${c[1]}</span></button>`}
function person(npc){return `<svg class="figure" viewBox="0 0 100 250" aria-hidden="true"><path fill="currentColor" d="M40 15Q70 2 77 30L79 45L88 55L78 59Q76 73 62 75L65 88L90 108L100 250H2L8 120Q10 99 37 89L42 76Q22 65 25 43Q22 21 40 15Z"/><path fill="#667069" opacity=".5" d="M37 89L51 111L65 88L61 139L51 122L40 138Z"/></svg><span class="reaction">${s.mode==='daily'?(npc&&s.npcFeeling==='sad'?'💧':''):(s.npcMood>65?'♥':'///')}</span><div class="mask">♡</div>`}
function mood(npc){let f=npc?s.npcFeeling:s.pcFeeling,v=npc?s.npcMood:s.pcMood;if(f==='calm'&&v>=55)f='warm';return `<div style="--heart:${FEEL[f][1]};--value:${v}%"><div class="mood-head"><span>${npc?'オリヴァー · 30歳':'あなた · 成人'}</span><span><b class="heart">♥</b> ${v}</span></div><div class="meter"><i></i></div><small>${FEEL[f][0]}</small></div>`}
function say(en,ja){$('message').innerHTML=`<em>${en}</em><span class="translation">${ja}</span>`}
function note(text){$('message').textContent=text}
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)}
function dialog(title,body,choices){$('modal').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><p>${body}</p><div class="choices"></div></section></div>`;const box=document.querySelector('.choices');choices.forEach(([label,fn,primary])=>{const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=()=>{$('modal').innerHTML='';fn()};box.append(b)});box.querySelector('button')?.focus()}
function advance(n){s.time+=n;while(s.time>=1440){s.time-=1440;s.day++}s.inviteCooldown=Math.max(0,s.inviteCooldown-1)}
function ready(){return !['sad','angry','guarded','tense'].includes(s.npcFeeling)&&!['sad','angry','guarded','tense'].includes(s.pcFeeling)&&PLACES[s.place][2]>=50&&s.pcMood>=30&&s.npcMood>=35&&(s.affection>=25||(s.place==='bar'&&s.npcMood>=60))}
function canCard(id){const c=DECK.find(c=>c[0]===id);return !!c&&(s.mode==='private'||!['leg','back','outfit'].includes(id))}
function eligible(){return DECK.filter(c=>canCard(c[0])&&c[2]<=s.npcMood)}
function render(){
 $('menu').disabled=s.mode!=='daily';$('moods').innerHTML=mood(false)+mood(true);$('scene').dataset.place=s.place;$('scene').classList.toggle('playing',s.mode!=='daily');$('scene').classList.toggle('private',s.mode==='private');$('pc').innerHTML=person(false);$('npc').innerHTML=person(true);
 $('location').innerHTML=`<strong>${s.mode==='private'?'ふたりだけの灯り':PLACES[s.place][0]}</strong><small>${s.mode==='private'?'静かな、奥まった場所':PLACES[s.place][1]}</small>`;
 $('stats').innerHTML=`<span>${s.day}日目 ${String(Math.floor(s.time/60)).padStart(2,'0')}:${String(s.time%60).padStart(2,'0')}</span><span>体力 ${s.energy} · ${s.money.toLocaleString()}円</span><span>親しさ ${s.affection}</span>`;
 $('daily').classList.toggle('hidden',s.mode!=='daily');$('cards').classList.toggle('hidden',s.mode==='daily');$('footer').classList.toggle('hidden',s.mode!=='daily');
 if(s.mode==='daily'){renderDaily();$('pile').innerHTML='';return}
 $('message').innerHTML=`<div class="card-status">${s.turn==='npc'?'相手の番…':'あなたの番'}　·　${s.round}/6</div>`;
 $('tableNote').textContent=s.mode==='private'?'ふたりの時間':'言葉のないやりとり';
 $('pile').innerHTML=s.stack.slice(-5).map((c,i)=>cardHTML(c.id,`${c.who} ${s.pair===c.seq?'picked':''}`,`style="--x:${(i-2)*13}px;--y:${(i-2)*-7}px;--r:${(i-2)*10}deg" data-seq="${c.seq}" ${c.who!=='npc'||s.turn!=='pc'?'disabled':''}`)).join('');
 $('pile').querySelectorAll('[data-seq]').forEach(e=>e.onclick=()=>{s.pair=s.pair===+e.dataset.seq?null:+e.dataset.seq;render()});
 $('hand').innerHTML=DECK.map(c=>cardHTML(c[0],s.selected===c[0]?'selected':'',`data-card="${c[0]}" ${!canCard(c[0])||s.turn!=='pc'?'disabled':''}`)).join('');
 $('hand').querySelectorAll('[data-card]').forEach(e=>e.onclick=()=>{s.selected=e.dataset.card;render()});
 $('bet').textContent=`ベット ＋${s.bet}`;$('bet').disabled=s.turn!=='pc';$('send').disabled=s.turn!=='pc'||!s.selected;
 $('cardHelp').textContent=s.pair!==null?'相手の絵柄と組み合わせて出します':s.bet?'ベット：この1手のムード変化が大きくなります':'相手のカードをタップすると組み合わせられます';
}
const tabs=[['talk','会話'],['life','暮らし'],['move','場所'],['romance','恋愛']];
function renderDaily(){const sets={talk:[['話しかける','chat'],['話を聞く','listen'],['ねぎらう','comfort'],['散歩に誘う','walk'],['少し距離を置く','space'],['気分を選ぶ','feeling']],life:[['花屋で働く','work'],['休む','rest'],['食事 · 500円','eat'],['お茶 · 300円','tea'],['翌朝まで眠る','sleep'],['手動セーブ','save']],move:Object.entries(PLACES).map(([k,v])=>[v[0],`move:${k}`]),romance:[['自分から誘う','invite'],['相手を待つ','wait'],['気持ちを伝える','flirt'],['一緒にお茶','tea'],['話を聞く','listen'],['気分を選ぶ','feeling']]};$('actions').innerHTML=sets[s.tab].map(([n,k])=>`<button data-action="${k}" ${k==='invite'?'class="primary"':''}>${n}</button>`).join('');$('actions').querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.action));$('tabs').innerHTML=tabs.map(([k,n])=>`<button class="${s.tab===k?'active':''}" data-tab="${k}">${n}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;render()})}
function npcInvite(force=false){if(s.inviteCooldown||!ready()||s.npcMood<52||(!force&&Math.random()>.25))return;s.inviteCooldown=4;dialog('オリヴァーからの誘い',"“Stay a little closer?”<br>「もう少し、そばにいてくれますか？」",[['応じる · 相手が先攻',()=>enter('npc'),true],['今は話していたい',()=>{say('Of course. I like talking with you.','もちろん。君と話すのも好きです。');render()}]])}
function act(a){if(a==='save'){save();return}if(a==='feeling'){dialog('今の気分', 'あなたのムードはご自身で選べます。',Object.entries(FEEL).map(([k,v])=>[v[0],()=>{s.pcFeeling=k;if(k==='warm')s.pcMood=Math.max(55,s.pcMood);render()}]));return}if(a==='invite'){invite();return}if(a==='wait'){advance(10);if(ready()&&s.npcMood>=52){render();npcInvite(true)}else{say('Shall we talk a little longer?','もう少し話しませんか。');render()}return}
 if(a.startsWith('move:')){s.place=a.split(':')[1];advance(15);s.visits++;note(PLACES[s.place][0]+'に移動しました。');render();return}
 s.repeat=s.lastAction===a?s.repeat+1:0;s.lastAction=a;const gain=s.repeat>2?2:7;
 if(a==='chat'){change('affection',3);change('npcMood',gain);change('pcMood',4);say('I was hoping I would see you today.','今日は君に会えたらいいなと思っていました。');advance(15)}
 if(a==='listen'){change('affection',5);change('npcMood',5);s.npcFeeling='calm';say('Thank you for listening. I feel better now.','聞いてくれてありがとう。少し気持ちが楽になりました。');advance(15)}
 if(a==='comfort'){change('affection',4);change('npcMood',4);s.npcFeeling='calm';say('Can I stay here with you for a while?','しばらく君とここにいてもいいですか？');advance(10)}
 if(a==='walk'){s.place='park';change('pcMood',8);change('npcMood',8);change('affection',4);change('energy',-5);say('Let’s take the long way around.','今日は少し遠回りしましょう。');advance(30)}
 if(a==='space'){s.npcFeeling='calm';change('npcMood',-8);s.inviteCooldown=4;note('穏やかな時間が流れます。');advance(20)}
 if(a==='flirt'){if(PLACES[s.place][2]<50){change('affection',-4);s.npcFeeling='tense';say('After work? I want to give you my full attention.','仕事のあとにしませんか。君とゆっくり向き合いたいので。')}else{change('affection',5);change('npcMood',gain+3);say('You make it hard to look away.','君から目を離せなくなります。')}advance(10)}
 if(a==='work'){if(s.energy<20){note('疲れています。休息を取ると働けます。');render();return}s.place='work';s.money+=1800;change('energy',-25);change('npcMood',-8);s.npcFeeling='tense';advance(180);note('花屋の仕事を終えました。報酬 1,800円。オリヴァーも仕事の片付けをしています。')}
 if(a==='rest'){change('energy',25);s.pcFeeling='calm';advance(60);note('ひと休み。体力が回復しました。')}
 if(a==='sleep'){s.day++;s.time=9*60;s.place='home';s.energy=100;s.npcFeeling='calm';s.pcFeeling='calm';s.npcMood=40;s.pcMood=38;s.inviteCooldown=2;note('新しい朝。今日は何をして過ごしましょう。')}
 if(a==='eat'||a==='tea'){let cost=a==='eat'?500:300;if(s.money<cost){note('所持金が足りません。');render();return}s.money-=cost;change('energy',a==='eat'?25:10);change('pcMood',8);change('npcMood',8);s.npcFeeling='calm';s.place='cafe';advance(30);say('There’s no need to hurry.','急がなくても大丈夫ですよ。')}
 render();if(['chat','listen','walk','flirt','tea'].includes(a))npcInvite();
}
function invite(){if(!ready()){if(PLACES[s.place][2]<50){change('affection',-12);s.npcFeeling='guarded';say('Not here. This really isn’t the time.','ここではやめましょう。今はそういう場ではありません。')}else if(['sad','angry','guarded','tense'].includes(s.npcFeeling)){say('Could you just talk with me for now?','今はただ、話をしてくれませんか。')}else{say('Let’s spend a little more time together first.','まずはもう少し、一緒に過ごしましょう。')}render();return}dialog('言葉のない時間へ','先攻と後攻を選べます。カードはすべて表向きです。',[['自分から · 先攻',()=>enter('pc'),true],['相手に委ねる · 後攻',()=>enter('npc')],['日常へ戻る',()=>{}]])}
function enter(first,privateMode=false){generation++;clearTimeout(timer);s.mode=privateMode?'private':'public';s.stack=[];s.round=0;s.selected=null;s.pair=null;s.bet=0;s.turn=first;render();if(first==='npc')scheduleNPC()}
function scheduleNPC(){const g=generation;timer=setTimeout(()=>{if(g!==generation||s.mode==='daily'||s.turn!=='npc')return;const opts=eligible();if(!opts.length){exitCards();return}const last=s.stack.at(-1);const same=last&&opts.find(c=>c[0]===last.id);const c=same&&Math.random()<.55?same:opts[Math.floor(Math.random()*opts.length)];play(c[0],'npc')},850)}
function pairBonus(id,other){return id===other?4:([id,other].includes('hand')?5:2)}
function play(id,who){if(!canCard(id)||s.turn!==who)return;const c=DECK.find(c=>c[0]===id);const chosen=s.stack.find(c=>c.seq===s.pair&&c.who==='npc');const risky=c[2]>s.npcMood;let gain=risky?-7:5;if(chosen)gain+=risky?0:pairBonus(id,chosen.id);gain*=1+(who==='pc'?s.bet:0)*.5;change('npcMood',Math.round(gain));change('pcMood',Math.round(gain*.7));if(risky){change('affection',-2)}else change('affection',1);if(chosen){s.stack=s.stack.filter(c=>c.seq!==chosen.seq);s.stack.push({...chosen,seq:s.stack.length+100+s.round})}s.stack.push({id,who,seq:Date.now()+s.round});s.round++;s.selected=null;s.pair=null;s.bet=0;s.turn=who==='pc'?'npc':'pc';advance(2);render();if(risky){$('npc').querySelector('.reaction').textContent='💦'}if(s.npcMood<25){exitCards();say('Let’s slow down a little.','少しゆっくりにしましょう。');return}if(s.round>=6){finishRound();return}if(s.turn==='npc')scheduleNPC()}
function finishRound(){generation++;if(s.mode==='private'){dialog('ふたりの時間','カードを仕舞って、このままふたりで過ごしますか？',[['このまま過ごす',()=>blackout(()=>{exitCards();change('affection',5);advance(60);say('I’d like to stay with you a little longer.','もう少し、君と一緒にいたいです。');render()}),true],['今日はここまで',()=>{exitCards();say('I’m glad we had this time together.','一緒に過ごせて嬉しいです。')}]]);return}
 s.stack=[];render();if(s.npcMood>=60&&s.pcMood>=50){dialog('もう少し、ふたりで',"“I’d like some time alone with you.”<br>「君とふたりきりで過ごしたいです。」",[['応じる',()=>blackout(()=>enter(s.turn,true)),true],['今はここまで',()=>{exitCards();say('All right. Shall we get some tea?','そっか。では、お茶でも飲みませんか。')}]]);}else{exitCards();say('I like being close to you.','君のそばにいるのが好きです。')}}
function blackout(next){$('fade').innerHTML='<div class="fade">ふたりの時間</div>';setTimeout(()=>{next();$('fade').innerHTML=''},1500)}
function exitCards(){generation++;clearTimeout(timer);s.mode='daily';s.stack=[];s.selected=null;s.pair=null;s.bet=0;s.round=0;s.inviteCooldown=4;render();note('カードを仕舞いました。いつもの会話へ。')}
function save(){if(s.mode!=='daily'){toast('カードを仕舞ってから保存できます');return}try{localStorage.setItem(SAVE,JSON.stringify(s));toast('保存しました')}catch{toast('保存できませんでした。端末の保存設定をご確認ください')}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(!d||d.version!==1||!PLACES[d.place]||!FEEL[d.pcFeeling]||!FEEL[d.npcFeeling]||!['talk','life','move','romance'].includes(d.tab))throw Error();for(const k of ['day','time','money','energy','affection','pcMood','npcMood'])if(!Number.isFinite(d[k])||d[k]<0)throw Error();generation++;clearTimeout(timer);s={...fresh(),...d,mode:'daily',stack:[],round:0,selected:null,pair:null,bet:0};render();note('保存した暮らしの続きから。')}catch{toast('読み込めるセーブがありません');startMenu()}}
function startMenu(){dialog('宵の間','会話を重ね、暮らしを送り、言葉のない時間へ。<br>成人同士の恋愛と、8枚のカード。',[['初めから',()=>{generation++;clearTimeout(timer);s=fresh();render();say('It’s good to see you. Sit with me?','会えて嬉しいです。隣に座りませんか？')},true],['続きから',load]])}
$('send').onclick=()=>play(s.selected,'pc');$('bet').onclick=()=>{s.bet=(s.bet+1)%3;render()};$('leave').onclick=()=>{exitCards();say('Of course. We can just talk.','もちろん。普通に話しましょう。')};$('menu').onclick=()=>dialog('メニュー','仮題：宵の間。保存は手動です。',[['戻る',()=>{},true],['セーブ',save],['ロード',()=>dialog('ロード','現在の未保存の進行を、保存内容に戻しますか？',[['戻す',load],['キャンセル',()=>{}]])],['遊び方',()=>dialog('遊び方','会話や生活でムードが変わります。恋愛タブから誘うか、相手を待てます。仕事中や強い警戒・落ち込みのある時は、先に会話や休息を。<br>カード卓では絵柄を選んで出します。相手のカードをタップすると組み合わせられます。ベットは所持金を使わず、その1手のムード変化を増幅します。6手で場面が進みます。<br>衣装・足・背中はプライベートで使用できます。いつでも「仕舞う」で日常へ戻れます。',[['閉じる',()=>{}]])],['タイトルへ',()=>dialog('タイトルへ','未保存の進行は、初めから始めると失われます。',[['タイトルへ',startMenu],['戻る',()=>{}]])]]);
render();startMenu();
</script></html>
