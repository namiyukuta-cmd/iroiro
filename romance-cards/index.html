<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>宵の間 — カードゲーム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#171d1c;color:#f7efdf;font-family:system-ui,-apple-system,sans-serif}button,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #ffffff30;background:#ffffff09;border-radius:10px;min-height:44px;padding:8px 12px}button:active{transform:translateY(1px)}button:disabled{opacity:.36;cursor:default}button:focus-visible{outline:3px solid #e5ba81}main{max-width:480px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#202825;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{height:55px;flex-shrink:0;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15}h1{font-family:serif;font-size:21px;font-weight:400;letter-spacing:5px;margin:0}small{color:#bcbdad;font-size:11px}.moods{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:10px 18px}.mood-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.heart{font-size:19px;color:var(--heart)}.meter{height:5px;border-radius:9px;background:#ffffff18;overflow:hidden}.meter i{display:block;height:100%;background:#c9858f;width:var(--value);transition:width .4s}.scene{position:relative;flex:1;min-height:155px;overflow:hidden;background:linear-gradient(#555d58,#a79378 70%,#47524c)}.scene:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 73% 20%,#f6d3a876,transparent 40%);pointer-events:none}.scene.private{background:linear-gradient(110deg,#251f30,#79535c 58%,#35252d)}.scenery{position:absolute;width:100%;height:100%;opacity:.65}.location{position:absolute;top:12px;left:15px;z-index:2}.location strong{display:block;font-family:serif;font-weight:400;font-size:19px;letter-spacing:3px}.location small{display:block;margin-top:5px;color:#f5efdc}.person{position:absolute;bottom:0;width:29%;height:72%;color:#202526;filter:drop-shadow(2px 4px 3px #0004)}.person.left{left:-1%;transform:scaleX(-1)}.person.right{right:-1%}.figure{width:100%;height:100%}.reaction{position:absolute;top:16%;left:50%;z-index:4;color:#ffd2d8;font-size:23px;text-shadow:0 2px 4px #000}.left .reaction{transform:scaleX(-1)}.private .mask{display:block}.mask{display:none;position:absolute;top:28%;left:29%;width:47%;height:26%;background:#eee4cf;border:3px double #9d735e;border-radius:5px;transform:rotate(-12deg);color:#854550;text-align:center;padding-top:6px;font-size:26px}.table{display:none;position:absolute;left:14%;right:14%;top:36%;bottom:5%;border-radius:48%;background:radial-gradient(ellipse,#365c49,#193f30);border:7px solid #5c4634;box-shadow:0 8px 0 #352a23,0 10px 25px #0008;z-index:3}.playing .table{display:block}.private .table{background:radial-gradient(ellipse,#813e50,#492232)}.pile{position:absolute;inset:12% 12%;display:flex;align-items:center;justify-content:center}.card{background:#f3ead8;color:#664648;border:1px solid #c0a282;border-radius:7px;box-shadow:0 3px 7px #0003;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px}.card svg{width:100%;height:calc(100% - 20px);max-height:67px}.card span{font-size:11px;letter-spacing:1px}.pile .card{position:absolute;width:78px;height:110px;transform:translate(var(--x),var(--y)) rotate(var(--r));animation:deal .35s ease-out}.pile .card:disabled{opacity:1}.pile .card.npc{border:2px solid #b56d78}.pile .card.picked{outline:3px solid #e7b355;transform:translate(var(--x),calc(var(--y) - 10px)) rotate(var(--r))}.pile .card svg{max-height:none}.table-note{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:#e1cf9a}.message{padding:12px 18px;min-height:88px;font-size:13px;line-height:1.6;background:#202825;border-top:1px solid #ffffff10;display:flex;flex-direction:column;justify-content:center}.card-status{text-align:center;color:#debf99;letter-spacing:2px}.bottom{padding:0 12px 8px;flex-shrink:0}.primary{background:#e1c6a1!important;color:#2d3028!important;border-color:#e1c6a1!important}.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.hand .card{height:87px;min-height:0;padding:3px}.hand .selected{outline:3px solid #d9ad6b;transform:translateY(-3px)}.hand .card:disabled{opacity:.4}.card-controls{display:flex;gap:6px;margin-top:9px}.card-controls button{flex:1;font-size:12px;padding:5px}.card-controls .send{flex:1.4}.hidden{display:none!important}.footer{text-align:center;font-size:10px;color:#939c8d;padding-top:8px}.overlay{position:fixed;inset:0;z-index:20;background:#111b;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{max-width:400px;width:100%;padding:26px 22px;background:#29322d;border:1px solid #b3936870;border-radius:16px;box-shadow:0 15px 65px #0009}.dialog h2{font-family:serif;font-weight:400;letter-spacing:3px;margin-top:0}.dialog p{font-size:13px;line-height:1.8;color:#d4d2c4}.dialog .choices{display:grid;gap:9px;margin-top:18px}.fade{position:fixed;inset:0;background:#09090d;z-index:30;display:flex;align-items:center;justify-content:center;animation:blackout 1s;letter-spacing:5px;color:#d8c5b0}@keyframes deal{from{opacity:0;margin-top:70px}to{opacity:1;margin-top:0}}@keyframes blackout{from{opacity:0}to{opacity:1}}@media(max-height:700px){header{height:45px}.moods{padding:6px 16px}.hand .card{height:68px}.message{min-height:68px;padding:7px 15px}.footer{padding:3px}.scene{min-height:125px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main><header><h1>宵の間</h1><button id="menu">☰ メニュー</button></header><div class="moods" id="moods"></div><section class="scene" id="scene"><svg class="scenery" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"><path fill="#22382c" d="M0 0h38v400H0zM322 0h15v400h-15z"/><path fill="#d4bb8e" opacity=".5" d="M48 32h263v205H48z"/><path stroke="#574c3e" stroke-width="7" fill="none" d="M44 30h270v209H44zM178 30v209M44 140h270"/><path fill="#283c32" d="M0 312Q140 275 400 316v84H0z"/><path fill="#3c4938" d="M10 293v-80q-35-40-13-70 32-13 43 20 36 20 8 62v70zM360 302v-78q-22-27-8-45 40-14 45 20l-16 28v75z"/><path stroke="#b5a27d" stroke-width="7" d="M65 281h245m-217 0v47m190-47v47"/></svg><div class="location" id="location"></div><div class="person left" id="pc"></div><div class="person right" id="npc"></div><div class="table"><div class="pile" id="pile"></div><div class="table-note" id="tableNote"></div></div></section><div class="message" id="message" aria-live="polite"></div><section class="bottom"><div id="cards"><div class="hand" id="hand"></div><div class="card-controls"><button id="leave">仕舞う</button><button id="bet">ベット ＋0</button><button class="primary send" id="send">カードを出す</button></div><div class="footer" id="cardHelp">8枚は何度でも使えます</div></div></section></main><div id="modal"></div><div id="fade"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DECK=[['lips','唇',35,'M15 48Q36 24 50 36Q65 24 85 48Q66 77 50 66Q32 77 15 48ZM15 48Q50 53 85 48M30 52Q50 64 70 52'],['hand','手',0,'M36 88V67L19 47Q17 38 25 41L35 48V20Q39 10 44 20V43V13Q50 5 54 14V43V18Q62 11 64 21V45V28Q72 21 74 32V65L64 88M44 57Q55 48 64 55'],['outfit','衣装',55,'M35 12L50 23L65 12L88 28L77 47L70 41V90H30V41L23 47L12 28ZM35 12L39 38L50 23L61 38L65 12M50 23V90M54 48h1M54 62h1'],['cheek','頬',15,'M31 13Q70 4 76 39L86 53L76 57Q80 77 59 79L57 91M31 13Q14 36 28 57M59 79Q40 75 36 62M60 40h5M59 56l8 2'],['leg','足',65,'M32 10L43 49L34 79L21 84Q18 94 42 88L55 80L61 49L68 10M43 49l18 0'],['back','背中',60,'M35 12V24L12 34L24 91H77L88 34L65 24V12M26 30Q50 99 75 30M35 24Q50 32 65 24'],['ear','耳',40,'M28 63Q8 22 40 13Q77 4 80 37Q83 57 62 65Q59 91 43 84Q35 81 39 70M31 47Q22 25 46 23Q72 23 66 45L54 53Q40 44 42 60'],['neck','首',45,'M32 10Q40 37 29 49L10 59M67 10Q60 37 71 49L90 59M29 49Q48 67 71 49M10 59L18 91M90 59L82 91']];
const FEEL={calm:['穏やか','#c9cdc7'],warm:['ときめき','#dc91b0'],sad:['落ち込み','#82afc4'],angry:['怒り','#e56559'],guarded:['警戒','#9a83b4'],tense:['緊張','#c8a66c']};
const fresh=()=>({pcMood:38,npcMood:40,pcFeeling:'calm',npcFeeling:'calm',mode:'public',turn:'pc',stack:[],round:0,selected:null,pair:null,bet:0,paused:false,ended:false});
let s=fresh(), timer=null, generation=0;
const clamp=n=>Math.max(0,Math.min(100,n));
function change(k,n){s[k]=clamp(s[k]+n)}
function svg(path){return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function cardHTML(id,cls='',extra=''){const c=DECK.find(c=>c[0]===id);return `<button class="card ${cls}" ${extra} aria-label="${c[1]}">${svg(c[3])}<span>${c[1]}</span></button>`}
function person(npc){return `<svg class="figure" viewBox="0 0 100 250" aria-hidden="true"><path fill="currentColor" d="M40 15Q70 2 77 30L79 45L88 55L78 59Q76 73 62 75L65 88L90 108L100 250H2L8 120Q10 99 37 89L42 76Q22 65 25 43Q22 21 40 15Z"/><path fill="#667069" opacity=".5" d="M37 89L51 111L65 88L61 139L51 122L40 138Z"/></svg><span class="reaction">${(npc?s.npcMood:s.pcMood)>65?'♥':'///'}</span><div class="mask">♡</div>`}
function mood(npc){let f=npc?s.npcFeeling:s.pcFeeling,v=npc?s.npcMood:s.pcMood;if(f==='calm'&&v>=55)f='warm';return `<div style="--heart:${FEEL[f][1]};--value:${v}%"><div class="mood-head"><span>${npc?'オリヴァー · 30歳':'あなた · 成人'}</span><span><b class="heart">♥</b> ${v}</span></div><div class="meter"><i></i></div><small>${FEEL[f][0]}</small></div>`}
function dialog(title,body,choices){$('modal').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><p>${body}</p><div class="choices"></div></section></div>`;const box=document.querySelector('.choices');choices.forEach(([label,fn,primary])=>{const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=()=>{$('modal').innerHTML='';fn()};box.append(b)});box.querySelector('button')?.focus()}
function canCard(id){const c=DECK.find(c=>c[0]===id);return !!c&&(s.mode==='private'||!['leg','back','outfit'].includes(id))}
function eligible(){return DECK.filter(c=>canCard(c[0])&&c[2]<=s.npcMood)}
function render(){
 $('moods').innerHTML=mood(false)+mood(true);$('scene').classList.add('playing');$('scene').classList.toggle('private',s.mode==='private');$('pc').innerHTML=person(false);$('npc').innerHTML=person(true);
 $('location').innerHTML=`<strong>${s.mode==='private'?'ふたりだけの灯り':'カード卓'}</strong><small>${s.mode==='private'?'プライベート':'言葉のないやりとり'}</small>`;
 $('message').innerHTML=`<div class="card-status">${s.ended?'カードを仕舞いました':s.turn==='npc'?'相手の番…':'あなたの番'}　·　${s.round}/6</div>`;
 $('tableNote').textContent=s.mode==='private'?'ふたりの時間':'言葉のないやりとり';
 $('pile').innerHTML=s.stack.slice(-5).map((c,i)=>cardHTML(c.id,`${c.who} ${s.pair===c.seq?'picked':''}`,`style="--x:${(i-2)*13}px;--y:${(i-2)*-7}px;--r:${(i-2)*10}deg" data-seq="${c.seq}" ${c.who!=='npc'||s.turn!=='pc'||s.paused||s.ended?'disabled':''}`)).join('');
 $('pile').querySelectorAll('[data-seq]').forEach(e=>e.onclick=()=>{s.pair=s.pair===+e.dataset.seq?null:+e.dataset.seq;render()});
 $('hand').innerHTML=DECK.map(c=>cardHTML(c[0],s.selected===c[0]?'selected':'',`data-card="${c[0]}" ${!canCard(c[0])||s.turn!=='pc'||s.paused||s.ended?'disabled':''}`)).join('');
 $('hand').querySelectorAll('[data-card]').forEach(e=>e.onclick=()=>{s.selected=e.dataset.card;render()});
 $('bet').textContent=`ベット ＋${s.bet}`;$('bet').disabled=s.turn!=='pc'||s.paused||s.ended;$('send').disabled=s.turn!=='pc'||!s.selected||s.paused||s.ended;
 $('cardHelp').textContent=s.pair!==null?'相手の絵柄と組み合わせて出します':s.bet?'ベット：この1手のムード変化が大きくなります':'相手のカードをタップすると組み合わせられます';
}
function enter(first,privateMode=false){generation++;clearTimeout(timer);s.mode=privateMode?'private':'public';s.stack=[];s.round=0;s.selected=null;s.pair=null;s.bet=0;s.turn=first;s.paused=false;s.ended=false;render();if(first==='npc')scheduleNPC()}
function scheduleNPC(){const g=generation;timer=setTimeout(()=>{if(g!==generation||s.paused||s.ended||s.turn!=='npc')return;const opts=eligible();if(!opts.length){exitCards();return}const last=s.stack.at(-1);const same=last&&opts.find(c=>c[0]===last.id);const c=same&&Math.random()<.55?same:opts[Math.floor(Math.random()*opts.length)];play(c[0],'npc')},850)}
function pairBonus(id,other){return id===other?4:([id,other].includes('hand')?5:2)}
function play(id,who){if(s.paused||s.ended||!canCard(id)||s.turn!==who)return;const c=DECK.find(c=>c[0]===id);const chosen=s.stack.find(c=>c.seq===s.pair&&c.who==='npc');const risky=c[2]>s.npcMood;let gain=risky?-7:5;if(chosen)gain+=risky?0:pairBonus(id,chosen.id);gain*=1+(who==='pc'?s.bet:0)*.5;change('npcMood',Math.round(gain));change('pcMood',Math.round(gain*.7));if(chosen){s.stack=s.stack.filter(c=>c.seq!==chosen.seq);s.stack.push({...chosen,seq:s.stack.length+100+s.round})}s.stack.push({id,who,seq:Date.now()+s.round});s.round++;s.selected=null;s.pair=null;s.bet=0;s.turn=who==='pc'?'npc':'pc';render();if(risky){$('npc').querySelector('.reaction').textContent='💦'}if(s.npcMood<25){exitCards();return}if(s.round>=6){finishRound();return}if(s.turn==='npc')scheduleNPC()}
function finishRound(){generation++;clearTimeout(timer);s.paused=true;render();if(s.mode==='private'){dialog('ふたりの時間','カードを仕舞って、このままふたりで過ごしますか？',[['このまま過ごす',()=>blackout(exitCards),true],['今日はここまで',exitCards]]);return}
 s.stack=[];render();if(s.npcMood>=60&&s.pcMood>=50){dialog('もう少し、ふたりで','“I’d like some time alone with you.”<br>「君とふたりきりで過ごしたいです。」',[['応じる',()=>blackout(()=>enter(s.turn,true)),true],['今はここまで',exitCards]]);}else exitCards();}
function blackout(next){generation++;clearTimeout(timer);s.paused=true;render();const g=generation;$('fade').innerHTML='<div class="fade">ふたりの時間</div>';timer=setTimeout(()=>{if(g!==generation)return;$('fade').innerHTML='';next()},1500)}
function exitCards(){generation++;clearTimeout(timer);s.stack=[];s.selected=null;s.pair=null;s.bet=0;s.ended=true;s.paused=true;render();startMenu()}
function newGame(first){s=fresh();enter(first)}
function startMenu(){dialog('カードを仕舞いました','次のカードゲームの先攻・後攻を選べます。',[['自分から · 先攻',()=>newGame('pc'),true],['相手から · 後攻',()=>newGame('npc')]])}
function resume(){s.paused=false;render();if(s.turn==='npc')scheduleNPC()}
function menu(){if(s.ended){startMenu();return}generation++;clearTimeout(timer);s.paused=true;render();dialog('カードメニュー','8枚の絵柄とベットで遊びます。',[['続ける',resume,true],['初めから · 先攻',()=>newGame('pc')],['初めから · 後攻',()=>newGame('npc')],['遊び方',()=>dialog('遊び方','絵柄を選び「カードを出す」を押します。相手のカードをタップすると組み合わせられます。ベットはその1手のムード変化を大きくします。<br>6手ごとに場面が進みます。衣装・足・背中はワインレッドのプライベート卓で使えます。<br>「仕舞う」で終了し、先攻・後攻を選んでまた遊べます。',[['卓へ戻る',resume]])]])}
$('send').onclick=()=>play(s.selected,'pc');$('bet').onclick=()=>{if(s.paused||s.ended||s.turn!=='pc')return;s.bet=(s.bet+1)%3;render()};$('leave').onclick=exitCards;$('menu').onclick=menu;
enter('pc');
</script></html>
