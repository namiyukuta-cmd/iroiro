<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ed">
  <title>ノート</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #e9e7e0;
      color: #202020;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button, textarea { font: inherit; }

    .screen {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      overflow: hidden;
      background: #f5f3ed;
      border: 1.5px solid #2e2e2e;
    }

    .hud-left {
      position: absolute;
      z-index: 20;
      top: calc(env(safe-area-inset-top) + 15px);
      left: 15px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    .portrait {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border: 2px solid #303030;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      box-shadow: 0 1px 3px rgba(0,0,0,.10);
      position: relative;
    }

    .portrait::before {
      content: "";
      position: absolute;
      width: 17px;
      height: 17px;
      left: 19px;
      top: 10px;
      border-radius: 50%;
      background: #4a4a4a;
    }

    .portrait::after {
      content: "";
      position: absolute;
      width: 31px;
      height: 18px;
      left: 12px;
      bottom: 8px;
      border-radius: 17px 17px 9px 9px;
      background: #4a4a4a;
    }

    .stats {
      padding-top: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.42;
      letter-spacing: .02em;
      text-shadow: 0 1px 0 rgba(255,255,255,.8);
      white-space: nowrap;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 3px;
    }

    .stat-value { opacity: .65; }

    .menu-button {
      position: absolute;
      z-index: 30;
      top: calc(env(safe-area-inset-top) + 15px);
      right: 14px;
      min-width: 62px;
      height: 42px;
      padding: 0 12px;
      border: 1.5px solid #303030;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      color: #202020;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .note-input {
      position: absolute;
      z-index: 5;
      top: calc(env(safe-area-inset-top) + 88px);
      right: 13px;
      bottom: calc(env(safe-area-inset-bottom) + 13px);
      left: 13px;
      width: auto;
      height: auto;
      margin: 0;
      padding: 8px 6px;
      resize: none;
      outline: none;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #202020;
      font-size: 17px;
      line-height: 1.7;
      caret-color: #202020;
    }

    .note-input::placeholder {
      color: rgba(32,32,32,.24);
    }

    .menu-panel {
      position: absolute;
      z-index: 50;
      top: calc(env(safe-area-inset-top) + 64px);
      right: 14px;
      width: 146px;
      padding: 7px;
      border: 1.5px solid #303030;
      border-radius: 12px;
      background: rgba(250,249,245,.97);
      box-shadow: 0 8px 24px rgba(0,0,0,.14);
    }

    .menu-panel[hidden] { display: none; }

    .menu-panel button {
      width: 100%;
      min-height: 42px;
      margin: 0;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #202020;
      text-align: left;
      font-size: 14px;
    }

    .menu-panel button:active { background: rgba(0,0,0,.08); }

    .saved-mark {
      position: absolute;
      z-index: 25;
      top: calc(env(safe-area-inset-top) + 61px);
      right: 19px;
      opacity: 0;
      font-size: 11px;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .saved-mark.show { opacity: .55; }

    .history {
      position: absolute;
      z-index: 70;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #f5f3ed;
    }

    .history[hidden] { display: none; }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: calc(env(safe-area-inset-top) + 62px);
      padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
      border-bottom: 1px solid rgba(0,0,0,.18);
    }

    .history-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .close-history {
      min-width: 58px;
      min-height: 42px;
      border: 1.5px solid #303030;
      border-radius: 999px;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px calc(env(safe-area-inset-bottom) + 18px);
    }

    .log {
      padding: 12px 2px 15px;
      border-bottom: 1px solid rgba(0,0,0,.17);
    }

    .time {
      margin-bottom: 5px;
      color: #777;
      font-size: 11px;
    }

    .text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.6;
    }

    .delete {
      margin-top: 7px;
      padding: 5px 8px;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 12px;
    }

    .empty {
      margin: 22px 4px;
      color: #888;
      font-size: 14px;
    }

    @media (min-width: 521px) {
      body { padding: 16px; }
      .screen {
        height: calc(100dvh - 32px);
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="hud-left" aria-hidden="true">
      <div class="portrait"></div>
      <div class="stats">
        <div class="stat-row"><span>HP</span><span class="stat-value">—</span></div>
        <div class="stat-row"><span>MP</span><span class="stat-value">—</span></div>
        <div class="stat-row"><span>Gold</span><span class="stat-value">—</span></div>
      </div>
    </div>

    <button id="menuButton" class="menu-button" type="button" aria-expanded="false">MENU</button>
    <div id="savedMark" class="saved-mark">保存しました</div>

    <textarea id="logInput" class="note-input" aria-label="ノート" placeholder=""></textarea>

    <div id="menuPanel" class="menu-panel" hidden>
      <button id="saveButton" type="button">残す</button>
      <button id="historyButton" type="button">履歴</button>
      <button id="clearButton" type="button">入力を消す</button>
    </div>

    <section id="history" class="history" hidden aria-label="履歴">
      <header class="history-head">
        <h1 class="history-title">履歴</h1>
        <button id="closeHistory" class="close-history" type="button">閉じる</button>
      </header>
      <div id="logs" class="history-list"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'iroiro-log-box';
    const DRAFT_KEY = 'iroiro-note-draft';

    const input = document.getElementById('logInput');
    const menuButton = document.getElementById('menuButton');
    const menuPanel = document.getElementById('menuPanel');
    const saveButton = document.getElementById('saveButton');
    const historyButton = document.getElementById('historyButton');
    const clearButton = document.getElementById('clearButton');
    const history = document.getElementById('history');
    const closeHistory = document.getElementById('closeHistory');
    const logsArea = document.getElementById('logs');
    const savedMark = document.getElementById('savedMark');

    input.value = localStorage.getItem(DRAFT_KEY) || '';

    input.addEventListener('input', () => {
      localStorage.setItem(DRAFT_KEY, input.value);
    });

    function loadLogs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    function closeMenu() {
      menuPanel.hidden = true;
      menuButton.setAttribute('aria-expanded', 'false');
    }

    menuButton.addEventListener('click', () => {
      const willOpen = menuPanel.hidden;
      menuPanel.hidden = !willOpen;
      menuButton.setAttribute('aria-expanded', String(willOpen));
    });

    saveButton.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) {
        closeMenu();
        return;
      }

      const logs = loadLogs();
      logs.unshift({
        time: new Date().toLocaleString('ja-JP'),
        text
      });
      saveLogs(logs);
      input.value = '';
      localStorage.removeItem(DRAFT_KEY);
      closeMenu();

      savedMark.classList.add('show');
      window.setTimeout(() => savedMark.classList.remove('show'), 1200);
    });

    clearButton.addEventListener('click', () => {
      input.value = '';
      localStorage.removeItem(DRAFT_KEY);
      closeMenu();
      input.focus();
    });

    function renderLogs() {
      const logs = loadLogs();
      logsArea.innerHTML = '';

      if (logs.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'まだ履歴はありません。';
        logsArea.appendChild(empty);
        return;
      }

      logs.forEach((log, index) => {
        const item = document.createElement('article');
        item.className = 'log';

        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = log.time;

        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = log.text;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'delete';
        deleteButton.textContent = '削除';
        deleteButton.addEventListener('click', () => {
          const currentLogs = loadLogs();
          currentLogs.splice(index, 1);
          saveLogs(currentLogs);
          renderLogs();
        });

        item.append(time, text, deleteButton);
        logsArea.appendChild(item);
      });
    }

    historyButton.addEventListener('click', () => {
      closeMenu();
      renderLogs();
      history.hidden = false;
    });

    closeHistory.addEventListener('click', () => {
      history.hidden = true;
    });

    document.addEventListener('pointerdown', (event) => {
      if (menuPanel.hidden) return;
      if (menuPanel.contains(event.target) || menuButton.contains(event.target)) return;
      closeMenu();
    });
  </script>
</body>
</html>
