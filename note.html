<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログを残す箱</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 14px;
      border: 1px solid #aaa;
      border-radius: 10px;
      background: #fff;
      color: #222;
      font: inherit;
      resize: vertical;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .logs {
      margin-top: 28px;
    }

    .log {
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
    }

    .time {
      margin-bottom: 8px;
      color: #666;
      font-size: 17px;
    }

    .text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .delete {
      width: auto;
      min-height: 44px;
      margin-top: 12px;
      padding: 8px 16px;
      background: #666;
    }

    .empty {
      color: #777;
    }
  </style>
</head>
<body>
  <main>
    <h1>ログを残す箱</h1>

    <textarea id="logInput" placeholder="ここに残す"></textarea>
    <button id="saveButton" type="button">残す</button>

    <section class="logs" id="logs"></section>
  </main>

  <script>
    const STORAGE_KEY = 'iroiro-log-box';
    const input = document.getElementById('logInput');
    const saveButton = document.getElementById('saveButton');
    const logsArea = document.getElementById('logs');

    function loadLogs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    function renderLogs() {
      const logs = loadLogs();
      logsArea.innerHTML = '';

      if (logs.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'まだログはありません。';
        logsArea.appendChild(empty);
        return;
      }

      logs.forEach((log, index) => {
        const item = document.createElement('article');
        item.className = 'log';

        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = log.time;

        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = log.text;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'delete';
        deleteButton.textContent = '削除';
        deleteButton.addEventListener('click', () => {
          const currentLogs = loadLogs();
          currentLogs.splice(index, 1);
          saveLogs(currentLogs);
          renderLogs();
        });

        item.append(time, text, deleteButton);
        logsArea.appendChild(item);
      });
    }

    saveButton.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;

      const logs = loadLogs();
      logs.unshift({
        time: new Date().toLocaleString('ja-JP'),
        text
      });
      saveLogs(logs);
      input.value = '';
      renderLogs();
    });

    renderLogs();
  </script>
</body>
</html>
