<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>文章入力</title>
  <link rel="stylesheet" href="word-editor.css?v=20261010window1">
  <script src="word-editor.js?v=20261010window1" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>文章入力</h1>
      <button type="button" id="closeEditor">閉じる</button>
    </header>
    <p id="selectedNovel" class="selected-novel"></p>
    <textarea id="userText" placeholder="ここに文章を入力してください" rows="6" aria-label="文章入力"></textarea>
    <section class="novel-post" aria-label="交換小説へ投稿">
      <div class="novel-row">
        <label for="novelAuthor">書いた人</label>
        <select id="novelAuthor">
          <option value="user">自分</option>
          <option value="chatgpt">ChatGPT</option>
        </select>
        <button type="button" id="appendNovelLog" disabled>交換小説ログに追加</button>
      </div>
      <p class="hint">ChatGPTの文章はコピーして入力欄に貼り付けます。投稿した文章は非公開GitHubに追加され、以前の投稿は上書きしません。</p>
    </section>
    <div class="save-controls">
      <button type="button" id="saveText" disabled>GitHubに保存</button>
      <button type="button" id="newText" disabled>新しい文章</button>
    </div>
    <p id="editorStatus" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
