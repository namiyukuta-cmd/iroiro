<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>文章入力・交換小説ログ</title>
  <link rel="stylesheet" href="word_index.css?v=20261010novel1">
  <script src="word_index.js?v=20261010private2" defer></script>
  <script src="novel-logs.js?v=20261010novel1" defer></script>
</head>
<body>
  <main>
    <section class="novel-section" aria-labelledby="novelHeading">
      <h1 id="novelHeading">交換小説ログ</h1>
      <label for="novelSelect">作品</label>
      <div class="novel-row">
        <select id="novelSelect" aria-label="作品を選択"><option value="">作品を選択してください</option></select>
        <button type="button" id="refreshNovels">一覧を更新</button>
      </div>
      <div class="novel-row">
        <input id="novelTitle" type="text" maxlength="120" placeholder="新しい作品名" aria-label="新しい作品名">
        <button type="button" id="createNovel">作品を作成</button>
      </div>
      <p id="novelStatus" role="status" aria-live="polite"></p>
    </section>

    <label class="editor-label" for="userText">文章入力</label>
    <textarea id="userText" placeholder="ここに文章を入力してください" rows="6" aria-label="文章入力"></textarea>

    <section class="novel-post" aria-label="交換小説へ投稿">
      <div class="novel-row">
        <label for="novelAuthor">書いた人</label>
        <select id="novelAuthor">
          <option value="user">自分</option>
          <option value="chatgpt">ChatGPT</option>
        </select>
        <button type="button" id="appendNovelLog">交換小説ログに追加</button>
      </div>
      <p class="hint">ChatGPTの文章はコピーして入力欄に貼り付けます。投稿した文章は非公開GitHubに追加され、以前の投稿は上書きしません。</p>
    </section>

    <section class="novel-entries-section" aria-labelledby="novelEntriesHeading">
      <div class="saved-title">
        <h2 id="novelEntriesHeading">投稿ログ</h2>
        <div class="novel-row">
          <button type="button" id="refreshNovelLogs">再読み込み</button>
          <button type="button" id="copyNovelLog">全文コピー</button>
        </div>
      </div>
      <div id="novelEntries" class="novel-entries"><p>作品を選択してください。</p></div>
    </section>

    <section class="standalone-save" aria-label="単独の文章を保存">
      <h2>文章ファイルの保存</h2>
      <div class="save-controls">
        <button type="button" id="saveText">GitHubに保存</button>
        <button type="button" id="newText">新しい文章</button>
      </div>
      <p id="saveStatus" role="status" aria-live="polite"></p>
      <section class="saved-section" aria-label="保存済みの文章">
        <div class="saved-title">
          <h2>保存済みの文章</h2>
          <button type="button" id="refreshSaves">一覧を更新</button>
        </div>
        <div id="savedList" class="saved-list"></div>
      </section>
    </section>

    <details id="githubSettings" class="github-settings">
      <summary>GitHub接続設定</summary>
      <label for="githubToken">private-game-data に書き込めるGitHubトークン</label>
      <input id="githubToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="トークンを入力">
      <button type="button" id="registerToken">この端末にトークンを登録</button>
      <p>トークンはこのブラウザに保存します。HTMLやGitHubの公開リポジトリには書き込みません。</p>
    </details>
  </main>
</body>
</html>
