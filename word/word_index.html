<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>文章入力</title>
  <link rel="stylesheet" href="word_index.css?v=20261010private2">
  <script src="word_index.js?v=20261010private2" defer></script>
</head>
<body>
  <main>
    <textarea id="userText" placeholder="ここに文章を入力してください" rows="6" aria-label="文章入力"></textarea>
    <div class="save-controls">
      <button type="button" id="saveText">GitHubに保存</button>
      <button type="button" id="newText">新しい文章</button>
    </div>
    <p id="saveStatus" role="status" aria-live="polite"></p>
    <section class="saved-section" aria-label="保存済みの文章">
      <div class="saved-title">
        <h2>保存済みの文章</h2>
        <button type="button" id="refreshSaves">一覧を更新</button>
      </div>
      <div id="savedList" class="saved-list"></div>
    </section>
    <details id="githubSettings" class="github-settings">
      <summary>GitHub接続設定</summary>
      <label for="githubToken">private-game-data に書き込めるGitHubトークン</label>
      <input id="githubToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="トークンを入力">
      <button type="button" id="registerToken">この端末にトークンを登録</button>
      <p>トークンはこのブラウザに保存します。HTMLやGitHubの公開リポジトリには書き込みません。</p>
    </details>
  </main>
</body>
</html>
