<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9a65f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>一人暮らしの部屋</title>
  <link rel="stylesheet" href="style.css?_nc=20261008-inventory-2">
</head>
<body>
<main class="app">
  <header class="hud">
    <div>
      <p class="eyebrow">MY FIRST ROOM</p>
      <h1>一人暮らしの部屋</h1>
    </div>
    <div class="money"><span>残金</span><strong id="money">0</strong><small>円</small></div>
  </header>

  <section class="goal-card">
    <div class="goal-head">
      <div><span class="goal-label">目標</span><strong id="goalTitle">引っ越し初日</strong></div>
      <button id="completeBtn" type="button">達成</button>
    </div>
    <div id="goalProgress" class="goal-progress"></div>
  </section>

  <section class="room-panel">
    <div class="room-head">
      <span id="sceneTitle" class="room-type">マイルーム</span>
      <span id="statusText">家具を選んで置きます</span>
      <button id="undoBtn" class="history-btn" type="button" disabled aria-label="元に戻す">↶ 戻す</button>
      <button id="redoBtn" class="history-btn" type="button" disabled aria-label="やり直す">↷ やり直す</button>
      <button id="gridToggle" class="grid-toggle" type="button" aria-pressed="false">マス目：OFF</button>
    </div>
    <div id="grid" class="grid" role="grid" aria-label="マイルーム"></div>
    <nav id="sceneNav" class="scene-nav" aria-label="部屋の移動">
      <button type="button" data-direction="left" class="scene-step" hidden></button>
      <button type="button" data-direction="up" class="scene-step" hidden></button>
      <button type="button" data-direction="down" class="scene-step" hidden></button>
      <button type="button" data-direction="right" class="scene-step" hidden></button>
    </nav>
  </section>

  <section class="controls">
    <div class="control-top">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="furniture" type="button">家具</button>
        <button class="tab" data-tab="appliance" type="button">家電・雑貨</button>
        <button class="tab" data-tab="manage" type="button">管理</button>
      </div>
      <button id="inventoryBtn" class="rotate-btn" type="button">手元・収納</button>
      <button id="rotateBtn" class="rotate-btn" type="button">↻ 回転</button>
    </div>

    <div id="furnitureTools" class="tool-grid panel">
      <button class="tool active" data-tool="bed" type="button"><b>ベッド</b><small>2×3 / 12,000円</small></button>
      <button class="tool" data-tool="desk" type="button"><b>机</b><small>2×1 / 5,000円</small></button>
      <button class="tool" data-tool="table" type="button"><b>ローテーブル</b><small>2×2 / 4,000円</small></button>
      <button class="tool" data-tool="sofa" type="button"><b>ソファ</b><small>3×1 / 9,000円</small></button>
      <button class="tool" data-tool="shelf" type="button"><b>収納棚</b><small>1×2 / 6,000円</small></button>
    </div>

    <div id="applianceTools" class="tool-grid panel hidden">
      <button class="tool" data-tool="fridge" type="button"><b>冷蔵庫</b><small>1×1 / 10,000円</small></button>
      <button class="tool" data-tool="washer" type="button"><b>洗濯機</b><small>1×1 / 8,000円</small></button>
      <button class="tool" data-tool="tv" type="button"><b>テレビ</b><small>2×1 / 7,000円</small></button>
      <button class="tool" data-tool="rug" type="button"><b>ラグ</b><small>3×2 / 3,000円</small></button>
      <button class="tool" data-tool="plant" type="button"><b>観葉植物</b><small>1×1 / 1,500円</small></button>
    </div>

    <div id="manageTools" class="manage panel hidden">
      <button id="removeBtn" type="button">家具を撤去</button>
      <button id="saveBtn" type="button">保存</button>
      <button id="loadBtn" type="button">読込</button>
      <button id="resetBtn" class="danger" type="button">引っ越し直す</button>
      <a href="../index.html?_nc=20261008-inventory-2">一覧へ</a>
    </div>
  </section>
</main>
<aside id="inventoryPanel" class="inventory-panel" hidden aria-label="手元と収納">
  <div class="inventory-head"><strong id="inventoryTitle">手元・未配置</strong><button id="inventoryBack" type="button" hidden>手元へ</button><button id="inventoryClose" type="button" aria-label="収納を閉じる">閉じる</button></div>
  <p id="inventoryHint" class="inventory-hint">家具をドラッグして部屋へ。部屋の家具もここへ戻せます。</p>
  <div id="loose" class="loose"><div id="looseList" class="loose-list"></div></div>
  <div id="storageGrid" class="storage-grid" hidden></div>
  <div class="inventory-actions"><button id="buyLooseBtn" type="button">選択中の家具を購入</button><button id="toLooseBtn" type="button" disabled>選択した家具を手元へ</button></div>
</aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="data.js?_nc=20261008-inventory-2"></script>
<script src="inventory.js?_nc=20261008-inventory-2"></script>
<script src="game.js?_nc=20261008-inventory-2"></script>
</body>
</html>
