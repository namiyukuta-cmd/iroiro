<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SHOP</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%}
    body{
      min-height:100dvh;display:grid;place-items:center;
      background:#d7d0bc;color:#211f1a;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background-image:
        linear-gradient(rgba(80,67,45,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(80,67,45,.06) 1px,transparent 1px);
      background-size:22px 22px;
    }
    main{width:min(100% - 36px,430px);display:grid;gap:14px}
    h1{margin:0 0 6px;text-align:center;font-size:30px;letter-spacing:.05em}
    .sub{text-align:center;margin:0 0 22px;color:#5b5548;font-size:13px}
    .menu{
      min-height:64px;border:2px solid #29261f;border-radius:10px;
      background:#eee8d8;color:#211f1a;font:inherit;font-size:19px;font-weight:800;
      display:grid;place-items:center;text-decoration:none;cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
    }
    .menu:active{transform:scale(.985);background:#e0d6be}
    .back{margin-top:8px;min-height:50px;font-size:16px}
  </style>
</head>
<body>
  <main>
    <div>
      <h1 id="gameTitle"></h1>
      <p class="sub" id="gameSubtitle"></p>
    </div>
    <a class="menu" id="newGameLink"></a>
    <a class="menu" id="continueGameLink"></a>
    <a class="menu back" id="backLink"></a>
  </main>
  <script>
  (async () => {
    const stamp = Date.now();
    for (const file of ['./SHOP_data.js','./SHOP_index.js']) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = file + '?v=20260923-far-layer-shift-v3&nocache=' + stamp;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }
  })();
  </script>
</body>
</html>
