<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SHOP</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#d8d0bb;color:#211f1a}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    button,a{font:inherit;color:inherit}
    .app{
      width:min(100%,520px);
      height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto auto;
      background:#eee8d8;
      border-left:1px solid rgba(41,38,31,.28);
      border-right:1px solid rgba(41,38,31,.28);
    }

    .top-status{
      padding:max(10px,env(safe-area-inset-top)) 12px 10px;
      border-bottom:2px solid #29261f;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:6px;
      background:#e9e1cf;
    }
    .status-cell{
      min-width:0;
      padding:6px 4px;
      text-align:center;
      border:1px solid #6e6659;
      border-radius:8px;
      background:#f8f3e8;
    }
    .status-label{display:block;font-size:10px;color:#6b6457;line-height:1}
    .status-value{display:block;margin-top:4px;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .scene-area{
      min-height:0;
      display:grid;
      grid-template-rows:minmax(0,1.2fr) minmax(150px,.8fr);
      background:#cfc6b3;
    }

    .town-panel{
      position:relative;
      min-height:0;
      border-bottom:2px solid #29261f;
      background:#bdb39f;
      overflow:hidden;
    }
    .town-scroll{
      width:100%;
      height:100%;
      overflow:hidden;
    }
    .town-strip{
      position:relative;
      width:100%;
      height:100%;
      min-width:0;
      background:#9cc9df;
      background-size:cover;
      background-position:center 62%;
      background-repeat:no-repeat;
      overflow:hidden;
    }
    .scene-layer{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }
    .scene-layer-far{z-index:0}
    .scene-layer-house{z-index:20}
    .scene-layer-backgroundNpc{z-index:40}
    .scene-layer-interactive{z-index:60}
    .scene-layer-player{z-index:100}
    .pickup-marker{
      position:absolute;
      z-index:90;
      transform:translate(-50%,0);
      border:0;
      padding:8px;
      margin:0;
      background:transparent;
      color:#fff4a6;
      font-size:30px;
      line-height:1;
      font-weight:900;
      text-shadow:0 0 4px #fff,0 0 8px #ffe45c,0 0 14px #ffd000;
      pointer-events:auto;
      cursor:pointer;
      animation:pickupGlow 1.15s ease-in-out infinite alternate;
    }
    .pickup-marker:active{transform:translate(-50%,0) scale(.88)}
    @keyframes pickupGlow{
      from{opacity:.65;filter:brightness(.9)}
      to{opacity:1;filter:brightness(1.35)}
    }
    .scene-object{
      position:absolute;
      bottom:0;
      display:block;
      max-width:none;
      object-fit:contain;
      object-position:center bottom;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
      filter:drop-shadow(0 2px 2px rgba(47,34,22,.18));
    }
    .layer-people,.layer-backgroundNpc{
      filter:drop-shadow(2px 3px 3px rgba(0,0,0,.28));
    }
    .selectable-npc{
      filter:
        drop-shadow(2px 0 0 #ffe600)
        drop-shadow(-2px 0 0 #ffe600)
        drop-shadow(0 2px 0 #ffe600)
        drop-shadow(0 -2px 0 #ffe600)
        drop-shadow(3px 3px 3px rgba(0,0,0,.32));
    }

    .action-screen{
      position:absolute;
      inset:0;
      z-index:500;
      display:none;
      grid-template-rows:24% minmax(0,1fr);
      background:#eee8d8;
      overflow:hidden;
    }
    .action-screen.is-open{display:grid}

    /* 戻る・モード切替はレイアウトを押し下げない浮きUI */
    .action-head{
      position:absolute;
      left:10px;
      right:10px;
      top:max(8px,env(safe-area-inset-top));
      z-index:20;
      display:flex;
      justify-content:space-between;
      align-items:center;
      pointer-events:none;
    }
    .action-back,.action-mode{
      pointer-events:auto;
      border:2px solid #29261f;
      border-radius:999px;
      background:rgba(255,250,240,.92);
      font-weight:900;
      min-height:38px;
      padding:5px 11px;
    }
    .action-head-title{display:none}
    .action-modes{display:flex;gap:6px}
    .action-mode[disabled]{opacity:.35}

    /* 上部：人の行き交いは足だけ */
    .feet-lane{
      position:relative;
      overflow:hidden;
      border-bottom:2px solid #29261f;
      background:#f8f3e8;
    }
    .feet-pair{
      position:absolute;
      top:42%;
      width:76px;
      height:68px;
      transform:translateX(-50%);
      animation:feetPass 7s linear infinite;
    }
    .feet-pair.left{left:-12%;animation-delay:0s}
    .feet-pair.right{left:-12%;animation-delay:3.5s}
    @keyframes feetPass{
      from{left:-12%}
      to{left:112%}
    }
    .foot{
      position:absolute;
      bottom:0;
      width:30px;
      height:16px;
      border-radius:50% 60% 45% 55%;
      background:#211f1a;
    }
    .foot::before{
      content:'';
      position:absolute;
      left:10px;
      bottom:10px;
      width:12px;
      height:42px;
      background:#211f1a;
      border-radius:7px 7px 0 0;
    }
    .foot.a{left:6px}
    .foot.b{right:6px}

    /* 下部：左に時間、右に物乞い/売り場 */
    .action-body{
      position:relative;
      min-height:0;
      display:grid;
      grid-template-columns:62px minmax(0,1fr);
      overflow:hidden;
      background:#eee8d8;
    }
    .time-rail{
      position:relative;
      min-height:0;
      border-right:2px solid #29261f;
      background:#e7deca;
      overflow:hidden;
    }
    .time-track{
      position:absolute;
      left:34px;
      top:5%;
      bottom:5%;
      width:3px;
      background:#4c463d;
    }
    .time-tick{
      position:absolute;
      left:-8px;
      width:19px;
      height:1px;
      background:#4c463d;
      transform:translateY(-50%);
    }
    .time-tick.major{
      left:-12px;
      width:27px;
      height:2px;
    }
    .time-label{
      position:absolute;
      right:34px;
      transform:translateY(-50%);
      font-size:9px;
      font-weight:800;
      color:#5e574d;
      white-space:nowrap;
    }
    .time-special{
      position:absolute;
      left:-15px;
      width:33px;
      height:5px;
      border-radius:999px;
      background:#29261f;
      transform:translateY(-50%);
    }
    .time-special-label{
      position:absolute;
      left:8px;
      transform:translateY(-50%);
      font-size:8px;
      font-weight:900;
      white-space:nowrap;
      writing-mode:vertical-rl;
      letter-spacing:.04em;
    }
    .time-now{
      position:absolute;
      left:-7px;
      width:17px;
      height:17px;
      border:3px solid #29261f;
      border-radius:50%;
      background:#fffaf0;
      transform:translate(-50%,-50%);
      z-index:4;
    }

    .action-main{
      position:relative;
      min-width:0;
      min-height:0;
      overflow:hidden;
      background:#eee8d8;
    }

    /* 物乞い：壺だけ */
    .beg-pot{
      position:absolute;
      left:50%;
      bottom:14%;
      transform:translateX(-50%);
      width:126px;
      height:92px;
      border:3px solid #29261f;
      border-radius:20px 20px 50% 50%;
      background:#c6a06b;
    }
    .beg-pot::before{
      content:'';
      position:absolute;
      left:20px;
      right:20px;
      top:-20px;
      height:20px;
      border:3px solid #29261f;
      border-bottom:0;
      background:#d2b17f;
      transform:perspective(80px) rotateX(35deg);
    }

    /* 物売り：3×3グリッド */
    .sell-grid{
      position:absolute;
      left:50%;
      top:10%;
      transform:translateX(-50%);
      width:min(84%,370px);
      aspect-ratio:1/1;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      border:3px solid #29261f;
      background:#f8f3e8;
    }
    .sell-cell{
      border-right:1px solid #7d7467;
      border-bottom:1px solid #7d7467;
      display:grid;
      place-items:center;
      padding:6px;
      text-align:center;
      font-size:12px;
      font-weight:800;
      background:#fffaf0;
    }
    .sell-cell:nth-child(3n){border-right:0}
    .sell-cell:nth-last-child(-n+3){border-bottom:0}
    .sell-cell.empty{color:#aaa}

    /* 人が止まった時だけ会話を出す */
    .action-dialog{
      position:absolute;
      left:7%;
      right:7%;
      top:6%;
      z-index:10;
      padding:12px;
      border:3px solid #29261f;
      border-radius:12px;
      background:#fffaf0;
      font-weight:800;
      display:none;
    }
    .action-dialog.is-open{display:block}
    .town-placeholder{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:#5d5548;
      font-weight:900;
      letter-spacing:.08em;
      background:
        linear-gradient(rgba(55,48,39,.06) 1px,transparent 1px),
        linear-gradient(90deg,rgba(55,48,39,.05) 1px,transparent 1px);
      background-size:28px 28px;
    }
    .scene-name{
      position:absolute;
      left:10px;
      top:10px;
      z-index:2;
      padding:6px 9px;
      border:1px solid #29261f;
      border-radius:8px;
      background:rgba(248,243,232,.9);
      font-size:13px;
      font-weight:900;
      pointer-events:none;
    }

    .player-panel{
      min-height:0;
      padding:12px;
      display:grid;
      grid-template-columns:92px minmax(0,1fr);
      gap:12px;
      background:#eee8d8;
    }
    .portrait{
      border:2px solid #29261f;
      border-radius:10px;
      background:#f8f3e8;
      display:grid;
      place-items:center;
      overflow:hidden;
      font-size:13px;
      font-weight:900;
      color:#746c5f;
    }
    .portrait img{width:100%;height:100%;object-fit:cover;display:block}
    .stats{display:grid;align-content:center;gap:10px}
    .stat-row{display:grid;grid-template-columns:44px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:13px;font-weight:900}
    .bar{
      height:14px;
      border:1px solid #29261f;
      border-radius:999px;
      overflow:hidden;
      background:#d7cebb;
    }
    .bar-fill{height:100%;width:0%;background:#514a40}
    .stat-num{text-align:right;font-variant-numeric:tabular-nums}

    #saveStatus{
      min-height:26px;
      margin:0;
      padding:4px 12px;
      border-top:1px solid #afa592;
      background:#eee8d8;
      color:#5b5548;
      font-size:12px;
      font-weight:700;
    }

    .bottom-menu{
      padding:10px 10px max(10px,env(safe-area-inset-bottom));
      border-top:2px solid #29261f;
      background:#e9e1cf;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:7px;
    }
    .menu-btn,.menu-link{
      min-height:48px;
      border:2px solid #29261f;
      border-radius:9px;
      background:#fffaf0;
      text-decoration:none;
      display:grid;
      place-items:center;
      text-align:center;
      font-size:13px;
      font-weight:900;
      padding:4px;
    }
    .menu-btn:active,.menu-link:active{transform:scale(.98);background:#e0d6be}
    .menu-btn:disabled{opacity:.5}

    @media(max-height:700px){
      .scene-area{grid-template-rows:minmax(0,1fr) 145px}
      .player-panel{grid-template-columns:78px minmax(0,1fr);padding:9px}
      .bottom-menu{padding-top:7px}
      .menu-btn,.menu-link{min-height:43px}
    }
  </style>
</head>
<body>
<script>
(() => {
  const SHOP_BUILD='20260923-1405-restore-1337';
  const u=new URL(location.href);
  if(u.searchParams.get('build')!==SHOP_BUILD){
    u.searchParams.set('build',SHOP_BUILD);
    location.replace(u.toString());
  }
})();
</script>
  <div class="app">
    <header class="top-status" aria-label="日時と天候">
      <div class="status-cell"><span class="status-label" id="dayLabel"></span><span class="status-value" id="dayText"></span></div>
      <div class="status-cell"><span class="status-label" id="timeLabel"></span><span class="status-value" id="timeText"></span></div>
      <div class="status-cell"><span class="status-label" id="tempLabel"></span><span class="status-value" id="tempText"></span></div>
      <div class="status-cell"><span class="status-label" id="weatherLabel"></span><span class="status-value" id="weatherText"></span></div>
    </header>

    <section class="action-screen" id="actionScreen" aria-label="行動">
      <div class="action-head">
        <button type="button" class="action-back" id="actionBack">戻る</button>
        <div class="action-head-title" id="actionTitle">行動</div>
        <div class="action-modes">
          <button type="button" class="action-mode" id="begModeButton">物乞い</button>
          <button type="button" class="action-mode" id="sellModeButton">物を売る</button>
        </div>
      </div>

      <div class="feet-lane" aria-label="人の行き交い">
        <div class="feet-pair left"><span class="foot a"></span><span class="foot b"></span></div>
        <div class="feet-pair right"><span class="foot a"></span><span class="foot b"></span></div>
      </div>

      <div class="action-body">
        <aside class="time-rail" aria-label="時間">
          <div class="time-track" id="timeTrack"></div>
        </aside>

        <div class="action-main">
          <div class="action-dialog" id="actionDialog"></div>
          <div class="beg-pot" id="begPot" aria-label="物乞いの壺"></div>
          <div class="sell-grid" id="sellGrid" aria-label="売る物"></div>
        </div>
      </div>
    </section>

    <main class="scene-area">
      <section class="town-panel" aria-label="町">
        <div class="scene-name" id="sceneName"></div>
        <div class="town-scroll" id="townScroll">
          <div class="town-strip" id="townStrip">
            <div class="town-placeholder" id="townPlaceholder"></div>
          </div>
        </div>
      </section>

      <section class="player-panel" aria-label="主人公の状態">
        <div class="portrait" id="portrait"></div>
        <div class="stats">
          <div class="stat-row">
            <span id="hpLabel"></span>
            <div class="bar"><div class="bar-fill" id="hpBar"></div></div>
            <span class="stat-num" id="hpText"></span>
          </div>
          <div class="stat-row">
            <span id="hungerLabel"></span>
            <div class="bar"><div class="bar-fill" id="hungerBar"></div></div>
            <span class="stat-num" id="hungerText"></span>
          </div>
          <div class="stat-row">
            <span id="thirstLabel"></span>
            <div class="bar"><div class="bar-fill" id="thirstBar"></div></div>
            <span class="stat-num" id="thirstText"></span>
          </div>
        </div>
      </section>
    </main>

    <p id="saveStatus" aria-live="polite"></p>
    <nav class="bottom-menu" id="bottomMenu" aria-label="メニュー"></nav>
  </div>

  <script src="./SHOP_data.js?v=20260923-1405-restore-1337"></script>
  <script src="./SHOP_items.js?v=20260923-1405-restore-1337"></script>
  <script src="./SHOP_action.js?v=20260923-1405-restore-1337"></script>
  <script src="./SHOP_save.js?v=20260923-1405-restore-1337"></script>
  <script src="./SHOP_app.js?v=20260923-1405-restore-1337"></script>
</body>
</html>
