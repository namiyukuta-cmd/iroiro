<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>お店屋さん</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#d7d0bc;color:#211f1a}
    body{
      min-height:100dvh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background-image:
        linear-gradient(rgba(80,67,45,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(80,67,45,.06) 1px,transparent 1px);
      background-size:22px 22px;
    }
    .app{
      width:min(100%,520px);
      min-height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      background:rgba(238,232,216,.72);
      border-left:1px solid rgba(41,38,31,.28);
      border-right:1px solid rgba(41,38,31,.28);
    }
    header{
      padding:max(16px,env(safe-area-inset-top)) 16px 14px;
      border-bottom:2px solid #29261f;
      background:#eee8d8;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    h1{margin:0;font-size:24px}
    .money{font-weight:800;font-size:16px}
    main{padding:18px 16px 24px;display:grid;align-content:start;gap:18px}
    .shop-board{
      min-height:250px;
      border:2px solid #29261f;
      border-radius:12px;
      background:#f3eddd;
      padding:16px;
      display:grid;
      gap:16px;
    }
    .shelf{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,62px);
      border:4px solid #9b5b3d;
      background:#e9dfcb;
    }
    .shelf div{border:1px solid rgba(41,38,31,.5)}
    .counter{
      height:52px;
      border:4px solid #b7a91d;
      background:#f4e989;
      border-radius:4px;
    }
    .floor{
      min-height:180px;
      border:2px dashed rgba(41,38,31,.28);
      border-radius:12px;
      display:grid;
      place-items:center;
      color:#6b6456;
      font-weight:700;
      font-size:14px;
    }
    #saveStatus{min-height:24px;margin:0;color:#5b5548;font-size:14px;font-weight:700}
    nav{
      padding:12px 14px max(12px,env(safe-area-inset-bottom));
      border-top:2px solid #29261f;
      background:#eee8d8;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
    }
    button,a.navbtn{
      min-height:50px;
      border:2px solid #29261f;
      border-radius:10px;
      background:#fffaf0;
      color:#211f1a;
      font:inherit;
      font-weight:800;
      text-decoration:none;
      display:grid;
      place-items:center;
    }
    button:active,a.navbtn:active{transform:scale(.985);background:#e0d6be}
    button:disabled{opacity:.5}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>お店屋さん</h1>
      <div class="money">所持金 <span id="moneyText">0</span></div>
    </header>

    <main>
      <section class="shop-board" aria-label="店内">
        <div class="shelf" aria-label="商品棚">
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>
        <div class="counter" aria-label="カウンター"></div>
        <div class="floor">店内</div>
      </section>
      <p id="saveStatus" aria-live="polite"></p>
    </main>

    <nav aria-label="メニュー">
      <button id="loadButton" type="button">ロード</button>
      <button id="saveButton" type="button">セーブ</button>
      <a class="navbtn" href="./SHOP_index.html">戻る</a>
    </nav>
  </div>

  <script src="./SHOP_save.js"></script>
  <script>
    (() => {
      // ブラウザ保存はしない。未セーブの状態はページを閉じると消える。
      window.SHOP_STATE = { version: 1, money: 0 };

      const status = document.getElementById('saveStatus');
      const saveButton = document.getElementById('saveButton');
      const loadButton = document.getElementById('loadButton');
      const moneyText = document.getElementById('moneyText');
      const params = new URLSearchParams(location.search);

      if (params.get('continue') === '1') {
        status.textContent = '続きから始める場合は「ロード」を押してください。';
      }

      function render(){
        moneyText.textContent = Number(window.SHOP_STATE.money || 0);
      }

      saveButton.addEventListener('click', async () => {
        saveButton.disabled = true;
        status.textContent = '保存中';
        try {
          await window.SHOP_SAVE.save(window.SHOP_STATE);
          status.textContent = '保存しました';
        } catch (error) {
          status.textContent = error && error.message ? error.message : '保存に失敗しました';
        } finally {
          saveButton.disabled = false;
        }
      });

      loadButton.addEventListener('click', async () => {
        loadButton.disabled = true;
        status.textContent = '読込中';
        try {
          const data = await window.SHOP_SAVE.load();
          if (data && typeof data === 'object') {
            window.SHOP_STATE = data;
            render();
          }
          status.textContent = '読み込みました';
        } catch (error) {
          status.textContent = error && error.message ? error.message : '読み込みに失敗しました';
        } finally {
          loadButton.disabled = false;
        }
      });

      render();
    })();
  </script>
</body>
</html>
