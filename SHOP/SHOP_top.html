<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SHOP</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#d8d0bb;color:#211f1a}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    button,a{font:inherit;color:inherit}
    .app{
      width:min(100%,520px);
      height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto auto;
      background:#eee8d8;
      border-left:1px solid rgba(41,38,31,.28);
      border-right:1px solid rgba(41,38,31,.28);
    }

    .top-status{
      padding:max(10px,env(safe-area-inset-top)) 12px 10px;
      border-bottom:2px solid #29261f;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:6px;
      background:#e9e1cf;
    }
    .status-cell{
      min-width:0;
      padding:6px 4px;
      text-align:center;
      border:1px solid #6e6659;
      border-radius:8px;
      background:#f8f3e8;
    }
    .status-label{display:block;font-size:10px;color:#6b6457;line-height:1}
    .status-value{display:block;margin-top:4px;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .scene-area{
      min-height:0;
      display:grid;
      grid-template-rows:minmax(0,1.2fr) minmax(150px,.8fr);
      background:#cfc6b3;
    }

    .town-panel{
      position:relative;
      min-height:0;
      border-bottom:2px solid #29261f;
      background:#bdb39f;
      overflow:hidden;
    }
    .town-scroll{
      width:100%;
      height:100%;
      overflow:hidden;
    }
    .town-strip{
      position:relative;
      width:100%;
      height:100%;
      min-width:0;
      background:#c7bca8;
      background-size:cover;
      background-position:center bottom;
      background-repeat:no-repeat;
      overflow:hidden;
    }
    .scene-object{
      position:absolute;
      bottom:0;
      display:block;
      max-width:none;
      object-fit:contain;
      object-position:center bottom;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
      filter:drop-shadow(0 2px 2px rgba(47,34,22,.18));
    }
    .layer-people{
      filter:
        drop-shadow(1px 0 0 rgba(255,248,225,.72))
        drop-shadow(-1px 0 0 rgba(255,248,225,.72))
        drop-shadow(0 1px 0 rgba(255,248,225,.72))
        drop-shadow(0 -1px 0 rgba(255,248,225,.72))
        drop-shadow(2px 3px 3px rgba(0,0,0,.32));
    }

    .town-placeholder{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:#5d5548;
      font-weight:900;
      letter-spacing:.08em;
      background:
        linear-gradient(rgba(55,48,39,.06) 1px,transparent 1px),
        linear-gradient(90deg,rgba(55,48,39,.05) 1px,transparent 1px);
      background-size:28px 28px;
    }
    .scene-name{
      position:absolute;
      left:10px;
      top:10px;
      z-index:2;
      padding:6px 9px;
      border:1px solid #29261f;
      border-radius:8px;
      background:rgba(248,243,232,.9);
      font-size:13px;
      font-weight:900;
      pointer-events:none;
    }

    .player-panel{
      min-height:0;
      padding:12px;
      display:grid;
      grid-template-columns:92px minmax(0,1fr);
      gap:12px;
      background:#eee8d8;
    }
    .portrait{
      border:2px solid #29261f;
      border-radius:10px;
      background:#f8f3e8;
      display:grid;
      place-items:center;
      overflow:hidden;
      font-size:13px;
      font-weight:900;
      color:#746c5f;
    }
    .portrait img{width:100%;height:100%;object-fit:cover;display:block}
    .stats{display:grid;align-content:center;gap:10px}
    .stat-row{display:grid;grid-template-columns:44px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:13px;font-weight:900}
    .bar{
      height:14px;
      border:1px solid #29261f;
      border-radius:999px;
      overflow:hidden;
      background:#d7cebb;
    }
    .bar-fill{height:100%;width:0%;background:#514a40}
    .stat-num{text-align:right;font-variant-numeric:tabular-nums}

    #saveStatus{
      min-height:26px;
      margin:0;
      padding:4px 12px;
      border-top:1px solid #afa592;
      background:#eee8d8;
      color:#5b5548;
      font-size:12px;
      font-weight:700;
    }

    .bottom-menu{
      padding:10px 10px max(10px,env(safe-area-inset-bottom));
      border-top:2px solid #29261f;
      background:#e9e1cf;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:7px;
    }
    .menu-btn,.menu-link{
      min-height:48px;
      border:2px solid #29261f;
      border-radius:9px;
      background:#fffaf0;
      text-decoration:none;
      display:grid;
      place-items:center;
      text-align:center;
      font-size:13px;
      font-weight:900;
      padding:4px;
    }
    .menu-btn:active,.menu-link:active{transform:scale(.98);background:#e0d6be}
    .menu-btn:disabled{opacity:.5}

    @media(max-height:700px){
      .scene-area{grid-template-rows:minmax(0,1fr) 145px}
      .player-panel{grid-template-columns:78px minmax(0,1fr);padding:9px}
      .bottom-menu{padding-top:7px}
      .menu-btn,.menu-link{min-height:43px}
    }
  </style>
</head>
<body>
<script>
(() => {
  const SHOP_BUILD='20260923-0842';
  const u=new URL(location.href);
  if(u.searchParams.get('build')!==SHOP_BUILD){
    u.searchParams.set('build',SHOP_BUILD);
    location.replace(u.toString());
  }
})();
</script>
  <div class="app">
    <header class="top-status" aria-label="日時と天候">
      <div class="status-cell"><span class="status-label" id="dayLabel"></span><span class="status-value" id="dayText"></span></div>
      <div class="status-cell"><span class="status-label" id="timeLabel"></span><span class="status-value" id="timeText"></span></div>
      <div class="status-cell"><span class="status-label" id="tempLabel"></span><span class="status-value" id="tempText"></span></div>
      <div class="status-cell"><span class="status-label" id="weatherLabel"></span><span class="status-value" id="weatherText"></span></div>
    </header>

    <main class="scene-area">
      <section class="town-panel" aria-label="町">
        <div class="scene-name" id="sceneName"></div>
        <div class="town-scroll" id="townScroll">
          <div class="town-strip" id="townStrip">
            <div class="town-placeholder" id="townPlaceholder"></div>
          </div>
        </div>
      </section>

      <section class="player-panel" aria-label="主人公の状態">
        <div class="portrait" id="portrait"></div>
        <div class="stats">
          <div class="stat-row">
            <span id="hpLabel"></span>
            <div class="bar"><div class="bar-fill" id="hpBar"></div></div>
            <span class="stat-num" id="hpText"></span>
          </div>
          <div class="stat-row">
            <span id="hungerLabel"></span>
            <div class="bar"><div class="bar-fill" id="hungerBar"></div></div>
            <span class="stat-num" id="hungerText"></span>
          </div>
          <div class="stat-row">
            <span id="thirstLabel"></span>
            <div class="bar"><div class="bar-fill" id="thirstBar"></div></div>
            <span class="stat-num" id="thirstText"></span>
          </div>
        </div>
      </section>
    </main>

    <p id="saveStatus" aria-live="polite"></p>
    <nav class="bottom-menu" id="bottomMenu" aria-label="メニュー"></nav>
  </div>

  <script src="./SHOP_data.js?v=20260923-0902"></script>
  <script src="./SHOP_save.js?v=20260923-0902"></script>
  <script src="./SHOP_app.js?v=20260923-0902"></script>
</body>
</html>
