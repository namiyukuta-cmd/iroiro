<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SHOP</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#d7d0bc;color:#211f1a}
    body{
      min-height:100dvh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background-image:
        linear-gradient(rgba(80,67,45,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(80,67,45,.06) 1px,transparent 1px);
      background-size:22px 22px;
    }
    .app{
      width:min(100%,520px);
      min-height:100dvh;
      margin:0 auto;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      background:rgba(238,232,216,.72);
      border-left:1px solid rgba(41,38,31,.28);
      border-right:1px solid rgba(41,38,31,.28);
    }
    header{
      padding:max(16px,env(safe-area-inset-top)) 16px 14px;
      border-bottom:2px solid #29261f;
      background:#eee8d8;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px 12px;
      align-items:center;
    }
    h1{margin:0;font-size:24px}
    .hud{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-weight:800;font-size:15px}
    main{padding:18px 16px 24px;display:grid;align-content:start;gap:18px}
    .shop-board{
      min-height:250px;
      border:2px solid #29261f;
      border-radius:12px;
      background:#f3eddd;
      padding:16px;
      display:grid;
      gap:16px;
    }
    .shelf{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-auto-rows:62px;
      border:4px solid #9b5b3d;
      background:#e9dfcb;
    }
    .shelf-slot{border:1px solid rgba(41,38,31,.5)}
    .counter{
      height:52px;
      border:4px solid #b7a91d;
      background:#f4e989;
      border-radius:4px;
    }
    .floor{
      min-height:180px;
      border:2px dashed rgba(41,38,31,.28);
      border-radius:12px;
      display:grid;
      place-items:center;
      color:#6b6456;
      font-weight:700;
      font-size:14px;
    }
    #saveStatus{min-height:24px;margin:0;color:#5b5548;font-size:14px;font-weight:700}
    nav{
      padding:12px 14px max(12px,env(safe-area-inset-bottom));
      border-top:2px solid #29261f;
      background:#eee8d8;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
    }
    button,a.navbtn{
      min-height:50px;
      border:2px solid #29261f;
      border-radius:10px;
      background:#fffaf0;
      color:#211f1a;
      font:inherit;
      font-weight:800;
      text-decoration:none;
      display:grid;
      place-items:center;
    }
    button:active,a.navbtn:active{transform:scale(.985);background:#e0d6be}
    button:disabled{opacity:.5}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 id="gameTitle"></h1>
      <div class="hud">
        <span id="dayText"></span>
        <span id="timeText"></span>
        <span id="moneyText"></span>
      </div>
    </header>

    <main>
      <section class="shop-board" id="shopBoard">
        <div class="shelf" id="shelf"></div>
        <div class="counter" id="counter"></div>
        <div class="floor" id="floor"></div>
      </section>
      <p id="saveStatus" aria-live="polite"></p>
    </main>

    <nav id="bottomNav"></nav>
  </div>

  <script src="./SHOP_data.js"></script>
  <script src="./SHOP_save.js"></script>
  <script src="./SHOP_app.js"></script>
</body>
</html>
