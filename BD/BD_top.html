<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BD - Game</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%}
    body{min-height:100dvh;background:#f5f4ef;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #game-root{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
    header{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #bbb}
    h1{margin:0;font-size:24px}.back{color:inherit;text-decoration:none;font-weight:700;font-size:12px}
    main{padding-top:14px;display:grid;gap:12px}
    #status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .status-card{border:2px solid #202020;border-radius:10px;background:#fff;padding:8px 10px;font-size:13px;font-weight:800}
    .status-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
    .bar{width:100%;height:12px;border:2px solid #202020;border-radius:999px;background:#ece9e1;overflow:hidden}
    .fill{height:100%;width:100%;background:#202020;transition:width .12s linear}
    #battle-field{width:100%;aspect-ratio:3/4;border:2px solid #202020;background:#fff;position:relative;overflow:hidden;contain:layout paint style}
    #player,.enemy{position:absolute;left:0;top:0;will-change:transform;transform:translate3d(0,0,0)}
    #player{width:30px;height:30px;border-radius:50%;background:#202020;z-index:3}
    #player.hit{filter:brightness(2)}
    #player.heal{box-shadow:0 0 0 7px rgba(32,32,32,.18)}
    .enemy{width:28px;height:28px;border-radius:50%;background:#b3261e;border:2px solid #68120d;z-index:2;transition:opacity .18s ease,filter .08s linear}
    .enemy.hit{filter:brightness(1.8)}
    .enemy.dead{opacity:0;pointer-events:none}
    #fx-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
    .slash-fx{position:absolute;width:58px;height:7px;border-radius:999px;background:#202020;transform-origin:center;animation:slashFx .22s ease-out forwards}
    .impact-fx{position:absolute;width:24px;height:24px;border:3px solid #202020;border-radius:50%;animation:impactFx .26s ease-out forwards}
    .burst-fx{position:absolute;width:20px;height:20px;border:3px solid #202020;animation:burstFx .3s ease-out forwards}
    .heal-fx{position:absolute;width:24px;height:24px;animation:healFx .62s ease-out forwards}
    .heal-fx::before,.heal-fx::after{content:"";position:absolute;left:50%;top:50%;background:#202020;border-radius:3px;transform:translate(-50%,-50%)}
    .heal-fx::before{width:24px;height:8px}.heal-fx::after{width:8px;height:24px}
    .float-text{position:absolute;font-size:14px;font-weight:900;white-space:nowrap;color:#202020;text-shadow:0 1px 0 #fff;animation:floatText .72s ease-out forwards}
    #field-flash{position:absolute;inset:0;background:rgba(32,32,32,.09);opacity:0;pointer-events:none;z-index:4}
    #field-flash.active{animation:fieldFlash .18s ease-out}

    #loadout-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .slot{aspect-ratio:1/1;min-width:0;border:2px solid #202020;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;position:relative;overflow:hidden}
    .slot.empty{border-color:#aaa;background:#eeeae2}
    .slot-name{font-size:13px;font-weight:900;line-height:1.15}
    .slot-meta{margin-top:4px;font-size:9px;line-height:1.25;color:#666}
    .slot-state{margin-top:5px;min-height:13px;font-size:9px;font-weight:800;line-height:1.15}
    .slot-count{position:absolute;right:5px;bottom:3px;font-size:15px;font-weight:900}
    .slot.waiting{opacity:.52}
    .slot.no-ac{opacity:.7}
    .slot.ready{box-shadow:inset 0 0 0 2px rgba(32,32,32,.16)}
    #message{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    @keyframes slashFx{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(var(--rot))}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45) rotate(var(--rot))}}
    @keyframes impactFx{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
    @keyframes burstFx{0%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) rotate(225deg) scale(2.2)}}
    @keyframes healFx{0%{opacity:0;transform:translate(-50%,-30%) scale(.45)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.25)}}
    @keyframes floatText{0%{opacity:0;transform:translate(-50%,0) scale(.85)}15%{opacity:1;transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1.04)}}
    @keyframes fieldFlash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
  </style>
</head>
<body>
<div id="game-root">
  <header><h1>BD</h1><a class="back" href="BD_index.html">入口へ</a></header>
  <main>
    <section id="status" aria-label="主人公の状態">
      <div class="status-card"><div class="status-head"><span>HP</span><span id="hpText">100 / 100</span></div><div class="bar"><div id="hpFill" class="fill"></div></div></div>
      <div class="status-card"><div class="status-head"><span>AC</span><span id="acText">100 / 100</span></div><div class="bar"><div id="acFill" class="fill"></div></div></div>
    </section>

    <section id="battle-field" aria-label="オートバトル画面">
      <div class="enemy" aria-label="敵1"></div><div class="enemy" aria-label="敵2"></div><div class="enemy" aria-label="敵3"></div>
      <div class="enemy" aria-label="敵4"></div><div class="enemy" aria-label="敵5"></div><div class="enemy" aria-label="敵6"></div>
      <div id="field-flash"></div><div id="fx-layer"></div><div id="player" aria-label="主人公"></div>
    </section>

    <section id="loadout-grid" aria-label="補給品とスキルのマス目欄">
      <div class="slot" id="supplySlot">
        <div class="slot-name">補給品</div>
        <div class="slot-meta">HP +40<br>HP45以下で自動</div>
        <div class="slot-count" id="supplyText">×5</div>
      </div>
      <div class="slot skill-slot" data-skill="0"><div class="slot-name">強打</div><div class="slot-meta">威力3 / AC55<br>待機5.0秒</div><div class="slot-state"></div></div>
      <div class="slot skill-slot" data-skill="1"><div class="slot-name">連撃</div><div class="slot-meta">威力2 / AC35<br>待機3.0秒</div><div class="slot-state"></div></div>
      <div class="slot skill-slot" data-skill="2"><div class="slot-name">斬撃</div><div class="slot-meta">威力1 / AC15<br>待機1.2秒</div><div class="slot-state"></div></div>
      <div class="slot empty"></div><div class="slot empty"></div><div class="slot empty"></div><div class="slot empty"></div>
      <div class="slot empty"></div><div class="slot empty"></div><div class="slot empty"></div><div class="slot empty"></div>
    </section>
    <div id="message" aria-live="polite"></div>
  </main>
</div>

<script>
(() => {
  const field=document.getElementById('battle-field');
  const playerEl=document.getElementById('player');
  const enemyEls=[...document.querySelectorAll('.enemy')];
  const fxLayer=document.getElementById('fx-layer');
  const fieldFlash=document.getElementById('field-flash');
  const hpText=document.getElementById('hpText'),hpFill=document.getElementById('hpFill');
  const acText=document.getElementById('acText'),acFill=document.getElementById('acFill');
  const supplyText=document.getElementById('supplyText'),supplySlot=document.getElementById('supplySlot'),message=document.getElementById('message');
  const skillSlots=[...document.querySelectorAll('.skill-slot')];
  const skillStates=skillSlots.map(el=>el.querySelector('.slot-state'));

  const PLAYER_SIZE=30,ENEMY_SIZE=28,MAX_FX=26;
  let fieldW=320,fieldH=426;
  let lastHud=0;

  const state={maxHp:100,hp:100,maxAc:100,ac:100,acRegenPerSec:16,supplies:5,supplyHeal:40,autoSupplyThreshold:45,x:40,y:80,vx:155,vy:118,nextTurn:0,lastTime:performance.now(),dead:false,nextPlayerHit:0};
  const initial=[[.18,.18],[.76,.16],[.48,.38],[.20,.62],[.78,.68],[.50,.86]];
  const enemies=enemyEls.map((el,i)=>({el,id:i+1,hp:4,maxHp:4,x:0,y:0,vx:0,vy:0,nextTurn:0,nextContactHit:0,dead:false}));
  const skills=[
    {name:'強打',cost:55,cooldown:5000,damage:3,range:150,readyAt:0},
    {name:'連撃',cost:35,cooldown:3000,damage:2,range:115,readyAt:0},
    {name:'斬撃',cost:15,cooldown:1200,damage:1,range:85,readyAt:0}
  ];

  function refreshBounds(){
    fieldW=field.clientWidth;fieldH=field.clientHeight;
    state.x=Math.min(Math.max(0,state.x),Math.max(0,fieldW-PLAYER_SIZE));
    state.y=Math.min(Math.max(0,state.y),Math.max(0,fieldH-PLAYER_SIZE));
    for(const e of enemies){e.x=Math.min(Math.max(0,e.x),Math.max(0,fieldW-ENEMY_SIZE));e.y=Math.min(Math.max(0,e.y),Math.max(0,fieldH-ENEMY_SIZE));}
  }

  function randomVelocity(min,max){const speed=min+Math.random()*(max-min),a=Math.random()*Math.PI*2;return {vx:Math.cos(a)*speed,vy:Math.sin(a)*speed};}
  function setEnemyDirection(e,now){
    const v=randomVelocity(70,130);e.vx=v.vx;e.vy=v.vy;
    if(Math.random()<.28&&!state.dead){const px=state.x+PLAYER_SIZE/2,py=state.y+PLAYER_SIZE/2,ex=e.x+ENEMY_SIZE/2,ey=e.y+ENEMY_SIZE/2;const a=Math.atan2(py-ey,px-ex)+(Math.random()-.5)*1.2;const s=75+Math.random()*55;e.vx=Math.cos(a)*s;e.vy=Math.sin(a)*s;}
    e.nextTurn=now+650+Math.random()*1700;
  }
  function setPlayerDirection(now){
    const target=nearestEnemy(Infinity),speed=135+Math.random()*80;
    if(target&&Math.random()<.7){const px=state.x+PLAYER_SIZE/2,py=state.y+PLAYER_SIZE/2,ex=target.x+ENEMY_SIZE/2,ey=target.y+ENEMY_SIZE/2;const a=Math.atan2(ey-py,ex-px)+(Math.random()-.5)*.9;state.vx=Math.cos(a)*speed;state.vy=Math.sin(a)*speed;}
    else{const v=randomVelocity(135,215);state.vx=v.vx;state.vy=v.vy;}
    state.nextTurn=now+450+Math.random()*1200;
  }

  function centerPlayer(){return {x:state.x+PLAYER_SIZE/2,y:state.y+PLAYER_SIZE/2};}
  function centerEnemy(e){return {x:e.x+ENEMY_SIZE/2,y:e.y+ENEMY_SIZE/2};}
  function dist(e){const p=centerPlayer(),q=centerEnemy(e),dx=q.x-p.x,dy=q.y-p.y;return Math.hypot(dx,dy);}
  function nearestEnemy(maxRange){let best=null,bestD=maxRange;for(const e of enemies){if(e.dead)continue;const d=dist(e);if(d<=bestD){best=e;bestD=d;}}return best;}

  function moveEntity(o,size,dt){
    o.x+=o.vx*dt;o.y+=o.vy*dt;const maxX=Math.max(0,fieldW-size),maxY=Math.max(0,fieldH-size);
    if(o.x<=0){o.x=0;o.vx=Math.abs(o.vx);}else if(o.x>=maxX){o.x=maxX;o.vx=-Math.abs(o.vx);}
    if(o.y<=0){o.y=0;o.vy=Math.abs(o.vy);}else if(o.y>=maxY){o.y=maxY;o.vy=-Math.abs(o.vy);}
  }

  function renderPositions(){
    playerEl.style.transform=`translate3d(${state.x.toFixed(1)}px,${state.y.toFixed(1)}px,0)`;
    for(const e of enemies){if(!e.dead)e.el.style.transform=`translate3d(${e.x.toFixed(1)}px,${e.y.toFixed(1)}px,0)`;}
  }

  function limitFx(){while(fxLayer.childElementCount>=MAX_FX)fxLayer.firstElementChild?.remove();}
  function addFx(cls,x,y,rot){limitFx();const el=document.createElement('div');el.className=cls;el.style.left=`${x}px`;el.style.top=`${y}px`;if(rot!==undefined)el.style.setProperty('--rot',`${rot}deg`);fxLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}
  function floatText(x,y,text){limitFx();const el=document.createElement('div');el.className='float-text';el.textContent=text;el.style.left=`${x}px`;el.style.top=`${y}px`;fxLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}
  function flash(){fieldFlash.classList.remove('active');void fieldFlash.offsetWidth;fieldFlash.classList.add('active');}

  function skillFx(skill,e){const p=centerPlayer(),q=centerEnemy(e),a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
    if(skill.name==='斬撃'){addFx('slash-fx',q.x,q.y,a);addFx('impact-fx',q.x,q.y);}
    else if(skill.name==='連撃'){addFx('slash-fx',q.x-6,q.y-4,a-24);setTimeout(()=>{if(!e.dead)addFx('slash-fx',q.x+6,q.y+4,a+24);},70);addFx('impact-fx',q.x,q.y);}
    else{addFx('burst-fx',q.x,q.y);addFx('impact-fx',q.x,q.y);flash();}
    floatText(q.x,q.y-14,skill.name);
  }

  function damageEnemy(e,amount,skill){if(e.dead)return;e.hp=Math.max(0,e.hp-amount);e.el.classList.add('hit');setTimeout(()=>e.el.classList.remove('hit'),90);skillFx(skill,e);
    if(e.hp<=0){e.dead=true;e.el.classList.add('dead');const q=centerEnemy(e);floatText(q.x,q.y-18,'撃破');message.textContent=`${skill.name}で敵${e.id}を倒した`;}
    else message.textContent=`${skill.name}：敵${e.id}に${amount}ダメージ`;
  }

  function useSupply(){if(state.dead||state.hp>state.autoSupplyThreshold||state.supplies<=0||state.hp>=state.maxHp)return;state.supplies--;state.hp=Math.min(state.maxHp,state.hp+state.supplyHeal);const p=centerPlayer();addFx('heal-fx',p.x,p.y);floatText(p.x,p.y-12,`HP +${state.supplyHeal}`);playerEl.classList.add('heal');setTimeout(()=>playerEl.classList.remove('heal'),280);message.textContent='補給品を自動使用';}
  function damagePlayer(amount,now){if(state.dead||now<state.nextPlayerHit)return;state.nextPlayerHit=now+360;state.hp=Math.max(0,state.hp-amount);const p=centerPlayer();addFx('impact-fx',p.x,p.y);floatText(p.x,p.y-12,`-${amount}`);playerEl.classList.add('hit');setTimeout(()=>playerEl.classList.remove('hit'),110);useSupply();if(state.hp<=0){state.dead=true;state.vx=0;state.vy=0;message.textContent='主人公は倒れた';}}

  function trySkills(now){if(state.dead)return;for(const skill of skills){if(now<skill.readyAt||state.ac<skill.cost)continue;const target=nearestEnemy(skill.range);if(!target)continue;state.ac-=skill.cost;skill.readyAt=now+skill.cooldown;damageEnemy(target,skill.damage,skill);break;}}

  function contactCheck(now){if(state.dead)return;for(const e of enemies){if(e.dead||now<e.nextContactHit)continue;if(dist(e)<=27){e.nextContactHit=now+900;damagePlayer(10,now);const p=centerPlayer(),q=centerEnemy(e),dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1;e.vx+=(dx/len)*70;e.vy+=(dy/len)*70;state.vx-=(dx/len)*55;state.vy-=(dy/len)*55;}}}

  function updateHud(now){
    hpText.textContent=`${Math.ceil(state.hp)} / ${state.maxHp}`;hpFill.style.width=`${Math.max(0,state.hp/state.maxHp*100)}%`;
    acText.textContent=`${Math.floor(state.ac)} / ${state.maxAc}`;acFill.style.width=`${Math.max(0,state.ac/state.maxAc*100)}%`;
    supplyText.textContent=`×${state.supplies}`;supplySlot.classList.toggle('waiting',state.supplies<=0);
    skills.forEach((s,i)=>{
      const wait=Math.max(0,(s.readyAt-now)/1000),slot=skillSlots[i];
      slot.classList.remove('waiting','no-ac','ready');
      if(wait>0){skillStates[i].textContent=`待機 ${wait.toFixed(1)}秒`;slot.classList.add('waiting');}
      else if(state.ac<s.cost){skillStates[i].textContent='AC不足';slot.classList.add('no-ac');}
      else{skillStates[i].textContent='発動可能';slot.classList.add('ready');}
    });
  }

  function init(){
    refreshBounds();const now=performance.now();
    enemies.forEach((e,i)=>{e.x=Math.max(0,Math.min(fieldW-ENEMY_SIZE,fieldW*initial[i][0]-ENEMY_SIZE/2));e.y=Math.max(0,Math.min(fieldH-ENEMY_SIZE,fieldH*initial[i][1]-ENEMY_SIZE/2));setEnemyDirection(e,now);});
    setPlayerDirection(now);renderPositions();updateHud(now);
  }

  const ro=window.ResizeObserver?new ResizeObserver(refreshBounds):null;if(ro)ro.observe(field);else window.addEventListener('resize',refreshBounds,{passive:true});

  function frame(now){
    const dt=Math.min((now-state.lastTime)/1000,.035);state.lastTime=now;
    if(!state.dead){state.ac=Math.min(state.maxAc,state.ac+state.acRegenPerSec*dt);if(now>=state.nextTurn)setPlayerDirection(now);moveEntity(state,PLAYER_SIZE,dt);}
    for(const e of enemies){if(e.dead)continue;if(now>=e.nextTurn)setEnemyDirection(e,now);moveEntity(e,ENEMY_SIZE,dt);}
    contactCheck(now);trySkills(now);renderPositions();
    if(now-lastHud>=100){lastHud=now;updateHud(now);}
    requestAnimationFrame(frame);
  }

  init();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
