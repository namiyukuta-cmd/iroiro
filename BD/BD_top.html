<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BD - Game</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#f5f4ef;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}

    #game-root{
      width:min(100%,520px);
      height:100dvh;
      margin:0 auto;
      padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));
      display:grid;
      grid-template-rows:36px 46px minmax(0,1fr) auto;
      gap:6px;
      overflow:hidden;
    }

    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #bbb;min-height:0}
    h1{margin:0;font-size:18px}
    .back{color:inherit;text-decoration:none;font-size:11px;font-weight:800}

    #status{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:0}
    .status-card{background:#fff;border:1.5px solid #202020;border-radius:7px;padding:5px 7px;min-width:0}
    .status-head{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:900;line-height:1;margin-bottom:4px}
    .bar{height:9px;border:1.5px solid #202020;border-radius:999px;background:#ece9e1;overflow:hidden}
    .fill{height:100%;width:100%;background:#202020}

    #battle-wrap{min-height:0;position:relative}
    #battle-field{width:100%;height:100%;border:2px solid #202020;background:#fff;position:relative;overflow:hidden;contain:layout paint style}
    #player,.enemy{position:absolute;left:0;top:0;will-change:transform;transform:translate3d(0,0,0)}
    #player{width:20px;height:20px;border-radius:50%;background:#202020;z-index:3}
    #player.hit{filter:brightness(2)}
    #player.heal{box-shadow:0 0 0 6px rgba(32,32,32,.18)}
    .enemy{width:18px;height:18px;border-radius:50%;background:#b3261e;border:2px solid #68120d;z-index:2;transition:opacity .16s ease,filter .07s linear}
    .enemy.hit{filter:brightness(1.8)}
    .enemy.dead{opacity:0;pointer-events:none}

    #battle-message{position:absolute;left:6px;top:6px;z-index:6;max-width:62%;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.82);font-size:10px;font-weight:800;pointer-events:none}
    #round-info{position:absolute;right:6px;top:6px;z-index:6;display:flex;gap:4px;pointer-events:none}
    .round-box{min-width:58px;padding:3px 5px;border:1px solid #202020;border-radius:5px;background:rgba(255,255,255,.9);font-size:10px;font-weight:900;text-align:center;white-space:nowrap}
    #fx-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
    #field-flash{position:absolute;inset:0;background:rgba(32,32,32,.09);opacity:0;pointer-events:none;z-index:4}
    #field-flash.active{animation:fieldFlash .18s ease-out}
    .slash-fx{position:absolute;width:54px;height:6px;border-radius:999px;background:#202020;transform-origin:center;animation:slashFx .22s ease-out forwards}
    .impact-fx{position:absolute;width:22px;height:22px;border:3px solid #202020;border-radius:50%;animation:impactFx .26s ease-out forwards}
    .burst-fx{position:absolute;width:18px;height:18px;border:3px solid #202020;animation:burstFx .3s ease-out forwards}
    .heal-fx{position:absolute;width:22px;height:22px;animation:healFx .62s ease-out forwards}
    .heal-fx::before,.heal-fx::after{content:"";position:absolute;left:50%;top:50%;background:#202020;border-radius:3px;transform:translate(-50%,-50%)}
    .heal-fx::before{width:22px;height:7px}.heal-fx::after{width:7px;height:22px}
    .float-text{position:absolute;font-size:12px;font-weight:900;white-space:nowrap;color:#202020;text-shadow:0 1px 0 #fff;animation:floatText .68s ease-out forwards}
    .cast-ring{position:absolute;width:28px;height:28px;border:3px solid #202020;border-radius:50%;animation:castRing .22s ease-out forwards}
    .projectile-fx{position:absolute;width:12px;height:12px;border-radius:50%;background:#202020;z-index:5;animation:projectileFly var(--dur) cubic-bezier(.18,.78,.28,1) forwards;box-shadow:0 0 0 3px rgba(32,32,32,.18)}
    .projectile-fx::after{content:"";position:absolute;right:7px;top:50%;width:28px;height:4px;border-radius:999px;background:rgba(32,32,32,.28);transform:translateY(-50%) rotate(var(--rot));transform-origin:right center}
    .projectile-fx.heavy{width:20px;height:20px;box-shadow:0 0 0 5px rgba(32,32,32,.18)}
    .projectile-fx.heavy::after{width:42px;height:6px;right:12px}
    .projectile-fx.light{width:9px;height:9px;box-shadow:0 0 0 2px rgba(32,32,32,.14)}
    .projectile-fx.light::after{width:22px;height:3px;right:5px}
    .impact-star{position:absolute;width:32px;height:32px;animation:impactStar .3s ease-out forwards}
    .impact-star::before,.impact-star::after{content:"";position:absolute;left:50%;top:50%;background:#202020;border-radius:2px;transform:translate(-50%,-50%)}
    .impact-star::before{width:32px;height:5px}.impact-star::after{width:5px;height:32px}
    .impact-ring{position:absolute;width:34px;height:34px;border:4px solid #202020;border-radius:50%;animation:impactRing .34s ease-out forwards}

    #loadout{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:3px;
      width:100%;
      min-height:0;
    }
    .slot{
      aspect-ratio:1/1;
      border:1.5px solid #202020;
      background:#fff;
      min-width:0;
      min-height:0;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .slot.empty{background:repeating-linear-gradient(135deg,#fff 0 8px,#f3f1eb 8px 16px)}
    .slot-icon{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
    .slot-count{position:absolute;right:3px;top:2px;font-size:11px;font-weight:1000;z-index:4;background:rgba(255,255,255,.88);padding:0 2px;border-radius:3px;line-height:1.1}
    .slot-time{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:1000;text-align:center;line-height:1;z-index:4;color:#fff;mix-blend-mode:difference;pointer-events:none}
    .slot-time:empty{display:none}
    .cooldown-cover{position:absolute;left:0;right:0;bottom:0;height:0;background:#202020;z-index:3;pointer-events:none}

    .supply-icon{width:22px;height:27px;border:2px solid #202020;border-radius:5px 5px 7px 7px;position:relative;background:#fff}
    .supply-icon::before{content:"";position:absolute;left:50%;top:-7px;width:10px;height:7px;transform:translateX(-50%);border:2px solid #202020;border-bottom:0;border-radius:3px 3px 0 0;background:#fff}
    .supply-icon::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:1000;line-height:1;color:#202020}

    .smash-icon{width:25px;height:25px;position:relative;display:grid;place-items:center}
    .smash-icon::before,.smash-icon::after{content:"";position:absolute;left:50%;top:50%;background:#202020;transform-origin:center}
    .smash-icon::before{width:25px;height:4px;transform:translate(-50%,-50%) rotate(45deg)}
    .smash-icon::after{width:25px;height:4px;transform:translate(-50%,-50%) rotate(-45deg)}
    .smash-core{width:11px;height:11px;border:3px solid #202020;transform:rotate(45deg);background:#fff;z-index:1}

    .double-icon,.slash-icon{width:30px;height:30px;position:relative}
    .double-icon::before,.double-icon::after,.slash-icon::before{content:"";position:absolute;width:25px;height:4px;border-radius:999px;background:#202020;left:50%;top:50%}
    .double-icon::before{transform:translate(-50%,-75%) rotate(-35deg)}
    .double-icon::after{transform:translate(-50%,75%) rotate(-35deg)}
    .slash-icon::before{transform:translate(-50%,-50%) rotate(-35deg)}

    @keyframes slashFx{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(var(--rot))}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45) rotate(var(--rot))}}
    @keyframes impactFx{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
    @keyframes burstFx{0%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) rotate(225deg) scale(2.2)}}
    @keyframes healFx{0%{opacity:0;transform:translate(-50%,-30%) scale(.45)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.25)}}
    @keyframes floatText{0%{opacity:0;transform:translate(-50%,0) scale(.85)}15%{opacity:1;transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-28px) scale(1.04)}}
    @keyframes fieldFlash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
    @keyframes castRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
    @keyframes projectileFly{0%{opacity:1;transform:translate(-50%,-50%) translate3d(0,0,0) scale(.72)}100%{opacity:1;transform:translate(-50%,-50%) translate3d(var(--dx),var(--dy),0) scale(1.12)}}
    @keyframes impactStar{0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) rotate(110deg) scale(1.9)}}
    @keyframes impactRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.18)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.35)}}

    @media (max-height:700px){
      #game-root{grid-template-rows:32px 42px minmax(0,1fr) auto;gap:4px;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom))}
      #loadout{gap:2px}
      .slot-time{font-size:14px}
    }
  </style>
</head>
<body>
<div id="game-root">
  <header><h1>BD</h1><a class="back" href="BD_index.html">入口へ</a></header>

  <section id="status" aria-label="主人公の状態">
    <div class="status-card">
      <div class="status-head"><span>HP</span><span id="hpText">100 / 100</span></div>
      <div class="bar"><div id="hpFill" class="fill"></div></div>
    </div>
    <div class="status-card">
      <div class="status-head"><span>AC</span><span id="acText">100 / 100</span></div>
      <div class="bar"><div id="acFill" class="fill"></div></div>
    </div>
  </section>

  <section id="battle-wrap">
    <div id="battle-field" aria-label="オートバトル画面">
      <div class="enemy" aria-label="敵1"></div><div class="enemy" aria-label="敵2"></div><div class="enemy" aria-label="敵3"></div>
      <div class="enemy" aria-label="敵4"></div><div class="enemy" aria-label="敵5"></div><div class="enemy" aria-label="敵6"></div>
      <div id="field-flash"></div><div id="fx-layer"></div><div id="player" aria-label="主人公"></div>
      <div id="battle-message">戦闘中</div>
      <div id="round-info"><div class="round-box">残り <span id="timeText">30.0</span></div><div class="round-box">撃破 <span id="killText">0</span></div></div>
    </div>
  </section>

  <section id="loadout" aria-label="補給品とスキルのマス目">
    <div class="slot" id="supplySlot">
      <div class="slot-icon"><div class="supply-icon" aria-label="補給品"></div></div>
      <div class="slot-count" id="supplyCount">5</div>
    </div>
    <div class="slot skill-slot" id="skillSlot0">
      <div class="slot-icon"><div class="smash-icon" aria-label="強打"><div class="smash-core"></div></div></div>
      <div class="cooldown-cover" id="skillCover0"></div>
      <div class="slot-time" id="skillTime0"></div>
    </div>
    <div class="slot skill-slot" id="skillSlot1">
      <div class="slot-icon"><div class="double-icon" aria-label="連撃"></div></div>
      <div class="cooldown-cover" id="skillCover1"></div>
      <div class="slot-time" id="skillTime1"></div>
    </div>
    <div class="slot skill-slot" id="skillSlot2">
      <div class="slot-icon"><div class="slash-icon" aria-label="斬撃"></div></div>
      <div class="cooldown-cover" id="skillCover2"></div>
      <div class="slot-time" id="skillTime2"></div>
    </div>
    <div class="slot empty"></div>
    <div class="slot empty"></div><div class="slot empty"></div><div class="slot empty"></div><div class="slot empty"></div><div class="slot empty"></div>
  </section>
</div>

<script>
(() => {
  const field=document.getElementById('battle-field');
  const playerEl=document.getElementById('player');
  const enemyEls=[...document.querySelectorAll('.enemy')];
  const fxLayer=document.getElementById('fx-layer');
  const fieldFlash=document.getElementById('field-flash');
  const message=document.getElementById('battle-message');
  const timeText=document.getElementById('timeText'),killText=document.getElementById('killText');
  const hpText=document.getElementById('hpText'),hpFill=document.getElementById('hpFill');
  const acText=document.getElementById('acText'),acFill=document.getElementById('acFill');
  const supplyCount=document.getElementById('supplyCount');
  const skillCovers=[document.getElementById('skillCover0'),document.getElementById('skillCover1'),document.getElementById('skillCover2')];
  const skillTimes=[document.getElementById('skillTime0'),document.getElementById('skillTime1'),document.getElementById('skillTime2')];

  const PLAYER_SIZE=20,ENEMY_SIZE=18,MAX_FX=40;
  let fieldW=320,fieldH=420,lastHud=0;

  const state={maxHp:100,hp:100,maxAc:100,ac:100,acRegenPerSec:16,supplies:5,supplyHeal:40,autoSupplyThreshold:30,x:0,y:0,vx:0,vy:0,nextTurn:0,lastTime:performance.now(),dead:false,nextPlayerHit:0,roundDuration:30000,roundStart:0,roundEnd:0,kills:0,finished:false};
  const enemies=enemyEls.map((el,i)=>({el,id:i+1,hp:4,maxHp:4,x:0,y:0,vx:0,vy:0,speed:34+(i%3)*5,nextTurn:0,nextContactHit:0,dead:false,respawnAt:0}));
  const skills=[
    {name:'強打',cost:5,cooldown:5000,damage:3,range:150,readyAt:0},
    {name:'連撃',cost:3,cooldown:3000,damage:2,range:115,readyAt:0},
    {name:'斬撃',cost:1,cooldown:1000,damage:1,range:85,readyAt:0}
  ];

  function placePlayer(){
    state.x=Math.max(0,(fieldW-PLAYER_SIZE)/2);
    state.y=Math.max(0,fieldH*.64-PLAYER_SIZE/2);
    state.vx=0;state.vy=0;
  }

  function refreshBounds(){
    fieldW=field.clientWidth;fieldH=field.clientHeight;
    placePlayer();
    for(const e of enemies){e.x=Math.min(Math.max(0,e.x),Math.max(0,fieldW-ENEMY_SIZE));e.y=Math.min(Math.max(0,e.y),Math.max(0,fieldH-ENEMY_SIZE));}
  }

  function randomVelocity(min,max){const speed=min+Math.random()*(max-min),a=Math.random()*Math.PI*2;return{vx:Math.cos(a)*speed,vy:Math.sin(a)*speed};}
  function centerPlayer(){return{x:state.x+PLAYER_SIZE/2,y:state.y+PLAYER_SIZE/2};}
  function centerEnemy(e){return{x:e.x+ENEMY_SIZE/2,y:e.y+ENEMY_SIZE/2};}
  function dist(e){const p=centerPlayer(),q=centerEnemy(e);return Math.hypot(q.x-p.x,q.y-p.y);}
  function nearestEnemy(maxRange){let best=null,bestD=maxRange;for(const e of enemies){if(e.dead)continue;const d=dist(e);if(d<=bestD){best=e;bestD=d;}}return best;}

  function setEnemyDirection(e,now){
    const p=centerPlayer(),q=centerEnemy(e);
    const a=Math.atan2(p.y-q.y,p.x-q.x);
    e.vx=Math.cos(a)*e.speed;
    e.vy=Math.sin(a)*e.speed;
    e.nextTurn=now+180;
  }

  function moveEnemyTowardPlayer(e,dt,now){
    if(now>=e.nextTurn)setEnemyDirection(e,now);
    e.x+=e.vx*dt;
    e.y+=e.vy*dt;
    e.x=Math.min(Math.max(0,e.x),Math.max(0,fieldW-ENEMY_SIZE));
    e.y=Math.min(Math.max(0,e.y),Math.max(0,fieldH-ENEMY_SIZE));
  }

  function spawnEnemyAtEdge(e,now){
    const side=Math.floor(Math.random()*4);
    if(side===0){e.x=Math.random()*Math.max(0,fieldW-ENEMY_SIZE);e.y=0;}
    else if(side===1){e.x=Math.max(0,fieldW-ENEMY_SIZE);e.y=Math.random()*Math.max(0,fieldH-ENEMY_SIZE);}
    else if(side===2){e.x=Math.random()*Math.max(0,fieldW-ENEMY_SIZE);e.y=Math.max(0,fieldH-ENEMY_SIZE);}
    else{e.x=0;e.y=Math.random()*Math.max(0,fieldH-ENEMY_SIZE);}
    setEnemyDirection(e,now);
  }

  function renderPositions(){
    playerEl.style.transform=`translate3d(${state.x.toFixed(1)}px,${state.y.toFixed(1)}px,0)`;
    for(const e of enemies){if(!e.dead)e.el.style.transform=`translate3d(${e.x.toFixed(1)}px,${e.y.toFixed(1)}px,0)`;}
  }

  function limitFx(){while(fxLayer.childElementCount>=MAX_FX)fxLayer.firstElementChild?.remove();}
  function addFx(cls,x,y,rot){limitFx();const el=document.createElement('div');el.className=cls;el.style.left=`${x}px`;el.style.top=`${y}px`;if(rot!==undefined)el.style.setProperty('--rot',`${rot}deg`);fxLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}
  function floatText(x,y,text){limitFx();const el=document.createElement('div');el.className='float-text';el.textContent=text;el.style.left=`${x}px`;el.style.top=`${y}px`;fxLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}
  function flash(){fieldFlash.classList.remove('active');void fieldFlash.offsetWidth;fieldFlash.classList.add('active');}

  function projectileFx(x1,y1,x2,y2,type='normal',duration=150){
    limitFx();
    const el=document.createElement('div');
    const dx=x2-x1,dy=y2-y1;
    const rot=Math.atan2(dy,dx)*180/Math.PI;
    el.className='projectile-fx '+type;
    el.style.left=x1+'px';
    el.style.top=y1+'px';
    el.style.setProperty('--dx',dx+'px');
    el.style.setProperty('--dy',dy+'px');
    el.style.setProperty('--rot',rot+'deg');
    el.style.setProperty('--dur',duration+'ms');
    fxLayer.appendChild(el);
    el.addEventListener('animationend',()=>el.remove(),{once:true});
  }

  function hitBurst(x,y,strong=false){
    addFx('impact-fx',x,y);
    addFx('impact-star',x,y);
    if(strong)addFx('impact-ring',x,y);
  }

  function skillFx(skill,e){
    const p=centerPlayer(),q=centerEnemy(e),a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
    addFx('cast-ring',p.x,p.y);

    if(skill.name==='強打'){
      const dx=(q.x-p.x),dy=(q.y-p.y),len=Math.hypot(dx,dy)||1;
      const base=`translate3d(${state.x.toFixed(1)}px,${state.y.toFixed(1)}px,0)`;
      const step=`translate3d(${(state.x+dx/len*10).toFixed(1)}px,${(state.y+dy/len*10).toFixed(1)}px,0)`;
      playerEl.animate([{transform:base},{transform:step},{transform:base}],{duration:180,easing:'ease-out'});
    }

    if(skill.name==='斬撃'){
      projectileFx(p.x,p.y,q.x,q.y,'light',120);
      setTimeout(()=>{addFx('slash-fx',q.x,q.y,a);hitBurst(q.x,q.y,false);},110);
    }
    else if(skill.name==='連撃'){
      projectileFx(p.x,p.y,q.x-6,q.y-4,'normal',145);
      setTimeout(()=>projectileFx(p.x,p.y,q.x+6,q.y+4,'normal',145),75);
      setTimeout(()=>{addFx('slash-fx',q.x-6,q.y-4,a-24);hitBurst(q.x-6,q.y-4,false);},135);
      setTimeout(()=>{addFx('slash-fx',q.x+6,q.y+4,a+24);hitBurst(q.x+6,q.y+4,false);},210);
    }
    else{
      projectileFx(p.x,p.y,q.x,q.y,'heavy',180);
      setTimeout(()=>{addFx('burst-fx',q.x,q.y);hitBurst(q.x,q.y,true);flash();},170);
    }
    floatText(q.x,q.y-14,skill.name);
  }

  function damageEnemy(e,amount,skill){
    if(e.dead)return;
    e.hp=Math.max(0,e.hp-amount);e.el.classList.add('hit');setTimeout(()=>e.el.classList.remove('hit'),90);skillFx(skill,e);
    if(e.hp<=0){e.dead=true;e.respawnAt=performance.now()+650;e.el.classList.add('dead');state.kills++;const q=centerEnemy(e);floatText(q.x,q.y-18,'撃破');message.textContent=`${skill.name}で敵${e.id}撃破`;}
    else message.textContent=`${skill.name}：敵${e.id} -${amount}`;
  }

  function useSupply(){
    if(state.dead||state.hp>state.autoSupplyThreshold||state.supplies<=0||state.hp>=state.maxHp)return;
    state.supplies--;state.hp=Math.min(state.maxHp,state.hp+state.supplyHeal);
    const p=centerPlayer();addFx('heal-fx',p.x,p.y);floatText(p.x,p.y-12,`HP +${state.supplyHeal}`);playerEl.classList.add('heal');setTimeout(()=>playerEl.classList.remove('heal'),280);message.textContent='補給品を自動使用';
  }

  function damagePlayer(amount,now){
    if(state.dead||now<state.nextPlayerHit)return;
    state.nextPlayerHit=now+360;state.hp=Math.max(0,state.hp-amount);
    const p=centerPlayer();addFx('impact-fx',p.x,p.y);floatText(p.x,p.y-12,`-${amount}`);playerEl.classList.add('hit');setTimeout(()=>playerEl.classList.remove('hit'),110);useSupply();
    if(state.hp<=0){state.dead=true;state.vx=0;state.vy=0;message.textContent='主人公は倒れた';}
  }

  function trySkills(now){
    if(state.dead)return;
    for(const skill of skills){if(now<skill.readyAt||state.ac<skill.cost)continue;const target=nearestEnemy(skill.range);if(!target)continue;state.ac-=skill.cost;skill.readyAt=now+skill.cooldown;damageEnemy(target,skill.damage,skill);break;}
  }

  function contactCheck(now){
    if(state.dead)return;
    for(const e of enemies){if(e.dead||now<e.nextContactHit)continue;if(dist(e)<=19){e.nextContactHit=now+900;damagePlayer(10,now);const p=centerPlayer(),q=centerEnemy(e),dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1;e.x+=dx/len*8;e.y+=dy/len*8;}}
  }

  function updateHud(now){
    hpText.textContent=`${Math.ceil(state.hp)} / ${state.maxHp}`;hpFill.style.width=`${Math.max(0,state.hp/state.maxHp*100)}%`;
    acText.textContent=`${Math.floor(state.ac)} / ${state.maxAc}`;acFill.style.width=`${Math.max(0,state.ac/state.maxAc*100)}%`;
    supplyCount.textContent=state.supplies;
    const remain=Math.max(0,state.roundEnd-now);timeText.textContent=(remain/1000).toFixed(1);killText.textContent=state.kills;
    skills.forEach((s,i)=>{const remainMs=Math.max(0,s.readyAt-now);const ratio=Math.max(0,Math.min(1,remainMs/s.cooldown));skillCovers[i].style.height=(ratio*100)+'%';skillTimes[i].textContent=remainMs>0?(remainMs/1000).toFixed(1):'';});
  }

  function respawnEnemy(e,now){
    e.hp=e.maxHp;e.dead=false;e.respawnAt=0;e.el.classList.remove('dead','hit');
    spawnEnemyAtEdge(e,now);
  }

  function finishRound(){
    if(state.finished)return;
    state.finished=true;state.vx=0;state.vy=0;
    for(const e of enemies){e.vx=0;e.vy=0;}
    message.textContent=`終了：30秒で ${state.kills}体撃破`;
    timeText.textContent='0.0';killText.textContent=state.kills;
  }

  function init(){
    refreshBounds();const now=performance.now();
    state.roundStart=now;state.roundEnd=now+state.roundDuration;
    enemies.forEach(e=>spawnEnemyAtEdge(e,now));
    renderPositions();updateHud(now);
  }

  const ro=window.ResizeObserver?new ResizeObserver(refreshBounds):null;if(ro)ro.observe(field);else window.addEventListener('resize',refreshBounds,{passive:true});

  function frame(now){
    const dt=Math.min((now-state.lastTime)/1000,.035);state.lastTime=now;
    if(!state.finished&&now>=state.roundEnd)finishRound();
    if(!state.finished){
      if(!state.dead){state.ac=Math.min(state.maxAc,state.ac+state.acRegenPerSec*dt);}
      for(const e of enemies){if(e.dead){if(now>=e.respawnAt)respawnEnemy(e,now);continue;}moveEnemyTowardPlayer(e,dt,now);}
      contactCheck(now);trySkills(now);
    }
    renderPositions();
    if(now-lastHud>=100){lastHud=now;updateHud(now);}
    requestAnimationFrame(frame);
  }

  init();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
