<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BD - Game</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100dvh;
      background: #f5f4ef;
      color: #202020;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #game-root {
      width: min(100%, 520px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }
    header {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #bbb;
    }
    h1 { margin: 0; font-size: 24px; }
    .back {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
    }
    main { padding-top: 16px; }
    #battle-field {
      width: 100%;
      aspect-ratio: 3 / 4;
      border: 2px solid #202020;
      background: #fff;
      position: relative;
      overflow: hidden;
    }
    #player {
      position: absolute;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #202020;
      transform: translate3d(0,0,0);
      will-change: transform;
      z-index: 2;
    }
    .enemy {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #b3261e;
      border: 2px solid #68120d;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <header>
      <h1>BD</h1>
      <a class="back" href="BD_index.html">入口へ</a>
    </header>
    <main>
      <section id="battle-field" aria-label="オートバトル画面">
        <div class="enemy" style="left:18%; top:18%;" aria-label="敵1"></div>
        <div class="enemy" style="left:76%; top:16%;" aria-label="敵2"></div>
        <div class="enemy" style="left:48%; top:38%;" aria-label="敵3"></div>
        <div class="enemy" style="left:20%; top:62%;" aria-label="敵4"></div>
        <div class="enemy" style="left:78%; top:68%;" aria-label="敵5"></div>
        <div class="enemy" style="left:50%; top:86%;" aria-label="敵6"></div>
        <div id="player" aria-label="主人公"></div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const field = document.getElementById('battle-field');
      const player = document.getElementById('player');

      const state = {
        x: 40,
        y: 80,
        vx: 155,
        vy: 118,
        lastTime: performance.now(),
        nextTurn: performance.now() + 900
      };

      function chooseDirection(now) {
        const speed = 135 + Math.random() * 85;
        const angle = Math.random() * Math.PI * 2;
        state.vx = Math.cos(angle) * speed;
        state.vy = Math.sin(angle) * speed;
        state.nextTurn = now + 500 + Math.random() * 1400;
      }

      function animate(now) {
        const rect = field.getBoundingClientRect();
        const size = player.offsetWidth;
        const maxX = Math.max(0, rect.width - size - 4);
        const maxY = Math.max(0, rect.height - size - 4);
        const dt = Math.min((now - state.lastTime) / 1000, 0.04);
        state.lastTime = now;

        if (now >= state.nextTurn) chooseDirection(now);

        state.x += state.vx * dt;
        state.y += state.vy * dt;

        if (state.x <= 0) {
          state.x = 0;
          state.vx = Math.abs(state.vx);
          state.vy += (Math.random() - 0.5) * 100;
        } else if (state.x >= maxX) {
          state.x = maxX;
          state.vx = -Math.abs(state.vx);
          state.vy += (Math.random() - 0.5) * 100;
        }

        if (state.y <= 0) {
          state.y = 0;
          state.vy = Math.abs(state.vy);
          state.vx += (Math.random() - 0.5) * 100;
        } else if (state.y >= maxY) {
          state.y = maxY;
          state.vy = -Math.abs(state.vy);
          state.vx += (Math.random() - 0.5) * 100;
        }

        player.style.transform = `translate3d(${state.x}px, ${state.y}px, 0)`;
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
