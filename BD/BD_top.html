<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BD - Game</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#f5f4ef;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}

    #game-root{
      width:min(100%,520px);
      height:100dvh;
      margin:0 auto;
      padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));
      display:grid;
      grid-template-rows:32px 42px minmax(0,1fr) auto;
      gap:4px;
      overflow:hidden;
    }

    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #bbb;min-height:0}
    h1{margin:0;font-size:18px}
    .back{color:inherit;text-decoration:none;font-size:11px;font-weight:800}

    #status{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:0}
    .status-card{background:#fff;border:1.5px solid #202020;border-radius:7px;padding:5px 7px;min-width:0}
    .status-head{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:900;line-height:1;margin-bottom:4px}
    .bar{height:9px;border:1.5px solid #202020;border-radius:999px;background:#ece9e1;overflow:hidden}
    .fill{height:100%;width:100%;background:#202020}

    #battle-wrap{min-height:0;position:relative}
    #battle-field{
      width:100%;
      height:100%;
      border:2px solid #202020;
      background:#fff;
      position:relative;
      overflow:hidden;
      display:grid;
      grid-template-columns:29% 1fr;
      contain:layout paint style;
    }

    #player-stage{
      position:relative;
      min-width:0;
      border-right:1px solid #b9b9b9;
      background:linear-gradient(180deg,#f7f6f1,#ece9e1);
      overflow:hidden;
    }
    #player-stage::after{
      content:"";
      position:absolute;
      left:14%;
      right:14%;
      bottom:11%;
      height:1px;
      background:#b9b7af;
    }
    #player-caption{
      position:absolute;
      left:50%;
      top:9%;
      transform:translateX(-50%);
      font-size:9px;
      font-weight:900;
      letter-spacing:.08em;
      white-space:nowrap;
      opacity:.55;
    }
    #player{
      position:absolute;
      left:50%;
      top:24%;
      width:66px;
      height:112px;
      transform:translate(-50%,-50%);
      z-index:3;
      transform-origin:50% 88%;
      animation:playerWalk 1s steps(2,end) infinite;
      will-change:transform;
    }
    #player .head{
      position:absolute;
      left:50%;
      top:0;
      width:25px;
      height:28px;
      transform:translateX(-50%);
      border-radius:48% 48% 44% 44%;
      background:#202020;
    }
    #player .body{
      position:absolute;
      left:50%;
      top:25px;
      width:35px;
      height:50px;
      transform:translateX(-50%);
      background:#202020;
      clip-path:polygon(20% 0,80% 0,100% 22%,86% 100%,14% 100%,0 22%);
    }
    #player .arm{
      position:absolute;
      top:29px;
      width:11px;
      height:48px;
      border-radius:8px;
      background:#202020;
      transform-origin:50% 8%;
    }
    #player .arm.left{left:8px;transform:rotate(7deg)}
    #player .arm.right{right:8px;transform:rotate(-7deg)}
    #player .leg{
      position:absolute;
      top:70px;
      width:13px;
      height:42px;
      border-radius:0 0 7px 7px;
      background:#202020;
      transform-origin:50% 0;
    }
    #player .leg.left{left:18px;transform:rotate(2deg)}
    #player .leg.right{right:18px;transform:rotate(-2deg)}
    #player.attack{animation:playerAttack .22s ease-out}
    #player.hit{filter:brightness(2)}
    #player.heal{filter:drop-shadow(0 0 9px rgba(34,197,94,.65))}

    #dungeon{
      position:relative;
      min-width:0;
      overflow:hidden;
      background:#151515;
    }
    #dungeon-canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
    }
    #dungeon-shade{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:radial-gradient(circle at 16% 52%,rgba(255,255,255,.08),transparent 32%);
      z-index:1;
    }
    #encounter-mark{
      position:absolute;
      left:8%;
      top:50%;
      width:8px;
      height:8px;
      transform:translate(-50%,-50%);
      border:1px solid rgba(255,255,255,.7);
      border-radius:50%;
      z-index:2;
      opacity:.55;
    }
    .enemy{
      position:absolute;
      left:0;
      top:0;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#d13c32;
      border:1px solid #60100c;
      z-index:3;
      will-change:transform;
      transition:opacity .15s ease,filter .07s linear;
      box-shadow:0 0 0 1px rgba(255,255,255,.25);
    }
    .enemy.hit{filter:brightness(2.2)}
    .enemy.dead{opacity:0;pointer-events:none}

    #battle-message{
      position:absolute;
      left:6px;
      top:6px;
      z-index:10;
      max-width:58%;
      padding:3px 6px;
      border-radius:5px;
      background:rgba(255,255,255,.88);
      font-size:10px;
      font-weight:800;
      pointer-events:none;
    }
    #round-info{position:absolute;right:6px;top:6px;z-index:10;display:flex;gap:4px;pointer-events:none}
    .round-box{min-width:58px;padding:3px 5px;border:1px solid #202020;border-radius:5px;background:rgba(255,255,255,.9);font-size:10px;font-weight:900;text-align:center;white-space:nowrap}

    #fx-layer{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
    #field-flash{position:absolute;inset:0;background:rgba(255,255,255,.26);opacity:0;pointer-events:none;z-index:8}
    #field-flash.active{animation:fieldFlash .28s ease-out}
    .slash-fx{position:absolute;width:70px;height:8px;border-radius:999px;background:var(--fx,#38bdf8);box-shadow:0 0 10px var(--fx,#38bdf8),0 0 0 3px var(--fx-soft,rgba(56,189,248,.16));transform-origin:center;animation:slashFx .28s ease-out forwards}
    .impact-fx{position:absolute;width:28px;height:28px;border:4px solid var(--fx,#38bdf8);border-radius:50%;box-shadow:0 0 12px var(--fx-soft,rgba(56,189,248,.35));animation:impactFx .34s ease-out forwards}
    .burst-fx{position:absolute;width:30px;height:30px;border:4px solid var(--fx,#ef4444);box-shadow:0 0 14px var(--fx-soft,rgba(239,68,68,.38));animation:burstFx .42s ease-out forwards}
    .heal-fx{position:absolute;width:22px;height:22px;animation:healFx .62s ease-out forwards}
    .heal-fx::before,.heal-fx::after{content:"";position:absolute;left:50%;top:50%;background:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.45);border-radius:3px;transform:translate(-50%,-50%)}
    .heal-fx::before{width:22px;height:7px}.heal-fx::after{width:7px;height:22px}
    .float-text{position:absolute;font-size:11px;font-weight:900;white-space:nowrap;color:var(--fx,#202020);text-shadow:0 0 8px rgba(255,255,255,.95);animation:floatText .68s ease-out forwards}
    .cast-ring{position:absolute;width:38px;height:38px;border:4px solid var(--fx,#38bdf8);border-radius:50%;box-shadow:0 0 16px var(--fx-soft,rgba(56,189,248,.35));animation:castRing .3s ease-out forwards}
    .projectile-fx{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--fx,#38bdf8);z-index:5;animation:projectileFly var(--dur) cubic-bezier(.18,.78,.28,1) forwards;box-shadow:0 0 0 3px var(--fx-soft,rgba(56,189,248,.20)),0 0 16px var(--fx,#38bdf8)}
    .projectile-fx::after{content:"";position:absolute;right:7px;top:50%;width:42px;height:5px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--fx,#38bdf8));transform:translateY(-50%) rotate(var(--rot));transform-origin:right center}
    .projectile-fx.heavy{width:22px;height:22px;box-shadow:0 0 0 5px var(--fx-soft,rgba(239,68,68,.24)),0 0 22px var(--fx,#ef4444)}
    .projectile-fx.heavy::after{width:62px;height:8px;right:12px}
    .projectile-fx.light{width:11px;height:11px}
    .projectile-fx.light::after{width:34px;height:4px;right:6px}
    .impact-star{position:absolute;width:38px;height:38px;animation:impactStar .38s ease-out forwards}
    .impact-star::before,.impact-star::after{content:"";position:absolute;left:50%;top:50%;background:var(--fx,#38bdf8);border-radius:2px;transform:translate(-50%,-50%)}
    .impact-star::before{width:38px;height:5px}.impact-star::after{width:5px;height:38px}
    .impact-ring{position:absolute;width:42px;height:42px;border:5px solid var(--fx,#ef4444);border-radius:50%;animation:impactRing .42s ease-out forwards}
    .ray-fx{position:absolute;width:42px;height:5px;border-radius:999px;background:var(--fx,#38bdf8);transform-origin:left center;animation:rayBurst .34s ease-out forwards}
    .shock-ring{position:absolute;width:62px;height:62px;border:4px solid var(--fx,#ef4444);border-radius:50%;animation:shockRing .5s ease-out forwards}

    #loadout{
      display:grid;
      grid-template-columns:repeat(5,42px);
      grid-auto-rows:42px;
      gap:3px;
      width:max-content;
      max-width:100%;
      min-height:0;
      justify-self:center;
      margin:0 auto;
    }
    .slot{
      width:42px;
      height:42px;
      border:1.5px solid #202020;
      background:#fff;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .slot.used{opacity:.16}
    .weapon-icon{width:28px;height:28px;position:relative;transform:rotate(-45deg)}
    .weapon-icon::before{content:"";position:absolute;left:12px;top:0;width:4px;height:21px;background:#202020;border-radius:3px 3px 1px 1px}
    .weapon-icon::after{content:"";position:absolute;left:5px;top:19px;width:18px;height:4px;background:#202020;border-radius:2px;box-shadow:7px 7px 0 -1px #202020}
    .armor-icon{width:27px;height:31px;border:3px solid #202020;border-radius:50% 50% 42% 42%;clip-path:polygon(50% 0,100% 18%,88% 72%,50% 100%,12% 72%,0 18%);background:#fff;position:relative}
    .armor-icon::after{content:"";position:absolute;left:50%;top:4px;bottom:5px;width:3px;background:#202020;transform:translateX(-50%)}
    .slot-icon{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
    .slot-time{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:1000;text-align:center;line-height:1;z-index:4;color:#fff;mix-blend-mode:difference;pointer-events:none}
    .slot-time:empty{display:none}
    .cooldown-cover{position:absolute;left:0;right:0;bottom:0;height:0;background:#202020;z-index:3;pointer-events:none}

    .supply-icon{width:22px;height:27px;border:2px solid #202020;border-radius:5px 5px 7px 7px;position:relative;background:#fff}
    .supply-icon::before{content:"";position:absolute;left:50%;top:-7px;width:10px;height:7px;transform:translateX(-50%);border:2px solid #202020;border-bottom:0;border-radius:3px 3px 0 0;background:#fff}
    .supply-icon::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:1000;line-height:1;color:#202020}

    .smash-icon{width:25px;height:25px;position:relative;display:grid;place-items:center}
    .smash-icon::before,.smash-icon::after{content:"";position:absolute;left:50%;top:50%;background:#202020;transform-origin:center}
    .smash-icon::before{width:25px;height:4px;transform:translate(-50%,-50%) rotate(45deg)}
    .smash-icon::after{width:25px;height:4px;transform:translate(-50%,-50%) rotate(-45deg)}
    .smash-core{width:11px;height:11px;border:3px solid #202020;transform:rotate(45deg);background:#fff;z-index:1}
    .double-icon,.slash-icon{width:30px;height:30px;position:relative}
    .double-icon::before,.double-icon::after,.slash-icon::before{content:"";position:absolute;width:25px;height:4px;border-radius:999px;background:#202020;left:50%;top:50%}
    .double-icon::before{transform:translate(-50%,-75%) rotate(-35deg)}
    .double-icon::after{transform:translate(-50%,75%) rotate(-35deg)}
    .slash-icon::before{transform:translate(-50%,-50%) rotate(-35deg)}

    @keyframes playerWalk{
      0%,100%{transform:translate(-50%,-50%) translateY(0) rotate(-1deg)}
      50%{transform:translate(-50%,-50%) translateY(-3px) rotate(1deg)}
    }
    @keyframes playerAttack{
      0%{transform:translate(-50%,-50%) translateX(0) rotate(0)}
      45%{transform:translate(-50%,-50%) translateX(11px) rotate(5deg)}
      100%{transform:translate(-50%,-50%) translateX(0) rotate(0)}
    }
    @keyframes slashFx{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(var(--rot))}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45) rotate(var(--rot))}}
    @keyframes impactFx{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
    @keyframes burstFx{0%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) rotate(225deg) scale(2.2)}}
    @keyframes healFx{0%{opacity:0;transform:translate(-50%,-30%) scale(.45)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.25)}}
    @keyframes floatText{0%{opacity:0;transform:translate(-50%,0) scale(.85)}15%{opacity:1;transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-28px) scale(1.04)}}
    @keyframes fieldFlash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
    @keyframes castRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
    @keyframes projectileFly{0%{opacity:1;transform:translate(-50%,-50%) translate3d(0,0,0) scale(.72)}100%{opacity:1;transform:translate(-50%,-50%) translate3d(var(--dx),var(--dy),0) scale(1.12)}}
    @keyframes impactStar{0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) rotate(110deg) scale(1.9)}}
    @keyframes impactRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.18)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.35)}}
    @keyframes rayBurst{0%{opacity:1;transform:translate(0,-50%) rotate(var(--rot)) scaleX(.25)}100%{opacity:0;transform:translate(0,-50%) rotate(var(--rot)) scaleX(1.65)}}
    @keyframes shockRing{0%{opacity:.95;transform:translate(-50%,-50%) scale(.18)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.85)}}

    @media (max-height:700px){
      #game-root{grid-template-rows:32px 42px minmax(0,1fr) auto;gap:4px;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom))}
      #loadout{gap:2px;grid-template-columns:repeat(5,38px);grid-auto-rows:38px}
      .slot{width:38px;height:38px}
      .slot-time{font-size:14px}
      #player{width:56px;height:96px}
    }
  </style>
</head>
<body>
<div id="game-root">
  <header><h1>BD</h1><a class="back" href="BD_index.html">入口へ</a></header>

  <section id="status" aria-label="主人公の状態">
    <div class="status-card">
      <div class="status-head"><span>HP</span><span id="hpText">100 / 100</span></div>
      <div class="bar"><div id="hpFill" class="fill"></div></div>
    </div>
    <div class="status-card">
      <div class="status-head"><span>AC</span><span id="acText">100 / 100</span></div>
      <div class="bar"><div id="acFill" class="fill"></div></div>
    </div>
  </section>

  <section id="battle-wrap">
    <div id="battle-field" aria-label="自動探索画面">
      <div id="player-stage" aria-label="主人公">
        <div id="player-caption">探索中</div>
        <div id="player">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>
      </div>

      <div id="dungeon" aria-label="自動生成ダンジョン">
        <canvas id="dungeon-canvas" width="160" height="220"></canvas>
        <div id="dungeon-shade"></div>
        <div id="encounter-mark" aria-hidden="true"></div>
        <div class="enemy" aria-label="敵1"></div><div class="enemy" aria-label="敵2"></div><div class="enemy" aria-label="敵3"></div>
        <div class="enemy" aria-label="敵4"></div><div class="enemy" aria-label="敵5"></div><div class="enemy" aria-label="敵6"></div>
      </div>

      <div id="field-flash"></div>
      <div id="fx-layer"></div>
      <div id="battle-message">探索中</div>
      <div id="round-info"><div class="round-box">残り <span id="timeText">30.0</span></div><div class="round-box">撃破 <span id="killText">0</span></div></div>
    </div>
  </section>

  <section id="loadout" aria-label="装備と補給品とスキルのマス目">
    <div class="slot supply-slot" id="supplySlot0"><div class="slot-icon"><div class="supply-icon" aria-label="補給品"></div></div></div>
    <div class="slot supply-slot" id="supplySlot1"><div class="slot-icon"><div class="supply-icon" aria-label="補給品"></div></div></div>
    <div class="slot supply-slot" id="supplySlot2"><div class="slot-icon"><div class="supply-icon" aria-label="補給品"></div></div></div>
    <div class="slot supply-slot" id="supplySlot3"><div class="slot-icon"><div class="supply-icon" aria-label="補給品"></div></div></div>
    <div class="slot supply-slot" id="supplySlot4"><div class="slot-icon"><div class="supply-icon" aria-label="補給品"></div></div></div>

    <div class="slot" id="weaponSlot"><div class="slot-icon"><div class="weapon-icon" aria-label="武器"></div></div></div>
    <div class="slot" id="armorSlot"><div class="slot-icon"><div class="armor-icon" aria-label="防具"></div></div></div>

    <div class="slot skill-slot" id="skillSlot0">
      <div class="slot-icon"><div class="smash-icon" aria-label="強打"><div class="smash-core"></div></div></div>
      <div class="cooldown-cover" id="skillCover0"></div>
      <div class="slot-time" id="skillTime0"></div>
    </div>
    <div class="slot skill-slot" id="skillSlot1">
      <div class="slot-icon"><div class="double-icon" aria-label="連撃"></div></div>
      <div class="cooldown-cover" id="skillCover1"></div>
      <div class="slot-time" id="skillTime1"></div>
    </div>
    <div class="slot skill-slot" id="skillSlot2">
      <div class="slot-icon"><div class="slash-icon" aria-label="斬撃"></div></div>
      <div class="cooldown-cover" id="skillCover2"></div>
      <div class="slot-time" id="skillTime2"></div>
    </div>
  </section>
</div>

<script>
(() => {
  const field=document.getElementById('battle-field');
  const dungeon=document.getElementById('dungeon');
  const dungeonCanvas=document.getElementById('dungeon-canvas');
  const dungeonCtx=dungeonCanvas.getContext('2d');
  const playerEl=document.getElementById('player');
  const enemyEls=[...document.querySelectorAll('.enemy')];
  const fxLayer=document.getElementById('fx-layer');
  const fieldFlash=document.getElementById('field-flash');
  const message=document.getElementById('battle-message');
  const timeText=document.getElementById('timeText'),killText=document.getElementById('killText');
  const hpText=document.getElementById('hpText'),hpFill=document.getElementById('hpFill');
  const acText=document.getElementById('acText'),acFill=document.getElementById('acFill');
  const supplySlots=[0,1,2,3,4].map(i=>document.getElementById('supplySlot'+i));
  const skillCovers=[document.getElementById('skillCover0'),document.getElementById('skillCover1'),document.getElementById('skillCover2')];
  const skillTimes=[document.getElementById('skillTime0'),document.getElementById('skillTime1'),document.getElementById('skillTime2')];

  const ENEMY_SIZE=8,MAX_FX=40;
  let dungeonW=280,dungeonH=420,lastHud=0;

  const state={
    maxHp:100,hp:100,maxAc:100,ac:100,acRegenPerSec:16,
    supplies:5,supplyHeal:40,autoSupplyThreshold:30,
    weaponBonus:1,armorDefense:3,
    normalAttackCooldown:900,normalAttackReadyAt:0,
    lastTime:performance.now(),dead:false,nextPlayerHit:0,
    roundDuration:30000,roundStart:0,roundEnd:0,kills:0,finished:false
  };

  const skills=[
    {name:'強打',cost:5,cooldown:5000,damage:3,range:170,readyAt:0},
    {name:'連撃',cost:3,cooldown:3000,damage:2,range:135,readyAt:0},
    {name:'斬撃',cost:1,cooldown:1000,damage:1,range:105,readyAt:0}
  ];

  const FX_COLORS={
    smash:{main:'#ef4444',soft:'rgba(239,68,68,.38)'},
    combo:{main:'#f59e0b',soft:'rgba(245,158,11,.35)'},
    slash:{main:'#38bdf8',soft:'rgba(56,189,248,.35)'},
    heal:{main:'#22c55e',soft:'rgba(34,197,94,.35)'},
    hit:{main:'#fb7185',soft:'rgba(251,113,133,.35)'}
  };

  let dungeonMap=null;

  function generateDungeon(){
    const W=dungeonCanvas.width,H=dungeonCanvas.height;
    const cells=new Uint8Array(W*H);
    const idx=(x,y)=>y*W+x;
    const rooms=[];

    function carveRect(x,y,w,h){
      const x0=Math.max(1,Math.floor(x)),y0=Math.max(1,Math.floor(y));
      const x1=Math.min(W-2,Math.floor(x+w)),y1=Math.min(H-2,Math.floor(y+h));
      for(let yy=y0;yy<y1;yy++){
        for(let xx=x0;xx<x1;xx++)cells[idx(xx,yy)]=1;
      }
    }

    function carveH(x1,x2,y,width=2){
      const a=Math.max(1,Math.min(x1,x2)),b=Math.min(W-2,Math.max(x1,x2));
      for(let yy=Math.max(1,y-width);yy<=Math.min(H-2,y+width);yy++){
        for(let x=a;x<=b;x++)cells[idx(x,yy)]=1;
      }
    }

    function carveV(y1,y2,x,width=2){
      const a=Math.max(1,Math.min(y1,y2)),b=Math.min(H-2,Math.max(y1,y2));
      for(let xx=Math.max(1,x-width);xx<=Math.min(W-2,x+width);xx++){
        for(let y=a;y<=b;y++)cells[idx(xx,y)]=1;
      }
    }

    // 小さな長方形の部屋を散らして、細い直角通路でつなぐ。
    const targetRooms=12+Math.floor(Math.random()*7);
    for(let tries=0;tries<180&&rooms.length<targetRooms;tries++){
      const rw=10+Math.floor(Math.random()*24);
      const rh=8+Math.floor(Math.random()*20);
      const rx=3+Math.floor(Math.random()*Math.max(1,W-rw-6));
      const ry=3+Math.floor(Math.random()*Math.max(1,H-rh-6));
      const pad=5;
      const overlaps=rooms.some(r=>
        rx<r.x+r.w+pad && rx+rw+pad>r.x &&
        ry<r.y+r.h+pad && ry+rh+pad>r.y
      );
      if(overlaps)continue;
      rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
      carveRect(rx,ry,rw,rh);
    }

    rooms.sort((a,b)=>a.cx-b.cx);

    for(let i=1;i<rooms.length;i++){
      const a=rooms[i-1],b=rooms[i];
      if(Math.random()<.5){
        carveH(a.cx,b.cx,a.cy,1);
        carveV(a.cy,b.cy,b.cx,1);
      }else{
        carveV(a.cy,b.cy,a.cx,1);
        carveH(a.cx,b.cx,b.cy,1);
      }
    }

    // 枝道を少し追加。
    for(let i=0;i<Math.floor(rooms.length/3);i++){
      const a=rooms[Math.floor(Math.random()*rooms.length)];
      const b=rooms[Math.floor(Math.random()*rooms.length)];
      if(!a||!b||a===b)continue;
      if(Math.random()<.5){
        carveH(a.cx,b.cx,a.cy,1);
        carveV(a.cy,b.cy,b.cx,1);
      }else{
        carveV(a.cy,b.cy,a.cx,1);
        carveH(a.cx,b.cx,b.cy,1);
      }
    }

    // 左中央に接敵地点へつながる短い入口通路。
    if(rooms.length){
      const entranceY=Math.floor(H*.5);
      carveH(2,rooms[0].cx,entranceY,1);
      carveV(entranceY,rooms[0].cy,rooms[0].cx,1);
      carveRect(2,entranceY-4,8,9);
    }

    dungeonMap={W,H,cells};
    drawDungeon();
  }

  function drawDungeon(){
    if(!dungeonMap)return;
    const {W,H,cells}=dungeonMap;
    const image=dungeonCtx.createImageData(W,H);

    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i=y*W+x,p=i*4;
        if(cells[i]){
          const n=224+((x+y)%3)*5;
          image.data[p]=n;
          image.data[p+1]=n;
          image.data[p+2]=n-4;
          image.data[p+3]=255;
        }else{
          image.data[p]=18;
          image.data[p+1]=18;
          image.data[p+2]=18;
          image.data[p+3]=255;
        }
      }
    }

    // 通路・部屋の境界を1pxの壁として少し明るく見せる。
    for(let y=1;y<H-1;y++){
      for(let x=1;x<W-1;x++){
        const i=y*W+x;
        if(cells[i])continue;
        const near=
          cells[i-1]||cells[i+1]||cells[i-W]||cells[i+W];
        if(near){
          const p=i*4;
          image.data[p]=76;
          image.data[p+1]=76;
          image.data[p+2]=72;
        }
      }
    }

    dungeonCtx.putImageData(image,0,0);
  }

  function fieldPoint(el){
    const fr=field.getBoundingClientRect(),r=el.getBoundingClientRect();
    return{x:r.left-fr.left+r.width/2,y:r.top-fr.top+r.height/2};
  }
  function playerPoint(){return fieldPoint(playerEl)}
  function enemyPoint(e){return fieldPoint(e.el)}

  function dungeonEncounterPoint(){
    return{x:dungeonW*.08,y:dungeonH*.50};
  }

  const enemies=enemyEls.map((el,i)=>({
    el,id:i+1,hp:4,maxHp:4,x:0,y:0,vx:0,vy:0,
    speed:15+(i%3)*2,nextTurn:0,nextContactHit:0,dead:false,respawnAt:0
  }));

  function refreshBounds(){
    dungeonW=dungeon.clientWidth;
    dungeonH=dungeon.clientHeight;
    const nextW=Math.max(120,Math.round(dungeonW));
    const nextH=Math.max(160,Math.round(dungeonH));
    if(dungeonCanvas.width!==nextW||dungeonCanvas.height!==nextH){
      dungeonCanvas.width=nextW;
      dungeonCanvas.height=nextH;
      generateDungeon();
    }
    for(const e of enemies){
      e.x=Math.min(Math.max(0,e.x),Math.max(0,dungeonW-ENEMY_SIZE));
      e.y=Math.min(Math.max(0,e.y),Math.max(0,dungeonH-ENEMY_SIZE));
    }
  }

  function encounterDistance(e){
    const p=dungeonEncounterPoint();
    return Math.hypot((e.x+ENEMY_SIZE/2)-p.x,(e.y+ENEMY_SIZE/2)-p.y);
  }

  function nearestEnemy(maxRange){
    let best=null,bestD=maxRange;
    for(const e of enemies){
      if(e.dead)continue;
      const d=encounterDistance(e);
      if(d<=bestD){best=e;bestD=d;}
    }
    return best;
  }

  function setEnemyDirection(e,now){
    const p=dungeonEncounterPoint();
    const ex=e.x+ENEMY_SIZE/2,ey=e.y+ENEMY_SIZE/2;
    const dx=p.x-ex,dy=p.y-ey;
    const d=Math.hypot(dx,dy)||1;
    const wander=(Math.random()-.5)*.45;
    const a=Math.atan2(dy,dx)+wander;
    e.vx=Math.cos(a)*e.speed;
    e.vy=Math.sin(a)*e.speed;
    e.nextTurn=now+500+Math.random()*900;
  }

  function moveEnemyTowardEncounter(e,dt,now){
    if(now>=e.nextTurn)setEnemyDirection(e,now);
    e.x+=e.vx*dt;
    e.y+=e.vy*dt;
    if(e.x<2||e.x>dungeonW-ENEMY_SIZE-2||e.y<2||e.y>dungeonH-ENEMY_SIZE-2)setEnemyDirection(e,0);
    e.x=Math.min(Math.max(2,e.x),Math.max(2,dungeonW-ENEMY_SIZE-2));
    e.y=Math.min(Math.max(2,e.y),Math.max(2,dungeonH-ENEMY_SIZE-2));
  }

  function spawnEnemy(e,now){
    e.x=dungeonW*(.45+Math.random()*.48);
    e.y=dungeonH*(.08+Math.random()*.84);
    e.hp=e.maxHp;
    e.dead=false;
    e.el.classList.remove('dead','hit');
    setEnemyDirection(e,now);
  }

  function renderPositions(){
    for(const e of enemies){
      if(!e.dead)e.el.style.transform=`translate3d(${e.x.toFixed(1)}px,${e.y.toFixed(1)}px,0)`;
    }
  }

  function animatePlayerAttack(){
    playerEl.classList.remove('attack');
    void playerEl.offsetWidth;
    playerEl.classList.add('attack');
    setTimeout(()=>playerEl.classList.remove('attack'),240);
  }

  function limitFx(){while(fxLayer.childElementCount>=MAX_FX)fxLayer.firstElementChild?.remove()}
  function addFx(cls,x,y,rot,color){
    limitFx();
    const el=document.createElement('div');
    el.className=cls;el.style.left=x+'px';el.style.top=y+'px';
    if(rot!==undefined)el.style.setProperty('--rot',rot+'deg');
    if(color){el.style.setProperty('--fx',color.main);el.style.setProperty('--fx-soft',color.soft)}
    fxLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});
  }
  function floatText(x,y,text,color){
    limitFx();
    const el=document.createElement('div');el.className='float-text';el.textContent=text;
    el.style.left=x+'px';el.style.top=y+'px';
    if(color)el.style.setProperty('--fx',color.main);
    fxLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});
  }
  function flash(){fieldFlash.classList.remove('active');void fieldFlash.offsetWidth;fieldFlash.classList.add('active')}

  function projectileFx(x1,y1,x2,y2,type='normal',duration=150,color){
    limitFx();
    const el=document.createElement('div');
    const dx=x2-x1,dy=y2-y1,rot=Math.atan2(dy,dx)*180/Math.PI;
    el.className='projectile-fx '+type;
    el.style.left=x1+'px';el.style.top=y1+'px';
    el.style.setProperty('--dx',dx+'px');el.style.setProperty('--dy',dy+'px');
    el.style.setProperty('--rot',rot+'deg');el.style.setProperty('--dur',duration+'ms');
    if(color){el.style.setProperty('--fx',color.main);el.style.setProperty('--fx-soft',color.soft)}
    fxLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});
  }

  function hitBurst(x,y,strong,color){
    addFx('impact-fx',x,y,undefined,color);
    addFx('impact-star',x,y,undefined,color);
    const rays=strong?10:6;
    for(let i=0;i<rays;i++)addFx('ray-fx',x,y,(360/rays)*i,color);
    if(strong){addFx('impact-ring',x,y,undefined,color);addFx('shock-ring',x,y,undefined,color);flash()}
  }

  function skillFx(skill,e){
    const p=playerPoint(),q=enemyPoint(e),a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
    animatePlayerAttack();

    if(skill.name==='強打'){
      const color=FX_COLORS.smash;
      addFx('cast-ring',p.x,p.y,undefined,color);
      projectileFx(p.x,p.y,q.x,q.y,'heavy',330,color);
      setTimeout(()=>{addFx('burst-fx',q.x,q.y,undefined,color);hitBurst(q.x,q.y,true,color)},310);
      floatText(q.x,q.y-12,skill.name,color);
    }else if(skill.name==='連撃'){
      const color=FX_COLORS.combo;
      addFx('cast-ring',p.x,p.y,undefined,color);
      projectileFx(p.x,p.y,q.x-5,q.y-3,'normal',270,color);
      setTimeout(()=>projectileFx(p.x,p.y,q.x+5,q.y+3,'normal',270,color),90);
      setTimeout(()=>{addFx('slash-fx',q.x,q.y,a,color);hitBurst(q.x,q.y,false,color)},280);
      floatText(q.x,q.y-12,skill.name,color);
    }else{
      const color=FX_COLORS.slash;
      projectileFx(p.x,p.y,q.x,q.y,'light',230,color);
      setTimeout(()=>{addFx('slash-fx',q.x,q.y,a,color);hitBurst(q.x,q.y,false,color)},220);
      floatText(q.x,q.y-12,skill.name,color);
    }
  }

  function damageEnemy(e,amount,skill){
    if(e.dead)return;
    e.hp=Math.max(0,e.hp-amount);
    e.el.classList.add('hit');
    setTimeout(()=>e.el.classList.remove('hit'),90);
    skillFx(skill,e);

    if(e.hp<=0){
      e.dead=true;
      e.respawnAt=performance.now()+900;
      e.el.classList.add('dead');
      state.kills++;
      const q=enemyPoint(e);
      floatText(q.x,q.y-16,'撃破');
      message.textContent=skill.name+'で敵'+e.id+'撃破';
    }else{
      message.textContent=skill.name+'：敵'+e.id+' -'+amount;
    }
  }

  function useSupply(){
    if(state.dead||state.hp>state.autoSupplyThreshold||state.supplies<=0||state.hp>=state.maxHp)return;
    state.supplies--;
    state.hp=Math.min(state.maxHp,state.hp+state.supplyHeal);
    const p=playerPoint();
    addFx('heal-fx',p.x,p.y,undefined,FX_COLORS.heal);
    floatText(p.x,p.y-18,'HP +'+state.supplyHeal,FX_COLORS.heal);
    playerEl.classList.add('heal');
    setTimeout(()=>playerEl.classList.remove('heal'),300);
    message.textContent='補給品を自動使用';
  }

  function damagePlayer(amount,now){
    if(state.dead||now<state.nextPlayerHit)return;
    state.nextPlayerHit=now+420;
    const finalDamage=Math.max(1,amount-state.armorDefense);
    state.hp=Math.max(0,state.hp-finalDamage);
    const p=playerPoint();
    addFx('impact-fx',p.x,p.y,undefined,FX_COLORS.hit);
    floatText(p.x,p.y-18,'-'+finalDamage,FX_COLORS.hit);
    playerEl.classList.add('hit');
    setTimeout(()=>playerEl.classList.remove('hit'),120);
    if(state.hp<=0){gameOver();return}
    useSupply();
  }

  function normalAttack(now){
    if(state.dead||now<state.normalAttackReadyAt)return false;
    const target=nearestEnemy(145);
    if(!target)return false;
    state.normalAttackReadyAt=now+state.normalAttackCooldown;
    const damage=1+state.weaponBonus;
    damageEnemy(target,damage,{name:'通常攻撃',damage,range:145});
    return true;
  }

  function trySkills(now){
    if(state.dead)return;
    for(const skill of skills){
      if(now<skill.readyAt||state.ac<skill.cost)continue;
      const target=nearestEnemy(skill.range);
      if(!target)continue;
      state.ac-=skill.cost;
      skill.readyAt=now+skill.cooldown;
      damageEnemy(target,skill.damage+state.weaponBonus,skill);
      return;
    }
    normalAttack(now);
  }

  function contactCheck(now){
    if(state.dead)return;
    for(const e of enemies){
      if(e.dead||now<e.nextContactHit)continue;
      if(encounterDistance(e)<=16){
        e.nextContactHit=now+950;
        damagePlayer(10,now);
        e.x+=35+Math.random()*25;
        e.y+=(-20+Math.random()*40);
        setEnemyDirection(e,now);
      }
    }
  }

  function updateHud(now){
    hpText.textContent=Math.ceil(state.hp)+' / '+state.maxHp;
    hpFill.style.width=Math.max(0,state.hp/state.maxHp*100)+'%';
    acText.textContent=Math.floor(state.ac)+' / '+state.maxAc;
    acFill.style.width=Math.max(0,state.ac/state.maxAc*100)+'%';
    supplySlots.forEach((slot,i)=>slot.classList.toggle('used',i>=state.supplies));
    const remain=Math.max(0,state.roundEnd-now);
    timeText.textContent=(remain/1000).toFixed(1);
    killText.textContent=state.kills;
    skills.forEach((s,i)=>{
      const remainMs=Math.max(0,s.readyAt-now);
      const ratio=Math.max(0,Math.min(1,remainMs/s.cooldown));
      skillCovers[i].style.height=(ratio*100)+'%';
      skillTimes[i].textContent=remainMs>0?(remainMs/1000).toFixed(1):'';
    });
  }

  function respawnEnemy(e,now){spawnEnemy(e,now)}

  function gameOver(){
    if(state.finished)return;
    state.dead=true;state.finished=true;
    for(const e of enemies){e.vx=0;e.vy=0}
    hpText.textContent='0 / '+state.maxHp;
    hpFill.style.width='0%';
    message.textContent='ゲームオーバー：'+state.kills+'体撃破';
  }

  function finishRound(){
    if(state.finished)return;
    state.finished=true;
    for(const e of enemies){e.vx=0;e.vy=0}
    message.textContent='探索終了：30秒で '+state.kills+'体撃破';
    timeText.textContent='0.0';
  }

  function init(){
    refreshBounds();
    const now=performance.now();
    state.roundStart=now;
    state.roundEnd=now+state.roundDuration;
    enemies.forEach(e=>spawnEnemy(e,now));
    renderPositions();
    updateHud(now);
  }

  const ro=window.ResizeObserver?new ResizeObserver(refreshBounds):null;
  if(ro)ro.observe(dungeon);else window.addEventListener('resize',refreshBounds,{passive:true});

  function frame(now){
    const dt=Math.min((now-state.lastTime)/1000,.035);
    state.lastTime=now;

    if(!state.finished&&now>=state.roundEnd)finishRound();

    if(!state.finished){
      if(!state.dead)state.ac=Math.min(state.maxAc,state.ac+state.acRegenPerSec*dt);
      for(const e of enemies){
        if(e.dead){
          if(now>=e.respawnAt)respawnEnemy(e,now);
          continue;
        }
        moveEnemyTowardEncounter(e,dt,now);
      }
      contactCheck(now);
      trySkills(now);
    }

    renderPositions();
    if(now-lastHud>=100){lastHud=now;updateHud(now)}
    requestAnimationFrame(frame);
  }

  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
