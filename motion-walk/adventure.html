<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>うごく冒険</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d0a;color:#f7ead0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100dvh;background:linear-gradient(#1c2630 0 13%,#344739 13% 56%,#241a13 56%)}
header{height:13%;padding:10px 14px;display:flex;align-items:end;justify-content:space-between;background:#111b22dd;border-bottom:1px solid #6f654d}
.stat{font-size:12px;color:#c7baa1}.stat b{display:block;font-size:18px;color:#fff}
#field{height:43%;position:relative;overflow:hidden;background:linear-gradient(#73899a 0 40%,#536a49 40% 70%,#78694d 70%);border-bottom:2px solid #392b1d}
#field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(165deg,#685943 0 16px,#74634a 16px 32px)}
.actor{position:absolute;bottom:17%;width:34%;height:65%;z-index:2;display:flex;align-items:end;justify-content:center;filter:drop-shadow(0 7px 4px #0008)}
#hero{left:7%}#enemy{right:7%}.actor .body{position:relative;width:76px;height:126px;transform-origin:50% 100%}
.head{position:absolute;width:42px;height:42px;border-radius:50%;left:17px;top:0;border:4px solid #2b2118}.torso{position:absolute;left:12px;top:38px;width:53px;height:62px;border:4px solid #2b2118;border-radius:10px}.leg{position:absolute;top:94px;width:17px;height:34px;background:#352a22}.l{left:17px}.r{right:17px}
#hero .head{background:#d9b58b}#hero .torso{background:#596c7d}#hero .body:after{content:"";position:absolute;width:9px;height:85px;background:#d8d5c3;right:-2px;top:35px;transform:rotate(23deg);border:2px solid #29231c}
#enemy .head{background:#788c46}#enemy .torso{background:#51642f}.enemy-eye{position:absolute;top:16px;left:8px;width:7px;height:5px;background:#ff4b3e;box-shadow:19px 0 #ff4b3e}
#enemy{right:7%;opacity:1}#enemy.enter{animation:enemyEnter .45s steps(5,end)}#enemy.idle .body,#hero .body{animation:idle .9s steps(2,end) infinite}#hero.attack{animation:attack .22s steps(3,end)}#enemy.hit{animation:hit .25s steps(4,end)}#enemy.dead{animation:dead .5s steps(5,end) forwards}
@keyframes enemyEnter{from{transform:translateX(-120vw);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes idle{50%{transform:translateY(-4px) rotate(-1deg)}}@keyframes attack{50%{transform:translate(-28px,-5px) rotate(-5deg)}}@keyframes hit{25%{transform:translateX(-10px)}50%{transform:translateX(8px);filter:brightness(2)}75%{transform:translateX(-5px)}}@keyframes dead{to{opacity:0;transform:translate(-30px,25px) rotate(-15deg)}}
.name{position:absolute;bottom:-24px;width:130%;left:-15%;text-align:center;font-weight:800;font-size:13px;text-shadow:0 2px #000}
.hpbar{position:absolute;bottom:-8px;width:100%;height:7px;background:#241b18;border:1px solid #b8a27a}.hpfill{height:100%;background:#b94335;transition:width .15s}
#slash{position:absolute;z-index:5;width:100px;height:7px;background:#fff;box-shadow:0 0 14px #fff,0 0 25px #ffd778;left:31%;top:50%;transform:rotate(-35deg) scaleX(0);opacity:0}
#slash.go{animation:slash .22s ease-out}@keyframes slash{0%{opacity:1;transform:rotate(-35deg) scaleX(.1)}60%{opacity:1;transform:rotate(-35deg) scaleX(1.3)}100%{opacity:0;transform:rotate(-35deg) scaleX(1.6)}}
#damage{position:absolute;z-index:6;left:22%;top:34%;font-size:26px;font-weight:900;color:#fff4c4;text-shadow:2px 2px #7b241c;opacity:0}#damage.go{animation:dmg .55s ease-out}@keyframes dmg{0%{opacity:1;transform:translateY(15px) scale(.7)}60%{opacity:1;transform:translateY(-15px) scale(1.2)}100%{opacity:0;transform:translateY(-30px)}}
#panel{height:44%;padding:10px 12px;background:linear-gradient(#1c1611,#0e0c0a);display:flex;flex-direction:column;gap:8px}
#enemyInfo{display:flex;justify-content:space-between;font-size:13px}.meter{height:13px;background:#2a231d;border:1px solid #665743}.meter>div{height:100%;background:linear-gradient(90deg,#b68a32,#e8c861);width:0;transition:width .15s}
#log{height:62px;padding:8px;background:#0b0a09;border:1px solid #45392d;color:#cdbd9f;font-size:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.box{height:54px;border:1px solid #514332;background:#17130f;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px}.box strong{font-size:18px;color:#e6c266}
.controls{display:flex;gap:8px;margin-top:auto}button,a.btn{border:1px solid #746148;background:#292117;color:#eee1c8;border-radius:8px;padding:11px;font-weight:800;text-decoration:none;text-align:center;flex:1;font-size:13px}#start{background:#9c6d28;color:white}
</style></head><body>
<header><div class="stat">移動距離<b><span id="km">0.00</span> km</b></div><div class="stat">階層<b><span id="floor">1</span> F</b></div><div class="stat">撃破<b><span id="kills">0</span></b></div></header>
<section id="field"><div id="enemy" class="actor"><div class="body"><div class="head"><i class="enemy-eye"></i></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div></div><div class="hpbar"><div id="ehp" class="hpfill"></div></div><div id="ename" class="name">荒野ゴブリン</div></div>
<div id="hero" class="actor"><div class="body"><div class="head"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div></div><div class="name">冒険者</div></div><div id="slash"></div><div id="damage"></div></section>
<section id="panel"><div id="enemyInfo"><b id="enemyLabel">敵を探索中</b><span>HP <span id="hptext">0/0</span></span></div><div class="meter"><div id="motionbar"></div></div>
<div id="log">ゲーム開始でモーション検出を開始します。</div><div class="grid"><div class="box">攻撃力<br><strong id="atk">12</strong></div><div class="box">武器<br><span id="weapon">古い剣</span></div><div class="box">GOLD<br><strong id="gold">0</strong></div><div class="box">次の攻撃<br><span id="need">6動作</span></div></div>
<div class="controls"><a class="btn" href="./select.html">戻る</a><button id="sound">SE ON</button><button id="start">ゲーム開始</button></div></section>
<script>
const $=id=>document.getElementById(id), hero=$('hero'),enemy=$('enemy'),slash=$('slash'),damage=$('damage'),ehp=$('ehp'),motionbar=$('motionbar'),log=$('log');
let running=false,raw=0,steps=0,meters=0,kills=0,floor=1,gold=0,atk=12,hp=0,maxHp=0,lastImpulse=0,smooth=0,audio=null,sound=true,enemyNo=0;
const enemies=[['荒野ゴブリン',45,7],['洞窟ネズミ',58,9],['骸骨兵',78,12],['沼オーク',105,16],['黒騎士',145,24]];
function tone(f,d=.08,type='square',vol=.025){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function spawn(){const e=enemies[enemyNo%enemies.length],scale=1+Math.floor(enemyNo/enemies.length)*.28;maxHp=Math.round(e[1]*scale);hp=maxHp;$('ename').textContent=e[0];$('enemyLabel').textContent=e[0];$('hptext').textContent=hp+'/'+maxHp;ehp.style.width='100%';enemy.className='actor enter';setTimeout(()=>enemy.className='actor idle',480);log.textContent=e[0]+' が現れた！';tone(150,.16,'sawtooth');}
function attack(){if(hp<=0)return;hero.classList.remove('attack');slash.classList.remove('go');damage.classList.remove('go');void hero.offsetWidth;hero.classList.add('attack');slash.classList.add('go');const d=atk+Math.floor(Math.random()*6);damage.textContent=d+' DAMAGE';damage.classList.add('go');enemy.classList.add('hit');tone(560,.07,'sawtooth');setTimeout(()=>enemy.classList.remove('hit'),260);hp=Math.max(0,hp-d);ehp.style.width=(hp/maxHp*100)+'%';$('hptext').textContent=hp+'/'+maxHp;log.textContent='冒険者の攻撃！ '+d+'ダメージ';if(hp<=0)setTimeout(kill,320)}
function kill(){enemy.className='actor dead';kills++;gold+=enemies[enemyNo%enemies.length][2];$('kills').textContent=kills;$('gold').textContent=gold;log.textContent=$('ename').textContent+'を倒した！ '+enemies[enemyNo%enemies.length][2]+'G獲得';tone(700,.08,'triangle');setTimeout(()=>tone(940,.12,'triangle'),90);enemyNo++;if(kills%5===0){floor++;atk+=3;$('floor').textContent=floor;$('atk').textContent=atk;$('weapon').textContent='強化剣 +'+(floor-1)}setTimeout(spawn,850)}
function motion(){if(!running)return;raw++;motionbar.style.width=((raw%6)/6*100)+'%';$('need').textContent=(6-(raw%6||0))+'動作';if(raw%6===0){steps++;meters+=7.5;$('km').textContent=(meters/1000).toFixed(2);motionbar.style.width='100%';attack();setTimeout(()=>motionbar.style.width='0%',180)}}
function onMotion(e){const a=e.accelerationIncludingGravity;if(!a)return;const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);smooth=smooth*.73+mag*.27;const now=performance.now();if(Math.abs(mag-smooth)>1.7&&now-lastImpulse>330){lastImpulse=now;motion()}}
$('start').onclick=async()=>{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){try{if(await DeviceMotionEvent.requestPermission()!=='granted')return}catch(e){log.textContent='モーションセンサーを許可してください';return}}if(!running){running=true;$('start').textContent='停止';window.addEventListener('devicemotion',onMotion);if(maxHp===0)spawn();log.textContent='身体を動かすと攻撃します。'}else{running=false;$('start').textContent='再開';window.removeEventListener('devicemotion',onMotion);log.textContent='停止中';}};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'SE ON':'SE OFF';if(sound&&!audio)audio=new (window.AudioContext||window.webkitAudioContext)()};
</script></body></html>
