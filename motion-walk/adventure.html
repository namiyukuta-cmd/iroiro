<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>声で歩く迷宮</title>
  <link rel="stylesheet" href="./css/dungeon.css?v=1">
  <script defer src="./vendor/three.min.js?v=160"></script>
  <script defer src="./js/dungeon-data.js?v=1"></script>
  <script defer src="./js/dungeon-engine.js?v=1"></script>
  <script defer src="./js/dungeon-view.js?v=1"></script>
  <script defer src="./js/voice-input.js?v=1"></script>
  <script defer src="./js/dungeon-app.js?v=1"></script>
</head>
<body>
  <header><div><small>声で歩く迷宮</small><h1 id="place">地下1階・石の回廊</h1></div><span id="direction">北</span></header>
  <main id="scene" aria-label="一人称のダンジョン"><div id="viewError" hidden></div><div class="sceneLabel" id="sceneLabel">探索中</div><div id="enemyStatus" hidden></div></main>
  <section class="dashboard">
    <div id="log" role="status">「進め」で1マス移動。「調べる」で足元や正面を確認。</div>
    <div class="stats"><div>HP<b id="hp">40 / 40</b></div><div>レベル<b id="level">1</b></div><div>経験値<b id="xp">0 / 20</b></div><div>所持金<b id="gold">0 G</b></div></div>
    <div class="voiceLine"><span id="voiceStatus">マイク停止中</span><span id="heard">認識：—</span></div>
    <div class="actions" id="exploreControls"><button data-command="left" aria-label="左を向く">←</button><button data-command="forward" aria-label="前へ進む">↑</button><button data-command="back" aria-label="後ろへ戻る">↓</button><button data-command="right" aria-label="右を向く">→</button><button class="wide" data-command="inspect">調べる・決定</button><button class="wide" data-command="heal">回復 <span class="potions">3</span></button></div>
    <div class="actions" id="battleControls" hidden><button data-command="attack">攻撃</button><button data-command="guard">防御</button><button data-command="heal">回復</button><button data-command="flee">逃げる</button><button data-command="left" aria-label="前の行動を選択">←</button><button data-command="right" aria-label="次の行動を選択">→</button><button class="wide" data-command="confirm">決定</button></div>
    <div id="endControls" hidden><button id="restart">最初から</button></div>
    <footer><a href="./select.html">戻る</a><button id="sound">SE ON</button><button id="mic">音声開始</button></footer>
  </section>
</body>
</html>
