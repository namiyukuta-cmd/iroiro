<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>底辺エアロビ配信</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101014;
  color:#f8f5ef;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ===== 最上部 ===== */

.top{
  height:8%;
  min-height:66px;
  padding:0 2px;
  background:#17171e;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  align-items:center;
  border-bottom:1px solid #444;
}

.s{
  font-size:13px;
  color:#aaa;
  text-align:center;
  line-height:1;
}

.s b{
  display:block;
  margin-top:2px;
  font-size:24px;
  line-height:1;
  color:#fff;
}

/* ===== 配信画面 ===== */

.stageRow{
  height:30%;
  min-height:235px;
  background:#0d0d12;
  border-bottom:1px solid #333;
}

.stream{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:linear-gradient(
    #e9dfd0 0 70%,
    #b8a98f 70%
  );
}

.room{
  position:absolute;
  inset:0;
}

/* 窓をさらに小さく */
.window{
  position:absolute;
  left:6%;
  top:10%;
  width:20%;
  height:23%;
  background:#95b8c7;
  border:5px solid #eee;
  box-shadow:0 0 0 2px #9a8e7c;
}

.shelf{
  position:absolute;
  right:5%;
  top:17%;
  width:22%;
  height:6px;
  background:#765e49;
  box-shadow:0 32px #765e49;
}

.plant{
  position:absolute;
  right:9%;
  bottom:27%;
  font-size:31px;
}

.phone{
  position:absolute;
  right:6%;
  bottom:7%;
  width:18px;
  height:54px;
  background:#24242a;
  border-radius:5px;
  box-shadow:0 0 0 3px #555;
}

/* 配信者を1段階大きく */
.girl{
  position:absolute;
  left:50%;
  bottom:2%;
  width:124px;
  height:230px;
  transform:translateX(-50%) scale(.9);
  transform-origin:50% 100%;
}

.girl img{
  display:block;
  width:100%;
  height:auto;
  max-height:100%;
  object-fit:contain;
}

.live{
  position:absolute;
  left:8px;
  top:8px;
  background:#e73359;
  border-radius:5px;
  padding:4px 7px;
  font-size:11px;
  font-weight:900;
}

/* いいねを配信画面左下へ */
.likeOverlay{
  position:absolute;
  left:10px;
  bottom:8px;
  z-index:5;
  color:#111;
  font-size:22px;
  line-height:1;
  font-weight:1000;
  letter-spacing:-1px;
  text-shadow:
    0 1px 0 #ffffff55,
    1px 0 0 #ffffff33;
}

.likeOverlay span{
  font-size:24px;
}

.pop{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  font-size:21px;
  font-weight:900;
  text-shadow:0 2px 4px #000;
  color:#fff;
  opacity:0;
}

.pop.go{
  animation:pop .7s;
}

/* ===== スパチャエリア ===== */

.superArea{
  height:70px;
  flex:0 0 70px;
  display:flex;
  align-items:stretch;
  background:#111118;
  border-bottom:1px solid #333;
}

.patronbar{
  flex:1;
  min-width:0;
  padding:5px 4px 5px 7px;
  display:flex;
  gap:4px;
  align-items:center;
  overflow:hidden;
}

.patronhint{
  width:31px;
  flex:0 0 31px;
  font-size:8px;
  line-height:1.15;
  color:#777;
  font-weight:800;
}

.patronicon{
  width:43px;
  height:43px;
  flex:0 0 43px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2px;
  font-size:9px;
  font-weight:900;
  color:#fff;
  line-height:1.05;
  white-space:pre-line;
  box-shadow:0 0 0 2px #fff4;
  animation:patronIn .35s ease-out;
}

/* 投げ銭総額 */
.tiptotal{
  width:55px;
  flex:0 0 55px;
  border-left:1px solid #333;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:8px;
  color:#aaa;
}

.tiptotal b{
  margin-top:2px;
  font-size:13px;
  color:#ffd46d;
}

/* 32x32 投げ銭金額 */
.tiprail{
  width:174px;
  flex:0 0 174px;
  padding:4px 5px;
  border-left:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2px;
}

.tipicon{
  width:32px;
  height:32px;
  flex:0 0 32px;
  position:relative;
  border-radius:4px;
  color:#fff;
  border:1px solid #ffffff45;
  font-weight:1000;
  overflow:hidden;
}

.tipNum{
  position:absolute;
  left:0;
  top:3px;
  width:100%;
  text-align:center;
  font-size:13px;
  line-height:13px;
  letter-spacing:-.5px;
}

.tipYen{
  position:absolute;
  right:2px;
  bottom:1px;
  font-size:7px;
  line-height:7px;
  font-weight:900;
}

.tipicon.hit{
  animation:tipHit .65s ease;
}

.tip50,.sc50{
  background:#58718d;
}

.tip100,.sc100{
  background:#2c8c68;
}

.tip200,.sc200{
  background:#3977c9;
}

.tip300,.sc300{
  background:#9b54b7;
}

.tip500,.sc500{
  background:#d04b57;
}

/* ===== コメント ===== */

.chat{
  flex:1;
  min-height:0;
  background:#0e0e13;
  border-bottom:1px solid #333;
  display:flex;
  flex-direction:column;
}

.chatTitle{
  height:31px;
  flex:0 0 31px;
  padding:7px 10px 5px;
  font-size:13px;
  font-weight:900;
  color:#aaa;
  border-bottom:1px solid #292931;
}

.comments{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:5px 8px 8px;
  user-select:text;
}

.comment{
  padding:9px 8px;
  border-bottom:1px solid #26262d;
  font-size:16px;
  font-weight:650;
  line-height:1.3;
}

.commentName{
  font-size:13px;
  color:#a9a9b4;
  font-weight:900;
  margin-right:7px;
}

.comment.superchat{
  margin:5px 0;
  border:0;
  border-radius:7px;
  color:#fff;
  padding:10px 9px;
  font-size:16px;
  font-weight:800;
}

.comment.superchat .commentName{
  color:#fff;
  font-size:13px;
}

/* ===== 下部操作 ===== */

.panel{
  height:82px;
  flex:0 0 82px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  background:#121217;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.bar{
  height:5px;
  flex:0 0 5px;
  background:#292931;
  border-radius:8px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:#e25a78;
  transition:width .15s;
}

.controls{
  flex:1;
  min-height:0;
  display:flex;
  gap:5px;
}

button,a{
  flex:1;
  min-width:0;
  border-radius:8px;
  border:1px solid #555;
  background:#24242b;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-weight:900;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#start{
  background:#d53f63;
  border-color:#d53f63;
}

/* ===== アニメーション ===== */

@keyframes pop{
  0%{
    opacity:1;
    transform:translate(-50%,15px) scale(.8);
  }
  60%{
    opacity:1;
    transform:translate(-50%,-10px) scale(1.15);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-25px);
  }
}

@keyframes tipHit{
  0%,100%{
    transform:translate(0);
  }
  15%{
    transform:translate(-4px,2px) rotate(-5deg);
  }
  30%{
    transform:translate(4px,-2px) rotate(5deg);
  }
  45%{
    transform:translate(-3px,-2px);
  }
  60%{
    transform:translate(3px,2px);
    box-shadow:0 0 18px #fff;
  }
}

@keyframes patronIn{
  0%{
    transform:translateY(28px) scale(.5);
    opacity:0;
  }
  70%{
    transform:translateY(-4px) scale(1.08);
    opacity:1;
  }
  100%{
    transform:none;
    opacity:1;
  }
}
</style>
</head>

<body>

<div class="top">
  <div class="s">
    登録者数
    <b><span id="subs">3</span></b>
  </div>

  <div class="s">
    総再生数
    <b><span id="plays">12</span></b>
  </div>

  <div class="s">
    視聴者数
    <b><span id="viewers">0</span></b>
  </div>

  <div class="s">
    配信時間
    <b id="time">00:00</b>
  </div>
</div>


<div class="stageRow">

  <div class="stream">

    <div class="room">
      <div class="window"></div>
      <div class="shelf"></div>
      <div class="plant">🪴</div>
      <div class="phone"></div>
    </div>

    <div class="live">● LIVE</div>

    <div id="girl" class="girl">
      <img
        id="streamerPose"
        src="./assets/streamer_down.png?v=2"
        alt="配信者"
      >
    </div>

    <div class="likeOverlay">
      🖤 <span id="likes">0</span>
    </div>

    <div id="pop" class="pop">
      +1 視聴
    </div>

  </div>

</div>


<div class="superArea">

  <div id="patronbar" class="patronbar">
    <div class="patronhint">
      SUPER<br>CHAT
    </div>
  </div>

  <div class="tiptotal">
    投げ銭
    <b>¥<span id="tips">0</span></b>
  </div>

  <div class="tiprail">

    <div id="tip50" class="tipicon tip50">
      <span class="tipNum">50</span>
      <span class="tipYen">円</span>
    </div>

    <div id="tip100" class="tipicon tip100">
      <span class="tipNum">100</span>
      <span class="tipYen">円</span>
    </div>

    <div id="tip200" class="tipicon tip200">
      <span class="tipNum">200</span>
      <span class="tipYen">円</span>
    </div>

    <div id="tip300" class="tipicon tip300">
      <span class="tipNum">300</span>
      <span class="tipYen">円</span>
    </div>

    <div id="tip500" class="tipicon tip500">
      <span class="tipNum">500</span>
      <span class="tipYen">円</span>
    </div>

  </div>

</div>


<div class="chat">

  <div class="chatTitle">
    コメント
  </div>

  <div id="comments" class="comments"></div>

</div>


<div class="panel">

  <div class="bar">
    <div id="fill" class="fill"></div>
  </div>

  <div class="controls">
    <a href="./top.html">戻る</a>
    <button id="sound">SE ON</button>
    <button id="start">配信開始</button>
  </div>

</div>


<script src="./js/stream-patrons.js?v=1"></script>
<script src="./js/stream-comments.js?v=1"></script>

<script>
const $=x=>document.getElementById(x);

let running=false;
let raw=0;
let moves=0;
let subs=3;
let plays=12;
let likes=0;
let tips=0;
let viewers=0;
let startAt=0;
let timer=null;
let last=0;
let smooth=0;
let audio=null;
let sound=true;
let pose=false;


function tone(f){

  if(!sound||!audio)return;

  let o=audio.createOscillator();
  let g=audio.createGain();

  o.frequency.value=f;
  g.gain.value=.025;

  o.connect(g);
  g.connect(audio.destination);

  o.start();

  g.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.1
  );

  o.stop(audio.currentTime+.1);
}


function anonName(){

  return '視聴者***'+
    String(
      Math.floor(Math.random()*90)+10
    );
}


function addComment(
  t,
  name=anonName(),
  superAmount=0
){

  let d=document.createElement('div');

  d.className=
    'comment'+
    (
      superAmount
        ?' superchat sc'+superAmount
        :''
    );

  let n=document.createElement('span');

  n.className='commentName';
  n.textContent=name;

  let msg=document.createElement('span');

  msg.textContent=t;

  d.append(n,msg);

  $('comments').appendChild(d);

  $('comments').scrollTop=
    $('comments').scrollHeight;
}


function superChat(result){

  let p=result.patron;
  let amount=result.amount;
  let icon=$('tip'+amount);

  icon.classList.remove('hit');

  void icon.offsetWidth;

  icon.classList.add('hit');

  let badge=document.createElement('div');

  badge.className=
    'patronicon sc'+amount;

  badge.textContent=
    p.name+'\n¥'+amount;

  $('patronbar').appendChild(badge);

  let badges=
    $('patronbar')
      .querySelectorAll('.patronicon');

  if(badges.length>6){
    badges[0].remove();
  }

  setTimeout(
    ()=>{
      if(badge.isConnected){
        badge.remove();
      }
    },
    6500
  );

  addComment(
    p.name+
    'さんが¥'+
    amount+
    'スパチャしました',
    p.name,
    amount
  );

  addComment(
    result.line,
    p.name,
    amount
  );
}


function action(){

  raw++;

  $('fill').style.width=
    (raw%6)/6*100+'%';

  pose=!pose;

  $('streamerPose').src=
    pose
      ?'./assets/streamer_up.png?v=1'
      :'./assets/streamer_down.png?v=1';

  if(raw%6)return;

  moves++;
  plays++;

  $('plays').textContent=plays;

  $('fill').style.width='100%';

  if(Math.random()<.55){

    likes++;

    $('likes').textContent=likes;

    show('+1 いいね');
  }

  if(Math.random()<.95){

    viewers++;

    $('viewers').textContent=viewers;

    show('+1 視聴者');
  }

  if(
    Math.random()<.80 &&
    viewers>=1
  ){

    subs++;

    $('subs').textContent=subs;

    show('+1 登録');
  }

  if(
    Math.random()<.75 &&
    subs>=1
  ){

    let result=
      StreamPatrons.tip(
        StreamPatrons.pick()
      );

    let p=result.patron;
    let amount=result.amount;

    tips+=amount;

    $('tips').textContent=tips;

    show(
      p.name+
      ' ¥'+
      amount
    );

    superChat(result);
  }

  if(Math.random()<.38){

    addComment(
      StreamComments.random()
    );
  }

  tone(520);

  setTimeout(
    ()=>$('fill').style.width='0%',
    180
  );
}


function show(t){

  $('pop').textContent=t;

  $('pop').classList.remove('go');

  void $('pop').offsetWidth;

  $('pop').classList.add('go');
}


function motion(e){

  if(!running)return;

  let a=
    e.accelerationIncludingGravity;

  if(!a)return;

  let m=
    Math.sqrt(
      (a.x||0)**2+
      (a.y||0)**2+
      (a.z||0)**2
    );

  smooth=
    smooth*.73+
    m*.27;

  let n=performance.now();

  if(
    Math.abs(m-smooth)>1.7 &&
    n-last>330
  ){

    last=n;

    action();
  }
}


function clock(){

  let s=
    Math.floor(
      (Date.now()-startAt)/1000
    );

  $('time').textContent=
    String(
      Math.floor(s/60)
    ).padStart(2,'0')
    +':'+
    String(
      s%60
    ).padStart(2,'0');
}


$('start').onclick=async()=>{

  if(!audio){

    audio=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();
  }

  if(
    typeof DeviceMotionEvent!='undefined' &&
    typeof DeviceMotionEvent.requestPermission==='function'
  ){

    try{

      if(
        await DeviceMotionEvent.requestPermission()
        !=='granted'
      ){
        return;
      }

    }catch(e){

      return;
    }
  }

  if(!running){

    running=true;

    if(!startAt){
      startAt=Date.now();
    }

    timer=
      setInterval(
        clock,
        500
      );

    window.addEventListener(
      'devicemotion',
      motion
    );

    $('start').textContent='停止';

    viewers=
      Math.max(
        1,
        viewers
      );

    $('viewers').textContent=
      viewers;

    addComment(
      '配信始まった',
      '視聴者***'
    );

  }else{

    running=false;

    clearInterval(timer);

    window.removeEventListener(
      'devicemotion',
      motion
    );

    $('start').textContent='再開';
  }
};


$('sound').onclick=()=>{

  sound=!sound;

  $('sound').textContent=
    sound
      ?'SE ON'
      :'SE OFF';
};
</script>

</body>
</html>
