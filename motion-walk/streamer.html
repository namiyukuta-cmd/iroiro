<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>底辺エアロビ配信</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101014;color:#f8f5ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{height:100dvh;display:flex;flex-direction:column}.top{height:9%;padding:2px 3px;background:#17171e;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;align-items:center;border-bottom:1px solid #444}.s{font-size:11px;color:#aaa;text-align:center;line-height:1.05}.s b{display:block;font-size:19px;line-height:1.05;color:#fff}.patronrow{height:58px;display:flex;background:#111118;border-bottom:1px solid #333}.patronbar{flex:1;padding:5px 5px 5px 8px;display:flex;gap:4px;align-items:center;overflow:hidden}.tiptotal{width:62px;flex:0 0 62px;border-left:1px solid #333;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#aaa}.tiptotal b{font-size:14px;color:#ffd46d}.patronhint{font-size:9px;color:#777;width:34px;flex:0 0 34px}.patronicon{width:48px;height:48px;flex:0 0 48px;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;font-size:10px;font-weight:900;color:#fff;line-height:1.1;box-shadow:0 0 0 2px #fff4;animation:patronIn .35s ease-out}.stageRow{height:38%;display:flex;background:#0d0d12;border-bottom:1px solid #333}.stream{flex:1;position:relative;overflow:hidden;background:linear-gradient(#e9dfd0 0 70%,#b8a98f 70%)}.room{position:absolute;inset:0}.window{position:absolute;left:7%;top:8%;width:27%;height:29%;background:#95b8c7;border:7px solid #eee;box-shadow:0 0 0 2px #9a8e7c}.shelf{position:absolute;right:5%;top:14%;width:24%;height:7px;background:#765e49;box-shadow:0 38px #765e49}.plant{position:absolute;right:10%;bottom:28%;font-size:38px}.phone{position:absolute;right:7%;bottom:7%;width:20px;height:62px;background:#24242a;border-radius:5px;box-shadow:0 0 0 3px #555}.girl{position:absolute;left:50%;bottom:3%;width:110px;height:220px;transform:translateX(-50%) scale(.82);transform-origin:50% 100%}.girl img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}.live{position:absolute;left:8px;top:8px;background:#e73359;border-radius:5px;padding:4px 6px;font-size:10px;font-weight:900}.pop{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:21px;font-weight:900;text-shadow:0 2px 4px #000;color:#fff;opacity:0}.pop.go{animation:pop .7s}.tiprail{width:60px;flex:0 0 60px;background:#17171e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tipicon{width:48px;height:48px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;border:2px solid #ffffff35}.tipicon.hit{animation:tipHit .65s ease}.tip50,.sc50{background:#58718d}.tip100,.sc100{background:#2c8c68}.tip200,.sc200{background:#3977c9}.tip300,.sc300{background:#9b54b7}.tip500,.sc500{background:#d04b57}.chat{height:24%;background:#0e0e13;border-bottom:1px solid #333;display:flex;flex-direction:column}.chatTitle{height:24px;padding:5px 9px;font-size:10px;font-weight:800;color:#aaa;border-bottom:1px solid #292931}.comments{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:5px 8px;user-select:text}.comment{padding:5px 7px;border-bottom:1px solid #26262d;font-size:13px;line-height:1.25}.commentName{font-size:10px;color:#a9a9b4;font-weight:800;margin-right:6px}.comment.superchat{margin:4px 0;border:0;border-radius:7px;color:#fff;padding:7px}.comment.superchat .commentName{color:#fff}.panel{height:calc(29% - 58px);min-height:145px;padding:7px 10px;background:#121217;display:flex;flex-direction:column;gap:5px}.goal{font-size:10px;display:flex;justify-content:space-between}.bar{height:8px;background:#292931;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#e25a78;transition:width .15s}.log{height:30px;padding:5px;background:#09090c;border:1px solid #333;color:#c8c8ce;font-size:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.box{border:1px solid #383841;padding:4px;text-align:center;font-size:9px}.box b{display:block;font-size:13px;color:#ffd46d}.controls{display:flex;gap:5px;margin-top:auto}button,a{flex:1;padding:8px 4px;border-radius:8px;border:1px solid #555;background:#24242b;color:#fff;text-align:center;text-decoration:none;font-weight:800;font-size:11px}#start{background:#d53f63;border-color:#d53f63}@keyframes pop{0%{opacity:1;transform:translate(-50%,15px) scale(.8)}60%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-25px)}}@keyframes tipHit{0%,100%{transform:translate(0)}15%{transform:translate(-4px,2px) rotate(-5deg)}30%{transform:translate(4px,-2px) rotate(5deg)}45%{transform:translate(-3px,-2px)}60%{transform:translate(3px,2px);box-shadow:0 0 18px #fff}}@keyframes patronIn{0%{transform:translateY(28px) scale(.5);opacity:0}70%{transform:translateY(-4px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}</style></head>
<body><div class="top"><div class="s">登録者数<b><span id="subs">3</span></b></div><div class="s">総再生数<b><span id="plays">12</span></b></div><div class="s">視聴者数<b><span id="viewers">0</span></b></div><div class="s">配信時間<b id="time">00:00</b></div></div>
<div class="patronrow"><div id="patronbar" class="patronbar"><div class="patronhint">SUPER<br>CHAT</div></div><div class="tiptotal">投げ銭<b>¥<span id="tips">0</span></b></div></div>
<div class="stageRow"><div class="stream"><div class="room"><div class="window"></div><div class="shelf"></div><div class="plant">🪴</div><div class="phone"></div></div><div class="live">● LIVE</div><div id="girl" class="girl"><img id="streamerPose" src="./assets/streamer_down.png?v=2" alt="配信者"></div><div id="pop" class="pop">+1 視聴</div></div><div class="tiprail"><div id="tip50" class="tipicon tip50">¥50</div><div id="tip100" class="tipicon tip100">¥100</div><div id="tip200" class="tipicon tip200">¥200</div><div id="tip300" class="tipicon tip300">¥300</div><div id="tip500" class="tipicon tip500">¥500</div></div></div>
<div class="chat"><div class="chatTitle">コメント</div><div id="comments" class="comments"></div></div>
<div class="panel"><div class="bar"><div id="fill" class="fill"></div></div><div class="stats"><div class="box">今日の運動<b id="moves">0</b></div><div class="box">いいね<b id="likes">0</b></div></div><div class="controls"><a href="./top.html">戻る</a><button id="sound">SE ON</button><button id="start">配信開始</button></div></div>
<script src="./js/stream-patrons.js?v=1"></script><script src="./js/stream-comments.js?v=1"></script><script>const $=x=>document.getElementById(x);let running=false,raw=0,moves=0,subs=3,plays=12,likes=0,tips=0,viewers=0,startAt=0,timer=null,last=0,smooth=0,audio=null,sound=true,pose=false;function tone(f){if(!sound||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);o.stop(audio.currentTime+.1)}function anonName(){return '視聴者***'+String(Math.floor(Math.random()*90)+10)}function addComment(t,name=anonName(),superAmount=0){let d=document.createElement('div');d.className='comment'+(superAmount?' superchat sc'+superAmount:'');let n=document.createElement('span');n.className='commentName';n.textContent=name;let msg=document.createElement('span');msg.textContent=t;d.append(n,msg);$('comments').appendChild(d);$('comments').scrollTop=$('comments').scrollHeight}function superChat(result){let p=result.patron,amount=result.amount,icon=$('tip'+amount);icon.classList.remove('hit');void icon.offsetWidth;icon.classList.add('hit');let badge=document.createElement('div');badge.className='patronicon sc'+amount;badge.textContent=p.name+'\n¥'+amount;$('patronbar').appendChild(badge);let badges=$('patronbar').querySelectorAll('.patronicon');if(badges.length>6)badges[0].remove();setTimeout(()=>{if(badge.isConnected)badge.remove()},6500);addComment(p.name+'さんが¥'+amount+'スパチャしました',p.name,amount);addComment(result.line,p.name,amount)}function action(){raw++;$('fill').style.width=(raw%6)/6*100+'%';pose=!pose;$('streamerPose').src=pose?'./assets/streamer_up.png?v=1':'./assets/streamer_down.png?v=1';if(raw%6)return;moves++;plays++;$('moves').textContent=moves;$('plays').textContent=plays;$('fill').style.width='100%';let r=Math.random();if(r<.55){likes++;$('likes').textContent=likes;show('+1 いいね')}if(Math.random()<.95){viewers++;$('viewers').textContent=viewers;show('+1 視聴者')}if(Math.random()<.80&&viewers>=1){subs++;$('subs').textContent=subs;show('+1 登録')}if(Math.random()<.75&&subs>=1){let result=StreamPatrons.tip(StreamPatrons.pick()),p=result.patron,amount=result.amount;tips+=amount;$('tips').textContent=tips;show(p.name+' ¥'+amount);superChat(result);}if(Math.random()<.38)addComment(StreamComments.random());tone(520);setTimeout(()=>$('fill').style.width='0%',180)}function show(t){$('pop').textContent=t;$('pop').classList.remove('go');void $('pop').offsetWidth;$('pop').classList.add('go')}function motion(e){if(!running)return;let a=e.accelerationIncludingGravity;if(!a)return;let m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);smooth=smooth*.73+m*.27;let n=performance.now();if(Math.abs(m-smooth)>1.7&&n-last>330){last=n;action()}}function clock(){let s=Math.floor((Date.now()-startAt)/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')} $('start').onclick=async()=>{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(typeof DeviceMotionEvent!='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){try{if(await DeviceMotionEvent.requestPermission()!=='granted')return}catch(e){return}}if(!running){running=true;if(!startAt)startAt=Date.now();timer=setInterval(clock,500);window.addEventListener('devicemotion',motion);$('start').textContent='停止';viewers=Math.max(1,viewers);$('viewers').textContent=viewers;addComment('配信始まった','視聴者***');}else{running=false;clearInterval(timer);window.removeEventListener('devicemotion',motion);$('start').textContent='再開';}};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'SE ON':'SE OFF'};</script></body></html>
