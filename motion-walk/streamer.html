<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>底辺エアロビ配信</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101014;color:#f8f5ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{height:100dvh;display:flex;flex-direction:column}.top{height:12%;padding:10px 14px;background:#17171e;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #444}.s{font-size:11px;color:#aaa}.s b{display:block;font-size:19px;color:#fff}.stream{height:55%;position:relative;overflow:hidden;background:linear-gradient(#e9dfd0 0 70%,#b8a98f 70%)}.room{position:absolute;inset:0}.window{position:absolute;left:7%;top:8%;width:27%;height:29%;background:#95b8c7;border:7px solid #eee;box-shadow:0 0 0 2px #9a8e7c}.shelf{position:absolute;right:5%;top:14%;width:24%;height:7px;background:#765e49;box-shadow:0 38px #765e49}.plant{position:absolute;right:10%;bottom:28%;font-size:50px}.phone{position:absolute;right:7%;bottom:7%;width:25px;height:78px;background:#24242a;border-radius:5px;box-shadow:0 0 0 3px #555}.phone:after{content:"";position:absolute;left:10px;top:78px;width:5px;height:70px;background:#444}.girl{position:absolute;left:50%;bottom:12%;width:120px;height:245px;transform:translateX(-50%);transform-origin:50% 100%}.head{position:absolute;left:35px;top:0;width:52px;height:58px;border-radius:50%;background:#ddb58f;border:4px solid #3a2c2b}.hair{position:absolute;left:28px;top:-6px;width:68px;height:70px;border-radius:48% 48% 40% 40%;background:#49312f;z-index:-1}.body{position:absolute;left:26px;top:53px;width:70px;height:90px;background:#d35c70;border-radius:16px 16px 8px 8px;border:4px solid #382d2d}.arm{position:absolute;top:65px;width:24px;height:100px;background:#ddb58f;border:4px solid #382d2d;border-radius:14px;transform-origin:50% 8px}.arm.l{left:8px}.arm.r{right:5px}.leg{position:absolute;top:136px;width:31px;height:105px;background:#333c52;border:4px solid #382d2d;border-radius:8px}.leg.l{left:28px}.leg.r{right:24px}.girl.move1 .arm.l{transform:rotate(145deg)}.girl.move1 .arm.r{transform:rotate(-145deg)}.girl.move1 .leg.l{transform:rotate(9deg)}.girl.move1 .leg.r{transform:rotate(-9deg)}.girl.move2 .arm.l{transform:rotate(65deg)}.girl.move2 .arm.r{transform:rotate(-65deg)}.girl.move2{transform:translateX(-50%) translateY(-8px)}.live{position:absolute;left:12px;top:12px;background:#e73359;border-radius:5px;padding:5px 8px;font-size:12px;font-weight:900}.view{position:absolute;right:12px;top:12px;background:#0009;border-radius:5px;padding:5px 8px;font-size:12px}.comments{position:absolute;left:12px;right:12px;bottom:8px;height:82px;display:flex;flex-direction:column;justify-content:end;gap:3px;pointer-events:none}.comment{width:max-content;max-width:85%;padding:4px 8px;background:#0009;border-radius:12px;font-size:11px}.pop{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:24px;font-weight:900;text-shadow:0 2px 4px #000;color:#fff;opacity:0}.pop.go{animation:pop .7s}@keyframes pop{0%{opacity:1;transform:translate(-50%,15px) scale(.8)}60%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-25px)}}.panel{height:33%;padding:9px 12px;background:#121217;display:flex;flex-direction:column;gap:7px}.goal{font-size:12px;display:flex;justify-content:space-between}.bar{height:11px;background:#292931;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#e25a78;transition:width .15s}.log{height:43px;padding:7px;background:#09090c;border:1px solid #333;color:#c8c8ce;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.box{border:1px solid #383841;padding:7px;text-align:center;font-size:10px}.box b{display:block;font-size:16px;color:#ffd46d}.controls{display:flex;gap:7px;margin-top:auto}button,a{flex:1;padding:11px 5px;border-radius:9px;border:1px solid #555;background:#24242b;color:#fff;text-align:center;text-decoration:none;font-weight:800;font-size:12px}#start{background:#d53f63;border-color:#d53f63}</style></head>
<body><div class="top"><div class="s">登録者<b><span id="subs">3</span>人</b></div><div class="s">総再生数<b><span id="plays">12</span></b></div><div class="s">配信時間<b id="time">00:00</b></div></div>
<div class="stream"><div class="room"><div class="window"></div><div class="shelf"></div><div class="plant">🪴</div><div class="phone"></div></div><div class="live">● LIVE</div><div class="view">視聴者 <span id="viewers">0</span></div><div id="girl" class="girl"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div><div id="pop" class="pop">+1 視聴</div><div id="comments" class="comments"></div></div>
<div class="panel"><div class="goal"><b>エアロビ継続</b><span>次の反応まで <span id="need">6</span>動作</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="log" class="log">配信開始を押して、スマホを持って身体を動かそう。</div><div class="stats"><div class="box">今日の運動<b id="moves">0</b></div><div class="box">いいね<b id="likes">0</b></div><div class="box">投げ銭<b>¥<span id="tips">0</span></b></div></div><div class="controls"><a href="./top.html">戻る</a><button id="sound">SE ON</button><button id="start">配信開始</button></div></div>
<script>const $=x=>document.getElementById(x);let running=false,raw=0,moves=0,subs=3,plays=12,likes=0,tips=0,viewers=0,startAt=0,timer=null,last=0,smooth=0,audio=null,sound=true,pose=false;const comments=['誰だこの配信','がんばれー','動き独特で草','今日も来た','意外と運動になる','あとちょっと！','初見です'];function tone(f){if(!sound||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);o.stop(audio.currentTime+.1)}function addComment(t){let d=document.createElement('div');d.className='comment';d.textContent=t;$('comments').appendChild(d);while($('comments').children.length>3)$('comments').firstChild.remove()}function action(){raw++;$('fill').style.width=(raw%6)/6*100+'%';$('need').textContent=6-(raw%6||0);pose=!pose;$('girl').className='girl '+(pose?'move1':'move2');if(raw%6)return;moves++;plays++;$('moves').textContent=moves;$('plays').textContent=plays;$('fill').style.width='100%';let r=Math.random();if(r<.55){likes++;$('likes').textContent=likes;show('+1 いいね')}if(r<.22){viewers++;$('viewers').textContent=viewers;show('+1 視聴者')}if(r<.10){subs++;$('subs').textContent=subs;show('+1 登録')}if(r<.04){tips+=100;$('tips').textContent=tips;show('¥100 投げ銭！')}if(Math.random()<.38)addComment(comments[Math.floor(Math.random()*comments.length)]);$('log').textContent='エアロビ継続中。身体の動きが配信の反応につながる。';tone(520);setTimeout(()=>$('fill').style.width='0%',180)}function show(t){$('pop').textContent=t;$('pop').classList.remove('go');void $('pop').offsetWidth;$('pop').classList.add('go')}function motion(e){if(!running)return;let a=e.accelerationIncludingGravity;if(!a)return;let m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);smooth=smooth*.73+m*.27;let n=performance.now();if(Math.abs(m-smooth)>1.7&&n-last>330){last=n;action()}}function clock(){let s=Math.floor((Date.now()-startAt)/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')} $('start').onclick=async()=>{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(typeof DeviceMotionEvent!='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){try{if(await DeviceMotionEvent.requestPermission()!=='granted')return}catch(e){$('log').textContent='モーションセンサーを許可してください';return}}if(!running){running=true;if(!startAt)startAt=Date.now();timer=setInterval(clock,500);window.addEventListener('devicemotion',motion);$('start').textContent='停止';viewers=Math.max(1,viewers);$('viewers').textContent=viewers;addComment('配信始まった');$('log').textContent='LIVE配信中。エアロビ開始！'}else{running=false;clearInterval(timer);window.removeEventListener('devicemotion',motion);$('start').textContent='再開';$('log').textContent='配信停止中'}};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'SE ON':'SE OFF'};</script></body></html>
