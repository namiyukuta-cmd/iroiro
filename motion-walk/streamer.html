<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>底辺エアロビ配信</title>

<link rel="stylesheet" href="./css/streamer.css?v=13">
</head>

<body>

<!-- 配信情報 -->
<div class="top">
  <div class="s">登録者<b id="subs">3</b></div>
  <div class="s">再生数<b id="plays">12</b></div>
  <div class="s">視聴者<b id="viewers">0</b></div>
  <div class="s">配信時間<b id="time">00:00</b></div>
</div>

<!-- 配信画面 -->
<div class="stageRow">
  <div class="stream">
    <div class="room">
      <div class="window"></div>
      <div class="shelf"></div>
      <div class="plant">🪴</div>
      <div class="phone"></div>
    </div>

    <div class="live">LIVE</div>

    <div class="girl">
      <img id="streamerPose" src="./assets/streamer_down.png?v=1" alt="">
    </div>

    <div class="likeOverlay">♥ <span id="likes">0</span></div>

    <div id="pop" class="pop"></div>
  </div>
</div>

<!-- コメント者ごとに固定した色 -->
<div id="commenterRail" class="tiprail" aria-label="常連コメント者"></div>
<div class="superArea">
  <div class="activitySummary">
    <div id="patronbar" class="patronbar">コメントを待っています</div>
    <div>今回の動作 <b id="exerciseCount">0</b>回</div>
    <div id="sessionResult" role="status">収益は停止時に確定（1動作＝10円）</div>
  </div>
  <div class="tiptotal">確定収益<b>¥<span id="tips">0</span></b></div>
</div>

<!-- コメント -->
<div class="chat">
  <div class="chatTitle">コメント</div>
  <div id="comments" class="comments"></div>
</div>

<!-- 6動作進行 -->
<div class="bar">
  <div id="fill" class="fill"></div>
</div>

<!-- 操作 -->
<div class="panel">
  <div class="controls">
    <a href="./top.html">戻る</a>
    <button id="sound" type="button">SE ON</button>
    <button id="cameraMode" type="button">カメラ</button>
    <button id="start" type="button">配信開始</button>
  </div>
</div>

<video id="cameraVideo" playsinline muted></video>

<!-- データ・ゲーム処理 -->
<script src="./js/stream-patrons.js?v=2"></script>
<script src="./js/stream-comments.js?v=2"></script>
<script src="./js/streamer-game.js?v=4"></script>

</body>
</html>
