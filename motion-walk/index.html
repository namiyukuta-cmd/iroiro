<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noarchive">
<title>うごく探索</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151812;color:#f4f0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
button{font:inherit}
#app{width:100%;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;background:linear-gradient(#1d2117,#12150f)}
header{padding:max(10px,env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid #454936;background:#202419}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:18px;margin:0;letter-spacing:.04em}
.status{font-size:12px;padding:5px 9px;border:1px solid #666b4c;border-radius:999px;background:#2b3021}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stat{background:#171a13;border:1px solid #3d4231;border-radius:10px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{font-size:10px;color:#bfc3aa}
main{position:relative;overflow:hidden;min-height:0}
#world{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#100d25 0 45%,#20183d 45% 58%,#080a13 58% 100%);perspective:520px}
#road{position:absolute;left:28%;right:28%;top:38%;height:100%;background:linear-gradient(90deg,#161826,#303244 5%,#202333 48%,#b62cff 49% 51%,#202333 52%,#303244 95%,#161826);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);transform-origin:50% 0;will-change:transform}
#scenery{position:absolute;inset:0;will-change:transform;overflow:hidden}
.building{position:absolute;bottom:-8%;width:20%;border:2px solid #111522;background:linear-gradient(135deg,#242842,#111424);box-shadow:inset 0 0 0 1px #343858}
.building:before{content:"";position:absolute;inset:8% 12%;background:repeating-linear-gradient(0deg,transparent 0 15px,#25e6ff 16px 19px,transparent 20px 31px),repeating-linear-gradient(90deg,transparent 0 18px,#ff35cb 19px 22px,transparent 23px 38px);opacity:.65}
.neon{position:absolute;padding:4px 7px;border:1px solid currentColor;background:#0b0d18d9;font-size:9px;font-weight:800;letter-spacing:.12em;box-shadow:0 0 8px currentColor;text-shadow:0 0 5px currentColor;transform:skewY(-4deg)}
.skybridge{position:absolute;height:8px;background:#242943;border:1px solid #555d80;box-shadow:0 0 8px #2ad9ff66}
#horizonGlow{position:absolute;left:30%;right:30%;top:31%;height:30%;background:radial-gradient(ellipse,#cf35ff55 0,#1b9dff22 35%,transparent 70%);filter:blur(8px)}
#cityLines{position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,#45eaff33 50%,transparent 50.3%);pointer-events:none}
.tower{position:absolute;bottom:39%;background:#14182b;border:1px solid #333a5d;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);box-shadow:0 0 14px #000}
.tower:after{content:"";position:absolute;inset:7px;background:repeating-linear-gradient(0deg,#23dcff55 0 2px,transparent 2px 11px)}
.antenna{position:absolute;width:2px;background:#ff37cf;box-shadow:0 0 7px #ff37cf}
.lamp{position:absolute;width:5px;height:5px;border-radius:50%;background:#40edff;box-shadow:0 0 9px #40edff}
.pipe{position:absolute;height:5px;background:#3c4055;border:1px solid #111522}
.vendor{position:absolute;width:54px;height:34px;background:#262139;border:2px solid #ff37cf;box-shadow:0 0 10px #ff37cf55}
.vendor:before{content:"";position:absolute;left:-4px;right:-4px;top:-10px;height:9px;background:repeating-linear-gradient(90deg,#25e6ff 0 8px,#ff35cb 8px 16px)}
.crate{position:absolute;width:18px;height:14px;background:#4a3c35;border:2px solid #191513}
.drone{position:absolute;width:22px;height:7px;border-radius:6px;background:#373d58;border:1px solid #58eaff;box-shadow:0 0 8px #58eaff}
.drone:before,.drone:after{content:"";position:absolute;top:2px;width:8px;height:2px;background:#ff3dc8}
.drone:before{left:-7px}.drone:after{right:-7px}
.cable{position:absolute;height:1px;background:#586078;transform-origin:left center}
.roadmark{position:absolute;width:4px;height:18px;background:#58eaff88;box-shadow:0 0 5px #58eaff}
#player{position:absolute;left:50%;top:62%;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;background:#8e62c9;border:3px solid #241d2e;box-shadow:0 4px 10px #0008;z-index:5}
#player:after{content:"";position:absolute;width:12px;height:8px;left:8px;top:-8px;border-radius:50% 50% 0 0;background:#8e62c9;border:3px solid #241d2e;border-bottom:0}
#pulse{position:absolute;left:50%;top:62%;width:34px;height:34px;border:2px solid #f6efd0;border-radius:50%;transform:translate(-50%,-50%) scale(1);opacity:0;z-index:4;pointer-events:none}
#pulse.go{animation:pulse .35s ease-out}
@keyframes droneFloat{from{transform:translateY(-3px)}to{transform:translateY(5px)}}
@keyframes pulse{0%{opacity:.9;transform:translate(-50%,-50%) scale(.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
#soundBtn{position:absolute;left:12px;top:12px;z-index:12;border:1px solid #666b4c;background:#202419;color:#f4f0df;border-radius:10px;padding:8px 10px;font-size:12px}
#cameraBtn{position:absolute;right:12px;top:12px;z-index:12;border:1px solid #666b4c;background:#202419;color:#f4f0df;border-radius:10px;padding:8px 10px;font-size:12px}
#cameraBox{position:absolute;right:12px;top:54px;width:140px;height:190px;z-index:11;display:none;border:2px solid #666b4c;border-radius:12px;overflow:hidden;background:#000}
#cameraView{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#motionZone{position:absolute;left:18%;right:18%;top:12%;bottom:12%;border:2px dashed #f0e7c2;border-radius:10px;pointer-events:none}
#cameraMeter{position:absolute;left:6px;right:6px;bottom:6px;height:7px;border-radius:999px;background:#111a;overflow:hidden}
#cameraMeterFill{height:100%;width:0;background:#f0e7c2}
#message{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:86%;padding:7px 12px;border-radius:10px;background:#11150dcc;border:1px solid #4e543d;font-size:13px;text-align:center;z-index:8}
#jobHud{position:absolute;left:12px;right:12px;bottom:12px;z-index:9;background:#090b16dd;border:1px solid #35dff0;border-radius:10px;padding:8px 10px;font-size:11px;box-shadow:0 0 12px #20d9ff33}
#jobLine{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
#jobBar{height:7px;border-radius:999px;background:#24283a;overflow:hidden}
#jobFill{height:100%;width:0;background:linear-gradient(90deg,#25e6ff,#ff35cb)}
#jobPopup{position:absolute;inset:0;z-index:19;display:none;align-items:center;justify-content:center;padding:24px;background:#070914d9}
#jobCard{width:min(88vw,350px);border:1px solid #35dff0;background:#101426;padding:18px;border-radius:14px;box-shadow:0 0 24px #25e6ff44}
#jobCard small{color:#35dff0;letter-spacing:.12em}
#jobCard h2{font-size:20px;margin:8px 0}
#jobCard p{margin:7px 0;line-height:1.5}
#startPanel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#151812e8;z-index:20}
.panel{width:min(92vw,380px);background:#272c20;border:1px solid #61674b;border-radius:18px;padding:20px}
.panel h2{margin:0 0 10px;font-size:22px}
.panel p{margin:7px 0;color:#d4d7c2;font-size:14px;line-height:1.55}
.primary{width:100%;margin-top:15px;padding:14px;border:0;border-radius:13px;background:#f0e7c2;color:#1c1e17;font-weight:800;font-size:18px}
.smallnote{font-size:11px!important;color:#aeb39e!important}
footer{padding:9px 12px max(10px,env(safe-area-inset-bottom));background:#202419;border-top:1px solid #454936}
.goalrow{display:flex;align-items:center;gap:8px}
.bar{height:12px;flex:1;background:#11140e;border:1px solid #50563f;border-radius:999px;overflow:hidden}
#barFill{height:100%;width:0;background:#d8cf9a}
#goalText{min-width:84px;text-align:right;font-size:12px}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
#sensitivity{width:100%;accent-color:#d8cf9a}
#stopBtn{border:1px solid #5f654b;background:#181b14;color:#e9e5d4;border-radius:9px;padding:7px 12px}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="topline"><h1>うごく探索</h1><div id="sensorStatus" class="status">待機中</div></div>
  <div class="stats">
    <div class="stat"><b id="distanceCount">0.00</b><span>総運動 km</span></div>
    <div class="stat"><b id="moneyCount">0</b><span>所持金 円</span></div>
    <div class="stat"><b id="deliveryCount">0</b><span>配達完了</span></div>
    <div class="stat"><b id="timeCount">00:00</b><span>リアル運動時間</span></div>
  </div>
</header>

<main>
  <div id="world">
    <div id="horizonGlow"></div>
    <div id="road"></div>
    <div id="scenery"></div>
    <div id="cityLines"></div>
    <button id="soundBtn" type="button">SE OFF</button>
    <button id="cameraBtn" type="button">家事カメラ ON</button>
    <div id="cameraBox">
      <video id="cameraView" autoplay playsinline muted></video>
      <div id="motionZone"></div>
      <div id="cameraMeter"><div id="cameraMeterFill"></div></div>
    </div>
    <canvas id="motionCanvas" width="48" height="64" hidden></canvas>
    <div id="message">iPhoneを持って体を動かしてください</div>
    <div id="jobHud">
      <div id="jobLine"><span id="jobName">依頼待機中</span><b id="jobDistance">0.00 / 0.00 km</b></div>
      <div id="jobBar"><div id="jobFill"></div></div>
    </div>
    <div id="jobPopup"><div id="jobCard"><small>DELIVERY NETWORK</small><h2 id="jobPopupTitle">依頼が入った。</h2><p id="jobPopupText"></p></div></div>
    <div id="pulse"></div>
    <div id="player"></div>
  </div>

  <div id="startPanel">
    <div class="panel">
      <h2>動いたぶんだけ進む</h2>
      <p>その場の足踏みでも、軽いステップでもOKです。iPhoneが一定の揺れを感じると「うごき」として数えます。</p>
      <p>6回のうごきでゲーム内を1歩進みます。</p>
      <button id="startBtn" class="primary">ゲーム開始</button>
      <p class="smallnote">iPhoneでは最初に「動作と方向」への許可確認が出ることがあります。Safariでこのページを開いたまま使ってください。</p>
    </div>
  </div>
</main>

<footer>
  <div class="goalrow">
    <div class="bar"><div id="barFill"></div></div>
    <div id="goalText">次まで 6</div>
  </div>
  <div class="controls">
    <input id="sensitivity" type="range" min="8" max="28" value="17" aria-label="感度">
    <button id="stopBtn" type="button">停止</button>
  </div>
</footer>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const startPanel=$('startPanel');
const startBtn=$('startBtn');
const stopBtn=$('stopBtn');
const status=$('sensorStatus');
const moneyEl=$('moneyCount');
const deliveryEl=$('deliveryCount');
const jobHud=$('jobHud');
const jobName=$('jobName');
const jobDistanceEl=$('jobDistance');
const jobFill=$('jobFill');
const jobPopup=$('jobPopup');
const jobPopupTitle=$('jobPopupTitle');
const jobPopupText=$('jobPopupText');
const distanceEl=$('distanceCount');
const timeEl=$('timeCount');
const goalText=$('goalText');
const barFill=$('barFill');
const road=$('road');
const scenery=$('scenery');
const pulse=$('pulse');
const message=$('message');
const sensitivity=$('sensitivity');
const soundBtn=$('soundBtn');
const cameraBtn=$('cameraBtn');
const cameraView=$('cameraView');
const cameraBox=$('cameraBox');
const motionCanvas=$('motionCanvas');
const cameraMeterFill=$('cameraMeterFill');

let running=false;
let soundOn=false;
let audioCtx=null;
let rawMotions=0;
let gameSteps=0;
let totalMeters=0;
let money=0;
let deliveries=0;
let currentJob=null;
let jobMeters=0;
let jobActive=false;
let jobSequence=0;
const METERS_PER_GAME_STEP=7.5;
const jobs=[
  {item:'医療用ナノパック',from:'第9区診療所',to:'ネオン市場',km:.18,pay:48,client:'診療所員'},
  {item:'暗号化データケース',from:'NOVA端末局',to:'第3高架下',km:.24,pay:52,client:'フードの男'},
  {item:'交換用義肢パーツ',from:'機械街',to:'南ブロック工房',km:.31,pay:55,client:'整備士'},
  {item:'温かい食事パック',from:'24H屋台',to:'居住塔C-17',km:.14,pay:45,client:'住民'},
  {item:'冷却セル',from:'港湾倉庫',to:'NEXUS研究棟',km:.36,pay:58,client:'研究員'},
  {item:'旧型ドローン部品',from:'スクラップ市場',to:'第6修理区',km:.21,pay:50,client:'修理屋'},
  {item:'密封された小箱',from:'地下商店街',to:'雨路地42番',km:.27,pay:53,client:'依頼人'},
  {item:'合成繊維ロール',from:'工業区',to:'東区仕立屋',km:.33,pay:56,client:'店主'}
];
let lastImpulse=0;
let lastMag=null;
let smoothedDelta=0;
let roadOffset=0;
let sceneryOffset=0;
let wakeLock=null;
let activeMs=0;
let activeStartedAt=null;
let timerId=null;
let gameStarted=false;
let cameraStream=null;
let cameraMotionTimer=null;
let previousFrame=null;
let lastCameraImpulse=0;
const CAMERA_THRESHOLD=18;
const CAMERA_INTERVAL=180;
const CAMERA_REFRACTORY=420;
const MOTIONS_PER_STEP=6;

function audio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,duration=0.08,type='sine',gain=.06,slide=0){
  if(!soundOn)return;
  const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+duration);
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+duration);
}
function noise(duration=.09,gain=.045,cutoff=1800){
  if(!soundOn)return;
  const a=audio(),len=Math.ceil(a.sampleRate*duration),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;f.type='lowpass';f.frequency.value=cutoff;g.gain.value=gain;
  s.connect(f).connect(g).connect(a.destination);s.start();
}
const se={
  foot(){tone(115,.045,'sine',.025,-35)},
  encounter(){tone(150,.18,'sawtooth',.07,-70);setTimeout(()=>tone(85,.24,'square',.045,-30),90)},
  slash(){noise(.11,.055,3200);tone(760,.07,'sawtooth',.025,-560)},
  hit(){noise(.08,.065,650);tone(95,.09,'square',.035,-35)},
  evade(){noise(.075,.03,5000);tone(1100,.055,'sine',.018,-500)},
  chest(){tone(330,.06,'square',.025,100);setTimeout(()=>tone(520,.09,'sine',.035,180),70)},
  discover(){tone(660,.07,'sine',.035,160);setTimeout(()=>tone(990,.12,'sine',.035,180),80)},
  victory(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>tone(n,.14,'triangle',.045,20),i*90))}
};
function playBattleDemo(){
  se.encounter();
  setTimeout(()=>se.slash(),420);
  setTimeout(()=>se.hit(),610);
  setTimeout(()=>se.evade(),850);
  setTimeout(()=>se.slash(),1080);
  setTimeout(()=>se.victory(),1320);
}

const objects=[];
function buildScenery(){
  const blocks=[
    [1,34,25],[16,25,36],[79,28,31],[88,19,42],
    [3,13,48],[22,10,55],[70,12,51],[86,7,60]
  ];
  blocks.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='building';
    el.style.left=b[0]+'%';
    el.style.height=b[2]+'%';
    el.style.width=b[1]+'%';
    scenery.appendChild(el);
    objects.push(el);
  });
  const signs=[['NOVA',8,48,'#25e6ff'],['DELIVERY',73,43,'#ff35cb'],['24H',18,30,'#f5d84b'],['SECTOR 09',68,25,'#25e6ff']];
  signs.forEach(s=>{
    const el=document.createElement('div');
    el.className='neon';el.textContent=s[0];
    el.style.left=s[1]+'%';el.style.top=s[2]+'%';el.style.color=s[3];
    scenery.appendChild(el);
  });
  [[5,37,38],[62,33,34]].forEach(v=>{
    const el=document.createElement('div');el.className='skybridge';
    el.style.left=v[0]+'%';el.style.top=v[1]+'%';el.style.width=v[2]+'%';
    scenery.appendChild(el);
  });
  [[34,27,8,24],[45,22,7,19],[55,25,9,23]].forEach(v=>{
    const el=document.createElement('div');el.className='tower';
    el.style.left=v[0]+'%';el.style.width=v[2]+'%';el.style.height=v[3]+'%';scenery.appendChild(el);
  });
  [[39,17,8],[52,14,11],[63,20,7]].forEach(v=>{
    const el=document.createElement('div');el.className='antenna';
    el.style.left=v[0]+'%';el.style.top=v[1]+'%';el.style.height=v[2]+'%';scenery.appendChild(el);
  });
  [[31,55],[66,49],[12,61],[83,57],[42,41],[58,38]].forEach(v=>{
    const el=document.createElement('div');el.className='lamp';el.style.left=v[0]+'%';el.style.top=v[1]+'%';scenery.appendChild(el);
  });
  [[2,66,20],[78,69,18],[7,78,17]].forEach(v=>{
    const el=document.createElement('div');el.className='pipe';el.style.left=v[0]+'%';el.style.top=v[1]+'%';el.style.width=v[2]+'%';scenery.appendChild(el);
  });
  [[5,71],[82,75]].forEach(v=>{
    const el=document.createElement('div');el.className='vendor';el.style.left=v[0]+'%';el.style.top=v[1]+'%';scenery.appendChild(el);
  });
  [[15,82],[20,84],[76,85],[81,82]].forEach(v=>{
    const el=document.createElement('div');el.className='crate';el.style.left=v[0]+'%';el.style.top=v[1]+'%';scenery.appendChild(el);
  });
  [[24,22],[70,18],[61,31]].forEach((v,i)=>{
    const el=document.createElement('div');el.className='drone';el.style.left=v[0]+'%';el.style.top=v[1]+'%';el.style.animation='droneFloat '+(2.5+i*.5)+'s ease-in-out infinite alternate';scenery.appendChild(el);
  });
  for(let i=0;i<12;i++){
    const el=document.createElement('div');el.className='roadmark';
    el.style.left=(46+(i%2)*8)+'%';el.style.top=(58+i*4)+'%';scenery.appendChild(el);
  }
}
buildScenery();

function elapsedMs(){
  return activeMs+(running && activeStartedAt!==null ? performance.now()-activeStartedAt : 0);
}
function updateTime(){
  const total=Math.floor(elapsedMs()/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  timeEl.textContent=h>0 ? String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function updateUI(){
  distanceEl.textContent=(totalMeters/1000).toFixed(2);
  moneyEl.textContent=money;
  deliveryEl.textContent=deliveries;
  const rem=MOTIONS_PER_STEP-(rawMotions%MOTIONS_PER_STEP || (rawMotions===0?0:MOTIONS_PER_STEP));
  const inStep=rawMotions%MOTIONS_PER_STEP;
  barFill.style.width=((inStep/MOTIONS_PER_STEP)*100)+'%';
  goalText.textContent=inStep===0 ? '次まで '+MOTIONS_PER_STEP : '次まで '+(MOTIONS_PER_STEP-inStep);
  if(currentJob){
    jobName.textContent=currentJob.item+' → '+currentJob.to;
    jobDistanceEl.textContent=(jobMeters/1000).toFixed(2)+' / '+currentJob.km.toFixed(2)+' km';
    jobFill.style.width=Math.min(100,jobMeters/(currentJob.km*1000)*100)+'%';
  }else{
    jobName.textContent='依頼待機中';
    jobDistanceEl.textContent='0.00 / 0.00 km';
    jobFill.style.width='0%';
  }
}

function wait(ms){return new Promise(r=>setTimeout(r,ms));}
async function showNextJob(){
  if(!running)return;
  jobActive=false;
  currentJob=jobs[jobSequence++%jobs.length];
  jobMeters=0;
  updateUI();
  jobPopup.style.display='flex';
  jobPopupTitle.textContent='依頼が入った。';
  jobPopupText.textContent='';
  await wait(900);
  if(!running)return;
  jobPopupText.textContent=currentJob.from+'から「'+currentJob.item+'」を受け取った。';
  await wait(1300);
  if(!running)return;
  jobPopupText.textContent=currentJob.to+'まで配達。　報酬 '+currentJob.pay+'円';
  await wait(1500);
  if(!running)return;
  jobPopupTitle.textContent='配達開始';
  await wait(650);
  if(!running)return;
  jobPopup.style.display='none';
  jobMeters=0;
  jobActive=true;
  updateUI();
}
async function finishJob(){
  if(!jobActive || !currentJob)return;
  jobActive=false;
  jobMeters=currentJob.km*1000;
  updateUI();
  jobPopup.style.display='flex';
  jobPopupTitle.textContent='到着';
  jobPopupText.textContent=currentJob.client+'「ありがとう」';
  se.discover();
  await wait(1100);
  if(!running)return;
  money+=currentJob.pay;
  deliveries++;
  jobPopupTitle.textContent='配達完了';
  jobPopupText.textContent='無事に配達が終わった。　+'+currentJob.pay+'円';
  updateUI();
  await wait(1400);
  if(!running)return;
  currentJob=null;
  jobPopup.style.display='none';
  updateUI();
  await wait(700);
  if(running)showNextJob();
}

function animateStep(){
  se.foot();
  roadOffset=(roadOffset+34)%52;
  sceneryOffset=(sceneryOffset+3)%36;
  road.style.transform='translateY('+roadOffset+'px)';
  scenery.style.transform='translateY('+sceneryOffset+'px) scale('+(1+Math.min(gameSteps,60)*0.0015)+')';
  pulse.classList.remove('go');
  void pulse.offsetWidth;
  pulse.classList.add('go');

  if(gameSteps%24===0){
    message.textContent='敵が現れた！';
    playBattleDemo();
    setTimeout(()=>{ if(running) message.textContent='敵を倒した！'; },1750);
    setTimeout(()=>{ if(running) message.textContent='そのまま動くと先へ進みます'; },2700);
  }else if(gameSteps%15===0){
    message.textContent='何かを発見した！';
    se.discover();
    setTimeout(()=>{ if(running) message.textContent='そのまま動くと先へ進みます'; },1200);
  }else if(gameSteps%10===0){
    message.textContent=gameSteps+'歩進みました';
    setTimeout(()=>{ if(running) message.textContent='そのまま動くと先へ進みます'; },1200);
  }
}

function registerMotion(){
  rawMotions++;
  if(rawMotions%MOTIONS_PER_STEP===0){
    gameSteps++;
    totalMeters+=METERS_PER_GAME_STEP;
    if(jobActive && currentJob){
      jobMeters+=METERS_PER_GAME_STEP;
      if(jobMeters>=currentJob.km*1000) finishJob();
    }
    animateStep();
    try{ if(navigator.vibrate) navigator.vibrate(25); }catch(e){}
  }
  updateUI();
}

function motionHandler(e){
  if(!running)return;
  const a=e.acceleration;
  const g=e.accelerationIncludingGravity;
  let mag=0;

  if(a && [a.x,a.y,a.z].every(v=>typeof v==='number')){
    mag=Math.hypot(a.x,a.y,a.z);
  }else if(g && [g.x,g.y,g.z].every(v=>typeof v==='number')){
    const gm=Math.hypot(g.x,g.y,g.z);
    if(lastMag===null){lastMag=gm;return;}
    mag=Math.abs(gm-lastMag)*3;
    lastMag=gm;
  }else{
    return;
  }

  smoothedDelta=smoothedDelta*0.73+mag*0.27;
  const threshold=Number(sensitivity.value)/10;
  const now=performance.now();

  if(smoothedDelta>threshold && now-lastImpulse>330){
    lastImpulse=now;
    registerMotion();
  }
}

function stopCameraMotion(){
  clearInterval(cameraMotionTimer);
  cameraMotionTimer=null;
  previousFrame=null;
  cameraMeterFill.style.width='0%';
}

function analyzeCameraMotion(){
  if(!cameraStream || cameraView.readyState<2)return;
  const ctx=motionCanvas.getContext('2d',{willReadFrequently:true});
  const w=motionCanvas.width,h=motionCanvas.height;
  ctx.save();
  ctx.translate(w,0);ctx.scale(-1,1);
  ctx.drawImage(cameraView,0,0,w,h);
  ctx.restore();
  const frame=ctx.getImageData(0,0,w,h).data;
  if(!previousFrame){previousFrame=new Uint8ClampedArray(frame);return;}
  const x0=Math.floor(w*.18),x1=Math.ceil(w*.82),y0=Math.floor(h*.12),y1=Math.ceil(h*.88);
  let changed=0,total=0;
  for(let y=y0;y<y1;y+=2){
    for(let x=x0;x<x1;x+=2){
      const i=(y*w+x)*4;
      const diff=(Math.abs(frame[i]-previousFrame[i])+Math.abs(frame[i+1]-previousFrame[i+1])+Math.abs(frame[i+2]-previousFrame[i+2]))/3;
      if(diff>24)changed++;
      total++;
    }
  }
  previousFrame.set(frame);
  const score=total?changed/total*100:0;
  cameraMeterFill.style.width=Math.min(100,score*3)+'%';
  const now=performance.now();
  if(running && score>CAMERA_THRESHOLD && now-lastCameraImpulse>CAMERA_REFRACTORY){
    lastCameraImpulse=now;
    registerMotion();
  }
}

async function toggleCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream=null;
    cameraView.srcObject=null;
    cameraBox.style.display='none';
    stopCameraMotion();
    cameraBtn.textContent='家事カメラ ON';
    return;
  }
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    cameraView.srcObject=cameraStream;
    cameraBox.style.display='block';
    cameraBtn.textContent='家事カメラ OFF';
    previousFrame=null;
    clearInterval(cameraMotionTimer);
    cameraMotionTimer=setInterval(analyzeCameraMotion,CAMERA_INTERVAL);
  }catch(e){
    cameraBtn.textContent='カメラ不可';
    message.textContent='カメラを開始できませんでした';
  }
}

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen');
  }catch(e){}
}

async function start(){
  try{
    // iOS requires audio initialization inside a direct user gesture.
    // Keep it isolated from motion permission so audio failure can never block game start.
    if(soundOn){
      try{ audio(); }catch(e){ soundOn=false; soundBtn.textContent='SE OFF'; }
    }
    if(!gameStarted){
      gameStarted=true;
      activeMs=0;
      rawMotions=0;
      gameSteps=0;
      totalMeters=0;
      money=0;
      deliveries=0;
      currentJob=null;
      jobMeters=0;
      jobActive=false;
      jobSequence=0;
      roadOffset=0;
      sceneryOffset=0;
      road.style.transform='translateY(0)';
      scenery.style.transform='translateY(0)';
      updateUI();
      updateTime();
    }
    if(typeof DeviceMotionEvent==='undefined'){
      status.textContent='センサー非対応';
      message.textContent='このブラウザでは動作センサーを使えません';
      return;
    }

    if(typeof DeviceMotionEvent.requestPermission==='function'){
      const permission=await DeviceMotionEvent.requestPermission();
      if(permission!=='granted'){
        status.textContent='許可なし';
        message.textContent='動作センサーの許可が必要です';
        return;
      }
    }

    running=true;
    activeStartedAt=performance.now();
    clearInterval(timerId);
    timerId=setInterval(updateTime,1000);
    updateTime();
    lastMag=null;
    smoothedDelta=0;
    window.addEventListener('devicemotion',motionHandler,{passive:true});
    startPanel.style.display='none';
    status.textContent='計測中';
    message.textContent='動いた距離は総運動距離に加算されます';
    await requestWakeLock();
    if(!currentJob) setTimeout(()=>{if(running)showNextJob();},500);
  }catch(err){
    status.textContent='開始失敗';
    message.textContent='センサーを開始できませんでした';
  }
}

function stop(){
  if(running && activeStartedAt!==null) activeMs+=performance.now()-activeStartedAt;
  activeStartedAt=null;
  clearInterval(timerId);
  timerId=null;
  updateTime();
  running=false;
  jobActive=false;
  jobPopup.style.display='none';
  window.removeEventListener('devicemotion',motionHandler);
  try{ wakeLock?.release(); }catch(e){}
  wakeLock=null;
  status.textContent='停止中';
  startBtn.textContent='再開';
  startPanel.style.display='flex';
}

soundBtn.addEventListener('click',()=>{
  if(!soundOn){
    try{
      soundOn=true;
      audio();
      soundBtn.textContent='SE ON';
      se.chest();
    }catch(e){
      soundOn=false;
      soundBtn.textContent='SE不可';
    }
  }else{
    soundOn=false;
    soundBtn.textContent='SE OFF';
  }
});
cameraBtn.addEventListener('click',toggleCamera);
startBtn.addEventListener('click',start);
stopBtn.addEventListener('click',stop);

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && running) requestWakeLock();
});

updateUI();
updateTime();
})();
</script>
</body>
