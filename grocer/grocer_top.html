<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Grocer</title>
  <link rel="stylesheet" href="./grocer_top.css?v=20261004-5">
</head>
<body>
  <main class="grocer-top">
    <section class="home-upper" aria-label="店">
      <div class="scene-window" id="sceneWindow">
        <div class="home-status">
          <span id="dayLabel">1日目</span>
          <strong id="moneyLabel">500G</strong>
        </div>
      </div>

      <aside class="home-side-actions" aria-label="主な操作">
        <button type="button" class="home-button" id="openShopButton">店を開く</button>
        <button type="button" class="home-button" id="stockButton">仕入れ</button>
      </aside>
    </section>

    <section class="home-bottom-actions" aria-label="その他の操作">
      <button type="button" class="home-button wide" id="inventoryButton">インベントリを開く</button>
      <button type="button" class="home-button" id="restButton">休む</button>
    </section>
  </main>

  <script src="./grocer_state.js?v=20261004-1"></script>
  <script src="./grocer_top.js?v=20261004-5"></script>
</body>
</html>
