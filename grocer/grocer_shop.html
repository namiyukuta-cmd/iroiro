<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Grocer - 店</title>
  <link rel="stylesheet" href="./grocer_shop.css?v=20261004-1">
  <link rel="stylesheet" href="./grocer_inventory.css?v=20261004-1">
</head>
<body>
  <main class="shop-screen">
    <section class="shop-upper">
      <div class="customer-panel" id="customerPanel"></div>

      <aside class="shop-side">
        <section class="reservation-box" aria-label="予約">
          <div class="panel-title">予約</div>
          <div id="reservationBox"></div>
        </section>
        <button type="button" class="side-button" id="backButton">戻る</button>
      </aside>
    </section>

    <section class="inventory-panel" aria-label="売り物インベントリ">
      <div class="inventory-grid" id="inventoryGrid"></div>
    </section>

    <section class="conversation-panel" id="conversationPanel" hidden>
      <div class="conversation-text" id="conversationText"></div>
      <div class="conversation-actions">
        <button type="button" class="conversation-button" id="replyButton">応じる</button>
        <button type="button" class="conversation-button" id="skipButton">応じない</button>
      </div>
    </section>
  </main>

  <script src="./grocer_inventory.js?v=20261004-1"></script>
  <script src="./grocer_shop.js?v=20261004-1"></script>
</body>
</html>
