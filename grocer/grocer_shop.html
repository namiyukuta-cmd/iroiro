<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Grocer - 店</title>
  <link rel="stylesheet" href="./grocer_trade.css?v=20261004-2">
  <link rel="stylesheet" href="./grocer_reservation.css?v=20261004-2">
  <link rel="stylesheet" href="./grocer_inventory.css?v=20261004-1">
  <link rel="stylesheet" href="./grocer_shop.css?v=20261004-3">
</head>
<body>
  <main class="trade-screen shop-screen">
    <section class="trade-upper">
      <section class="trade-main" aria-label="店">
        <div class="panel-title">店</div>
        <div class="customer-content" id="customerPanel"></div>
      </section>

      <aside class="trade-side">
        <section class="reservation-panel" aria-label="予約">
          <div class="panel-title">予約</div>
          <div class="reservation-content" id="reservationBox"></div>
        </section>

        <div class="trade-actions">
          <button type="button" class="trade-button" id="backButton">戻る</button>
        </div>
      </aside>
    </section>

    <section class="trade-middle" aria-label="売上と所持金">
      <div class="money-bar">
        <div class="money-cell">
          <span class="money-label">本日売上</span>
          <strong class="money-value" id="daySales">0G</strong>
        </div>
        <div class="money-cell">
          <span class="money-label">所持金</span>
          <strong class="money-value" id="shopMoney">0G</strong>
        </div>
      </div>
    </section>

    <section class="inventory-panel" aria-label="売り物インベントリ">
      <div class="inventory-grid" id="inventoryGrid"></div>
    </section>

    <section class="conversation-panel" id="conversationPanel" hidden>
      <div class="conversation-text" id="conversationText"></div>
      <div class="conversation-actions">
        <button type="button" class="conversation-button" id="replyButton">応じる</button>
        <button type="button" class="conversation-button" id="skipButton">応じない</button>
      </div>
    </section>
  </main>

  <script src="./grocer_inventory.js?v=20261004-1"></script>
  <script src="./grocer_shop.js?v=20261004-1"></script>
</body>
</html>
