<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Grocer</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%}
    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      background:#f4efe6;
      color:#241f1a;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main{
      width:min(100% - 36px,420px);
      display:grid;
      gap:16px;
    }
    h1{
      margin:0 0 18px;
      text-align:center;
      font-size:30px;
    }
    .menu{
      min-height:64px;
      border:2px solid #241f1a;
      border-radius:12px;
      background:#fffaf2;
      color:#241f1a;
      text-decoration:none;
      display:grid;
      place-items:center;
      font-size:20px;
      font-weight:800;
    }
    .menu:active{
      transform:scale(.985);
      background:#e9dfd0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Grocer</h1>
    <a class="menu" id="newGameLink" href="./grocer_top.html?new=1">はじめから</a>
    <a class="menu" id="continueGameLink" href="./grocer_top.html?continue=1">続きから</a>
  </main>
<script>
(() => {
  const go = (mode) => {
    location.href = './grocer_top.html?' + mode + '=1&_nc=' + Date.now();
  };
  document.getElementById('newGameLink').addEventListener('click', (e) => {
    e.preventDefault();
    go('new');
  });
  document.getElementById('continueGameLink').addEventListener('click', (e) => {
    e.preventDefault();
    go('continue');
  });
})();
</script>
</body>
</html>
