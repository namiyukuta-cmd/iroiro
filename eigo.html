<html lang="ja">
<head>

  <style>
    *{box-sizing:border-box}
    :root{--bg:#f7f7f5;--text:#202020;--yellow:#efc84e;--yellow-bg:#fff8d9;--green:#5d9869;--red:#c75f5f}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .app{width:100%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;overflow:hidden;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
    .top{display:grid;gap:7px}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .count{font-size:20px;font-weight:850}.score{font-size:13px;font-weight:750;color:#666}
    .progress{height:9px;border-radius:999px;background:#e7e7e2;overflow:hidden}.progress-bar{height:100%;width:0;background:#333;transition:width .18s}
    .save-row{display:flex;justify-content:flex-end}.save-button{height:32px;padding:0 14px;border:1.5px solid #6e9c76;border-radius:10px;background:#f2fbf4;font-size:12px;font-weight:800;cursor:pointer}
    .card{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:2px solid var(--yellow);border-radius:22px;background:var(--yellow-bg);padding:18px 14px;display:flex;flex-direction:column;justify-content:center;gap:16px}
    .kind{font-size:12px;font-weight:800;color:#8b793f;text-align:center}.jp{font-size:17px;line-height:1.45;text-align:center;color:#4c4c47;font-weight:700}
    .question{font-size:28px;line-height:1.45;text-align:center;font-weight:850;overflow-wrap:anywhere}.blank{display:inline-block;min-width:76px;border-bottom:3px solid #8f7b37;color:#8f7b37;padding:0 4px}
    .feedback{min-height:64px;text-align:center;font-size:16px;line-height:1.45;font-weight:800;display:flex;align-items:center;justify-content:center;padding:4px;white-space:pre-line}
    .feedback.ok{color:var(--green)}.feedback.ng{color:var(--red)}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{min-width:0;min-height:64px;border:2px solid #999;border-radius:16px;background:#fff;color:#202020;font-size:20px;font-weight:800;padding:8px;cursor:pointer;overflow-wrap:anywhere}
    .choice:active,.save-button:active{transform:scale(.97)}.choice.correct{border-color:var(--green);background:#eef8f0}.choice.wrong{border-color:var(--red);background:#fff0f0}.choice:disabled{opacity:1;color:#202020}
    .bottom{font-size:12px;line-height:1.45;color:#777;text-align:center;min-height:18px}.finish{display:none;text-align:center;gap:15px}.finish.show{display:grid}.finish-title{font-size:30px;font-weight:900}.finish-result{font-size:19px;font-weight:800;line-height:1.6}
    .status{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 30px);padding:8px 12px;border-radius:10px;background:#222;color:#fff;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;text-align:center}.status.show{opacity:1}
    @media(min-width:700px){.app{max-width:520px;margin:0 auto;border-left:1px solid #e2e2df;border-right:1px solid #e2e2df}}
  </style>
</head>

上にあります。","text":"The book is ___ the desk.","answer":"on","choices":["on","in","at","to"]},{"jp":"私は7時に起きます。","text":"I get up ___ seven.","answer":"at","choices":["at","in","on","to"]},{"jp":"私は学校へ行きます。","text":"I go ___ school.","answer":"to","choices":["to","at","in","from"]},{"jp":"私は日本出身です。","text":"I am ___ Japan.","answer":"from","choices":["from","to","in","at"]},{"jp":"私は友達と話しました。","text":"I talked ___ my friend.","answer":"with","choices":["with","by","for","from"]},{"jp":"これはあなたへのプレゼントです。","text":"This is a present ___ you.","answer":"for","choices":["for","by","with","from"]},{"jp":"この本は彼によって書かれました。","text":"This book was written ___ him.","answer":"by","choices":["by","with","for","from"]},{"jp":"学校は駅と公園の間にあります。","text":"The school is ___ the station and the park.","answer":"between","choices":["between","under","after","from"]},{"jp":"猫は机の下にいます。","text":"The cat is ___ the desk.","answer":"under","choices":["under","over","between","from"]}]},{"label":"疑問詞","why":"聞きたい内容に合う疑問詞を選ぶ。What=何、Where=どこ、When=いつ、Why=なぜ、Who=誰、How=どのように。","items":[{"jp":"これは何ですか。","text":"___ is this?","answer":"What","choices":["What","Who","Where","When"]},{"jp":"あなたはどこに住んでいますか。","text":"___ do you live?","answer":"Where","choices":["Where","What","When","Why"]},{"jp":"あなたはいつ勉強しますか。","text":"___ do you study?","answer":"When","choices":["When","Where","Who","Which"]},{"jp":"なぜあなたは英語を勉強しますか。","text":"___ do you study English?","answer":"Why","choices":["Why","What","Where","Who"]},{"jp":"あなたは何歳ですか。","text":"___ old are you?","answer":"How","choices":["How","What","Who","When"]},{"jp":"あの男性は誰ですか。","text":"___ is that man?","answer":"Who","choices":["Who","What","Where","When"]},{"jp":"どちらの本があなたのですか。","text":"___ book is yours?","answer":"Which","choices":["Which","What","Who","When"]},{"jp":"これは誰のかばんですか。","text":"___ bag is this?","answer":"Whose","choices":["Whose","Who","Which","What"]},{"jp":"あなたはどうやって学校へ行きますか。","text":"___ do you go to school?","answer":"How","choices":["How","What","Where","Why"]},{"jp":"りんごはいくつありますか。","text":"___ many apples are there?","answer":"How","choices":["How","What","Who","When"]}]},{"label":"接続詞","why":"文と文の関係に合う接続詞を選ぶ。because=理由、but=逆接、and=追加、or=選択。","items":[{"jp":"私は疲れていたので寝ました。","text":"I went to bed ___ I was tired.","answer":"because","choices":["because","but","or","than"]},{"jp":"私はテニスが好きですが、野球は好きではありません。","text":"I like tennis, ___ I do not like baseball.","answer":"but","choices":["but","and","because","than"]},{"jp":"私は本を読み、音楽を聞きます。","text":"I read books ___ listen to music.","answer":"and","choices":["and","but","or","because"]},{"jp":"お茶かコーヒーを選んでください。","text":"Choose tea ___ coffee.","answer":"or","choices":["or","and","but","because"]},{"jp":"雨だったので家にいました。","text":"I stayed home ___ it was raining.","answer":"because","choices":["because","but","and","or"]},{"jp":"彼は若いですが、とても強いです。","text":"He is young, ___ very strong.","answer":"but","choices":["but","and","because","or"]},{"jp":"私は朝食を食べて学校へ行きました。","text":"I ate breakfast ___ went to school.","answer":"and","choices":["and","but","or","because"]},{"jp":"今行きますか、それとも後で行きますか。","text":"Will you go now ___ later?","answer":"or","choices":["or","and","but","because"]},{"jp":"彼女は忙しかったので来ませんでした。","text":"She did not come ___ she was busy.","answer":"because","choices":["because","but","and","or"]},{"jp":"私は英語を勉強しますが、難しいです。","text":"I study English, ___ it is difficult.","answer":"but","choices":["but","and","because","or"]}]},{"label":"比較","why":"2つを比べる比較級では -er / more を使い、than の後に比較相手を置く。","items":[{"jp":"彼は私より背が高いです。","text":"He is taller ___ me.","answer":"than","choices":["than","that","then","and"]},{"jp":"この本はあの本より新しいです。","text":"This book is ___ than that one.","answer":"newer","choices":["newer","new","newest","more new"]},{"jp":"私の犬はあなたの犬より大きいです。","text":"My dog is ___ than yours.","answer":"bigger","choices":["bigger","big","biggest","more big"]},{"jp":"今日は昨日より寒いです。","text":"Today is ___ than yesterday.","answer":"colder","choices":["colder","cold","coldest","more cold"]},{"jp":"数学は英語より難しいです。","text":"Math is ___ difficult than English.","answer":"more","choices":["more","most","very","much"]},{"jp":"彼女は私より若いです。","text":"She is ___ than me.","answer":"younger","choices":["younger","young","youngest","more young"]},{"jp":"この箱はあの箱より軽いです。","text":"This box is ___ than that one.","answer":"lighter","choices":["lighter","light","lightest","more light"]},{"jp":"この映画はその映画より面白いです。","text":"This movie is ___ interesting than that one.","answer":"more","choices":["more","most","very","much"]},{"jp":"私の部屋はあなたの部屋より小さいです。","text":"My room is ___ than yours.","answer":"smaller","choices":["smaller","small","smallest","more small"]},{"jp":"夏は春より暑いです。","text":"Summer is ___ than spring.","answer":"hotter","choices":["hotter","hot","hottest","more hot"]}]},{"label":"不定詞","why":"want / need / hope などの後で「〜すること」を表すときは to + 動詞の原形。","items":[{"jp":"私は英語を勉強したいです。","text":"I want ___ study English.","answer":"to","choices":["to","for","at","of"]},{"jp":"私は新しい本を買いたいです。","text":"I want ___ buy a new book.","answer":"to","choices":["to","for","at","of"]},{"jp":"彼女は医者になりたいです。","text":"She wants ___ be a doctor.","answer":"to","choices":["to","for","at","of"]},{"jp":"私たちは早く起きる必要があります。","text":"We need ___ get up early.","answer":"to","choices":["to","for","at","of"]},{"jp":"彼は日本へ行きたいです。","text":"He wants ___ go to Japan.","answer":"to","choices":["to","for","at","of"]},{"jp":"私はあなたに会えてうれしいです。","text":"I am happy ___ see you.","answer":"to","choices":["to","for","at","of"]},{"jp":"彼女は英語を話そうとしました。","text":"She tried ___ speak English.","answer":"to","choices":["to","for","at","of"]},{"jp":"私は何か食べるものが欲しいです。","text":"I want something ___ eat.","answer":"to","choices":["to","for","at","of"]},{"jp":"彼はその本を読むことを決めました。","text":"He decided ___ read the book.","answer":"to","choices":["to","for","at","of"]},{"jp":"私たちはまた会いたいです。","text":"We hope ___ meet again.","answer":"to","choices":["to","for","at","of"]}]},{"label":"動名詞","why":"like / enjoy などの後で「〜すること」を表すときは動詞ingを使う。","items":[{"jp":"私はテニスをすることが好きです。","text":"I like ___ tennis.","answer":"playing","choices":["playing","play","played","plays"]},{"jp":"私は本を読むことが好きです。","text":"I like ___ books.","answer":"reading","choices":["reading","read","reads","reader"]},{"jp":"彼女は音楽を聞くことを楽しみます。","text":"She enjoys ___ to music.","answer":"listening","choices":["listening","listen","listened","listens"]},{"jp":"彼は泳ぐことが好きです。","text":"He likes ___.","answer":"swimming","choices":["swimming","swim","swam","swims"]},{"jp":"私たちは料理をすることを楽しみます。","text":"We enjoy ___.","answer":"cooking","choices":["cooking","cook","cooked","cooks"]},{"jp":"彼らはサッカーをすることが好きです。","text":"They like ___ soccer.","answer":"playing","choices":["playing","play","played","plays"]},{"jp":"私は英語を勉強することが好きです。","text":"I like ___ English.","answer":"studying","choices":["studying","study","studied","studies"]},{"jp":"彼女は写真を撮ることを楽しみます。","text":"She enjoys ___ pictures.","answer":"taking","choices":["taking","take","took","takes"]},{"jp":"彼は走ることが好きです。","text":"He likes ___.","answer":"running","choices":["running","run","ran","runs"]},{"jp":"私たちは映画を見ることを楽しみます。","text":"We enjoy ___ movies.","answer":"watching","choices":["watching","watch","watched","watches"]}]}];
const bank=GROUPS.flatMap((group,g)=>group.items.map((item,i)=>({
  id:'g'+String(g+1).padStart(2,'0')+'_'+String(i+1).padStart(2,'0'),
  kind:(g+1)+'/20　'+group.label,
  why:group.why,
  ...item
})));
const byId=Object.fromEntries(bank.map(q=>[q.id,q]));

const countEl=document.getElementById('count');
const scoreEl=document.getElementById('score');
const progressBar=document.getElementById('progressBar');
const kindEl=document.getElementById('kind');
const jpEl=document.getElementById('jp');
const questionEl=document.getElementById('question');
const feedbackEl=document.getElementById('feedback');
const choicesEl=document.getElementById('choices');
const quizView=document.getElementById('quizView');
const finishView=document.getElementById('finishView');
const finishResult=document.getElementById('finishResult');
const saveButton=document.getElementById('saveButton');
const statusBox=document.getElementById('status');
let locked=false;

function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function flash(message){statusBox.textContent=message;statusBox.classList.add('show');clearTimeout(flash.timer);flash.timer=setTimeout(()=>statusBox.classList.remove('show'),1700)}
function newState(){return {version:3,updatedAt:null,stats:{},day:null}}
function loadState(){try{const raw=localStorage.getItem(LOCAL_KEY);const s=raw?JSON.parse(raw):null;return s&&s.version===3?s:newState()}catch(e){return newState()}}
let state=loadState();
if(!state.stats||typeof state.stats!=='object')state.stats={};
function saveLocal(){state.updatedAt=new Date().toISOString();localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}
function stat(id){if(!state.stats[id])state.stats[id]={seen:0,correct:0,wrong:0,lastSeen:null,lastWrong:null};return state.stats[id]}

function makeDay(){
  return {date:localDate(),completed:0,totalAnswers:0,correct:0,wrong:0,queue:shuffle(bank.map(q=>q.id)),history:[],firstSeen:{},current:null,finished:false};
}
function ensureDay(){
  if(!state.day||state.day.date!==localDate()||state.day.finished)state.day=makeDay();
  if(!Array.isArray(state.day.queue))state.day.queue=shuffle(bank.map(q=>q.id));
  if(!Array.isArray(state.day.history))state.day.history=[];
  if(!state.day.firstSeen||typeof state.day.firstSeen!=='object')state.day.firstSeen={};
  saveLocal();
}
ensureDay();

function nextQuestion(){
  if(state.day.completed>=DAILY_TOTAL){finishDay();return}
  let id=state.day.queue.shift();
  if(!id){
    const unseen=bank.filter(q=>!state.day.firstSeen[q.id]);
    if(!unseen.length){finishDay();return}
    id=shuffle(unseen)[0].id;
  }
  if(!byId[id]){nextQuestion();return}
  state.day.current=id;saveLocal();renderQuestion(byId[id]);
}
function renderQuestion(q){
  locked=false;quizView.style.display='block';finishView.classList.remove('show');
  kindEl.textContent=q.kind;jpEl.textContent=q.jp;
  questionEl.innerHTML=q.text.replace('___','<span class="blank">___</span>');
  feedbackEl.textContent='';feedbackEl.className='feedback';choicesEl.innerHTML='';
  shuffle(q.choices).forEach(choice=>{
    const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=choice;b.addEventListener('click',()=>answer(q,choice,b));choicesEl.appendChild(b);
  });
  updateHeader();
}
function answer(q,choice,button){
  if(locked)return;locked=true;
  const ok=choice===q.answer;
  const s=stat(q.id);s.seen++;s.lastSeen=new Date().toISOString();
  const firstToday=!state.day.firstSeen[q.id];
  if(firstToday){state.day.firstSeen[q.id]=true;state.day.completed++}
  state.day.totalAnswers++;
  if(ok){
    s.correct++;state.day.correct++;button.classList.add('correct');
    feedbackEl.textContent='○';feedbackEl.className='feedback ok';
  }else{
    s.wrong++;s.lastWrong=new Date().toISOString();state.day.wrong++;button.classList.add('wrong');
    [...choicesEl.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct')});
    feedbackEl.textContent='×　正解：'+q.answer+'\nどうして？ '+q.why;feedbackEl.className='feedback ng';
    const pos=Math.min(5+Math.floor(Math.random()*4),state.day.queue.length);
    state.day.queue.splice(pos,0,q.id);
  }
  [...choicesEl.children].forEach(b=>b.disabled=true);
  state.day.history.push({id:q.id,answer:choice,correct:ok,firstToday,at:new Date().toISOString()});
  saveLocal();updateHeader();
  setTimeout(()=>nextQuestion(),ok?380:2400);
}
function updateHeader(){
  countEl.textContent='今日 '+state.day.completed+' / '+DAILY_TOTAL;
  scoreEl.textContent='○ '+state.day.correct+'　× '+state.day.wrong;
  progressBar.style.width=Math.min(100,state.day.completed/DAILY_TOTAL*100)+'%';
}
function finishDay(){
  state.day.finished=true;state.day.current=null;saveLocal();updateHeader();
  quizView.style.display='none';finishView.classList.add('show');
  finishResult.textContent='200種類完了\n正解 '+state.day.correct+'回　／　間違い '+state.day.wrong+'回\n総回答 '+state.day.totalAnswers+'回';
}

function cleanToken(token){return String(token||'').replace(/\s+/g,'')}
function getToken(){for(const key of TOKEN_KEYS){const token=cleanToken(localStorage.getItem(key)||'');if(token)return token}return ''}
function rememberToken(token){const t=cleanToken(token);if(!t)return '';localStorage.setItem(TOKEN_KEYS[0],t);return t}
function cloudUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(CLOUD.owner)+'/'+encodeURIComponent(CLOUD.repo)+'/contents/'+CLOUD.path.split('/').map(encodeURIComponent).join('/')}
function headers(token){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}
function encodeBase64Utf8(text){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary)}
async function saveCloud(){
  saveLocal();let token=getToken();
  if(!token){const entered=prompt('private-game-data に保存するGitHubトークンを入力してください');if(!entered)throw new Error('保存を中止しました');token=rememberToken(entered)}
  let sha='';const read=await fetch(cloudUrl(),{headers:headers(token)});
  if(read.ok){const file=await read.json();sha=file.sha||''}else if(read.status!==404)throw new Error('private-game-data を読み込めませんでした ('+read.status+')');
  const body={message:'Update English drill save',content:encodeBase64Utf8(JSON.stringify(state,null,2))};if(sha)body.sha=sha;
  const res=await fetch(cloudUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},headers(token)),body:JSON.stringify(body)});
  if(!res.ok)throw new Error('private-game-data へ保存できませんでした ('+res.status+')');
}
saveButton.addEventListener('click',async()=>{saveButton.disabled=true;saveButton.textContent='保存中';try{await saveCloud();flash('private-game-data に保存しました')}catch(e){flash(e.message||'保存できませんでした')}finally{saveButton.disabled=false;saveButton.textContent='保存'}});

updateHeader();
if(state.day.finished||state.day.completed>=DAILY_TOTAL)finishDay();else nextQuestion();
</script>
