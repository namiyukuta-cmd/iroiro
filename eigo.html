<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>英語</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f7f7f5;
      --text: #202020;
      --line: #d8d8d3;
      --yellow: #f3c84b;
      --yellow-bg: #fff8d7;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    button { font: inherit; }

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 44%) minmax(0, 56%);
      overflow: hidden;
      padding:
        max(10px, env(safe-area-inset-top))
        10px
        max(10px, env(safe-area-inset-bottom));
      gap: 10px;
    }

    .top-area {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px;
      gap: 10px;
    }

    .sentence-panel {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      border: 3px solid var(--yellow);
      border-radius: 22px;
      background: var(--yellow-bg);
      padding: 16px;
    }

    .sentence-placeholder {
      color: #9b8a4e;
      font-size: 17px;
      line-height: 1.6;
    }

    .sentence {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 9px 7px;
      min-height: 100%;
    }

    .sentence-word {
      min-height: 44px;
      border: 2px solid #d6b23d;
      border-radius: 12px;
      background: #fff;
      padding: 8px 12px;
      color: #181818;
      font-size: 19px;
      font-weight: 650;
      cursor: pointer;
    }

    .category-rail {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 7px;
      scrollbar-width: none;
      padding: 1px 1px 1px 0;
    }

    .category-rail::-webkit-scrollbar { display: none; }

    .category-button {
      flex: 0 0 46px;
      width: 100%;
      min-height: 46px;
      border: 2px solid var(--cat);
      border-radius: 12px;
      background: #fff;
      color: #222;
      font-size: 15px;
      font-weight: 750;
      line-height: 1.05;
      padding: 4px 3px;
      cursor: pointer;
    }

    .category-button.active {
      background: color-mix(in srgb, var(--cat) 22%, white);
      box-shadow: inset 0 0 0 1px var(--cat);
    }

    .palette {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      border: 3px solid var(--accent, #e18aae);
      border-radius: 24px;
      background: #fff;
      padding: 14px;
    }

    .palette-head {
      position: sticky;
      top: -14px;
      z-index: 2;
      margin: -14px -14px 14px;
      padding: 13px 14px 11px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .palette-title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
    }

    .palette-note {
      margin-top: 4px;
      color: #777;
      font-size: 14px;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding-bottom: 8px;
    }

    .word-button {
      min-height: 52px;
      border: 2px solid var(--accent, #e18aae);
      border-radius: 14px;
      background: #fff;
      color: #1f1f1f;
      font-size: 18px;
      font-weight: 650;
      padding: 8px 7px;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .word-button:active,
    .sentence-word:active,
    .category-button:active {
      transform: scale(0.97);
    }

    @media (min-width: 700px) {
      .app {
        max-width: 520px;
        margin: 0 auto;
        border-left: 1px solid #e2e2df;
        border-right: 1px solid #e2e2df;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top-area" aria-label="英文作成エリア">
      <div class="sentence-panel" id="sentencePanel">
        <div class="sentence" id="sentence">
          <div class="sentence-placeholder" id="placeholder">下の単語を押すと、ここに英文が並びます。</div>
        </div>
      </div>

      <nav class="category-rail" id="categoryRail" aria-label="単語グループ"></nav>
    </section>

    <section class="palette" id="palette" aria-label="選択中の単語グループ">
      <div class="palette-head">
        <h1 class="palette-title" id="paletteTitle">主語</h1>
        <div class="palette-note">単語を押すと上に追加</div>
      </div>
      <div class="word-grid" id="wordGrid"></div>
    </section>
  </main>

  <script>
    const groups = [
      {
        id: 'subject',
        label: '主語',
        color: '#df7fa7',
        words: ['I', 'you', 'he', 'she', 'it', 'we', 'they', 'this', 'that', 'these', 'those', 'Tom', 'my mother', 'my father', 'my friend', 'the dog']
      },
      {
        id: 'be',
        label: 'be動詞',
        color: '#79a6e8',
        words: ['am', 'is', 'are', 'was', 'were', 'be', 'been']
      },
      {
        id: 'verb',
        label: '一般動詞',
        color: '#6f98df',
        words: ['play', 'like', 'love', 'have', 'go', 'come', 'eat', 'drink', 'see', 'look', 'watch', 'read', 'write', 'speak', 'study', 'use', 'make', 'take', 'get', 'give', 'know', 'want', 'need', 'live', 'work']
      },
      {
        id: 'modal',
        label: '助動詞',
        color: '#91c77d',
        words: ['can', 'could', 'will', 'would', 'may', 'must', 'should']
      },
      {
        id: 'wh',
        label: 'WH',
        color: '#b68bd0',
        words: ['what', 'who', 'whose', 'which', 'where', 'when', 'why', 'how', 'how many', 'how much', 'how old', 'how long']
      },
      {
        id: 'noun',
        label: '名詞',
        color: '#ef9b66',
        words: ['book', 'school', 'student', 'teacher', 'friend', 'family', 'dog', 'cat', 'music', 'English', 'Japan', 'park', 'station', 'home', 'food', 'water', 'time', 'day', 'week', 'year']
      },
      {
        id: 'pronoun',
        label: '代名詞',
        color: '#d992ae',
        words: ['me', 'you', 'him', 'her', 'it', 'us', 'them', 'my', 'your', 'his', 'her', 'its', 'our', 'their', 'mine', 'yours', 'hers', 'ours', 'theirs']
      },
      {
        id: 'adjective',
        label: '形容詞',
        color: '#e2be57',
        words: ['good', 'bad', 'big', 'small', 'new', 'old', 'young', 'happy', 'sad', 'busy', 'free', 'beautiful', 'interesting', 'difficult', 'easy', 'favorite']
      },
      {
        id: 'adverb',
        label: '副詞',
        color: '#65b8aa',
        words: ['very', 'well', 'often', 'usually', 'always', 'sometimes', 'never', 'today', 'yesterday', 'tomorrow', 'now', 'here', 'there', 'also', 'too']
      },
      {
        id: 'article',
        label: '冠詞',
        color: '#9c9c9c',
        words: ['a', 'an', 'the']
      },
      {
        id: 'preposition',
        label: '前置詞',
        color: '#a9846a',
        words: ['in', 'on', 'at', 'to', 'from', 'for', 'with', 'by', 'of', 'about', 'under', 'over', 'near', 'before', 'after', 'between', 'into']
      },
      {
        id: 'conjunction',
        label: '接続詞',
        color: '#555555',
        words: ['and', 'but', 'or', 'because', 'so', 'if', 'when', 'that', 'than']
      }
    ];

    const sentence = document.getElementById('sentence');
    const placeholder = document.getElementById('placeholder');
    const categoryRail = document.getElementById('categoryRail');
    const palette = document.getElementById('palette');
    const paletteTitle = document.getElementById('paletteTitle');
    const wordGrid = document.getElementById('wordGrid');

    let activeGroupId = groups[0].id;

    function addWord(word) {
      if (placeholder) placeholder.remove();

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'sentence-word';
      button.textContent = word;
      button.title = '押すと削除';
      button.addEventListener('click', () => {
        button.remove();
        if (!sentence.querySelector('.sentence-word')) {
          const empty = document.createElement('div');
          empty.className = 'sentence-placeholder';
          empty.id = 'placeholder';
          empty.textContent = '下の単語を押すと、ここに英文が並びます。';
          sentence.appendChild(empty);
        }
      });

      sentence.appendChild(button);
      button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    function renderPalette(group) {
      paletteTitle.textContent = group.label;
      palette.style.setProperty('--accent', group.color);
      wordGrid.innerHTML = '';

      group.words.forEach(word => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'word-button';
        button.textContent = word;
        button.addEventListener('click', () => addWord(word));
        wordGrid.appendChild(button);
      });

      palette.scrollTop = 0;
    }

    function setActiveGroup(id) {
      activeGroupId = id;
      const group = groups.find(item => item.id === id);
      if (!group) return;

      categoryRail.querySelectorAll('.category-button').forEach(button => {
        button.classList.toggle('active', button.dataset.group === id);
      });

      renderPalette(group);
    }

    groups.forEach(group => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'category-button';
      button.dataset.group = group.id;
      button.style.setProperty('--cat', group.color);
      button.textContent = group.label;
      button.addEventListener('click', () => setActiveGroup(group.id));
      categoryRail.appendChild(button);
    });

    setActiveGroup(activeGroupId);
  </script>
</body>
</html>
