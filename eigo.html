const bank=[];let n=1;GROUPS.forEach(g=>g.items.forEach(x=>bank.push({...x,id:'q'+String(n++).padStart(3,'0'),kind:g.label,why:g.why})));const byId=Object.fromEntries(bank.map(q=>[q.id,q]));
const countEl=document.getElementById('count'),scoreEl=document.getElementById('score'),progressBar=document.getElementById('progressBar'),kindEl=document.getElementById('kind'),jpEl=document.getElementById('jp'),questionEl=document.getElementById('question'),feedbackEl=document.getElementById('feedback'),choicesEl=document.getElementById('choices'),quizView=document.getElementById('quizView'),finishView=document.getElementById('finishView'),finishResult=document.getElementById('finishResult'),saveButton=document.getElementById('saveButton'),nextButton=document.getElementById('nextButton'),statusBox=document.getElementById('status');let locked=false;
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function flash(m){statusBox.textContent=m;statusBox.classList.add('show');clearTimeout(flash.timer);flash.timer=setTimeout(()=>statusBox.classList.remove('show'),1700)}function newState(){return{version:3,updatedAt:null,stats:{},day:null}}function loadState(){try{const s=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');return s&&s.version===3?s:newState()}catch(e){return newState()}}let state=loadState();if(!state.stats||typeof state.stats!=='object')state.stats={};function saveLocal(){state.updatedAt=new Date().toISOString();localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}function stat(id){if(!state.stats[id])state.stats[id]={seen:0,correct:0,wrong:0,lastSeen:null,lastWrong:null};return state.stats[id]}
function makeDay(){return{date:localDate(),completed:0,totalAnswers:0,correct:0,wrong:0,queue:shuffle(bank.map(q=>q.id)),history:[],firstSeen:{},current:null,finished:false}}function ensureDay(){if(!state.day||state.day.date!==localDate()||state.day.finished)state.day=makeDay();if(!Array.isArray(state.day.queue))state.day.queue=shuffle(bank.map(q=>q.id));if(!Array.isArray(state.day.history))state.day.history=[];if(!state.day.firstSeen||typeof state.day.firstSeen!=='object')state.day.firstSeen={};saveLocal()}ensureDay();
function nextQuestion(){if(state.day.completed>=DAILY_TOTAL){finishDay();return}let id=state.day.queue.shift();if(!id){const unseen=bank.filter(q=>!state.day.firstSeen[q.id]);if(!unseen.length){finishDay();return}id=shuffle(unseen)[0].id}if(!byId[id]){nextQuestion();return}state.day.current=id;saveLocal();renderQuestion(byId[id])}function renderQuestion(q){locked=false;quizView.style.display='block';finishView.classList.remove('show');kindEl.textContent=q.kind;jpEl.textContent=q.jp;questionEl.innerHTML=q.text.replace('___','<span class="blank">___</span>');feedbackEl.textContent='';feedbackEl.className='feedback';choicesEl.innerHTML='';nextButton.classList.remove('show');shuffle(q.choices).forEach(choice=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=choice;b.addEventListener('click',()=>answer(q,choice,b));choicesEl.appendChild(b)});updateHeader()}
function answer(q,choice,button){if(locked)return;locked=true;const ok=choice===q.answer,s=stat(q.id);s.seen++;s.lastSeen=new Date().toISOString();const firstToday=!state.day.firstSeen[q.id];if(firstToday){state.day.firstSeen[q.id]=true;state.day.completed++}state.day.totalAnswers++;if(ok){s.correct++;state.day.correct++;button.classList.add('correct');feedbackEl.textContent='○';feedbackEl.className='feedback ok'}else{s.wrong++;s.lastWrong=new Date().toISOString();state.day.wrong++;button.classList.add('wrong');[...choicesEl.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct')});feedbackEl.textContent='×　正解：'+q.answer+'\nどうして？ '+q.why;feedbackEl.className='feedback ng';const pos=Math.min(5+Math.floor(Math.random()*4),state.day.queue.length);state.day.queue.splice(pos,0,q.id)}[...choicesEl.children].forEach(b=>b.disabled=true);state.day.history.push({id:q.id,answer:choice,correct:ok,firstToday,at:new Date().toISOString()});saveLocal();updateHeader();nextButton.classList.add('show')}
nextButton.addEventListener('click',()=>{if(!locked)return;nextButton.classList.remove('show');nextQuestion()});function updateHeader(){countEl.textContent='今日 '+state.day.completed+' / '+DAILY_TOTAL;scoreEl.textContent='○ '+state.day.correct+'　× '+state.day.wrong;progressBar.style.width=Math.min(100,state.day.completed/DAILY_TOTAL*100)+'%'}function finishDay(){state.day.finished=true;state.day.current=null;saveLocal();updateHeader();quizView.style.display='none';finishView.classList.add('show');finishResult.textContent='200種類完了\n正解 '+state.day.correct+'回　／　間違い '+state.day.wrong+'回\n総回答 '+state.day.totalAnswers+'回'}
function cleanToken(t){return String(t||'').replace(/\s+/g,'')}function getToken(){for(const k of TOKEN_KEYS){const t=cleanToken(localStorage.getItem(k)||'');if(t)return t}return''}function rememberToken(t){t=cleanToken(t);if(t)localStorage.setItem(TOKEN_KEYS[0],t);return t}function cloudUrl(){return'https://api.github.com/repos/'+encodeURIComponent(CLOUD.owner)+'/'+encodeURIComponent(CLOUD.repo)+'/contents/'+CLOUD.path.split('/').map(encodeURIComponent).join('/')}function headers(t){return{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}function encode64(text){const bytes=new TextEncoder().encode(text);let b='';for(const x of bytes)b+=String.fromCharCode(x);return btoa(b)}async function saveCloud(){saveLocal();let token=getToken();if(!token){const x=prompt('private-game-data に保存するGitHubトークンを入力してください');if(!x)throw new Error('保存を中止しました');token=rememberToken(x)}let sha='';const read=await fetch(cloudUrl(),{headers:headers(token)});if(read.ok){const f=await read.json();sha=f.sha||''}else if(read.status!==404)throw new Error('private-game-data を読み込めませんでした ('+read.status+')');const body={message:'Update English drill save',content:encode64(JSON.stringify(state,null,2))};if(sha)body.sha=sha;const res=await fetch(cloudUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},headers(token)),body:JSON.stringify(body)});if(!res.ok)throw new Error('private-game-data へ保存できませんでした ('+res.status+')')}
saveButton.addEventListener('click',async()=>{saveButton.disabled=true;saveButton.textContent='保存中';try{await saveCloud();flash('private-game-data に保存しました')}catch(e){flash(e.message||'保存できませんでした')}finally{saveButton.disabled=false;saveButton.textContent='保存'}});updateHeader();if(state.day.finished||state.day.completed>=DAILY_TOTAL)finishDay();else nextQuestion();
</script>
