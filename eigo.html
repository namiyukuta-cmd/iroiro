<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>英語100問</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#f7f7f5;--text:#202020;--line:#d8d8d3;--yellow:#efc84e;--yellow-bg:#fff8d9;--green:#5d9869;--red:#c75f5f}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .app{width:100%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;overflow:hidden;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
    .top{display:grid;gap:7px}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .count{font-size:20px;font-weight:850}.score{font-size:13px;font-weight:750;color:#666}
    .progress{height:9px;border-radius:999px;background:#e7e7e2;overflow:hidden}.progress-bar{height:100%;width:0;background:#333;transition:width .18s}
    .save-row{display:flex;justify-content:flex-end}.save-button{height:32px;padding:0 14px;border:1.5px solid #6e9c76;border-radius:10px;background:#f2fbf4;font-size:12px;font-weight:800;cursor:pointer}
    .card{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:2px solid var(--yellow);border-radius:22px;background:var(--yellow-bg);padding:18px 14px;display:flex;flex-direction:column;justify-content:center;gap:16px}
    .kind{font-size:12px;font-weight:800;color:#8b793f;text-align:center}
    .jp{font-size:17px;line-height:1.45;text-align:center;color:#4c4c47;font-weight:700}
    .question{font-size:28px;line-height:1.45;text-align:center;font-weight:850;overflow-wrap:anywhere}
    .blank{display:inline-block;min-width:76px;border-bottom:3px solid #8f7b37;color:#8f7b37;padding:0 4px}
    .feedback{min-height:48px;text-align:center;font-size:16px;line-height:1.4;font-weight:800;display:flex;align-items:center;justify-content:center;padding:4px}
    .feedback.ok{color:var(--green)}.feedback.ng{color:var(--red)}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .choice{min-width:0;min-height:64px;border:2px solid #999;border-radius:16px;background:#fff;color:#202020;font-size:20px;font-weight:800;padding:8px;cursor:pointer;overflow-wrap:anywhere}
    .choice:active,.save-button:active{transform:scale(.97)}
    .choice.correct{border-color:var(--green);background:#eef8f0}.choice.wrong{border-color:var(--red);background:#fff0f0}
    .choice:disabled{opacity:1;color:#202020}
    .bottom{font-size:12px;line-height:1.45;color:#777;text-align:center;min-height:18px}
    .finish{display:none;text-align:center;gap:15px}.finish.show{display:grid}.finish-title{font-size:30px;font-weight:900}.finish-result{font-size:19px;font-weight:800;line-height:1.6}
    .status{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 30px);padding:8px 12px;border-radius:10px;background:#222;color:#fff;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;text-align:center}.status.show{opacity:1}
    @media(min-width:700px){.app{max-width:520px;margin:0 auto;border-left:1px solid #e2e2df;border-right:1px solid #e2e2df}}
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="topline"><div class="count" id="count">今日 0 / 100</div><div class="score" id="score">○ 0　× 0</div></div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="save-row"><button class="save-button" id="saveButton" type="button">保存</button></div>
    </section>

    <section class="card" id="card">
      <div id="quizView">
        <div class="kind" id="kind"></div>
        <div class="jp" id="jp"></div>
        <div class="question" id="question"></div>
        <div class="feedback" id="feedback"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="finish" id="finishView">
        <div class="finish-title">100問終了</div>
        <div class="finish-result" id="finishResult"></div>
      </div>
    </section>

    <div class="bottom" id="bottom">間違えた問題は、少し後でもう一度出ます。</div>
  </main>
  <div class="status" id="status"></div>

    function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
    function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function flash(message){statusBox.textContent=message;statusBox.classList.add('show');clearTimeout(flash.timer);flash.timer=setTimeout(()=>statusBox.classList.remove('show'),1700)}
    function newState(){
      let legacy=[];try{const old=JSON.parse(localStorage.getItem(OLD_LOCAL_KEY)||'null');if(old&&Array.isArray(old.confirmedSentences))legacy=old.confirmedSentences}catch(e){}
      return {version:2,updatedAt:null,stats:{},day:null,legacySentences:legacy};
    }
    function loadState(){try{const raw=localStorage.getItem(LOCAL_KEY);const s=raw?JSON.parse(raw):null;return s&&s.version===2?s:newState()}catch(e){return newState()}}
    let state=loadState();
    if(!state.stats||typeof state.stats!=='object')state.stats={};
    function saveLocal(){state.updatedAt=new Date().toISOString();localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}
    function stat(id){if(!state.stats[id])state.stats[id]={seen:0,correct:0,wrong:0,lastSeen:null,lastWrong:null};return state.stats[id]}

    function makeDay(){
      const today=localDate();
      const oldWrong=bank.filter(q=>stat(q.id).wrong>0).sort((a,b)=>stat(b.id).wrong-stat(a.id).wrong||String(stat(b.id).lastWrong||'').localeCompare(String(stat(a.id).lastWrong||'')));
      const oldIds=shuffle(oldWrong.slice(0,30)).slice(0,20).map(q=>q.id);
      const fresh=shuffle(bank.filter(q=>stat(q.id).seen===0&&!oldIds.includes(q.id))).slice(0,40).map(q=>q.id);
      const need=60-oldIds.length-fresh.length;
      const filler=shuffle(bank.filter(q=>!oldIds.includes(q.id)&&!fresh.includes(q.id))).slice(0,Math.max(0,need)).map(q=>q.id);
      return {date:today,answered:0,correct:0,wrong:0,queue:[...oldIds,...fresh,...filler],history:[],current:null,finished:false};
    }
    function ensureDay(){
      if(!state.day||state.day.date!==localDate()||state.day.finished&&state.day.answered<DAILY_TOTAL)state.day=makeDay();
      if(!Array.isArray(state.day.queue))state.day.queue=[];
      if(!Array.isArray(state.day.history))state.day.history=[];
      saveLocal();
    }
    ensureDay();

    function weightedPick(){
      const wrong=bank.filter(q=>stat(q.id).wrong>0);
      if(wrong.length&&Math.random()<0.55){
        const pool=[];wrong.forEach(q=>{const w=Math.min(6,1+stat(q.id).wrong);for(let i=0;i<w;i++)pool.push(q.id)});return pool[Math.floor(Math.random()*pool.length)];
      }
      return bank[Math.floor(Math.random()*bank.length)].id;
    }
    function fillQueue(){while(state.day.queue.length<18&&state.day.answered+state.day.queue.length<DAILY_TOTAL+12)state.day.queue.push(weightedPick())}
    function nextQuestion(){
      if(state.day.answered>=DAILY_TOTAL){finishDay();return}
      fillQueue();
      let id=state.day.queue.shift();
      if(!byId[id])id=weightedPick();
      state.day.current=id;saveLocal();renderQuestion(byId[id]);
    }
    function renderQuestion(q){
      locked=false;quizView.style.display='block';finishView.classList.remove('show');
      kindEl.textContent=q.kind;jpEl.textContent=q.jp;
      questionEl.innerHTML=q.text.replace('___','<span class="blank">___</span>');
      feedbackEl.textContent='';feedbackEl.className='feedback';choicesEl.innerHTML='';
      shuffle(q.choices).forEach(choice=>{
        const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=choice;b.addEventListener('click',()=>answer(q,choice,b));choicesEl.appendChild(b);
      });
      updateHeader();
    }
    function answer(q,choice,button){
      if(locked)return;locked=true;
      const ok=choice===q.answer;const s=stat(q.id);s.seen++;s.lastSeen=new Date().toISOString();
      state.day.answered++;
      if(ok){s.correct++;state.day.correct++;button.classList.add('correct');feedbackEl.textContent='○';feedbackEl.className='feedback ok'}
      else{
        s.wrong++;s.lastWrong=new Date().toISOString();state.day.wrong++;button.classList.add('wrong');
        [...choicesEl.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct')});
        feedbackEl.textContent='×　正解：'+q.answer;feedbackEl.className='feedback ng';
        const pos=Math.min(5+Math.floor(Math.random()*4),state.day.queue.length);state.day.queue.splice(pos,0,q.id);
      }
      [...choicesEl.children].forEach(b=>b.disabled=true);
      state.day.history.push({id:q.id,answer:choice,correct:ok,at:new Date().toISOString()});
      saveLocal();updateHeader();
      setTimeout(()=>nextQuestion(),ok?420:900);
    }
    function updateHeader(){
      countEl.textContent='今日 '+state.day.answered+' / '+DAILY_TOTAL;
      scoreEl.textContent='○ '+state.day.correct+'　× '+state.day.wrong;
      progressBar.style.width=Math.min(100,state.day.answered/DAILY_TOTAL*100)+'%';
    }
    function finishDay(){
      state.day.finished=true;state.day.current=null;saveLocal();updateHeader();
      quizView.style.display='none';finishView.classList.add('show');
      finishResult.textContent='正解 '+state.day.correct+'問　／　間違い '+state.day.wrong+'問';
    }

    function cleanToken(token){return String(token||'').replace(/\s+/g,'')}
    function getToken(){for(const key of TOKEN_KEYS){const token=cleanToken(localStorage.getItem(key)||'');if(token)return token}return ''}
    function rememberToken(token){const t=cleanToken(token);if(!t)return '';localStorage.setItem(TOKEN_KEYS[0],t);return t}
    function cloudUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(CLOUD.owner)+'/'+encodeURIComponent(CLOUD.repo)+'/contents/'+CLOUD.path.split('/').map(encodeURIComponent).join('/')}
    function headers(token){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}
    function encodeBase64Utf8(text){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary)}
    async function saveCloud(){
      saveLocal();let token=getToken();
      if(!token){const entered=prompt('private-game-data に保存するGitHubトークンを入力してください');if(!entered)throw new Error('保存を中止しました');token=rememberToken(entered)}
      let sha='';const read=await fetch(cloudUrl(),{headers:headers(token)});
      if(read.ok){const file=await read.json();sha=file.sha||''}else if(read.status!==404)throw new Error('private-game-data を読み込めませんでした ('+read.status+')');
      const body={message:'Update English drill save',content:encodeBase64Utf8(JSON.stringify(state,null,2))};if(sha)body.sha=sha;
      const res=await fetch(cloudUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},headers(token)),body:JSON.stringify(body)});
      if(!res.ok)throw new Error('private-game-data へ保存できませんでした ('+res.status+')');
    }
    saveButton.addEventListener('click',async()=>{saveButton.disabled=true;saveButton.textContent='保存中';try{await saveCloud();flash('private-game-data に保存しました')}catch(e){flash(e.message||'保存できませんでした')}finally{saveButton.disabled=false;saveButton.textContent='保存'}});

    updateHeader();
    if(state.day.finished||state.day.answered>=DAILY_TOTAL)finishDay();else nextQuestion();
  </script>
</body>
</html>
