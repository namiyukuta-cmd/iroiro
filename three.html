<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>3D試作</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      position: fixed;
      inset: 0;
    }
    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.9);
    }
    .status {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }
    .face {
      width: 46px;
      height: 46px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 50%;
      background: rgba(16,16,16,.58);
      display: grid;
      place-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .face::before {
      content: "";
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 14px 0 5px rgba(255,255,255,.92);
      transform: translateY(-6px);
    }
    .stats { min-width: 92px; }
    .bar {
      width: 92px;
      height: 6px;
      margin: 2px 0 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0,0,0,.48);
      border: 1px solid rgba(255,255,255,.55);
    }
    .bar > span {
      display: block;
      width: 82%;
      height: 100%;
      background: #eee;
    }
    .menu {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      min-width: 58px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 19px;
      background: rgba(12,12,12,.50);
      color: #fff;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      pointer-events: auto;
    }
    .hint {
      position: absolute;
      top: max(62px, calc(env(safe-area-inset-top) + 48px));
      left: 50%;
      transform: translateX(-50%);
      max-width: 76%;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.40);
      font-size: 11px;
      font-weight: 750;
      text-align: center;
      opacity: .9;
    }
    .joystick {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(12,12,12,.24);
      pointer-events: auto;
      touch-action: none;
    }
    .stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      margin: -21px 0 0 -21px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.58);
      background: rgba(255,255,255,.24);
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      transform: translate(0,0);
    }
    .actions {
      position: absolute;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
      display: grid;
      grid-template-columns: 54px 70px;
      align-items: end;
      gap: 10px;
      pointer-events: auto;
    }
    .round {
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
      background: rgba(12,12,12,.32);
      color: #fff;
      font-weight: 900;
      text-shadow: 0 1px 2px #000;
      touch-action: none;
    }
    #lookBtn { width: 54px; height: 54px; font-size: 10px; }
    #runBtn { width: 70px; height: 70px; font-size: 12px; }
    #message {
      position: absolute;
      left: 50%;
      bottom: max(138px, calc(env(safe-area-inset-bottom) + 126px));
      transform: translateX(-50%);
      min-width: 140px;
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.48);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transition: opacity .18s ease;
    }
    #message.show { opacity: 1; }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 20;
      background: #151515;
      color: #fff;
      font-size: 14px;
      letter-spacing: .08em;
    }
    #loading.error {
      padding: 30px;
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div id="game" aria-label="3Dゲーム画面"></div>
  <div id="loading">3Dを読み込み中…</div>

  <div class="hud">
    <div class="status">
      <div class="face" aria-hidden="true"></div>
      <div class="stats">
        <div>HP 82 / 100</div>
        <div class="bar"><span></span></div>
        <div>MP 24 / 30</div>
        <div>Gold 128</div>
      </div>
    </div>

    <button class="menu" type="button" id="menuBtn">MENU</button>
    <div class="hint">左下で移動・右下RUNを押しながら走る</div>

    <div class="joystick" id="joystick" aria-label="移動スティック">
      <div class="stick" id="stick"></div>
    </div>

    <div class="actions">
      <button class="round" type="button" id="lookBtn">LOOK</button>
      <button class="round" type="button" id="runBtn">RUN</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>
  </div>

  <script type="module">
    const loading = document.getElementById('loading');
    const game = document.getElementById('game');
    const joystick = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    const runBtn = document.getElementById('runBtn');
    const lookBtn = document.getElementById('lookBtn');
    const menuBtn = document.getElementById('menuBtn');
    const message = document.getElementById('message');

    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xa9bfd0);
      scene.fog = new THREE.Fog(0xa9bfd0, 18, 48);

      const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      game.appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xf4f7ff, 0x485444, 2.1);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xfff3d6, 2.4);
      sun.position.set(-8, 14, 7);
      scene.add(sun);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshStandardMaterial({ color: 0x718462, roughness: 1 })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // 道
      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(7, 44),
        new THREE.MeshStandardMaterial({ color: 0x857967, roughness: 1 })
      );
      road.rotation.x = -Math.PI / 2;
      road.position.y = 0.012;
      road.position.z = -5;
      scene.add(road);

      const obstacles = [];
      function addObstacle(x, z, sx, sy, sz, color = 0x73624f) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(sx, sy, sz),
          new THREE.MeshStandardMaterial({ color, roughness: .9 })
        );
        mesh.position.set(x, sy / 2, z);
        scene.add(mesh);
        obstacles.push({ x, z, r: Math.max(sx, sz) * .56 });
        return mesh;
      }

      // 小さな家と柵
      addObstacle(-6.5, -10, 5, 3.5, 4, 0x675c52);
      addObstacle(6.5, -15, 4.4, 3.0, 3.6, 0x7a6650);
      addObstacle(-7.5, 4, 3.8, 2.8, 3.2, 0x6d6258);
      for (let i = -8; i <= 8; i += 2) addObstacle(-5.8, i - 3, .18, .8, 1.2, 0x4b4238);

      function addTree(x, z, s = 1) {
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(.16 * s, .22 * s, 1.7 * s, 7),
          new THREE.MeshStandardMaterial({ color: 0x604734, roughness: 1 })
        );
        trunk.position.set(x, .85 * s, z);
        scene.add(trunk);
        const crown = new THREE.Mesh(
          new THREE.ConeGeometry(.9 * s, 2.2 * s, 9),
          new THREE.MeshStandardMaterial({ color: 0x355a3d, roughness: 1 })
        );
        crown.position.set(x, 2.25 * s, z);
        scene.add(crown);
        obstacles.push({ x, z, r: .52 * s });
      }

      [
        [-9,-4,1.2],[-10,-14,1.1],[-8,10,1.15],[9,-7,1.1],[10,-18,1.25],
        [8,7,1],[10,12,1.2],[-11,15,1.3],[5,15,1.15],[-4,-22,1.2]
      ].forEach(v => addTree(...v));

      // プレイヤー（簡易人型）
      const player = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x313c46, roughness: .8 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xc59a79, roughness: .9 });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(.34, .72, 4, 8), bodyMat);
      body.position.y = 1.05;
      player.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.28, 12, 8), skinMat);
      head.position.y = 1.72;
      player.add(head);
      const marker = new THREE.Mesh(
        new THREE.ConeGeometry(.11, .35, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      marker.rotation.x = Math.PI / 2;
      marker.position.set(0, 1.12, -.48);
      player.add(marker);
      player.position.set(0, 0, 9);
      scene.add(player);

      const clock = new THREE.Clock();
      const move = new THREE.Vector2(0, 0);
      let sprint = false;
      let joyPointer = null;
      let playerYaw = Math.PI;
      let camYawOffset = 0;
      let messageTimer = 0;

      function setJoystick(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const max = rect.width * .33;
        const len = Math.hypot(dx, dy) || 1;
        if (len > max) {
          dx = dx / len * max;
          dy = dy / len * max;
        }
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        move.set(dx / max, -dy / max);
      }

      joystick.addEventListener('pointerdown', e => {
        joyPointer = e.pointerId;
        joystick.setPointerCapture(e.pointerId);
        setJoystick(e.clientX, e.clientY);
      });
      joystick.addEventListener('pointermove', e => {
        if (e.pointerId === joyPointer) setJoystick(e.clientX, e.clientY);
      });
      function endJoy(e) {
        if (e.pointerId !== joyPointer) return;
        joyPointer = null;
        move.set(0, 0);
        stick.style.transform = 'translate(0,0)';
      }
      joystick.addEventListener('pointerup', endJoy);
      joystick.addEventListener('pointercancel', endJoy);

      runBtn.addEventListener('pointerdown', e => {
        sprint = true;
        runBtn.setPointerCapture(e.pointerId);
      });
      runBtn.addEventListener('pointerup', () => sprint = false);
      runBtn.addEventListener('pointercancel', () => sprint = false);

      function showMessage(text) {
        message.textContent = text;
        message.classList.add('show');
        clearTimeout(messageTimer);
        messageTimer = setTimeout(() => message.classList.remove('show'), 1200);
      }

      lookBtn.addEventListener('click', () => {
        camYawOffset += Math.PI / 2;
        showMessage('視点を回しました');
      });
      menuBtn.addEventListener('click', () => showMessage('MENU（試作）'));

      function collides(x, z) {
        if (Math.abs(x) > 13.8 || Math.abs(z) > 25) return true;
        for (const o of obstacles) {
          const dx = x - o.x;
          const dz = z - o.z;
          if (dx * dx + dz * dz < (o.r + .38) ** 2) return true;
        }
        return false;
      }

      const desiredCam = new THREE.Vector3();
      const lookAt = new THREE.Vector3();
      camera.position.set(0, 4.4, 14.5);

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), .04);

        if (move.lengthSq() > .002) {
          const cameraAngle = playerYaw + camYawOffset;
          const forwardX = -Math.sin(cameraAngle);
          const forwardZ = -Math.cos(cameraAngle);
          const rightX = Math.cos(cameraAngle);
          const rightZ = -Math.sin(cameraAngle);
          const vx = rightX * move.x + forwardX * move.y;
          const vz = rightZ * move.x + forwardZ * move.y;
          const vLen = Math.hypot(vx, vz) || 1;
          const nx = vx / vLen;
          const nz = vz / vLen;
          const speed = sprint ? 5.1 : 2.8;
          const nextX = player.position.x + nx * speed * dt;
          const nextZ = player.position.z + nz * speed * dt;

          if (!collides(nextX, player.position.z)) player.position.x = nextX;
          if (!collides(player.position.x, nextZ)) player.position.z = nextZ;

          const targetYaw = Math.atan2(-nx, -nz);
          let diff = ((targetYaw - playerYaw + Math.PI) % (Math.PI * 2)) - Math.PI;
          playerYaw += diff * Math.min(1, dt * 9);
          player.rotation.y = playerYaw;

          body.position.y = 1.05 + Math.sin(performance.now() * .012 * (sprint ? 1.45 : 1)) * .035;
        }

        const camAngle = playerYaw + camYawOffset;
        const dist = 5.8;
        desiredCam.set(
          player.position.x + Math.sin(camAngle) * dist,
          4.1,
          player.position.z + Math.cos(camAngle) * dist
        );
        camera.position.lerp(desiredCam, 1 - Math.pow(.001, dt));
        lookAt.set(player.position.x, 1.15, player.position.z);
        camera.lookAt(lookAt);

        renderer.render(scene, camera);
      }

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      loading.remove();
      animate();
    } catch (err) {
      console.error(err);
      loading.className = 'error';
      loading.textContent = '3Dライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。';
    }
  </script>
</body>
</html>
